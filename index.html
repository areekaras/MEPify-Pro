<style>
/* Layout: home grid of big tool buttons -> one tool per screen: question, inputs, then a big plain-English answer */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --ink:#14191E; --muted:#56616C; --line:#D3D9DE;
  --accent:#B0521C; --accent-ink:#FFFFFF; --accent-soft:#F6E6DB;
  --cool:#1F6E8C; --cool-soft:#DCEBF1; --pl:#2A6F62; --pl-soft:#DDEFEA;
  --logo-bg:#17607C; --logo-fg:#FFFFFF; --logo-hot:#F29A55;
  --ok:#1E7F48; --ok-soft:#DDF0E4; --bad:#B4322A; --bad-soft:#F7DEDB;
  --plate:#1B2229; --plate-ink:#EEF2F4; --plate-muted:#9AA6B1;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1316; --surface:#181D22; --ink:#E7ECEF; --muted:#94A0AB; --line:#2A323A;
  --accent:#E3884F; --accent-ink:#1A0F08; --accent-soft:#3A2416;
  --cool:#5DB4D6; --cool-soft:#14303B; --pl:#62C3AE; --pl-soft:#15302A;
  --ok:#54C483; --ok-soft:#163223; --bad:#F2766A; --bad-soft:#3A1A17;
  --plate:#232B33; --plate-ink:#EEF2F4; --plate-muted:#9FABB6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1316; --surface:#181D22; --ink:#E7ECEF; --muted:#94A0AB; --line:#2A323A;
  --accent:#E3884F; --accent-ink:#1A0F08; --accent-soft:#3A2416;
  --cool:#5DB4D6; --cool-soft:#14303B; --pl:#62C3AE; --pl-soft:#15302A;
  --ok:#54C483; --ok-soft:#163223; --bad:#F2766A; --bad-soft:#3A1A17;
  --plate:#232B33; --plate-ink:#EEF2F4; --plate-muted:#9FABB6; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(32px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:600px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* home */
.top{display:flex;align-items:center;gap:12px;padding-block:20px 8px}
.mark{width:44px;height:44px;flex:none}
.top h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;line-height:1}
.top p{margin:3px 0 0;color:var(--muted);font-size:14px}
.top p.by{color:var(--accent);font-weight:600;font-size:14.5px;letter-spacing:.01em}
.credit{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
.group{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.group h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-height:118px}
.tile:hover{border-color:var(--muted)}
.tile .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.tile.hvac .ic,.tile.psy .ic,.tile.ref .ic{background:var(--cool-soft);color:var(--cool)}
.tile.elec .ic{background:var(--accent-soft);color:var(--accent)}
.tile.tab .ic,.thead.tab .ic{background:var(--cool-soft);color:var(--cool)}
.tile.plumb .ic,.thead.plumb .ic{background:var(--pl-soft);color:var(--pl)}
.tile.feat{flex-direction:row;align-items:center;gap:14px;width:100%;min-height:0;margin-top:18px;background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.tile.feat .ic{background:var(--accent);color:var(--accent-ink);width:46px;height:46px;flex:none}
.tile.feat .ft{display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--plate-ink)}.tile.feat b{font-size:18px}.tile.feat .ft span{color:var(--plate-muted)}
.srch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 16px;margin-top:16px}
.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.srch svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.srch input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px var(--f-body);padding:13px 0;outline:none}
.tile.feat.sm{margin-top:14px}
.bar .fav{margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}

.ts-bar{height:6px;border-radius:3px;background:rgb(255 255 255/.12);overflow:hidden}.ts-bar i{display:block;height:100%;background:var(--ok)}

ol.ts-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.ts-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ts-btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}

.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.hlact{position:sticky;bottom:0;z-index:4;margin:6px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hlstat{font-size:12.5px;color:var(--muted)}
.hlactb{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px}
.hlactb .golink{align-self:stretch;text-align:center;padding:10px 8px;font-size:13.5px}
.golink.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

@media (max-width:400px){.row2{grid-template-columns:1fr}.tile{min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;--plate:#fff;--plate-ink:#000;--plate-muted:#444;color-scheme:light}

}

/* ===== Premium look v1.14 ===== */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#0D1B2A; --muted:#5F6F80; --line:#E3E8ED;
  --accent:#17607C; --accent-ink:#FFFFFF; --accent-soft:#E3EFF3;
  --cool:#1A7FA3; --cool-soft:#E0F1F7; --pl:#2E9D5A; --pl-soft:#E3F4EA;
  --ok:#1E8A55; --ok-soft:#E2F3EA; --bad:#C2362B; --bad-soft:#FBE7E5;
  --plate:#0F2E3D; --plate-ink:#F1F6F8; --plate-muted:#A9BDC8;
  --amb:#F29A55; --amb-ink:#2A1404; --shadow:0 1px 0 #E3E8ED,0 6px 18px rgb(13 27 42/.05);
  --c-hvac:#2F6FDB; --c-tab:#12968A; --c-psy:#6E56CF; --c-ref:#0E9BBE; --c-plumb:#2E9D5A; --c-elec:#D97F0E; --c-basic:#5F6F80; --c-top:#C2362B;
  --f-display:"Inter Display","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1620; --surface:#132330; --ink:#FFFFFF; --muted:#FFFFFF; --line:#21374A;
  --accent:#1F7FA3; --accent-ink:#FFFFFF; --accent-soft:#163847;
  --cool:#5CC4E6; --cool-soft:#123445; --pl:#6CCB8E; --pl-soft:#15302A;
  --ok:#5BD08E; --ok-soft:#14321F; --bad:#F2766A; --bad-soft:#3A1A17;
  --plate:#18394A; --plate-ink:#FFFFFF; --plate-muted:#FFFFFF; --amb:#C96A1E; --amb-ink:#FFFFFF; --shadow:none;
  --c-hvac:#7FA8F0; --c-tab:#4FCFBF; --c-psy:#A996F2; --c-ref:#5CD0EA; --c-plumb:#6CCB8E; --c-elec:#F2B157; --c-basic:#A9B7C3; --c-top:#F2766A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1620; --surface:#132330; --ink:#FFFFFF; --muted:#FFFFFF; --line:#21374A;
  --accent:#1F7FA3; --accent-ink:#FFFFFF; --accent-soft:#163847;
  --cool:#5CC4E6; --cool-soft:#123445; --pl:#6CCB8E; --pl-soft:#15302A;
  --ok:#5BD08E; --ok-soft:#14321F; --bad:#F2766A; --bad-soft:#3A1A17;
  --plate:#18394A; --plate-ink:#FFFFFF; --plate-muted:#FFFFFF; --amb:#C96A1E; --amb-ink:#FFFFFF; --shadow:none;
  --c-hvac:#7FA8F0; --c-tab:#4FCFBF; --c-psy:#A996F2; --c-ref:#5CD0EA; --c-plumb:#6CCB8E; --c-elec:#F2B157; --c-basic:#A9B7C3; --c-top:#F2766A; color-scheme:dark }
/* Dark theme: every word in white. Icons keep their section colour. */
html.dk body,html.dk body *:not(.ic):not(.ic *):not(.x-ic):not(.x-ic *){color:#FFFFFF!important}
html.dk input::placeholder,html.dk textarea::placeholder{color:rgb(255 255 255/.6)!important}
html.dk .chips button[aria-pressed="true"],html.dk .x-seg button[aria-pressed="true"]{background:#FFFFFF1F;border-color:#FFFFFF}

body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body.x-tabbed{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.x-tool{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.inp input,.inp select,.kv strong,.sumg strong,.hlv,.tbl,.ptt,.ptab table,.conv div,.calc-disp .rs,.keys button,.sl-t b{font-variant-numeric:tabular-nums}

/* header */
.x-hd{display:flex;align-items:center;gap:12px;padding-block:22px 16px}
.x-logo{width:44px;height:44px;flex:none}
.x-hd h1{font:600 23px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.x-hd p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.x-av{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 14px var(--f-body);cursor:pointer;flex:none;padding:0}
.x-av svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srch{border:0;border-radius:14px;box-shadow:var(--shadow);margin-top:0;padding:0 14px;border:1.5px solid transparent}
html.dk .srch{border-color:var(--line)}
.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.srch input{font-size:15.5px;padding:14px 0}

/* troubleshooter feature card */
.tile.feat{border:0;border-radius:20px;padding:16px;margin-top:14px;gap:14px}
.tile.feat .ic{background:rgb(255 255 255/.09);color:var(--amb);width:46px;height:46px;border-radius:14px}
html.dk .tile.feat .ic{color:#F2B157}
.tile.feat b{font:600 17px var(--f-display);letter-spacing:-.01em}
.tile.feat .ft span{font-size:13px}
.hlcont{border-radius:18px;border-width:0;box-shadow:var(--shadow)}

/* section headings */
.x-h{display:flex;align-items:baseline;gap:10px;margin:24px 2px 10px}
.x-h b{font:600 16.5px var(--f-display);letter-spacing:-.01em}
.x-h span{margin-left:auto;font-size:12.5px;color:var(--muted)}
.group h2{font:600 16.5px var(--f-display);letter-spacing:-.01em;text-transform:none;color:var(--ink)}

/* group colour helper */
.g-hvac{--g:var(--c-hvac)}.g-tab{--g:var(--c-tab)}.g-psy{--g:var(--c-psy)}.g-ref{--g:var(--c-ref)}.g-plumb{--g:var(--c-plumb)}.g-elec{--g:var(--c-elec)}.g-basic{--g:var(--c-basic)}.g-top{--g:var(--c-top)}
.x-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--g,var(--accent));background:var(--line);background:color-mix(in srgb,var(--g,var(--accent)) 13%,var(--surface))}
.x-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* favourites / recent strip */
.x-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.x-strip::-webkit-scrollbar{display:none}
.x-fv{flex:none;width:118px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;border:0;background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
html.dk .x-fv,html.dk .x-sec,html.dk .x-lst,html.dk .card,html.dk .x-set,html.dk .x-log{border:1px solid var(--line)}
.x-fv .x-ic{width:34px;height:34px;border-radius:10px}
.x-fv b{font:600 13.5px/1.3 var(--f-body)}

/* section cards */
.x-secs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.x-sec{display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:15px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.x-sec b{font:600 15px var(--f-body);display:block}
.x-sec small{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.x-sec:active,.x-fv:active,.x-it:active{transform:scale(.985)}

/* lists */
.x-lst{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.x-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px;cursor:pointer;min-width:0}
.x-it:last-child{border-bottom:0}
.x-it .tx{flex:1;min-width:0}
.x-it b{font:600 14.5px/1.3 var(--f-body);display:block}
.x-it small{font-size:12.5px;color:var(--muted);display:block;line-height:1.35;margin-top:1px}
.x-st{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;padding:0;color:#C3CCD4}
.x-st svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.x-st[aria-pressed="true"]{color:var(--amb)}.x-st[aria-pressed="true"] svg{fill:currentColor}
html.dk .x-st{color:#FFFFFF66!important}html.dk .x-st[aria-pressed="true"]{color:#F2B157!important}

/* section screen */
.x-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 12px}
.x-top h2{font:600 21px var(--f-display);letter-spacing:-.02em;margin:0;flex:1;min-width:0}
.x-btn{width:42px;height:42px;border-radius:13px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
html.dk .x-btn{border:1px solid var(--line)}
.x-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.x-band{border-radius:20px;padding:18px;margin-bottom:14px;color:#fff;background:var(--g)}
html.dk .x-band{background:color-mix(in srgb,var(--g) 30%,var(--surface))}
.x-band b{font:600 24px var(--f-display);letter-spacing:-.02em;display:block;color:#fff}
.x-band p{margin:4px 0 0;font-size:13.5px;color:rgb(255 255 255/.9)}

/* bottom tab bar */
.x-tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.x-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;font:500 11.5px var(--f-body);color:var(--muted);cursor:pointer;padding:0;min-width:0}
.x-tabs i{display:grid;place-items:center;padding:4px 18px;border-radius:14px}
.x-tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.x-tabs [aria-current="page"]{color:var(--accent);font-weight:600}
.x-tabs [aria-current="page"] i{background:var(--accent-soft)}

/* tool screen */
.bar{padding-block:14px 10px}
.back{border:0;box-shadow:var(--shadow);border-radius:13px;padding:10px 14px 10px 10px}
html.dk .back,html.dk .bar .fav{border:1px solid var(--line)}
.bar .fav{border:0;box-shadow:var(--shadow);border-radius:13px}
.bar .fav[aria-pressed="true"] svg{fill:var(--amb);stroke:var(--amb)}
.thead h2{font:600 26px/1.12 var(--f-display);letter-spacing:-.02em}
.thead .ic{border-radius:13px}
.thead.hvac .ic{color:var(--c-hvac);background:color-mix(in srgb,var(--c-hvac) 13%,var(--surface))}
.thead.tab .ic{color:var(--c-tab);background:color-mix(in srgb,var(--c-tab) 13%,var(--surface))}
.thead.psy .ic{color:var(--c-psy);background:color-mix(in srgb,var(--c-psy) 13%,var(--surface))}
.thead.ref .ic{color:var(--c-ref);background:color-mix(in srgb,var(--c-ref) 13%,var(--surface))}
.thead.plumb .ic{color:var(--c-plumb);background:color-mix(in srgb,var(--c-plumb) 13%,var(--surface))}
.thead.elec .ic{color:var(--c-elec);background:color-mix(in srgb,var(--c-elec) 13%,var(--surface))}
.thead.basic .ic{color:var(--c-basic);background:color-mix(in srgb,var(--c-basic) 13%,var(--surface))}
.thead.top .ic{color:var(--c-top);background:color-mix(in srgb,var(--c-top) 13%,var(--surface))}
.card{border:0;border-radius:20px;box-shadow:var(--shadow)}
.lbl{font-size:13.5px;font-weight:500;color:var(--muted)}
.inp{border:1.5px solid transparent;border-radius:12px;background:var(--bg)}
html.dk .inp{border-color:var(--line)}
.inp input,.inp select{font:500 20px var(--f-display);letter-spacing:-.01em}
.inp em{font:500 14px var(--f-body)}
.inp select.u{font:600 14px var(--f-body)}
.chips button{border:0;background:var(--bg);border-radius:11px;font-weight:600;color:var(--muted)}
html.dk .chips button{border:1px solid var(--line)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.x-stp{display:flex;gap:6px;padding:0 6px 0 2px;flex:none}
.x-stp button{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface);box-shadow:0 1px 2px rgb(13 27 42/.1);font:500 20px/1 var(--f-body);cursor:pointer;padding:0;touch-action:manipulation;color:var(--ink)}
html.dk .x-stp button{background:#FFFFFF14;box-shadow:none}
.x-stp button:active{background:var(--accent-soft)}
.ans{border-radius:24px;padding:20px}
.ans .cap{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:500}
.ans .hero b{font:600 46px/1 var(--f-display);letter-spacing:-.03em}
.ans .hero i{font:500 19px var(--f-body);color:var(--plate-muted)}
.verdict{font:600 28px/1.15 var(--f-display);letter-spacing:-.02em}
.kv strong{font:600 17px var(--f-display)}
.pill.ok{background:rgb(47 181 116/.18);color:#7FE3AE}.pill.bad{background:rgb(242 118 106/.2);color:#FFA79D}
.shr{gap:8px}
.shbtn{border:0;background:rgb(255 255 255/.1);border-radius:12px;padding:11px 16px}
.shbtn.pri{background:var(--amb);color:var(--amb-ink)}
.note{font-size:13px}
.calc-disp{border-radius:20px}
.keys button{border:0;box-shadow:var(--shadow);border-radius:14px}
.keys button.eq{background:var(--accent)}
html.dk .keys button{border:1px solid var(--line)}

/* readout bar pinned to the bottom of tool screens */
.x-rdo{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:12;max-width:580px;margin:0 auto;display:flex;align-items:center;gap:12px;border:0;text-align:left;width:auto;background:var(--plate);color:var(--plate-ink);border-radius:20px;padding:12px 16px;box-shadow:0 10px 30px rgb(0 0 0/.25);cursor:pointer;transition:transform .2s,opacity .2s}
.x-rdo[hidden]{display:flex!important;transform:translateY(140%);opacity:0;pointer-events:none}
.x-rdo .tx{flex:1;min-width:0}
.x-rdo small{display:block;font-size:12px;color:var(--plate-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-rdo b{display:block;font:600 26px/1.15 var(--f-display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-rdo b i{font:500 15px var(--f-body);font-style:normal;color:var(--plate-muted);margin-left:4px}
.x-rdo .pill{flex:none;font-size:12px;padding:4px 10px}
.x-rdo svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}

/* sheet (save reading) */
.x-dim{position:fixed;inset:0;z-index:30;background:rgb(6 14 20/.5);display:flex;align-items:flex-end;justify-content:center}
.x-sheet{width:100%;max-width:600px;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.x-sheet h3{font:600 20px var(--f-display);margin:0;letter-spacing:-.01em}
.x-res{background:var(--bg);border-radius:14px;padding:12px 14px}
.x-res small{font-size:12.5px;color:var(--muted)}.x-res b{display:block;font:600 24px/1.2 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.x-f{display:flex;flex-direction:column;gap:6px}
.x-f span{font-size:13px;font-weight:500;color:var(--muted)}
.x-f input,.x-f textarea{border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:500 16px var(--f-body);padding:12px;outline:none;width:100%}
.x-f textarea{min-height:70px;resize:vertical}
.x-f input:focus,.x-f textarea:focus{border-color:var(--accent)}
.x-seg{display:flex;gap:6px;flex-wrap:wrap}
.x-seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.x-seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.x-seg.res button[data-v="pass"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.x-seg.res button[data-v="fail"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.x-row{display:flex;gap:8px}
.x-row>*{flex:1}
.x-pri{border:0;border-radius:14px;padding:14px;font:600 15.5px var(--f-body);background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.x-pri.amb{background:var(--amb);color:var(--amb-ink)}
.x-sec2{border:1.5px solid var(--line);border-radius:14px;padding:12px;font:600 14.5px var(--f-body);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.x-pri svg,.x-sec2 svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.x-sec2.del{color:var(--bad);border-color:var(--bad)}
.x-sec2.armed{background:var(--bad);color:#fff}

/* job log */
.x-log{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.x-log>button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;cursor:pointer}
.x-log .t{display:flex;align-items:center;gap:8px;min-width:0}
.x-tag{flex:none;font:600 12px var(--f-body);background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:7px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-log .n{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-log .v{flex:none;font:600 15px var(--f-display);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-log .m{font-size:12.5px;color:var(--muted);margin-top:4px}
.x-log .m .pass{color:var(--ok);font-weight:600}.x-log .m .fail{color:var(--bad);font-weight:600}
.x-log .d{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.x-log pre{margin:0;white-space:pre-wrap;font:13px/1.5 var(--f-body);background:var(--bg);border-radius:12px;padding:12px;max-height:280px;overflow:auto}
.x-empty{text-align:center;padding:40px 18px;color:var(--muted)}
.x-empty b{display:block;color:var(--ink);font:600 17px var(--f-display);margin-bottom:6px}
.x-day{font:600 13px var(--f-body);color:var(--muted);margin:18px 2px 8px;display:flex}
.x-day span{margin-left:auto;font-weight:500}

/* settings */
.x-set{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:6px 16px;margin-bottom:12px}
.x-set h3{font:600 15px var(--f-display);margin:12px 0 4px;letter-spacing:-.01em}
.x-set .r{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;min-width:0}
.x-set .r:last-child{border-bottom:0}
.x-set .r>span{flex:none}
.x-set .r input{flex:1;min-width:0;text-align:right;border:0;background:transparent;color:var(--ink);font:500 15px var(--f-body);outline:none;padding:4px 0}
.x-set .r .x-seg{margin-left:auto}
.x-set .r .x-seg button{padding:6px 11px;min-height:34px;font-size:13px}
.x-set p{font-size:13px;color:var(--muted);margin:6px 0 12px;line-height:1.5}
.credit{border-top:0}

#xprint{display:none}
@media print{
  body.x-printing #app,body.x-printing .x-tabs,body.x-printing .x-rdo{display:none!important}
  body.x-printing #xprint{display:block}
  #xprint h1{font:600 18pt var(--f-display);margin:0 0 4px}#xprint p{margin:0 0 10px;font-size:10pt}
  #xprint table{border-collapse:collapse;width:100%;font-size:9pt}
  #xprint th,#xprint td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  .x-tabs,.x-rdo{display:none!important}
}
@media (prefers-reduced-motion:reduce){.x-rdo{transition:none}}
body.x-tabbed #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.x-tool #toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}

/* ---------- PSYCHROMETRICS (ASHRAE Fundamentals, SI) ---------- */
const PSY={
  p:alt=>101.325*Math.pow(1-2.25577e-5*(alt||0),5.2559), // kPa
  pws:t=>{const T=t+273.15;let l;
    if(t<0)l=-5.6745359e3/T+6.3925247-9.677843e-3*T+6.2215701e-7*T*T+2.0747825e-9*T**3-9.484024e-13*T**4+4.1635019*Math.log(T);
    else l=-5.8002206e3/T+1.3914993-4.8640239e-2*T+4.1764768e-5*T*T-1.4452093e-8*T**3+6.5459673*Math.log(T);
    return Math.exp(l)/1000;},
  Wpw:(pw,p)=>0.621945*pw/(p-pw),
  pwW:(W,p)=>W*p/(0.621945+W),
  h:(t,W)=>1.006*t+W*(2501+1.86*t),
  tHW:(h,W)=>(h-2501*W)/(1.006+1.86*W),
  v:(t,W,p)=>0.287042*(t+273.15)*(1+1.607858*W)/p,
  Wwb:(t,tw,p)=>{const Ws=PSY.Wpw(PSY.pws(tw),p);
    return tw>=0?((2501-2.326*tw)*Ws-1.006*(t-tw))/(2501+1.86*t-4.186*tw):((2830-0.24*tw)*Ws-1.006*(t-tw))/(2830+1.86*t-2.1*tw);},
  bis:(f,a,b)=>{let fa=f(a);for(let i=0;i<80;i++){const m=(a+b)/2,fm=f(m);if((fm>0)===(fa>0)){a=m;fa=fm}else b=m;}return (a+b)/2;},
  dew:(pw)=>PSY.bis(x=>PSY.pws(x)-pw,-80,100),
  wb:(t,W,p)=>PSY.bis(x=>PSY.Wwb(t,x,p)-W,-60,t),
  state(t,W,p){const pw=PSY.pwW(W,p),ps=PSY.pws(t),v=PSY.v(t,W,p);
    return{t,W,p,pw,rh:pw/ps*100,h:PSY.h(t,W),v,rho:(1+W)/v,td:PSY.dew(pw),tw:PSY.wb(t,W,p),Wsat:PSY.Wpw(ps,p)};},
  fromRH(t,rh,p){return PSY.state(t,PSY.Wpw(PSY.pws(t)*rh/100,p),p);}
};
const g1=x=>f(x*1000,2);
function psyRows(S){return[["Relative humidity",f(S.rh,1),"%"],["Wet bulb",f(S.tw,1),"°C"],["Dew point",f(S.td,1),"°C"],["Moisture",g1(S.W),"g/kg"],["Enthalpy",f(S.h,2),"kJ/kg"],["Specific volume",f(S.v,3),"m³/kg"],["Air density",f(S.rho,3),"kg/m³"],["Vapour pressure",f(S.pw,3),"kPa"]];}
/* mini psychrometric chart: pts=[{S,label}], lines=[[i,j]] */
function psyChart(pts,lines,p){
  const W=340,H=240,L=34,R=W-30,T=22,B=H-30;
  let tmin=0,tmax=50,wmax=30;
  pts.forEach(o=>{tmin=Math.min(tmin,Math.floor(o.S.t/5)*5-5);tmax=Math.max(tmax,Math.ceil(o.S.t/5)*5+5);wmax=Math.max(wmax,Math.ceil(o.S.W*1000/5)*5+5);});
  const X=t=>L+(t-tmin)/(tmax-tmin)*(R-L),Y=w=>B-w/wmax*(B-T);
  const curve=rh=>{let d="";for(let t=tmin;t<=tmax+0.01;t+=0.5){const w=PSY.Wpw(PSY.pws(t)*rh/100,p)*1000;if(w>wmax){break}d+=(d?"L":"M")+X(t).toFixed(1)+" "+Y(w).toFixed(1);}return d;};
  let g="";
  for(let t=tmin;t<=tmax;t+=10)g+=`<line x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${B}" stroke="var(--line)"/><text x="${X(t)}" y="${B+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${t}</text>`;
  for(let w=0;w<=wmax;w+=10)g+=`<line x1="${L}" y1="${Y(w)}" x2="${R}" y2="${Y(w)}" stroke="var(--line)"/><text x="${R+4}" y="${Y(w)+3}" font-size="10" fill="var(--muted)">${w}</text>`;
  [20,40,60,80].forEach(rh=>{g+=`<path d="${curve(rh)}" fill="none" stroke="var(--cool)" stroke-opacity=".35" stroke-width="1"/>`;});
  g+=`<path d="${curve(100)}" fill="none" stroke="var(--cool)" stroke-width="2"/>`;
  lines.forEach(([i,j])=>{const a=pts[i].S,b=pts[j].S;g+=`<line x1="${X(a.t)}" y1="${Y(a.W*1000)}" x2="${X(b.t)}" y2="${Y(b.W*1000)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"/>`;});
  pts.forEach(o=>{const x=X(o.S.t),y=Y(o.S.W*1000);let left=o.pos==="l"||(o.pos!=="b"&&x>R-40),ly=o.pos==="b"?y+17:y-9,lx=left?x-8:x+8;
    g+=`<circle cx="${x}" cy="${y}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${lx}" y="${ly}" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="${left?"end":"start"}">${o.label}</text>`;});
  g+=`<text x="${(L+R)/2}" y="${H-2}" text-anchor="middle" font-size="10" fill="var(--muted)">Dry bulb °C</text><text x="${R+4}" y="${T-10}" font-size="10" fill="var(--muted)">g/kg</text>`;
  return `<div class="card" style="padding:12px"><div class="lbl" style="font-size:13px">Psychrometric chart</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Psychrometric chart with the state points">${g}</svg><p class="note">Dark curve is saturation (100 % RH). Faint curves are 20, 40, 60 and 80 % RH.</p></div>`;
}

      t.kind="FCU";t.tag="FCU-"+pad(fcuN);t.kw=pk.v;t.pk=pk.k;t.cfm=cfm;t.size=HL.FCU.find(s=>s>=cfm);t.units=t.size?1:Math.ceil(cfm/HL.FCU[HL.FCU.length-1]);
      if(!t.size)t.size=HL.FCU.find(s=>s>=cfm/t.units);t.flow=Wcoil(pk.v/1000);t.pipe=HL.pipe(t.flow/t.units);t.esp=A.fcuEsp;}
    else{boxN++;const ah=ahus.find(x=>x.a.id===r.sys);t.kind=ah.a.type==="vav"?"VAV":"CAV";t.tag=t.kind+"-"+pad(boxN);t.ahu=ah.a.name;
      t.inlet=HL.BOX.find(d=>q/1000/(Math.PI*(d/1000)**2/4)<=A.boxV);t.inV=t.inlet?q/1000/(Math.PI*(t.inlet/1000)**2/4):NaN;
      t.qmin=t.kind==="VAV"?Math.min(q,Math.max(A.minVav/100*q,ah.oaf>0?c.oaL/ah.oaf:0)):q;}
    terminals.push(t);});
  // plant: every coil, hour by hour (FAHU + FCUs + AHUs = the project block)
  const plantH=hrs.map(t=>J.block[t]),ppk=peakOf(plantH),plant=ppk.v*(1+W.margin/100),flow=Wcoil(plant/1000);
  const nC=W.nCh,chiller={each:plant/nC,n:nC,sb:W.sbCh,flowEach:flow/nC};
  const header=HL.pipe(flow),fr=header?header.R*W.run*(1+W.fit/100):NaN;
  const headPa=fr+(W.dpCh+W.dpCoil+W.dpVal+W.dpOth)*1000,headM=headPa/9810;
  const pumpShaft=chiller.flowEach/1000*headPa/(W.effP/100)/1000;
  const pump={n:nC,sb:W.sbCh,flowEach:chiller.flowEach,headM,headPa,fricPa:fr,shaft:pumpShaft,motor:HL.motor(pumpShaft*1.15),pipeEach:HL.pipe(chiller.flowEach)};
  return{J,ahus,fahu,terminals,plant,plantPk:ppk.k,plantH,flow,header,chiller,pump};
};


/* ---------- BASIC: keypad calculators ---------- */
const FNS=["asin","acos","atan","sin","cos","tan","ln","log","√"];
function tokenize(s){const out=[];let i=0;
 while(i<s.length){const c=s[i];
  if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const txt=s.slice(i,j);if(txt.split(".").length>2||txt===".")throw 0;out.push({t:"n",v:parseFloat(txt)});i=j;continue;}
  if(s.startsWith("Ans",i)){out.push({t:"ans"});i+=3;continue;}
  const fn=FNS.find(x=>s.startsWith(x+"(",i));if(fn){out.push({t:"f",v:fn});i+=fn.length+1;continue;}
  if(c==="π"||c==="e"){out.push({t:"c",v:c==="π"?Math.PI:Math.E});i++;continue;}
  if("+−×÷^()!%".includes(c)){out.push({t:c});i++;continue;}
  throw 0;}
 return out;}
function evalExpr(s,deg,ans){
 const tk=tokenize(s);let p=0;const pk=()=>tk[p],nx=()=>tk[p++];
 const toR=x=>deg?x*Math.PI/180:x,fromR=x=>deg?x*180/Math.PI:x,cl=x=>Math.abs(x)<1e-12?0:x;
 const opnd=k=>k&&(k.t==="n"||k.t==="c"||k.t==="ans"||k.t==="f"||k.t==="(");
 function expr(){let a=term().v;while(pk()&&(pk().t==="+"||pk().t==="−")){const op=nx().t,b=term(),bv=b.pct?a*b.v:b.v;a=op==="+"?a+bv:a-bv;}return a;}
 function term(){const r=unary();let a=r.v,pct=r.pct;
  for(;;){const k=pk();if(k&&(k.t==="×"||k.t==="÷")){nx();const b=unary().v;a=k.t==="×"?a*b:a/b;pct=false;}else if(opnd(k)){a*=unary().v;pct=false;}else break;}
  return{v:a,pct};}
 function unary(){const k=pk();if(k&&(k.t==="−"||k.t==="+")){nx();const r=unary();return{v:k.t==="−"?-r.v:r.v,pct:r.pct};}return power();}
 function power(){const b=postfix();if(pk()&&pk().t==="^"){nx();const e=unary();return{v:Math.pow(b.v,e.v),pct:false};}return b;}
 function postfix(){let v=primary(),pct=false;
  while(pk()&&(pk().t==="!"||pk().t==="%")){if(nx().t==="!"){if(v<0||v>170||v!==Math.floor(v))return{v:NaN,pct:false};let r=1;for(let i=2;i<=v;i++)r*=i;v=r;}else{v=v/100;pct=true;}}
  return{v,pct};}
 function primary(){const k=nx();if(!k)throw 0;
  if(k.t==="n"||k.t==="c")return k.v;if(k.t==="ans")return ans;
  if(k.t==="("||k.t==="f"){const v=expr();if(pk()&&pk().t===")")nx();if(k.t==="(")return v;
   switch(k.v){case"sin":return cl(Math.sin(toR(v)));case"cos":return cl(Math.cos(toR(v)));
    case"tan":{const r=toR(v);return Math.abs(Math.cos(r))<1e-12?NaN:cl(Math.tan(r));}
    case"asin":return fromR(Math.asin(v));case"acos":return fromR(Math.acos(v));case"atan":return fromR(Math.atan(v));
    case"ln":return Math.log(v);case"log":return Math.log10(v);case"√":return Math.sqrt(v);}}
  throw 0;}
 if(!tk.length)throw 0;const v=expr();if(p<tk.length)throw 0;return v;}
function cfmt(x){if(!isFinite(x))return "Error";if(x===0)return "0";const a=Math.abs(x);
 if(a>=1e15||a<1e-9)return x.toExponential(8).replace(/\.?0+e/,"e");
 return Number(x.toPrecision(12)).toLocaleString("en-US",{maximumFractionDigits:10});}
const KB=[["C","clr","fn"],["⌫","bk","fn"],["%","%","op"],["÷","÷","op"],["7","7"],["8","8"],["9","9"],["×","×","op"],["4","4"],["5","5"],["6","6"],["−","−","op"],["1","1"],["2","2"],["3","3"],["+","+","op"],["±","neg","fn"],["0","0"],[".","."],["=","eq","eq"]];
const KS=[["sin","sin("],["cos","cos("],["tan","tan("],["π","π"],["e","e"],["sin⁻¹","asin("],["cos⁻¹","acos("],["tan⁻¹","atan("],["ln","ln("],["log","log("],["x²","^2"],["xʸ","^"],["√","√("],["x!","!"],["1/x","inv"],["(","("],[")",")"],["Ans","Ans"],["×10ˣ","×10^"],["DEG","deg"]];
let calcPress=null;
function calcUI(el,st,sci){
 if(typeof st.x!=="string")st.x="";if(!Array.isArray(st.hist))st.hist=[];st.ans=num(st.ans)||0;if(st.deg===undefined)st.deg=true;
 const all=sci?KS.concat(KB):KB;
 el.innerHTML=`<div class="calc-disp"><span class="md" id="cmd"></span><div class="ex" id="cex"></div><div class="rs" id="crs" aria-live="polite"></div></div>
  ${sci?`<div class="keys sci">${KS.map((k,i)=>`<button type="button" data-i="${i}" class="fn">${k[0]}</button>`).join("")}</div>`:""}
  <div class="keys">${KB.map((k,i)=>`<button type="button" data-i="${(sci?KS.length:0)+i}" class="${k[2]||""}">${k[0]}</button>`).join("")}</div>
  <div class="hist" id="chist"></div>`;
 const ops=["+","−","×","÷","^","%","!","^2","×10^"];
 function upd(){
  el.querySelector("#cex").textContent=st.done?st.last+" =":(st.x||"0");
  let r="";if(st.done)r=cfmt(st.ans);else if(st.x){try{const v=evalExpr(st.x,st.deg,st.ans);r=isFinite(v)?cfmt(v):"";}catch(e){r="";}}
  el.querySelector("#crs").textContent=r||(st.x?"…":"0");
  el.querySelector("#cmd").textContent=sci?(st.deg?"DEG":"RAD"):"";
  const dk=el.querySelector('[data-i="'+(KS.length-1)+'"]');if(sci&&dk)dk.textContent=st.deg?"DEG":"RAD";
  el.querySelector("#chist").innerHTML=st.hist.length?`<div class="lbl" style="font-size:13px;color:var(--muted)">Recent</div>${st.hist.map((h,i)=>`<button type="button" data-h="${i}"><span>${esc(h.x)}</span><strong>${cfmt(h.v)}</strong></button>`).join("")}`:"";
  el.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const h=st.hist[+b.dataset.h];st.x=String(Number(h.v.toPrecision(12)));st.done=false;save();upd();});
 }
 function press(k){
  if(k==="clr"){st.x="";st.done=false;}
  else if(k==="bk"){if(st.done){st.done=false;st.x="";}else{const f=FNS.find(x=>st.x.endsWith(x+"("));st.x=f?st.x.slice(0,-(f.length+1)):st.x.endsWith("Ans")?st.x.slice(0,-3):st.x.endsWith("×10^")?st.x.slice(0,-4):st.x.slice(0,-1);}}
  else if(k==="deg"){st.deg=!st.deg;}
  else if(k==="neg"){const base=st.done?"Ans":st.x;st.done=false;st.x=!base?"−":/^−\(.*\)$/.test(base)?base.slice(2,-1):"−("+base+")";}
  else if(k==="inv"){const base=st.done?"Ans":st.x;st.done=false;st.x=base?"1÷("+base+")":"1÷";}
  else if(k==="eq"){if(!st.x)return;let v;try{v=evalExpr(st.x,st.deg,st.ans);}catch(e){v=NaN;}
   if(isFinite(v)){st.hist.unshift({x:st.x,v});st.hist=st.hist.slice(0,6);st.ans=v;st.last=st.x;st.done=true;st.x="";}
   else{st.last=st.x;st.done=false;el.querySelector("#crs").textContent="Error";return;}}
  else{if(st.done){st.x=ops.includes(k)?"Ans"+k:k;st.done=false;}else st.x+=k;}
  save();upd();
 }
 el.querySelectorAll(".keys button").forEach(b=>b.onclick=()=>press(all[+b.dataset.i][1]));
 calcPress=press;upd();
}
document.addEventListener("keydown",e=>{
 const t=byId(view);if(!t||!t.keypad||!calcPress||e.ctrlKey||e.metaKey||e.altKey)return;
 const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="select"||tag==="textarea")return;
 const m={"+":"+","-":"−","*":"×","x":"×","/":"÷","^":"^","(":"(",")":")","%":"%","!":"!",".":".",",":".","Enter":"eq","=":"eq","Backspace":"bk","Escape":"clr","Delete":"clr"};
 const k=/^[0-9]$/.test(e.key)?e.key:m[e.key];if(!k)return;e.preventDefault();calcPress(k);
});

const pad2=n=>String(n).padStart(2,"0");
const todayISO=(()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());})();
const isoAdd=(iso,days)=>{const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);};
const pDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN;};
const dFmt=t=>new Date(t).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
function ymd(a,b){const A=new Date(a),Bd=new Date(b);let y=Bd.getUTCFullYear()-A.getUTCFullYear(),m=Bd.getUTCMonth()-A.getUTCMonth(),d=Bd.getUTCDate()-A.getUTCDate();
 if(d<0){m--;d+=new Date(Date.UTC(Bd.getUTCFullYear(),Bd.getUTCMonth(),0)).getUTCDate();}if(m<0){y--;m+=12;}return[y,m,d];}
function addMonths(t,n){const d=new Date(t),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return d.getTime();}

ed from wind.","4–20 mA scaling"]]},{"id":"vib","n":"AHU or fan vibration high","d":"Readings above the limit","c":[["Impeller dirty or out of balance","Clean the impeller and balance it. Check for damaged or bent blades.",""],["Pulley or coupling misalignment","Check alignment with a straight edge or laser.",""],["Belt tension wrong or belts worn","Set the tension to the maker's figure and replace belts as a matched set.","V-belt tension"],["Bearing wear","Listen for noise, check bearing temperature and the vibration spectrum.",""],["Anti-vibration mounts or flexible connections","Check transit locks are removed, springs are not bottomed out and flexible connections are not pulled tight.",""],["Running near resonance","If vibration peaks at one VFD speed, set a skip frequency.",""]]},{"id":"ftrip","n":"Fan motor tripping or high current","d":"Overload trips, amps above FLA","c":[["Fan moving more air than design","Forward-curved fans draw more current at low resistance: filters missing, access doors open, dampers wide open. Check ESP.",""],["Wrong rotation","Check against the arrow. A backward-running centrifugal fan still moves some air.",""],["Supply voltage low or unbalanced","Measure all three phases under load.","Voltage & current unbalance"],["Mechanical binding or bearings","Isolate and turn by hand.",""],["Motor too small after a pulley change","Fan power rises with the cube of speed. Check motor kW against the new duty.","Motor current"]]},{"id":"noise","n":"Noisy ducts or diffusers","d":"Whistling, rumble, rattling","c":[["Air velocity too high","Check the diffuser neck velocity and duct velocity against design.","Duct size"],["Damper throttled close to the outlet","Balance from the branch damper further back instead.",""],["Loose duct, turning vanes or access doors","Tighten and seal.",""],["Fan noise carried along the duct","Check the attenuator and flexible connections at the fan.",""]]},{"id":"coil","n":"Chilled water coil not cooling","d":"Low ΔT or ["No power or thermostat off","Check the FCU isolator, fuse and the thermostat mode, fan speed and set point.",""],["Fan motor or capacitor failed","Measure motor current and capacitor µF. Spin the fan by hand with power isolated.",""],["Control valve not opening","Check the actuator signal and that the valve opens. Feel the coil pipes: both should be cold when cooling.",""],["Air lock or isolating valves closed","Vent the coil and check both isolating valves are open.",""],["Filter blocked or condensate float switch tripped","Clean the filter. A full drain pan trips the float switch and stops the unit.",""]]},{"id":"stair","n":"Stair pressurisation not working","d":"Low pressure or doors too hard to open","c":[["Fan not starting on fire signal","Check the fire alarm interface, cause & effect, fan starter and fire-rated supply.",""],["Pressure too low with doors closed","Leaks in the shaft, open vents, or fan speed too low. Measure pressure across each door, often 50 Pa.",""],["Door opening force too high","Pressure relief or the VFD control is not working. Force at the handle is usually limited to about 100 N.",""],["Air velocity through open door too low","Measure velocity across the open fire floor door against the design figure, often about 0.75–2 m/s.",""],["Pressure sensor or controller","Check sensor tubing, zero and the controller's set point.","4–20 mA scaling"]]},{"id":"ctower","n":"Cooling tower water too warm","d":"High condenser water temperature","c":[["Fan not running or belt slipping","Check fan, motor current, belt tension and VFD speed.","V-belt tension"],["Poor water distribution","Blocked nozzles or distribution basin. Fill must be wetted evenly.",""],["Fill fouled or damaged","Scale, algae or broken fill packs reduce cooling.",""],["Wet bulb higher than design or recirculation","Hot humid exhaust air re-entering the intake. Check the wet bulb against design.","Air properties"],["Water flow wrong","Check condenser water flow and the range (in minus out) against design.",""]]},{"id":"hood","n":"Kitchen hood not capturing smoke","d":"Smoke or heat escaping into the kitchen","c":[["Exhaust airflow too low","Grease filters blocked, fan belt slipping or damper partly closed. Measure face velocity.",""],["Make-up air too high or blowing across the hood","Supply air jets disturb the capture zone. Adjust diffuser throw.",""],["Hood too small or set too high","Hood should overhang the cooking line on all open sides.",""],["Exhaust duct leaking or grease build-up","Check duct joints and cleanliness. Grease build-up is also a fire risk.",""]]},{"id":"tab","n":"Can't reach design airflow in balancing","d":"TAB results below design","c":[["Total airflow low at the fan","Fix the fan first: speed, rotation, filters, ESP. Branches can't add air the fan isn't making.","Duct size"],["Index run starved","Start balancing at the index (most remote) outlet with its damper fully open, then throttle the others.",""],["Wrong K-factor or measuring method","Use the diffuser maker's K-factor or a hood. Check the instrument calibration.",""],["Duct leakage","Compare fan airflow with the sum of all outlets. A big gap means leakage.",""],["Design or drawings changed","Check the outlet schedule against the latest drawings.",""]]}],"elec":[{"id":"mcb","n":"Breaker trips","d":"MCB or MCCB","c":[["Overload (trips after some time)","Measure the load current and compare with the breaker rating.","Breaker size"],["Short circuit (trips instantly)","Isolate and IR test the cable and the load. Look for damaged cable or terminals.","Insulation resistance"],["Wrong curve for the inrush","Motors, transformers and LED drivers trip B-curve breakers. Use C or D.","Breaker size"],["Loose connection heating the breaker","Check torque on terminals and look for discolouration. Use thermography under load.",""],["Faulty breaker","Swap with a known good breaker of the same rating.",""]]},{"id":"rcd","n":"RCD or earth leakage trips","d":"ELCB, RCBO","c":[["Earth fault on the circuit","With the load disconnected, IR test L–E and N–E.","Insulation resistance"],["Neutral touching earth or shared neutral","Check N–E insulation and that neutrals are not mixed between circuits.",""],["Moisture in outdoor equipment","Check sockets, junction boxes, heaters and gland sealing.",""],["Too much normal leakage","Many PCs or VFD filters add up. Measure leakage with a clamp meter, split circuits, use Type B or F RCDs for VFDs.",""],["Faulty RCD","Check trip time and trip current with an RCD tester.",""]]},{"id":"mstart","n":"Motor does not start","d":"No movement on start command","c":[["No supply or control circuit open","Check voltage at the starter, control fuse, stop and E-stop circuits, interlocks and MCC ready signal.",""],["Overload tripped","Reset only after finding the cause.",""],["Contactor not pulling in","Measure the coil voltage when the start command is given.",""],["Single phasing","Measure all three phases at the motor terminals.",""],["Seized or load too heavy","Isolate and turn by hand.",""],["Winding fault","Check winding resistance balance and IR to earth.","Insulation resistance"]]},{"id":"mhot","n":"Motor overheating","d":"Hot frame, winding RTD alarm","c":[["Overloaded","Measure current against nameplate FLA.","Motor current"],["Low or unbalanced voltage","Measure all phases under load.","Voltage & current unbalance"],["Poor cooling","Blocked fan cowl, dirt on the frame, high ambient or long running at low VFD speed.",""],["Too many starts per hour","Compare with the maker's limit.",""],["Bearing failure or misalignment","Check vibration, noise and bearing temperature.",""],["Wrong star or delta connection","Check the terminal links against the supply voltage.",""]]},{"id":"rot","n":"Motor runs the wrong way","d":"Reverse rotation","c":[["Phase sequence at the supply","Check with a phase rotation meter.",""],["Connections at the motor","Isolate and swap any two phases at one end only.",""],["VFD direction setting","Check the direction and reverse parameters.",""]]},{"id":"ol","n":"Overload relay trips","d":"Thermal or electronic overload","c":[["Setting wrong","Set to nameplate FLA. In a star-delta starter with the overload in the phase circuit, set to 0.58 × FLA.",""],["Real overload","Measure current. Check the driven load for binding.","Motor current"],["Single phasing or unbalance","Measure all three currents.","Voltage & current unbalance"],["Long starting time","High-inertia fans need a class 20 or 30 overload.",""],["Loose terminals at the relay","Check torque.",""]]},{"id":"irlow","n":"Low insulation resistance","d":"Megger reading below minimum","c":[["Moisture","Dry out with space heaters or low-voltage current, then re-test and check PI.","Insulation resistance"],["Dirt in the terminal box","Clean, dry and re-test.",""],["Electronics left connected","Disconnect VFDs, surge protectors and instruments before testing.",""],["Cable damage","Test sections separately to find it.",""],["Winding insulation failure","Confirm with PI and winding resistance. Rewind or replace.",""]]},{"id":"vdrop","n":"Low voltage at the load","d":"Voltage drop","c":[["Cable too small or too long","Recalculate voltage drop.","Cable size"],["Loose or high-resistance joints","Measure volt drop across each joint under load. Use thermography.",""],["Supply low at source","Check at the transformer and its tap position.","Transformer"],["Dips when large motors start","DOL starting causes voltage dips. Consider soft start or VFD.","Generator size"]]},{"id":"flick","n":"Lights flickering","d":"","c":[["Loose neutral or connection","Check the neutral at the board and joints.",""],["Large motor starting on the same supply","See if flicker matches motor starts.",""],["Failing LED driver","Swap the driver.",""],["Dimmer not compatible","Check driver and dimmer compatibility.",""],["Generator supply unstable","Check governor and AVR settings.",""]]},{"id":"chat","n":"Contactor chattering or humming","d":"","c":[["Low coil voltage","Measure at the coil while it pulls in. Long control cables cause drop.",""],["Dirty or worn pole faces, broken shading ring","Clean or replace the contactor.",""],["Bouncing control contact","Check thermostats, pressure switches and loose control wiring.",""],["Wrong coil voltage","Check the coil rating against the control supply, AC or DC.",""]]},{"id":"vfd","n":"VFD tripping","d":"Overcurrent, overvoltage, earth fault","c":[["Overcurrent: ramp too fast or overload","Increase the acceleration time. Check motor current and the load.","Motor current"],["Overvoltage: deceleration too fast","Increase the deceleration time or add a braking resistor.",""],["Earth fault in motor or cable","With the drive disconnected, IR test the motor and cable.","Insulation resistance"],["Motor data parameters wrong","Enter nameplate kW, V, A, rpm and Hz, then run auto-tune.",""],["Drive overheating","Check panel ventilation, drive fans and filters.",""],["Long motor cable","Use an output reactor or dV/dt filter and screened cable earthed at both ends.",""]]},{"id":"shock","n":"Tingling from metal frames","d":"Touch voltage","c":[["Missing or loose earth","Test earth continuity and check bonding connections.",""],["Earth fault with no RCD","Isolate and IR test.","Insulation resistance"],["Polarity reversed","Check live and neutral are not swapped.",""],["High earth electrode resistance","Test with an earth tester.",""],["Induced or ghost voltage","Confirm with a low-impedance tester before chasing it.",""]]},{"id":"phase","n":"Single phasing or phase failure","d":"","c":[["Blown fuse","Check each fuse.",""],["Loose or burnt terminal or contactor pole","Inspect and measure across each pole.",""],["Supply-side fault","Check the incoming supply.",""],["Phase failure relay","Check its settings and wiring.",""]]},{"id":"hot","n":"Burning smell or hot terminals","d":"","c":[["Loose termination","Isolate, re-torque to the maker's value, replace discoloured lugs.",""],["Cable or lug undersized, wrong crimp","Use the correct lug and die size.","Cable size"],["Overloaded circuit","Measure current against rating.",""],["Copper on aluminium without a bimetal lug","Replace with bimetal lugs.",""],["Harmonics heating the neutral","Measure neutral current on boards with many IT or LED loads.",""]]},{"id":"ma","n":"4–20 mA signal wrong or missing","d":"Transmitter to BMS or PLC","c":[["Open loop (0 mA)","Check wiring continuity, fuses and the 24 V loop supply.",""],["Range mismatch","Check LRV and URV at the transmitter and in the BMS or PLC.","4–20 mA scaling"],["Polarity or 2-wire / 4-wire mismatch","Check the wiring against the loop drawing.",""],["Loop load too high","Check total loop resistance against the transmitter's maximum.",""],["Earth loop or screen problem","Earth the screen at one end only.",""],["Transmitter in alarm","3.6 mA or 21 mA usually means a sensor fault (NAMUR NE 43).",""]]},{"id":"pf","n":"Low power factor or capacitor bank faults","d":"","c":[["Capacitor steps failed or fuses blown","Measure current or kVAr per step.",""],["Controller CT in the wrong place","The CT must see total load current on the correct phase.",""],["Harmonics damaging capacitors","On sites with many VFDs, use detuned reactors.",""],["Bank too small for the load","Recalculate kVAr.","Power factor fix"]]},{"id":"gen","n":"Generator won't start or take load","d":"","c":[["Battery or starter","Check battery voltage while cranking (should stay above about 9.6 V on a 12 V system) and the charger.",""],["Fuel","Check fuel level, valves open, air in the fuel line and fuel filter.",""],["Control in wrong mode or alarm active","Check AUTO mode, emergency stop and alarms on the controller.",""],["ATS not transferring","Check ATS mode, timers and the generator voltage and frequency are in range.",""],["Load step too big","Large motors starting at once. Stage the loads.","Generator size"]]},{"id":"ups","n":"UPS alarm or on battery","d":"","c":[["Input supply out of range","Measure input voltage and frequency. Generator supply may be unstable.",""],["Battery fault or end of life","Check battery voltage, temperature and the last battery test result.","UPS / battery backup"],["Overload","Compare load % with the UPS rating.",""],["Bypass or fan alarm","Check the event log and the cooling fans.",""]]},{"id":"earth","n":"Earth resistance too high","d":"Earth pit test fails","c":[["Dry soil","Readings rise in dry season. Water the pit and re-test, or add rods.",""],["Corroded or loose connection","Check the clamp at the rod and the test link.",""],["Too few rods or rods too short","Add rods spaced at least their own length apart, or drive deeper.",""],["Wrong test method","Use the 3-point (fall of potential) method with the test spikes far enough away.",""]]},{"id":"harm","n":"High neutral current or harmonics","d":"Hot neutral, transformer overheating","c":[["Non-linear loads","PCs, LED drivers and VFDs create triple harmonics that add up in the neutral.",""],["Unbalanced single-phase loads","Rebalance loads across the three phases.","Voltage & current unbalance"],["Neutral undersized","Size the neutral for harmonic current, often 1.5–2 × phase on IT boards.","Cable size"],["No filtering","Fit harmonic filters or use low-harmonic drives.",""]]}],"ref":[{"id":"warm","n":"Not cooling enough / warm air","d":"","c":[["Dirty filter or coil, or low airflow","Check filters, indoor coil, blower speed and belt. Measure the air temperature drop across the coil: 8–12 K is normal.",""],["Low refrigerant charge (leak)","High superheat with low subcooling. Use the Charge check tool, then leak test with nitrogen or a detector before recharging.","Charge check"],["Dirty condenser or high ambient","Clean the condenser coil and check the condenser fan. Compare condensing temperature to outdoor air: 10–20 K above is normal.",""],["Undersized for the load","Run the Heat load tool. Check for open doors, extra equipment or too much fresh air.",""],["Compressor not pumping","Suction too high and discharge too low at the same time. Check compressor current against RLA and valve condition.",""]]},{"id":"nostart","n":"Unit does not start","d":"","c":[["No power or tripped breaker","Check supply voltage at the unit and the isolator, breaker and fuses.",""],["Thermostat or controller","Check set point, mode, batteries and the control signal (24 V or communication) to the outdoor unit.",""],["Safety lockout","Read the fault code. Check the high / low pressure switches and the overload, and reset only after finding the cause.",""],["Failed capacitor or contactor","Measure the capacitor µF against its label (±6 %) and check the contactor coil voltage and contacts.",""],["Compressor winding fault","Measure winding resistance (C–S, C–R, S–R) and insulation resistance to earth.",""]]},{"id":"iceevap","n":"Ice on the indoor coil or suction line","d":"","c":[["Low airflow","Dirty filter, blocked return, slow or failed blower, or closed dampers. Fix airflow before touching the charge.",""],["Low charge","Suction saturation below 0 °C with high superheat. Find and fix the leak.","Charge check"],["Restriction or TXV problem","Temperature drop across the filter drier, or a TXV bulb that is loose or lost its charge.",""],["Running at very low load or low ambient","Check the low ambient control and night set points.",""]]},{"id":"hihead","n":"High head (discharge) pressure","d":"","c":[["Dirty or blocked condenser","Clean the coil and remove obstructions. Check for hot air recirculation around the unit.",""],["Condenser fan fault","Check fan rotation, speed, motor current and the fan capacitor.",""],["Overcharge","High subcooling with high head. Recover charge and recheck subcooling.","Charge check"],["Non-condensable gas (air) in the system","Head pressure above the saturation pressure at the liquid temperature when the system is off and equalised. Recover, evacuate and recharge.",""],["Water flow on water-cooled units","Check condenser water flow, ΔT and tube fouling.",""]]},{"id":"losuct","n":"Low suction pressure","d":"","c":[["Low charge","High superheat with low subcooling. Leak test before charging.","Charge check"],["Low indoor airflow","Dirty filter or coil, or a blower problem. Superheat will be low.",""],["Restriction (filter drier, TXV, strainer)","Temperature drop across the drier, high subcooling with high superheat.",""],["TXV underfeeding","Check the bulb mounting and insulation, the superheat setting and the power head.",""]]},{"id":"hisuct","n":"High suction pressure","d":"","c":[["Overcharge","Low superheat and high subcooling. Recover some charge.","Charge check"],["TXV overfeeding or stuck open","Low superheat. Check bulb position, contact and insulation.",""],["Compressor valves or scroll worn","High suction and low head together, with low current. Do a compressor efficiency check.",""],["High heat load","Very high return air temperature or too much fresh air.",""]]},{"id":"short","n":"Compressor short cycling","d":"","c":[["Thermostat location or differential","Thermostat near a supply grille or in sunlight, or differential set too low.",""],["Oversized unit","Unit reaches set point too fast. Check the capacity against the Heat load result.",""],["Low charge tripping the low-pressure switch","Watch suction pressure at cut-out. Leak test.","Charge check"],["High head tripping the high-pressure switch","See High head pressure. Check the condenser and its fan.",""],["Overload tripping","Measure current and voltage, and check the motor and its capacitor.",""]]},{"id":"trip","n":"Compressor trips on overload / high current","d":"","c":[["Low or unbalanced voltage","Measure all phases under load. Use the Unbalance tool: over 2 % voltage unbalance overheats motors.",""],["High head pressure","A dirty condenser or failed fan raises compressor current.",""],["Failed run capacitor","Measure µF. A weak capacitor raises current on single-phase compressors.",""],["Mechanical tightness or a winding fault","Check winding resistance balance and insulation resistance. Locked rotor current at start means a seized compressor.",""],["Wrong overload setting","Set to the nameplate RLA / FLA, not above.",""]]},{"id":"ofan","n":"Outdoor fan not running","d":"","c":[["Fan capacitor failed","Measure µF against the label.",""],["Fan motor failed or seized","Spin by hand with power isolated. Check winding resistance and bearings.",""],["Control board or fan speed controller","Check output voltage to the fan, and the head pressure control setting.",""],["Contactor or relay","Check coil voltage and contacts.",""]]},{"id":"water","n":"Water leaking from the indoor unit","d":"","c":[["Blocked condensate drain","Flush the drain line and trap. Check the drain pan for sludge.",""],["Unit not level or drain slope wrong","Unit must fall toward the drain. Drain line slope at least 1 %.",""],["Frozen coil melting","See Ice on the indoor coil.",""],["Missing trap on a draw-through unit","Negative pressure holds water in the pan. Fit a trap of the right depth.",""],["Sweating pipes or ducts","Use the Sweating check tool and repair insulation.",""]]},{"id":"noise","n":"Noisy compressor or unit","d":"","c":[["Loose panels, mounts or pipes","Tighten fixings and check pipe clamps and anti-vibration mounts.",""],["Liquid floodback to compressor","Very low superheat with knocking noise. Check charge, TXV and airflow.","Superheat"],["Fan blade or bearing","Check blade balance, clearance and bearings.",""],["Compressor internal wear","Noise with low pumping performance. Check current and pressures.",""],["Wrong rotation (3-phase scroll)","Loud noise, no pressure difference. Swap two phases.",""]]},{"id":"bubbles","n":"Bubbles in the sight glass","d":"","c":[["Low charge","Bubbles with low subcooling and high superheat. Find the leak.","Charge check"],["Restriction before the sight glass","Temperature drop across the filter drier or a kinked liquid line.",""],["Normal for some blends at low load","Check subcooling before acting. Bubbles alone are not proof of low charge with R-407C or on start-up.",""],["Low head pressure","Low ambient or fan cycling. Check head pressure control.",""]]},{"id":"hotcomp","n":"Compressor running very hot","d":"","c":[["High superheat (starved evaporator)","Suction gas cools the compressor. Check charge and TXV.","Superheat"],["High head pressure","Clean the condenser and check its fan.",""],["Low voltage or unbalance","Measure all phases under load.",""],["Short cycling","Repeated starts heat the motor. See Short cycling.",""],["Low oil or wrong oil","Check the oil level in the sight glass where fitted.",""]]},{"id":"oil","n":"Low oil or oil not returning","d":"Low oil level, oil pressure trips","c":[["Low refrigerant velocity in risers","Oil is not carried back up suction risers. Check riser sizing and traps.",""],["Long run time at low load","Oil stays in the evaporator. Check for oil return cycles on VRF.",""],["Floodback diluting oil","Low superheat washes oil out. Check superheat.","Superheat"],["Leak with oil loss","Look for oil stains at joints.",""]]},{"id":"defrost","n":"Heat pump defrost problems","d":"Outdoor coil iced in heating","c":[["Defrost sensor faulty or loose","Check the sensor resistance and mounting on the coil.",""],["Reversing valve sticking","Check the coil voltage and listen for the valve shifting.",""],["Low charge","Low suction in heating mode. Leak test.","Charge check"],["Drain blocked under outdoor unit","Meltwater refreezes. Clear the base pan drain.",""]]}],"plumb":[{"id":"lowp","n":"Low water pressure","d":"Weak flow at taps or showers","c":[["Supply pressure low","Measure pressure at the incoming main or booster outlet.","Pressure from height"],["Partly closed valve or blocked strainer","Check isolating valves, the meter and inline strainers.",""],["Pipe undersized or scaled","Check velocity and friction loss for the actual flow.","Friction loss"],["Aerator or shower head blocked","Clean or replace.",""],["PRV set too low or faulty","Check the pressure reducing valve setting and outlet pressure.",""]]},{"id":"upper","n":"No water on upper floors","d":"","c":[["Not enough head or booster not running","Each 10 m of height needs about 98 kPa. Check the booster set.","Pressure from height"],["Booster set fault","Check pump status, pressure switch or transducer and the vessel pre-charge.","Total pump head"],["Air lock in the riser","Vent the high points.",""],["Roof tank empty","Check the float valve and the transfer pump.",""]]},{"id":"hammer","n":"Water hammer","d":"Banging when taps or valves close","c":[["Fast-closing valves","Solenoid and quarter-turn valves close too quickly. Fit arrestors near them.",""],["High velocity","Velocity above about 2 m/s makes hammer worse.","Pipe flow & velocity"],["High static pressure","Fit or adjust a PRV.",""],["Loose pipe clips","Add or tighten supports.",""]]},{"id":"nohot","n":"No hot water or not hot enough","d":"","c":[["Heater has no power or thermostat set low","Check the breaker, isolator, thermostat and the element or burner.",""],["Element or thermostat failed","Measure element resistance and check the cut-out has not tripped.",""],["Heater too small for demand","Check the heater rating against the draw-off.","Water heater size"],["Mixing valve faulty or cold crossover","Check the TMV and any mixer that lets cold into the hot line.",""],["Long dead leg or no return circulation","Water cools in long pipes. Check the return pump.",""]]},{"id":"scald","n":"Hot water too hot","d":"Scalding risk","c":[["Thermostat set too high or stuck","Check the setting and measure outlet temperature.",""],["No or faulty thermostatic mixing valve","Fit or service the TMV at outlets, typically 41–43 °C for showers.",""],["Solar or heat pump overheating","Check the limit settings.",""]]},{"id":"boost","n":"Booster pump short cycling","d":"Starts and stops often","c":[["Pressure vessel pre-charge wrong","Pre-charge should be about 10 % below cut-in pressure with the system drained.",""],["Leak or dripping outlet","A small leak drops pressure and restarts the pump.",""],["Pressure switch band too narrow","Widen the cut-in to cut-out difference.",""],["Non-return valve passing","Water flows back and pressure falls.",""]]},{"id":"leak","n":"Leaking joints","d":"","c":[["Fitting not fully inserted or tightened","Check insertion depth marks and compression nuts.",""],["Wrong fitting for the pipe","PPR, PEX and copper need their own fittings and tools.",""],["Pressure above rating","Check working pressure and do a hydro test to spec.",""],["Expansion stress","Long hot lines need expansion loops or joints.",""]]},{"id":"block","n":"Drain blocked or slow","d":"","c":[["Blockage","Rod or jet the line. Check grease traps on kitchen drains.",""],["Slope too flat or back-fall","Check the fall along the run.","Drain slope"],["Poor venting","Gurgling and slow draining point to a blocked or missing vent.",""],["Pipe undersized","Check the size against fixture units.",""]]},{"id":"smell","n":"Sewer smell","d":"","c":[["Dry trap","Unused floor drains lose their water seal. Refill or fit trap primers.",""],["Vent blocked or missing","Siphoning pulls traps dry. Check the vent stack.",""],["Loose joint or cracked pipe","Smoke test the drainage.",""],["Air admittance valve stuck","Replace the AAV.",""]]},{"id":"cistern","n":"Toilet keeps running","d":"","c":[["Flush valve seal worn","Replace the seal or washer.",""],["Fill valve set too high","Water runs into the overflow. Lower the float.",""],["Fill valve not closing","Clean or replace the valve.",""]]},{"id":"dirty","n":"Dirty or discoloured water","d":"","c":[["Rust from steel pipes or tanks","Check for galvanised pipe or corroded tanks.",""],["Disturbed sediment","After shutdowns or high flow. Flush the system.","Pipe volume"],["Tank not cleaned","Clean and disinfect storage tanks.",""]]},{"id":"prv","n":"Relief valve dripping on water heater","d":"T&P or pressure relief valve","c":[["Supply pressure too high","Fit or adjust a PRV on the cold inlet.",""],["No expansion vessel or vessel flat","Hot water expands. Check the vessel pre-charge.",""],["Thermostat overheating","Check the water temperature.",""],["Valve seat dirty or worn","Operate the lever to flush, or replace the valve.",""]]},{"id":"overflow","n":"Water tank overflowing","d":"","c":[["Float valve not closing","Clean or replace the float valve or washer.",""],["Float set too high","Adjust the float arm.",""],["Level switch fault on pumped fill","Check the level controls and pump control.",""]]}]};
const TSAFE={"hvac":"Isolate and lock out before opening fans, heaters or panels. Let duct heaters cool before touching elements.","elec":"Isolate, lock out and prove dead before working. Only qualified persons should test live circuits, with the right PPE and a CAT-rated meter.","ref":"Recover refrigerant, never vent it. Isolate power before opening panels, and wear gloves and goggles when connecting gauges.","plumb":"Isolate water and power before work. Let hot water cool and relieve pressure before opening pipes or heaters."};



const TSEC=[["all","All"],["hvac","HVAC"],["elec","Electrical"],["ref","Refrigeration"],["plumb","Plumbing"]];
const TSN={hvac:"HVAC",elec:"Electrical",ref:"Refrigeration",plumb:"Plumbing"};
function trUI(el,st){
 if(!TSEC.some(s=>s[0]===st.sec))st.sec="all";if(typeof st.q!=="string")st.q="";
 el.innerHTML=`<div class="card">
   <div class="field"><span class="lbl">Section</span><div class="chips" id="tr-sec">${TSEC.map(s=>`<button type="button" data-v="${s[0]}" aria-pressed="${st.sec===s[0]}">${s[1]}</button>`).join("")}</div></div>
   <label class="field"><span class="lbl">Search</span><span class="inp"><input id="tr-q" type="search" value="${esc(st.q)}" placeholder="tripping, noise, leak…" style="font-family:var(--f-body);font-size:17px"></span></label>
   <label class="field"><span class="lbl">What is the problem?</span><span class="help" id="tr-count"></span><span class="inp"><select id="tr-sel"></select></span></label>
  </div><div class="ans" id="tr-ans" aria-live="polite"></div><div id="tr-after"></div>`;
 const match=()=>{const q=st.q.trim().toLowerCase();const out=[];
  Object.keys(TSD).forEach(k=>{if(st.sec!=="all"&&st.sec!==k)return;TSD[k].forEach(f=>{if(!q||(f.n+" "+f.d+" "+f.c.map(c=>c[0]+" "+c[1]).join(" ")).toLowerCase().includes(q))out.push([k,f]);});});return out;};
 const fill=()=>{const m=match(),sel=el.querySelector("#tr-sel");
  if(m.length&&!m.some(([k,f])=>k+"/"+f.id===st.sel))st.sel=m[0][0]+"/"+m[0][1].id;
  const grp={};m.forEach(([k,f])=>(grp[k]=grp[k]||[]).push(f));
  sel.innerHTML=Object.keys(grp).map(k=>`<optgroup label="${TSN[k]}">${grp[k].map(f=>`<option value="${k}/${f.id}"${st.sel===k+"/"+f.id?" selected":""}>${f.n}</option>`).join("")}</optgroup>`).join("");
  sel.disabled=!m.length;
  el.querySelector("#tr-count").textContent=m.length?`${m.length} fault${m.length===1?"":"s"}${st.q.trim()?` match “${st.q.trim()}”`:""}`:"";
  show2(m.length);};
 const show2=(n)=>{const A=el.querySelector("#tr-ans"),F=el.querySelector("#tr-after");
  if(!n){A.innerHTML=`<div class="cap">Answer</div><p class="hint">No fault matches “${esc(st.q.trim())}”. Try another word, or pick All.</p>`;F.innerHTML="";return;}
  const[k,id]=st.sel.split("/"),f=TSD[k].find(x=>x.id===id);
  A.innerHTML=`<div class="cap">${TSN[k]} · most likely cause</div><div class="verdict">${f.c[0][0]}</div><p class="say">${f.n}${f.d?` (${f.d.toLowerCase()})`:""}: work through these ${f.c.length} causes in order, starting with the most likely.</p>`;
  F.innerHTML=`<div class="ts-safety"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><span>${TSAFE[k]}</span></div>
   <div class="card" style="margin-top:14px"><ol class="steps">${f.c.map(c=>`<li><b>${c[0]}</b><span>${c[1]}</span>${c[2]?`<br><span class="ts-tool">MEPify: ${c[2]}</span>`:""}</li>`).join("")}</ol></div>`;};
 el.querySelectorAll("#tr-sec button").forEach(b=>b.onclick=()=>{st.sec=b.dataset.v;el.querySelectorAll("#tr-sec button").forEach(x=>x.setAttribute("aria-pressed",x===b));save();fill();});
 el.querySelector("#tr-q").addEventListener("input",e=>{st.q=e.target.value;save();fill();});
 el.querySelector("#tr-sel").addEventListener("change",e=>{st.sel=e.target.value;save();show2(1);});
 fill();
}

{id:"date",g:"basic",icon:"date",name:"Date calculator",short:"Days between dates, or add days to a date",

   const s=v.op==="-"?-1:1,u=v.n_u;let t;
   if(u==="months")t=addMonths(a,s*Math.round(n));else if(u==="years")t=addMonths(a,s*Math.round(n)*12);else t=a+s*Math.round(n*(u==="weeks"?7:1))*864e5;
   if(!isFinite(t)||Math.abs(t)>8.64e15)return{hint:"That is too far from the start date. Enter a smaller number."};
   const days=Math.round((t-a)/864e5);
   return{cap:"Result date",value:new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}),unit:"",
    say:`${v.op==="-"?"Going back":"Going forward"} ${n===1?"1 "+u.slice(0,-1):f(n)+" "+u} from ${dFmt(a)} lands on ${B(dFmt(t))}.`,

  const b=pDate(v.d2);if(!isFinite(b))return{hint:"Pick the end date."};
  const lo=Math.min(a,b),hi=Math.max(a,b),inc=v.incl==="1"?1:0,days=Math.round((hi-lo)/864e5)+inc;

  if(days<=40000)for(let i=0;i<days;i++){const wd=new Date(lo+i*864e5).getUTCDay();if(!off.includes(wd))work++;}
  const[y,m,d]=ymd(lo,hi+inc*864e5),parts=[y&&plural(y,"year"),m&&plural(m,"month"),(d||!(y||m))&&plural(d,"day")].filter(Boolean).join(", ");
  return{cap:b<a?"Time between (end is before start)":"Time between",value:f(days,0),unit:days===1?"day":"days",

 ],
 calc(v){
  const L=num(v.L),W=num(v.W),H=num(v.H),xw=num(v.xw)||0,ga=num(v.ga)||0,np=num(v.np)||0,lpd=num(v.lpd)||0,eq=num(v.eq)||0;
  if(!(L>0&&W>0&&H>0))return{hint:"Enter the room length, width and height."};
  const to=num(v.to),ti=num(v.ti),ro=num(v.ro),ri=num(v.ri);if(!isFinite(to)||!isFinite(ti)||!(ro>0&&ri>0))return{hint:"Check the design conditions under More options."};
  const A=L*W,dT=to-ti,Wo=PSY.fromRH(to,ro,101.325).W,Wi=PSY.fromRH(ti,ri,101.325).W;
  const shgf=num(v.gd)||0,scf=num(v.sc)||0.5;

  const sf=1+(num(v.sf)||0)/100;
  const roomS=(gS+gC+wall+roof+pS+lt+eq)*sf,roomL=pL*sf,S=roomS+fS*sf,Lt=roomL+fL*sf,tot=S+Lt,kw=tot/1000,tr=kw/3.51685;

  const brk=`<div class="card" style="padding:10px"><div class="lbl" style="font-size:13px">Where the heat comes from</div><div class="ptab"><table class="fit"><thead><tr><th>Source</th><th>W</th><th>Share</th></tr></thead><tbody>${parts.filter(p=>p[1]>0).map(p=>`<tr><td>${p[0]}</td><td>${f(p[1],0)}</td><td>${f(p[1]/tot*100,0)} %</td></tr>`).join("")}</tbody></table></div></div>`;

 ],
 calc(v){
  const MU={"kg/s":1,"kg/h":1/3600,"t/h":1000/3600,"lb/h":0.45359237/3600},QU={"m³/s":1,"m³/h":1/3600,"L/s":0.001,"CFM":0.000471947,"US GPM":0.0000630902};
  const t=num(v.t),alt=num(v.alt)||0;let rho,src="";
  if(v.mode==="rho"){const m=num(v.m)*MU[v.m_u||"kg/s"],q=num(v.q)*QU[v.q_u||"m³/s"];
   if(!(m>0&&q>0))return{hint:"Enter the mass flow and the volume flow."};
   rho=m/q;
   return{cap:"Density",value:f(rho,rho<10?3:1),unit:"kg/m³",say:`${B(f(m,3),"kg/s")} ÷ ${B(f(q,4),"m³/s")} = ${B(f(rho,rho<10?3:1),"kg/m³")}. `+(rho>950&&rho<1010?"That is about water.":rho>1&&rho<1.4?"That is about air.":""),
    rows:[["Specific volume",f(1/rho,4),"m³/kg"],["Relative to water",f(rho/1000,3),""],["In lb/ft³",f(rho*0.062428,3),"lb/ft³"]]};}
  if(v.fl==="water"){if(!(t>=0&&t<=100))return{hint:"Water temperature must be 0 to 100 °C."};rho=1000*(1-(t+288.9414)/(508929.2*(t+68.12963))*(t-3.9863)**2);src=`water at ${f(t,1)} °C`;}
  else if(v.fl==="air"){if(!(t>-50&&t<200))return{hint:"Air temperature must be −50 to 200 °C."};if(!(alt>=-400&&alt<6000))return{hint:"Enter an altitude between 0 and 6000 m."};
   rho=PSY.p(alt)*1000/(287.05*(t+273.15));src=`dry air at ${f(t,1)} °C${alt?`, ${f(alt,0)} m altitude`:""}`;}
  else{rho=num(v.rho);if(!(rho>0))return{hint:"Enter the fluid density in kg/m³."};src=`density ${f(rho)} kg/m³`;}
  let m,q;
  if(v.mode==="vol"){m=num(v.m)*MU[v.m_u||"kg/s"];if(!(m>0))return{hint:"Enter the mass flow."};q=m/rho;}
  else{q=num(v.q)*QU[v.q_u||"m³/s"];if(!(q>0))return{hint:"Enter the volume flow."};m=q*rho;}
  const rq=[["Volume flow",f(q,4),"m³/s"],["Volume flow",f(q*3600,1),"m³/h"],["Volume flow",f(q*1000,2),"L/s"],[v.fl==="air"?"Airflow":"Flow",f(v.fl==="air"?q/0.000471947:q/0.0000630902,0),v.fl==="air"?"CFM":"US GPM"]];
  const rm=[["Mass flow",f(m,3),"kg/s"],["Mass flow",f(m*3600,0),"kg/h"],["Mass flow",f(m*3.6,2),"t/h"]];
  const rows=(v.mode==="vol"?rq.slice(1):rm.slice(1)).concat(v.mode==="vol"?rm.slice(0,1):rq.slice(0,2)).concat([["Density used",f(rho,rho<10?3:1),"kg/m³"]]);
  return v.mode==="vol"?{cap:"Volume flow",value:f(q*1000,2),unit:"L/s",say:`${B(f(m,3),"kg/s")} of ${src} (${f(rho,rho<10?3:1)} kg/m³) is ${B(f(q,4),"m³/s")}, which is ${B(f(q*3600,1),"m³/h")}.`,rows}
   :{cap:"Mass flow",value:f(m,3),unit:"kg/s",say:`${B(f(q*3600,1),"m³/h")} of ${src} (${f(rho,rho<10?3:1)} kg/m³) is ${B(f(m,3),"kg/s")}, which is ${B(f(m*3600,0),"kg/h")}.`,rows};
 },
 note:"Volume flow = mass flow ÷ density. kg/s and kg/m³ are different quantities and cannot be converted directly. Water density from the Kell equation; dry air from the ideal gas law at the altitude pressure. Humid air is about 1 % lighter."},

{id:"ach",g:"hvac",icon:"ach",name:"Air changes",short:"Airflow needed for a room",
 intro:"Enter the room size and how many times per hour the air must be replaced.",
 fields:[
  {id:"L",label:"Length",type:"num",def:"5",unit:"m",half:true},
  {id:"W",label:"Width",type:"num",def:"4",unit:"m",half:true},
  {id:"H",label:"Ceiling height",type:"num",def:"3",unit:"m"},
  {id:"n",label:"Air changes per hour",type:"num",def:"6",unit:"ACH",presets:[["4","Store 4"],["6","Office 6"],["10","Toilet 10"],["15","Kitchen 15"]]}
 ],
 calc(v){
  const L=num(v.L),W=num(v.W),H=num(v.H),n=num(v.n);
  if(!(L>0&&W>0&&H>0))return{hint:"Enter length, width and height of the room."};
  if(!(n>0))return{hint:"Enter how many air changes per hour you need."};
  const vol=L*W*H,q=vol*n;
  return{cap:"Airflow needed",value:f(q,0),unit:"m³/h",
   say:`This ${f(vol,1)} m³ room needs ${B(f(q,0),"m³/h")} of air (${B(f(q/1.699,0),"CFM")}) to change the air ${f(n)} times an hour.`,
   rows:[["Airflow",f(q/1.699,0),"CFM"],["Airflow",f(q/3.6,1),"L/s"],["Room volume",f(vol,1),"m³"]]};
 }},

{id:"duct",g:"hvac",icon:"duct",name:"Duct size",short:"Round and rectangular duct from airflow",
 intro:"Enter the airflow and pick where the duct is. You get the duct size to use.",
 fields:[
  {id:"q",label:"Airflow",type:"num",def:"1500",units:["m³/h","CFM","L/s"],udef:"m³/h"},
  {id:"v",label:"Where is the duct?",help:"Sets the air speed. Lower speed is quieter but needs a bigger duct.",type:"num",def:"5",unit:"m/s",presets:[["3","Quiet room 3"],["4","Branch 4"],["5","Main duct 5"],["7","Plant room 7"]]},
  {id:"h",label:"Maximum duct height",help:"For the rectangular size, from the ceiling space you have.",type:"num",def:"250",unit:"mm",adv:true}
 ],
 calc(v){
  const qv=num(v.q),vel=num(v.v),h=num(v.h)||250;
  if(!(qv>0))return{hint:"Enter the airflow."};if(!(vel>0))return{hint:"Pick or enter an air speed."};
  const Q=qv*(AIRF[v.q_u]||AIRF["m³/h"]),A=Q/vel,D=Math.sqrt(4*A/Math.PI)*1000;
  const Dr=ROUND.find(d=>d>=D)||Math.ceil(D/50)*50;
  const vr=Q/(Math.PI/4*(Dr/1000)**2);
  let hh=Math.max(100,Math.round(h/50)*50),w=100;
  while(DE(w,hh)<D&&w<6000)w+=50;
  if(w<hh){let s2=100;while(DE(s2,s2)<D)s2+=50;w=hh=s2;}
  const vrect=Q/(w/1000*hh/1000);
  return{cap:"Round duct",value:"Ø "+Dr,unit:"mm",
   say:`Use a ${B("Ø "+Dr,"mm")} round duct or a ${B(w+" × "+hh,"mm")} rectangular duct. Air speed will be about ${f(vr,1)} m/s.`,
   rows:[["Rectangular",w+" × "+hh,"mm"],["Speed in rectangular",f(vrect,1),"m/s"],["Exact round size",f(D,0),"mm"],["Airflow",f(Q*1000,0),"L/s"]]};
 },
 note:"Round size is set by air speed. The rectangular size has the same pressure loss as the exact round size, so it can carry the same air. For long runs, check pressure drop too (aim for about 1 Pa per metre)."},

{id:"chw",g:"hvac",icon:"chw",name:"Chilled water flow",short:"Water flow and pipe size",
 intro:"Enter the cooling load. You get the water flow and the pipe size to use.",
 fields:[
  {id:"load",label:"Cooling load",type:"num",def:"100",units:["kW","TR"],udef:"kW"},
  {id:"dt",label:"Water temperature difference",help:"Return minus supply, for example 12.5 − 7 = 5.5 °C.",type:"num",def:"5.5",unit:"°C",presets:[["5","5"],["5.5","5.5"],["6","6"],["8","8"]]},
  {id:"vmax",label:"Maximum water speed in pipe",type:"num",def:"1.5",unit:"m/s",adv:true}
 ],
 calc(v){
  let kw=num(v.load);const dt=num(v.dt),vmax=num(v.vmax)||1.5;
  if(!(kw>0))return{hint:"Enter the cooling load."};if(!(dt>0))return{hint:"Enter the water temperature difference."};
  if(v.load_u==="TR")kw*=3.51685;
  const ls=kw/(4.186*dt),q=ls/1000;
  const p=PIPE.find(p=>q/(Math.PI/4*(p[1]/1000)**2)<=vmax);
  const vp=p?q/(Math.PI/4*(p[1]/1000)**2):NaN;
  return{cap:"Water flow",value:f(ls,2),unit:"L/s",
   say:p?`Flow needed is ${B(f(ls,2),"L/s")} (${f(ls*3.6,1)} m³/h). Use ${B(p[0])} pipe. Water speed will be ${f(vp,2)} m/s.`:`Flow needed is ${B(f(ls,2),"L/s")} (${f(ls*3.6,1)} m³/h). That is bigger than DN400, so split it over two pipes.`,
   rows:[["Flow",f(ls*3.6,2),"m³/h"],["Flow",f(ls*15.8503,1),"US GPM"],["Cooling load",f(kw/3.51685,1),"TR"]]};
 },
 note:"Plain water, steel pipe sizes (schedule 40). For glycol mixes, add 10 to 15 % to the flow."},

{id:"air",g:"hvac",icon:"air",name:"Coil capacity check",short:"Cooling from airflow and temperatures",
 intro:"Use during testing and balancing. Measure the airflow and the air temperature before and after the coil.",
 fields:[
  {id:"q",label:"Measured airflow",type:"num",def:"3000",units:["m³/h","CFM","L/s"],udef:"m³/h"},
  {id:"t1",label:"Air temperature entering coil",type:"num",def:"26",unit:"°C",half:true},
  {id:"t2",label:"Air temperature leaving coil",type:"num",def:"14",unit:"°C",half:true}
 ],
 calc(v){
