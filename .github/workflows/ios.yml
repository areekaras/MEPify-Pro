# Builds the MEPify iOS app on a Mac and checks it on an iPhone simulator.
# No Apple account is needed for this: the builds are unsigned. Signing and TestFlight come later.
name: Build iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          V=$(grep -o 'APPV="[0-9.]*"' js/config.js | grep -o '[0-9][0-9.]*')
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Build for the iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/MEPify.xcodeproj -scheme MEPify -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=${{ steps.v.outputs.ver }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee sim-build.log | grep -E "error:|warning: .*swift|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" sim-build.log; then
            grep -E "error:" sim-build.log | head -20 | while read -r l; do echo "::error title=simulator build::$l"; done
            exit 1
          fi

      - name: Build for a real iPhone (unsigned, proves it compiles for devices)
        run: |
          set -o pipefail
          xcodebuild -project ios/MEPify.xcodeproj -scheme MEPify -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=${{ steps.v.outputs.ver }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee device-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" device-build.log; then
            grep -E "error:" device-build.log | head -20 | while read -r l; do echo "::error title=device build::$l"; done
            exit 1
          fi

      - name: Run on an iPhone simulator
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/MEPify.app
          test -f "$APP/www/index.html" || { echo "::error::web files missing from the app"; exit 1; }
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          NAME=$(xcrun simctl list devices | grep "$DEV" | sed 's/ (.*//' | xargs)
          echo "::notice title=simulator::$NAME"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance light
          xcrun simctl install "$DEV" "$APP"
          ID=com.shafaf.mepify
          mkdir -p shots
          # 1st launch: opens every tool, saves a value
          xcrun simctl launch "$DEV" $ID -MEPifySelfTest; sleep 20
          DATA=$(xcrun simctl get_app_container "$DEV" $ID data)
          R1=$(cat "$DATA/Documents/selftest.json" 2>/dev/null || echo '{"error":"no result"}')
          echo "::notice title=run 1 (first launch)::$R1"
          xcrun simctl io "$DEV" screenshot shots/home-light.png
          # 2nd launch after the app is killed: the saved value must still be there
          xcrun simctl terminate "$DEV" $ID; sleep 2
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl launch "$DEV" $ID -MEPifySelfTest; sleep 15
          R2=$(cat "$DATA/Documents/selftest.json" 2>/dev/null || echo '{"error":"no result"}')
          echo "::notice title=run 2 (after kill and relaunch)::$R2"
          xcrun simctl io "$DEV" screenshot shots/home-dark.png
          python3 - "$R1" "$R2" <<'EOF'
          import json, sys
          r1, r2 = (json.loads(x) for x in sys.argv[1:3])
          fails = []
          if not r1.get("tools") or r1.get("opened") != r1.get("tools"): fails.append(f"tools opened {r1.get('opened')} of {r1.get('tools')}")
          if r1.get("toolErrors") or r2.get("toolErrors"): fails.append("tool errors: " + str(r1.get("toolErrors") or r2.get("toolErrors"))[:300])
          if r1.get("scriptErrors") or r2.get("scriptErrors"): fails.append("script errors: " + str(r1.get("scriptErrors") or r2.get("scriptErrors"))[:300])
          if not r1.get("native"): fails.append("native bridge missing")
          if not r2.get("savedBefore"): fails.append("saved data did not survive the relaunch")
          for f in fails: print(f"::error title=self-test::{f}")
          print(f"::notice title=self-test::{'PASS' if not fails else 'FAIL'} - app v{r1.get('app')}, {r1.get('opened')}/{r1.get('tools')} tools opened, {r1.get('faults')} faults, data kept after relaunch: {bool(r2.get('savedBefore'))}, top safe area {r1.get('safeTop')}")
          sys.exit(1 if fails else 0)
          EOF

      - name: Screenshots as text (so they can be read back without downloading)
        if: always()
        run: |
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png)
            sips -Z 900 -s format jpeg -s formatOptions 55 "$f" --out "shots/$n.jpg" >/dev/null
            base64 -i "shots/$n.jpg" | tr -d '\n' | fold -w 50000 > "shots/$n.b64"
            i=1; while read -r part; do echo "::notice title=shot $n $i::$part"; i=$((i+1)); done < "shots/$n.b64"
          done

      - name: Package
        if: always()
        run: |
          mkdir -p out
          [ -d build/Build/Products/Debug-iphonesimulator/MEPify.app ] && (cd build/Build/Products/Debug-iphonesimulator && zip -qry ../../../../out/MEPify-simulator.zip MEPify.app) || true
          cp shots/*.png out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MEPify-iOS-${{ steps.v.outputs.ver }}
          path: out/
