# MEPify (formerly SiteCalc Pro) - by Mohamed Shafaf Karumannil
# Builds the APK from index.html in this repo.
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create Android project
        run: |
          set -e
          mkdir -p out && cd out
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "MEPify"
          include ':app'
          EOF_FILE
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_FILE
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p "$(dirname app/build.gradle)"
          cat > app/build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.shafaf.sitecalc'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.shafaf.sitecalc'
                  minSdk 26
                  targetSdk 34
                  versionCode 14
                  versionName '1.14'
              }
              // Fixed signing key (from GitHub secrets) so every new APK installs over the old one.
              def ks = file('sitecalc-release.jks')
              signingConfigs {
                  fixed {
                      storeFile ks
                      storePassword System.getenv('KS_PASS') ?: ''
                      keyAlias 'sitecalc'
                      keyPassword System.getenv('KS_PASS') ?: ''
                  }
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { if (ks.exists()) signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/com/shafaf/sitecalc/MainActivity.java)"
          cat > app/src/main/java/com/shafaf/sitecalc/MainActivity.java <<'EOF_FILE'
          package com.shafaf.sitecalc;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import android.content.ContentValues;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.widget.Toast;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          /** MEPify by Mohamed Shafaf Karumannil. Runs the calculator fully offline from app assets. */
          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "SiteCalcNative");
                  setContentView(web);
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              /** Lets the page save the equipment schedule to Downloads and print it (Save as PDF). */
              public class Bridge {
                  @JavascriptInterface
                  public void print(final String job) {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                          if (pm != null) pm.print(job, web.createPrintDocumentAdapter(job), new PrintAttributes.Builder().build());
                      });
                  }

                  @JavascriptInterface
                  public String save(String name, String mime, String content) {
                      if (Build.VERSION.SDK_INT >= 29) {
                          try {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                              v.put(MediaStore.Downloads.MIME_TYPE, mime);
                              v.put(MediaStore.Downloads.IS_PENDING, 1);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (uri == null) throw new Exception("no file");
                              try (OutputStream o = getContentResolver().openOutputStream(uri)) {
                                  o.write(content.getBytes(StandardCharsets.UTF_8));
                              }
                              v.clear();
                              v.put(MediaStore.Downloads.IS_PENDING, 0);
                              getContentResolver().update(uri, v, null, null);
                              return "Saved to Downloads: " + name;
                          } catch (Exception e) {
                              // fall through to sharing
                          }
                      }
                      final Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("text/plain");
                      send.putExtra(Intent.EXTRA_SUBJECT, name);
                      send.putExtra(Intent.EXTRA_TEXT, content);
                      runOnUiThread(() -> startActivity(Intent.createChooser(send, "Share " + name)));
                      return "Choose where to send the schedule";
                  }

                  @JavascriptInterface
                  public void share(final String title, final String text) {
                      final Intent s = new Intent(Intent.ACTION_SEND);
                      s.setType("text/plain");
                      s.putExtra(Intent.EXTRA_SUBJECT, title);
                      s.putExtra(Intent.EXTRA_TEXT, text);
                      runOnUiThread(() -> startActivity(Intent.createChooser(s, "Share result")));
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  web.evaluateJavascript("(window.scBack && window.scBack()) ? '1' : '0'", v -> {
                      if (v == null || !v.contains("1")) finish();
                  });
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/strings.xml)"
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MEPify</string>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/colors.xml)"
          cat > app/src/main/res/values/colors.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="logo_bg">#FFFFFF</color>
              <color name="bg_light">#ECEFF1</color>
              <color name="bg_dark">#0F1316</color>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/styles.xml)"
          cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@color/bg_light</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@color/bg_light</item>
                  <item name="android:windowBackground">@color/bg_light</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values-night/styles.xml)"
          cat > app/src/main/res/values-night/styles.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@color/bg_dark</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">@color/bg_dark</item>
                  <item name="android:windowBackground">@color/bg_dark</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/drawable/ic_launcher_foreground.xml)"
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:translateX="22.6" android:translateY="22.6" android:scaleX="0.245" android:scaleY="0.245">
                  <path android:pathData="M128 24L218 76L128 128L38 76Z" android:fillColor="#1E7BE6" android:strokeColor="#1E7BE6" android:strokeWidth="10" android:strokeLineJoin="round" />
                  <path android:pathData="M38 76L128 128L128 232L38 180Z" android:fillColor="#1446B8" android:strokeColor="#1446B8" android:strokeWidth="10" android:strokeLineJoin="round" />
                  <path android:pathData="M128 128L218 76L218 180L128 232Z" android:fillColor="#12A39A" android:strokeColor="#12A39A" android:strokeWidth="10" android:strokeLineJoin="round" />
                  <path android:pathData="M128 128L38 76M128 128L218 76M128 128V232" android:strokeColor="#FFFFFF" android:strokeWidth="7" />
                  <path android:pathData="M128 104V128 M110 168L128 178.4 M174 164V178L128 204.6" android:strokeColor="#FFFFFF" android:strokeWidth="6" android:strokeLineCap="round" android:strokeLineJoin="round" />
                  <path android:pathData="M122.0,178.4a6.0,6.0 0 1,0 12.0,0a6.0,6.0 0 1,0 -12.0,0z" android:fillColor="#FFFFFF" />
                  <path android:pathData="M122.0,204.6a6.0,6.0 0 1,0 12.0,0a6.0,6.0 0 1,0 -12.0,0z" android:fillColor="#FFFFFF" />
                  <path android:pathData="M168.0,164.0a6.0,6.0 0 1,0 12.0,0a6.0,6.0 0 1,0 -12.0,0z" android:fillColor="#FFFFFF" />
                  <path android:pathData="M171.4,164.0a2.6,2.6 0 1,0 5.2,0a2.6,2.6 0 1,0 -5.2,0z" android:fillColor="#12A39A" />
                  <path android:pathData="M104.0,168.0a6.0,6.0 0 1,0 12.0,0a6.0,6.0 0 1,0 -12.0,0z" android:fillColor="#FFFFFF" />
                  <path android:pathData="M107.4,168.0a2.6,2.6 0 1,0 5.2,0a2.6,2.6 0 1,0 -5.2,0z" android:fillColor="#1446B8" />
                  <group android:translateX="128" android:translateY="72" android:scaleX="0.62" android:scaleY="0.62">
                    <path android:pathData="M4 -36H20L8 -6H22L-10 36L-2 4H-18Z" android:fillColor="#FFFFFF" android:strokeColor="#FFFFFF" android:strokeWidth="3" android:strokeLineJoin="round" />
                  </group>
                  <group android:translateX="82" android:translateY="150" android:scaleX="1.15" android:scaleY="1.15">
                    <path android:pathData="M0.0 0.0C-6.3 -3.4 -8.0 -14.3 -0.8 -19.7C4.6 -23.5 11.3 -18.5 8.4 -12.2C6.7 -8.4 3.8 -5.0 0.0 0.0Z" android:fillColor="#FFFFFF" />
                    <path android:pathData="M0.0 0.0C3.4 -6.3 14.3 -8.0 19.7 -0.8C23.5 4.6 18.5 11.3 12.2 8.4C8.4 6.7 5.0 3.8 0.0 0.0Z" android:fillColor="#FFFFFF" />
                    <path android:pathData="M-0.0 0.0C6.3 3.4 8.0 14.3 0.8 19.7C-4.6 23.5 -11.3 18.5 -8.4 12.2C-6.7 8.4 -3.8 5.0 -0.0 0.0Z" android:fillColor="#FFFFFF" />
                    <path android:pathData="M0.0 -0.0C-3.4 6.3 -14.3 8.0 -19.7 0.8C-23.5 -4.6 -18.5 -11.3 -12.2 -8.4C-8.4 -6.7 -5.0 -3.8 0.0 -0.0Z" android:fillColor="#FFFFFF" />
                    <path android:pathData="M-5.0,0.0a5.0,5.0 0 1,0 10.0,0a5.0,5.0 0 1,0 -10.0,0z" android:fillColor="#1446B8" />
                    <path android:pathData="M-2.5,0.0a2.5,2.5 0 1,0 5.0,0a2.5,2.5 0 1,0 -5.0,0z" android:fillColor="#FFFFFF" />
                  </group>
                  <group android:translateX="174" android:translateY="134" android:scaleX="0.58" android:scaleY="0.58">
                    <path android:pathData="M0 -36L20.5 -2.5A24 24 0 1 1 -20.5 -2.5Z" android:fillColor="#FFFFFF" />
                  </group>
                  <path android:pathData="M107.0,128.0a21.0,21.0 0 1,0 42.0,0a21.0,21.0 0 1,0 -42.0,0z" android:fillColor="#FFFFFF" />
                  <group android:translateX="128" android:translateY="127" android:scaleX="0.42" android:scaleY="0.42">
                    <path android:pathData="M0 -36C6 -22 24 -12 24 8C24 24 13 34 0 34C-13 34 -24 24 -24 10C-24 -2 -16 -10 -12 -18C-10 -10 -6 -6 -2 -6C-2 -16 -4 -26 0 -36Z" android:fillColor="#E5382B" />
                    <path android:pathData="M0 6C6 13 10 17 10 22C10 28 5 32 0 32C-5 32 -10 28 -10 22C-10 17 -6 13 0 6Z" android:fillColor="#FFFFFF" />
                  </group>
              </group>
          </vector>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml)"
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/logo_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_FILE
          # The app itself comes from index.html in the repo (one copy only).
          mkdir -p app/src/main/assets
          cp ../index.html app/src/main/assets/index.html
          # Version code goes up automatically with every build so phones accept the update.
          sed -i "s/versionCode 14/versionCode $((GITHUB_RUN_NUMBER + 100))/" app/build.gradle
          find . -type f | sort
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK at: $SDK"
          test -d "$SDK"
          echo "sdk.dir=$SDK" > out/local.properties
          ls "$SDK/platforms" "$SDK/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > out/app/sitecalc-release.jks
            echo "Signing with the fixed app key"
          else
            echo "::warning::SIGNING_KEY_B64 secret not set - APK uses a temporary key and will not update over the installed app"
          fi
      - name: Build APK
        working-directory: out
        env:
          KS_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp out/app/build/outputs/apk/debug/app-debug.apk MEPify.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MEPify-apk
          path: MEPify.apk
