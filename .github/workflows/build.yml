            el.querySelector("#cmd").textContent=sci?(st.deg?"DEG":"RAD"):"";
            const dk=el.querySelector('[data-i="'+(KS.length-1)+'"]');if(sci&&dk)dk.textContent=st.deg?"DEG":"RAD";
            el.querySelector("#chist").innerHTML=st.hist.length?`<div class="lbl" style="font-size:13px;color:var(--muted)">Recent</div>${st.hist.map((h,i)=>`<button type="button" data-h="${i}"><span>${esc(h.x)}</span><strong>${cfmt(h.v)}</strong></button>`).join("")}`:"";
            el.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const h=st.hist[+b.dataset.h];st.x=String(Number(h.v.toPrecision(12)));st.done=false;save();upd();});
           }
           function press(k){
            if(k==="clr"){st.x="";st.done=false;}
            else if(k==="bk"){if(st.done){st.done=false;st.x="";}else{const f=FNS.find(x=>st.x.endsWith(x+"("));st.x=f?st.x.slice(0,-(f.length+1)):st.x.endsWith("Ans")?st.x.slice(0,-3):st.x.endsWith("×10^")?st.x.slice(0,-4):st.x.slice(0,-1);}}
            else if(k==="deg"){st.deg=!st.deg;}
            else if(k==="neg"){const base=st.done?"Ans":st.x;st.done=false;st.x=!base?"−":/^−\(.*\)$/.test(base)?base.slice(2,-1):"−("+base+")";}
            else if(k==="inv"){const base=st.done?"Ans":st.x;st.done=false;st.x=base?"1÷("+base+")":"1÷";}
            else if(k==="eq"){if(!st.x)return;let v;try{v=evalExpr(st.x,st.deg,st.ans);}catch(e){v=NaN;}
             if(isFinite(v)){st.hist.unshift({x:st.x,v});st.hist=st.hist.slice(0,6);st.ans=v;st.last=st.x;st.done=true;st.x="";}
             else{st.last=st.x;st.done=false;el.querySelector("#crs").textContent="Error";return;}}
            else{if(st.done){st.x=ops.includes(k)?"Ans"+k:k;st.done=false;}else st.x+=k;}
            save();upd();
           }
           el.querySelectorAll(".keys button").forEach(b=>b.onclick=()=>press(all[+b.dataset.i][1]));
           calcPress=press;upd();
          }
          document.addEventListener("keydown",e=>{
           const t=byId(view);if(!t||!t.keypad||!calcPress||e.ctrlKey||e.metaKey||e.altKey)return;
           const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="select"||tag==="textarea")return;
           const m={"+":"+","-":"−","*":"×","x":"×","/":"÷","^":"^","(":"(",")":")","%":"%","!":"!",".":".",",":".","Enter":"eq","=":"eq","Backspace":"bk","Escape":"clr","Delete":"clr"};
           const k=/^[0-9]$/.test(e.key)?e.key:m[e.key];if(!k)return;e.preventDefault();calcPress(k);
          });

          /* ---------- BASIC: dates ---------- */
          const pad2=n=>String(n).padStart(2,"0");
          const todayISO=(()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());})();
          const isoAdd=(iso,days)=>{const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);};
          const pDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN;};
          const dFmt=t=>new Date(t).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
          function ymd(a,b){const A=new Date(a),Bd=new Date(b);let y=Bd.getUTCFullYear()-A.getUTCFullYear(),m=Bd.getUTCMonth()-A.getUTCMonth(),d=Bd.getUTCDate()-A.getUTCDate();
           if(d<0){m--;d+=new Date(Date.UTC(Bd.getUTCFullYear(),Bd.getUTCMonth(),0)).getUTCDate();}if(m<0){y--;m+=12;}return[y,m,d];}
          function addMonths(t,n){const d=new Date(t),day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return d.getTime();}
          const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;

          const TSD={"hvac":[{"id":"warm","n":"Room too warm","d":"Not reaching set point","c":[["Supply air too warm","Measure supply air at the diffuser. 12–15 °C is normal. If it is higher, the problem is at the coil or the chiller.","Coil capacity check"],["Low airflow","Dirty filters, closed or wrongly set dampers, a slipping belt or low fan speed. Measure airflow and compare with design.","Duct size"],["Chilled water not reaching the coil","Check CHW supply temperature, control valve stroke (command against actual position), strainer and isolating valves. Vent air from the coil.","Chilled water flow"],["Room sensor or set point wrong","Compare the sensor with a calibrated thermometer. Make sure it is not near a supply grille, in sunlight or by equipment. Check the BMS set point and schedule.",""],["Load higher than design","Extra people, equipment, open doors or more glass than drawn. Recalculate the room.","Heat load"]]},{"id":"cold","n":"Room too cold","d":"Overcooling","c":[["Set point or control mode wrong","Check the BMS set point and schedule, and that the unit is not left in manual or forced full cooling.",""],["Control valve passing or stuck open","Command the valve to 0 % and watch the leaving air and water temperatures. A passing valve still cools.",""],["Sensor reading high","Sensor in sunlight or near a heat source reads warm and keeps the unit cooling. Check calibration and location.",""],["Too much airflow or an oversized unit","Compare airflow with design. At low load the unit cannot turn down far enough.","Air changes"],["Reheat not working (where fitted)","Check the heater contactor, high-limit thermostat and airflow switch.","Duct heater"]]},{"id":"humid","n":"High humidity in the room","d":"Sticky air, sweating surfaces","c":[["Coil not removing moisture","Leaving air must be below the room dew point. Check the off-coil temperature (12–13 °C) and the CHW supply temperature.","Coil load"],["Too much untreated fresh air or infiltration","Check the fresh air damper position, door seals and whether the room is negative, drawing in humid outdoor air.","Air mixing"],["Oversized unit short cycling","The unit meets the temperature quickly and stops before it removes moisture. Check run time per cycle.","Heat load"],["Fan running on with the coil off","On splits and FCUs, a fan set to ON blows moisture back off the wet coil. Set it to AUTO.",""],["Water carried off the coil","Wet duct or pan overflow. Coil face velocity should be below 2.5 m/s.",""]]},{"id":"lowair","n":"Low airflow","d":"AHU or diffusers below design","c":[["Dirty filters","Read filter differential pressure against the clean and final values marked on the gauge. Replace if at or above final.",""],["Fan speed, belt or rotation","Check rpm against design, belt tension and wear, rotation arrow and VFD frequency.","V-belt tension"],["Dampers closed or wrongly set","Check volume dampers, fire dampers and motorised dampers are fully open or set as balanced.",""],["Duct leakage or disconnected flex","Check joints, access doors and flexible connections. Do a duct leakage test on suspect sections.",""],["System resistance above design","Measure external static pressure and plot it on the fan curve.","Duct size"]]},{"id":"press","n":"Room not holding pressure","d":"For example +50 Pa in a substation or LER","c":[["Leaks in the room envelope","Doors, cable and pipe transits, ceiling tiles and unsealed penetrations. Smoke test while the room is pressurised.",""],["Supply and exhaust not balanced","Measure supply, return and exhaust. For positive pressure, supply must exceed return plus exhaust by the leakage allowance, often 10–20 %.",""],["Pressure relief damper set too low or stuck open","Check the relief damper setting and blade movement.",""],["Doors not closing or door undercut too big","Check door closers, seals and drop seals.",""],["Pressure sensor or tubing","Check the transmitter zero, kinked or split tubing, and that the outdoor reference port is sheltered from wind.","4–20 mA scaling"]]},{"id":"vib","n":"AHU or fan vibration high","d":"Readings above the limit","c":[["Impeller dirty or out of balance","Clean the impeller and balance it. Check for damaged or bent blades.",""],["Pulley or coupling misalignment","Check alignment with a straight edge or laser.",""],["Belt tension wrong or belts worn","Set the tension to the maker's figure and replace belts as a matched set.","V-belt tension"],["Bearing wear","Listen for noise, check bearing temperature and the vibration spectrum.",""],["Anti-vibration mounts or flexible connections","Check transit locks are removed, springs are not bottomed out and flexible connections are not pulled tight.",""],["Running near resonance","If vibration peaks at one VFD speed, set a skip frequency.",""]]},{"id":"ftrip","n":"Fan motor tripping or high current","d":"Overload trips, amps above FLA","c":[["Fan moving more air than design","Forward-curved fans draw more current at low resistance: filters missing, access doors open, dampers wide open. Check ESP.",""],["Wrong rotation","Check against the arrow. A backward-running centrifugal fan still moves some air.",""],["Supply voltage low or unbalanced","Measure all three phases under load.","Voltage & current unbalance"],["Mechanical binding or bearings","Isolate and turn by hand.",""],["Motor too small after a pulley change","Fan power rises with the cube of speed. Check motor kW against the new duty.","Motor current"]]},{"id":"noise","n":"Noisy ducts or diffusers","d":"Whistling, rumble, rattling","c":[["Air velocity too high","Check the diffuser neck velocity and duct velocity against design.","Duct size"],["Damper throttled close to the outlet","Balance from the branch damper further back instead.",""],["Loose duct, turning vanes or access doors","Tighten and seal.",""],["Fan noise carried along the duct","Check the attenuator and flexible connections at the fan.",""]]},{"id":"coil","n":"Chilled water coil not cooling","d":"Low ΔT or warm off-coil air","c":[["Air trapped in the coil","Vent at the coil high point until water runs clear.",""],["Strainer blocked or valve not opening","Measure pressure drop across the strainer, and stroke the control valve.",""],["Coil fouled on air or water side","Clean the fins. Compare water-side pressure drop with design.",""],["Too much water flow (low ΔT)","Balance with the PICV or DRV and check flow against design.","Chilled water flow"],["CHW supply temperature high","Check the chiller set point and loading.",""]]},{"id":"chfrz","n":"Chiller trips on low evaporator temperature","d":"Freeze protection alarm","c":[["Low chilled water flow","Check the flow switch, pump, strainers and valves. Measure evaporator pressure drop against design.",""],["Set point too low or no glycol","Check leaving water set point and freeze protection setting.",""],["Low refrigerant charge","Suction pressure low. Use the refrigeration Troubleshooter and Charge check.","Charge check"],["Sensor fault","Compare the leaving water sensor with a calibrated thermometer.",""]]},{"id":"cond","n":"Condensate overflow or water carry-over","d":"Water in duct or ceiling","c":[["Drain blocked or no trap","A draw-through AHU needs a trap deeper than the fan negative pressure. Flush the line.",""],["Coil face velocity too high","Above about 2.5 m/s water is carried off the coil. Reduce airflow or add an eliminator.",""],["Drain pan not falling to the outlet","Check the unit is level and the pan drains fully.",""],["Drain line too small or flat","Minimum 1 % fall.","Drain slope"]]},{"id":"damp","n":"Fire or gas-tight damper not closing","d":"Or no open / closed feedback","c":[["Actuator power or command","Check the 24 V or 230 V supply and the command from F&G or BMS.",""],["Limit switches out of adjustment","Open and closed feedback must match the blade position.",""],["Mechanical obstruction","Debris, a frame installed out of square or a damaged blade seal.",""],["Spring return slow or weak","Time the close against the spec and check the spring.",""],["Cause & effect mismatch","Check the C&E matrix, the signal mapping and the interlock with F&G.",""]]},{"id":"iaq","n":"Stuffy air, high CO₂ or odour","d":"Complaints of poor air","c":[["Fresh air too low","Measure fresh air and compare with design, often about 10 L/s per person.","Air mixing"],["Fresh air damper closed or minimum set too low","Check the actuator and its minimum position.",""],["Exhaust fans not running","Check fans, belts and controls.",""],["Dirty filters or wet drain pan","Microbial growth causes odour. Clean and make sure the pan drains.",""],["Exhaust re-entering the intake","Intake too close to exhaust, generator or vehicle fumes.",""]]},{"id":"pump","n":"Pump low flow or cavitating","d":"Gravel noise, low ΔP","c":[["Air in the system","Vent the high points and check the expansion vessel pressure.",""],["Strainer blocked","Measure pressure drop across the strainer.",""],["Wrong rotation","Check against the arrow. On 3-phase, swap two phases.",""],["Low suction pressure (cavitation)","Not enough NPSH. Raise the system fill pressure or reduce suction losses.",""],["System resistance above design","Measure pump differential pressure and read the flow off the pump curve.","Total pump head"]]},{"id":"heater","n":"Duct heater not heating or tripping","d":"High-limit trips, no heat","c":[["Airflow switch not proving","The heater must only run with airflow. Check the switch and that airflow is above the minimum on the heater label.",""],["High-limit thermostat tripped","Usually caused by low airflow. Find the cause before resetting the manual-reset limit.",""],["Contactor, fuse or SSR fault","Measure current on each stage.",""],["Element open circuit","Measure resistance per element and compare with V² ÷ P.","Duct heater"],["Stage controller or control signal","Check the controller output against the demand.",""]]},{"id":"fcu","n":"FCU not working","d":"No air or no cooling from a fan coil","c":[["No power or thermostat off","Check the FCU isolator, fuse and the thermostat mode, fan speed and set point.",""],["Fan motor or capacitor failed","Measure motor current and capacitor µF. Spin the fan by hand with power isolated.",""],["Control valve not opening","Check the actuator signal and that the valve opens. Feel the coil pipes: both should be cold when cooling.",""],["Air lock or isolating valves closed","Vent the coil and check both isolating valves are open.",""],["Filter blocked or condensate float switch tripped","Clean the filter. A full drain pan trips the float switch and stops the unit.",""]]},{"id":"stair","n":"Stair pressurisation not working","d":"Low pressure or doors too hard to open","c":[["Fan not starting on fire signal","Check the fire alarm interface, cause & effect, fan starter and fire-rated supply.",""],["Pressure too low with doors closed","Leaks in the shaft, open vents, or fan speed too low. Measure pressure across each door, often 50 Pa.",""],["Door opening force too high","Pressure relief or the VFD control is not working. Force at the handle is usually limited to about 100 N.",""],["Air velocity through open door too low","Measure velocity across the open fire floor door against the design figure, often about 0.75–2 m/s.",""],["Pressure sensor or controller","Check sensor tubing, zero and the controller's set point.","4–20 mA scaling"]]},{"id":"ctower","n":"Cooling tower water too warm","d":"High condenser water temperature","c":[["Fan not running or belt slipping","Check fan, motor current, belt tension and VFD speed.","V-belt tension"],["Poor water distribution","Blocked nozzles or distribution basin. Fill must be wetted evenly.",""],["Fill fouled or damaged","Scale, algae or broken fill packs reduce cooling.",""],["Wet bulb higher than design or recirculation","Hot humid exhaust air re-entering the intake. Check the wet bulb against design.","Air properties"],["Water flow wrong","Check condenser water flow and the range (in minus out) against design.",""]]},{"id":"hood","n":"Kitchen hood not capturing smoke","d":"Smoke or heat escaping into the kitchen","c":[["Exhaust airflow too low","Grease filters blocked, fan belt slipping or damper partly closed. Measure face velocity.",""],["Make-up air too high or blowing across the hood","Supply air jets disturb the capture zone. Adjust diffuser throw.",""],["Hood too small or set too high","Hood should overhang the cooking line on all open sides.",""],["Exhaust duct leaking or grease build-up","Check duct joints and cleanliness. Grease build-up is also a fire risk.",""]]},{"id":"tab","n":"Can't reach design airflow in balancing","d":"TAB results below design","c":[["Total airflow low at the fan","Fix the fan first: speed, rotation, filters, ESP. Branches can't add air the fan isn't making.","Duct size"],["Index run starved","Start balancing at the index (most remote) outlet with its damper fully open, then throttle the others.",""],["Wrong K-factor or measuring method","Use the diffuser maker's K-factor or a hood. Check the instrument calibration.",""],["Duct leakage","Compare fan airflow with the sum of all outlets. A big gap means leakage.",""],["Design or drawings changed","Check the outlet schedule against the latest drawings.",""]]}],"elec":[{"id":"mcb","n":"Breaker trips","d":"MCB or MCCB","c":[["Overload (trips after some time)","Measure the load current and compare with the breaker rating.","Breaker size"],["Short circuit (trips instantly)","Isolate and IR test the cable and the load. Look for damaged cable or terminals.","Insulation resistance"],["Wrong curve for the inrush","Motors, transformers and LED drivers trip B-curve breakers. Use C or D.","Breaker size"],["Loose connection heating the breaker","Check torque on terminals and look for discolouration. Use thermography under load.",""],["Faulty breaker","Swap with a known good breaker of the same rating.",""]]},{"id":"rcd","n":"RCD or earth leakage trips","d":"ELCB, RCBO","c":[["Earth fault on the circuit","With the load disconnected, IR test L–E and N–E.","Insulation resistance"],["Neutral touching earth or shared neutral","Check N–E insulation and that neutrals are not mixed between circuits.",""],["Moisture in outdoor equipment","Check sockets, junction boxes, heaters and gland sealing.",""],["Too much normal leakage","Many PCs or VFD filters add up. Measure leakage with a clamp meter, split circuits, use Type B or F RCDs for VFDs.",""],["Faulty RCD","Check trip time and trip current with an RCD tester.",""]]},{"id":"mstart","n":"Motor does not start","d":"No movement on start command","c":[["No supply or control circuit open","Check voltage at the starter, control fuse, stop and E-stop circuits, interlocks and MCC ready signal.",""],["Overload tripped","Reset only after finding the cause.",""],["Contactor not pulling in","Measure the coil voltage when the start command is given.",""],["Single phasing","Measure all three phases at the motor terminals.",""],["Seized or load too heavy","Isolate and turn by hand.",""],["Winding fault","Check winding resistance balance and IR to earth.","Insulation resistance"]]},{"id":"mhot","n":"Motor overheating","d":"Hot frame, winding RTD alarm","c":[["Overloaded","Measure current against nameplate FLA.","Motor current"],["Low or unbalanced voltage","Measure all phases under load.","Voltage & current unbalance"],["Poor cooling","Blocked fan cowl, dirt on the frame, high ambient or long running at low VFD speed.",""],["Too many starts per hour","Compare with the maker's limit.",""],["Bearing failure or misalignment","Check vibration, noise and bearing temperature.",""],["Wrong star or delta connection","Check the terminal links against the supply voltage.",""]]},{"id":"rot","n":"Motor runs the wrong way","d":"Reverse rotation","c":[["Phase sequence at the supply","Check with a phase rotation meter.",""],["Connections at the motor","Isolate and swap any two phases at one end only.",""],["VFD direction setting","Check the direction and reverse parameters.",""]]},{"id":"ol","n":"Overload relay trips","d":"Thermal or electronic overload","c":[["Setting wrong","Set to nameplate FLA. In a star-delta starter with the overload in the phase circuit, set to 0.58 × FLA.",""],["Real overload","Measure current. Check the driven load for binding.","Motor current"],["Single phasing or unbalance","Measure all three currents.","Voltage & current unbalance"],["Long starting time","High-inertia fans need a class 20 or 30 overload.",""],["Loose terminals at the relay","Check torque.",""]]},{"id":"irlow","n":"Low insulation resistance","d":"Megger reading below minimum","c":[["Moisture","Dry out with space heaters or low-voltage current, then re-test and check PI.","Insulation resistance"],["Dirt in the terminal box","Clean, dry and re-test.",""],["Electronics left connected","Disconnect VFDs, surge protectors and instruments before testing.",""],["Cable damage","Test sections separately to find it.",""],["Winding insulation failure","Confirm with PI and winding resistance. Rewind or replace.",""]]},{"id":"vdrop","n":"Low voltage at the load","d":"Voltage drop","c":[["Cable too small or too long","Recalculate voltage drop.","Cable size"],["Loose or high-resistance joints","Measure volt drop across each joint under load. Use thermography.",""],["Supply low at source","Check at the transformer and its tap position.","Transformer"],["Dips when large motors start","DOL starting causes voltage dips. Consider soft start or VFD.","Generator size"]]},{"id":"flick","n":"Lights flickering","d":"","c":[["Loose neutral or connection","Check the neutral at the board and joints.",""],["Large motor starting on the same supply","See if flicker matches motor starts.",""],["Failing LED driver","Swap the driver.",""],["Dimmer not compatible","Check driver and dimmer compatibility.",""],["Generator supply unstable","Check governor and AVR settings.",""]]},{"id":"chat","n":"Contactor chattering or humming","d":"","c":[["Low coil voltage","Measure at the coil while it pulls in. Long control cables cause drop.",""],["Dirty or worn pole faces, broken shading ring","Clean or replace the contactor.",""],["Bouncing control contact","Check thermostats, pressure switches and loose control wiring.",""],["Wrong coil voltage","Check the coil rating against the control supply, AC or DC.",""]]},{"id":"vfd","n":"VFD tripping","d":"Overcurrent, overvoltage, earth fault","c":[["Overcurrent: ramp too fast or overload","Increase the acceleration time. Check motor current and the load.","Motor current"],["Overvoltage: deceleration too fast","Increase the deceleration time or add a braking resistor.",""],["Earth fault in motor or cable","With the drive disconnected, IR test the motor and cable.","Insulation resistance"],["Motor data parameters wrong","Enter nameplate kW, V, A, rpm and Hz, then run auto-tune.",""],["Drive overheating","Check panel ventilation, drive fans and filters.",""],["Long motor cable","Use an output reactor or dV/dt filter and screened cable earthed at both ends.",""]]},{"id":"shock","n":"Tingling from metal frames","d":"Touch voltage","c":[["Missing or loose earth","Test earth continuity and check bonding connections.",""],["Earth fault with no RCD","Isolate and IR test.","Insulation resistance"],["Polarity reversed","Check live and neutral are not swapped.",""],["High earth electrode resistance","Test with an earth tester.",""],["Induced or ghost voltage","Confirm with a low-impedance tester before chasing it.",""]]},{"id":"phase","n":"Single phasing or phase failure","d":"","c":[["Blown fuse","Check each fuse.",""],["Loose or burnt terminal or contactor pole","Inspect and measure across each pole.",""],["Supply-side fault","Check the incoming supply.",""],["Phase failure relay","Check its settings and wiring.",""]]},{"id":"hot","n":"Burning smell or hot terminals","d":"","c":[["Loose termination","Isolate, re-torque to the maker's value, replace discoloured lugs.",""],["Cable or lug undersized, wrong crimp","Use the correct lug and die size.","Cable size"],["Overloaded circuit","Measure current against rating.",""],["Copper on aluminium without a bimetal lug","Replace with bimetal lugs.",""],["Harmonics heating the neutral","Measure neutral current on boards with many IT or LED loads.",""]]},{"id":"ma","n":"4–20 mA signal wrong or missing","d":"Transmitter to BMS or PLC","c":[["Open loop (0 mA)","Check wiring continuity, fuses and the 24 V loop supply.",""],["Range mismatch","Check LRV and URV at the transmitter and in the BMS or PLC.","4–20 mA scaling"],["Polarity or 2-wire / 4-wire mismatch","Check the wiring against the loop drawing.",""],["Loop load too high","Check total loop resistance against the transmitter's maximum.",""],["Earth loop or screen problem","Earth the screen at one end only.",""],["Transmitter in alarm","3.6 mA or 21 mA usually means a sensor fault (NAMUR NE 43).",""]]},{"id":"pf","n":"Low power factor or capacitor bank faults","d":"","c":[["Capacitor steps failed or fuses blown","Measure current or kVAr per step.",""],["Controller CT in the wrong place","The CT must see total load current on the correct phase.",""],["Harmonics damaging capacitors","On sites with many VFDs, use detuned reactors.",""],["Bank too small for the load","Recalculate kVAr.","Power factor fix"]]},{"id":"gen","n":"Generator won't start or take load","d":"","c":[["Battery or starter","Check battery voltage while cranking (should stay above about 9.6 V on a 12 V system) and the charger.",""],["Fuel","Check fuel level, valves open, air in the fuel line and fuel filter.",""],["Control in wrong mode or alarm active","Check AUTO mode, emergency stop and alarms on the controller.",""],["ATS not transferring","Check ATS mode, timers and the generator voltage and frequency are in range.",""],["Load step too big","Large motors starting at once. Stage the loads.","Generator size"]]},{"id":"ups","n":"UPS alarm or on battery","d":"","c":[["Input supply out of range","Measure input voltage and frequency. Generator supply may be unstable.",""],["Battery fault or end of life","Check battery voltage, temperature and the last battery test result.","UPS / battery backup"],["Overload","Compare load % with the UPS rating.",""],["Bypass or fan alarm","Check the event log and the cooling fans.",""]]},{"id":"earth","n":"Earth resistance too high","d":"Earth pit test fails","c":[["Dry soil","Readings rise in dry season. Water the pit and re-test, or add rods.",""],["Corroded or loose connection","Check the clamp at the rod and the test link.",""],["Too few rods or rods too short","Add rods spaced at least their own length apart, or drive deeper.",""],["Wrong test method","Use the 3-point (fall of potential) method with the test spikes far enough away.",""]]},{"id":"harm","n":"High neutral current or harmonics","d":"Hot neutral, transformer overheating","c":[["Non-linear loads","PCs, LED drivers and VFDs create triple harmonics that add up in the neutral.",""],["Unbalanced single-phase loads","Rebalance loads across the three phases.","Voltage & current unbalance"],["Neutral undersized","Size the neutral for harmonic current, often 1.5–2 × phase on IT boards.","Cable size"],["No filtering","Fit harmonic filters or use low-harmonic drives.",""]]}],"ref":[{"id":"warm","n":"Not cooling enough / warm air","d":"","c":[["Dirty filter or coil, or low airflow","Check filters, indoor coil, blower speed and belt. Measure the air temperature drop across the coil: 8–12 K is normal.",""],["Low refrigerant charge (leak)","High superheat with low subcooling. Use the Charge check tool, then leak test with nitrogen or a detector before recharging.","Charge check"],["Dirty condenser or high ambient","Clean the condenser coil and check the condenser fan. Compare condensing temperature to outdoor air: 10–20 K above is normal.",""],["Undersized for the load","Run the Heat load tool. Check for open doors, extra equipment or too much fresh air.",""],["Compressor not pumping","Suction too high and discharge too low at the same time. Check compressor current against RLA and valve condition.",""]]},{"id":"nostart","n":"Unit does not start","d":"","c":[["No power or tripped breaker","Check supply voltage at the unit and the isolator, breaker and fuses.",""],["Thermostat or controller","Check set point, mode, batteries and the control signal (24 V or communication) to the outdoor unit.",""],["Safety lockout","Read the fault code. Check the high / low pressure switches and the overload, and reset only after finding the cause.",""],["Failed capacitor or contactor","Measure the capacitor µF against its label (±6 %) and check the contactor coil voltage and contacts.",""],["Compressor winding fault","Measure winding resistance (C–S, C–R, S–R) and insulation resistance to earth.",""]]},{"id":"iceevap","n":"Ice on the indoor coil or suction line","d":"","c":[["Low airflow","Dirty filter, blocked return, slow or failed blower, or closed dampers. Fix airflow before touching the charge.",""],["Low charge","Suction saturation below 0 °C with high superheat. Find and fix the leak.","Charge check"],["Restriction or TXV problem","Temperature drop across the filter drier, or a TXV bulb that is loose or lost its charge.",""],["Running at very low load or low ambient","Check the low ambient control and night set points.",""]]},{"id":"hihead","n":"High head (discharge) pressure","d":"","c":[["Dirty or blocked condenser","Clean the coil and remove obstructions. Check for hot air recirculation around the unit.",""],["Condenser fan fault","Check fan rotation, speed, motor current and the fan capacitor.",""],["Overcharge","High subcooling with high head. Recover charge and recheck subcooling.","Charge check"],["Non-condensable gas (air) in the system","Head pressure above the saturation pressure at the liquid temperature when the system is off and equalised. Recover, evacuate and recharge.",""],["Water flow on water-cooled units","Check condenser water flow, ΔT and tube fouling.",""]]},{"id":"losuct","n":"Low suction pressure","d":"","c":[["Low charge","High superheat with low subcooling. Leak test before charging.","Charge check"],["Low indoor airflow","Dirty filter or coil, or a blower problem. Superheat will be low.",""],["Restriction (filter drier, TXV, strainer)","Temperature drop across the drier, high subcooling with high superheat.",""],["TXV underfeeding","Check the bulb mounting and insulation, the superheat setting and the power head.",""]]},{"id":"hisuct","n":"High suction pressure","d":"","c":[["Overcharge","Low superheat and high subcooling. Recover some charge.","Charge check"],["TXV overfeeding or stuck open","Low superheat. Check bulb position, contact and insulation.",""],["Compressor valves or scroll worn","High suction and low head together, with low current. Do a compressor efficiency check.",""],["High heat load","Very high return air temperature or too much fresh air.",""]]},{"id":"short","n":"Compressor short cycling","d":"","c":[["Thermostat location or differential","Thermostat near a supply grille or in sunlight, or differential set too low.",""],["Oversized unit","Unit reaches set point too fast. Check the capacity against the Heat load result.",""],["Low charge tripping the low-pressure switch","Watch suction pressure at cut-out. Leak test.","Charge check"],["High head tripping the high-pressure switch","See High head pressure. Check the condenser and its fan.",""],["Overload tripping","Measure current and voltage, and check the motor and its capacitor.",""]]},{"id":"trip","n":"Compressor trips on overload / high current","d":"","c":[["Low or unbalanced voltage","Measure all phases under load. Use the Unbalance tool: over 2 % voltage unbalance overheats motors.",""],["High head pressure","A dirty condenser or failed fan raises compressor current.",""],["Failed run capacitor","Measure µF. A weak capacitor raises current on single-phase compressors.",""],["Mechanical tightness or a winding fault","Check winding resistance balance and insulation resistance. Locked rotor current at start means a seized compressor.",""],["Wrong overload setting","Set to the nameplate RLA / FLA, not above.",""]]},{"id":"ofan","n":"Outdoor fan not running","d":"","c":[["Fan capacitor failed","Measure µF against the label.",""],["Fan motor failed or seized","Spin by hand with power isolated. Check winding resistance and bearings.",""],["Control board or fan speed controller","Check output voltage to the fan, and the head pressure control setting.",""],["Contactor or relay","Check coil voltage and contacts.",""]]},{"id":"water","n":"Water leaking from the indoor unit","d":"","c":[["Blocked condensate drain","Flush the drain line and trap. Check the drain pan for sludge.",""],["Unit not level or drain slope wrong","Unit must fall toward the drain. Drain line slope at least 1 %.",""],["Frozen coil melting","See Ice on the indoor coil.",""],["Missing trap on a draw-through unit","Negative pressure holds water in the pan. Fit a trap of the right depth.",""],["Sweating pipes or ducts","Use the Sweating check tool and repair insulation.",""]]},{"id":"noise","n":"Noisy compressor or unit","d":"","c":[["Loose panels, mounts or pipes","Tighten fixings and check pipe clamps and anti-vibration mounts.",""],["Liquid floodback to compressor","Very low superheat with knocking noise. Check charge, TXV and airflow.","Superheat"],["Fan blade or bearing","Check blade balance, clearance and bearings.",""],["Compressor internal wear","Noise with low pumping performance. Check current and pressures.",""],["Wrong rotation (3-phase scroll)","Loud noise, no pressure difference. Swap two phases.",""]]},{"id":"bubbles","n":"Bubbles in the sight glass","d":"","c":[["Low charge","Bubbles with low subcooling and high superheat. Find the leak.","Charge check"],["Restriction before the sight glass","Temperature drop across the filter drier or a kinked liquid line.",""],["Normal for some blends at low load","Check subcooling before acting. Bubbles alone are not proof of low charge with R-407C or on start-up.",""],["Low head pressure","Low ambient or fan cycling. Check head pressure control.",""]]},{"id":"hotcomp","n":"Compressor running very hot","d":"","c":[["High superheat (starved evaporator)","Suction gas cools the compressor. Check charge and TXV.","Superheat"],["High head pressure","Clean the condenser and check its fan.",""],["Low voltage or unbalance","Measure all phases under load.",""],["Short cycling","Repeated starts heat the motor. See Short cycling.",""],["Low oil or wrong oil","Check the oil level in the sight glass where fitted.",""]]},{"id":"oil","n":"Low oil or oil not returning","d":"Low oil level, oil pressure trips","c":[["Low refrigerant velocity in risers","Oil is not carried back up suction risers. Check riser sizing and traps.",""],["Long run time at low load","Oil stays in the evaporator. Check for oil return cycles on VRF.",""],["Floodback diluting oil","Low superheat washes oil out. Check superheat.","Superheat"],["Leak with oil loss","Look for oil stains at joints.",""]]},{"id":"defrost","n":"Heat pump defrost problems","d":"Outdoor coil iced in heating","c":[["Defrost sensor faulty or loose","Check the sensor resistance and mounting on the coil.",""],["Reversing valve sticking","Check the coil voltage and listen for the valve shifting.",""],["Low charge","Low suction in heating mode. Leak test.","Charge check"],["Drain blocked under outdoor unit","Meltwater refreezes. Clear the base pan drain.",""]]}],"plumb":[{"id":"lowp","n":"Low water pressure","d":"Weak flow at taps or showers","c":[["Supply pressure low","Measure pressure at the incoming main or booster outlet.","Pressure from height"],["Partly closed valve or blocked strainer","Check isolating valves, the meter and inline strainers.",""],["Pipe undersized or scaled","Check velocity and friction loss for the actual flow.","Friction loss"],["Aerator or shower head blocked","Clean or replace.",""],["PRV set too low or faulty","Check the pressure reducing valve setting and outlet pressure.",""]]},{"id":"upper","n":"No water on upper floors","d":"","c":[["Not enough head or booster not running","Each 10 m of height needs about 98 kPa. Check the booster set.","Pressure from height"],["Booster set fault","Check pump status, pressure switch or transducer and the vessel pre-charge.","Total pump head"],["Air lock in the riser","Vent the high points.",""],["Roof tank empty","Check the float valve and the transfer pump.",""]]},{"id":"hammer","n":"Water hammer","d":"Banging when taps or valves close","c":[["Fast-closing valves","Solenoid and quarter-turn valves close too quickly. Fit arrestors near them.",""],["High velocity","Velocity above about 2 m/s makes hammer worse.","Pipe flow & velocity"],["High static pressure","Fit or adjust a PRV.",""],["Loose pipe clips","Add or tighten supports.",""]]},{"id":"nohot","n":"No hot water or not hot enough","d":"","c":[["Heater has no power or thermostat set low","Check the breaker, isolator, thermostat and the element or burner.",""],["Element or thermostat failed","Measure element resistance and check the cut-out has not tripped.",""],["Heater too small for demand","Check the heater rating against the draw-off.","Water heater size"],["Mixing valve faulty or cold crossover","Check the TMV and any mixer that lets cold into the hot line.",""],["Long dead leg or no return circulation","Water cools in long pipes. Check the return pump.",""]]},{"id":"scald","n":"Hot water too hot","d":"Scalding risk","c":[["Thermostat set too high or stuck","Check the setting and measure outlet temperature.",""],["No or faulty thermostatic mixing valve","Fit or service the TMV at outlets, typically 41–43 °C for showers.",""],["Solar or heat pump overheating","Check the limit settings.",""]]},{"id":"boost","n":"Booster pump short cycling","d":"Starts and stops often","c":[["Pressure vessel pre-charge wrong","Pre-charge should be about 10 % below cut-in pressure with the system drained.",""],["Leak or dripping outlet","A small leak drops pressure and restarts the pump.",""],["Pressure switch band too narrow","Widen the cut-in to cut-out difference.",""],["Non-return valve passing","Water flows back and pressure falls.",""]]},{"id":"leak","n":"Leaking joints","d":"","c":[["Fitting not fully inserted or tightened","Check insertion depth marks and compression nuts.",""],["Wrong fitting for the pipe","PPR, PEX and copper need their own fittings and tools.",""],["Pressure above rating","Check working pressure and do a hydro test to spec.",""],["Expansion stress","Long hot lines need expansion loops or joints.",""]]},{"id":"block","n":"Drain blocked or slow","d":"","c":[["Blockage","Rod or jet the line. Check grease traps on kitchen drains.",""],["Slope too flat or back-fall","Check the fall along the run.","Drain slope"],["Poor venting","Gurgling and slow draining point to a blocked or missing vent.",""],["Pipe undersized","Check the size against fixture units.",""]]},{"id":"smell","n":"Sewer smell","d":"","c":[["Dry trap","Unused floor drains lose their water seal. Refill or fit trap primers.",""],["Vent blocked or missing","Siphoning pulls traps dry. Check the vent stack.",""],["Loose joint or cracked pipe","Smoke test the drainage.",""],["Air admittance valve stuck","Replace the AAV.",""]]},{"id":"cistern","n":"Toilet keeps running","d":"","c":[["Flush valve seal worn","Replace the seal or washer.",""],["Fill valve set too high","Water runs into the overflow. Lower the float.",""],["Fill valve not closing","Clean or replace the valve.",""]]},{"id":"dirty","n":"Dirty or discoloured water","d":"","c":[["Rust from steel pipes or tanks","Check for galvanised pipe or corroded tanks.",""],["Disturbed sediment","After shutdowns or high flow. Flush the system.","Pipe volume"],["Tank not cleaned","Clean and disinfect storage tanks.",""]]},{"id":"prv","n":"Relief valve dripping on water heater","d":"T&P or pressure relief valve","c":[["Supply pressure too high","Fit or adjust a PRV on the cold inlet.",""],["No expansion vessel or vessel flat","Hot water expands. Check the vessel pre-charge.",""],["Thermostat overheating","Check the water temperature.",""],["Valve seat dirty or worn","Operate the lever to flush, or replace the valve.",""]]},{"id":"overflow","n":"Water tank overflowing","d":"","c":[["Float valve not closing","Clean or replace the float valve or washer.",""],["Float set too high","Adjust the float arm.",""],["Level switch fault on pumped fill","Check the level controls and pump control.",""]]}]};
          const TSAFE={"hvac":"Isolate and lock out before opening fans, heaters or panels. Let duct heaters cool before touching elements.","elec":"Isolate, lock out and prove dead before working. Only qualified persons should test live circuits, with the right PPE and a CAT-rated meter.","ref":"Recover refrigerant, never vent it. Isolate power before opening panels, and wear gloves and goggles when connecting gauges.","plumb":"Isolate water and power before work. Let hot water cool and relieve pressure before opening pipes or heaters."};



          const TSEC=[["all","All"],["hvac","HVAC"],["elec","Electrical"],["ref","Refrigeration"],["plumb","Plumbing"]];
          const TSN={hvac:"HVAC",elec:"Electrical",ref:"Refrigeration",plumb:"Plumbing"};
          function trUI(el,st){
           if(!TSEC.some(s=>s[0]===st.sec))st.sec="all";if(typeof st.q!=="string")st.q="";
           el.innerHTML=`<div class="card">
             <div class="field"><span class="lbl">Section</span><div class="chips" id="tr-sec">${TSEC.map(s=>`<button type="button" data-v="${s[0]}" aria-pressed="${st.sec===s[0]}">${s[1]}</button>`).join("")}</div></div>
             <label class="field"><span class="lbl">Search</span><span class="inp"><input id="tr-q" type="search" value="${esc(st.q)}" placeholder="tripping, noise, leak…" style="font-family:var(--f-body);font-size:17px"></span></label>
             <label class="field"><span class="lbl">What is the problem?</span><span class="help" id="tr-count"></span><span class="inp"><select id="tr-sel"></select></span></label>
            </div><div class="ans" id="tr-ans" aria-live="polite"></div><div id="tr-after"></div>`;
           const match=()=>{const q=st.q.trim().toLowerCase();const out=[];
            Object.keys(TSD).forEach(k=>{if(st.sec!=="all"&&st.sec!==k)return;TSD[k].forEach(f=>{if(!q||(f.n+" "+f.d+" "+f.c.map(c=>c[0]+" "+c[1]).join(" ")).toLowerCase().includes(q))out.push([k,f]);});});return out;};
           const fill=()=>{const m=match(),sel=el.querySelector("#tr-sel");
            if(m.length&&!m.some(([k,f])=>k+"/"+f.id===st.sel))st.sel=m[0][0]+"/"+m[0][1].id;
            const grp={};m.forEach(([k,f])=>(grp[k]=grp[k]||[]).push(f));
            sel.innerHTML=Object.keys(grp).map(k=>`<optgroup label="${TSN[k]}">${grp[k].map(f=>`<option value="${k}/${f.id}"${st.sel===k+"/"+f.id?" selected":""}>${f.n}</option>`).join("")}</optgroup>`).join("");
            sel.disabled=!m.length;
            el.querySelector("#tr-count").textContent=m.length?`${m.length} fault${m.length===1?"":"s"}${st.q.trim()?` match “${st.q.trim()}”`:""}`:"";
            show2(m.length);};
           const show2=(n)=>{const A=el.querySelector("#tr-ans"),F=el.querySelector("#tr-after");
            if(!n){A.innerHTML=`<div class="cap">Answer</div><p class="hint">No fault matches “${esc(st.q.trim())}”. Try another word, or pick All.</p>`;F.innerHTML="";return;}
            const[k,id]=st.sel.split("/"),f=TSD[k].find(x=>x.id===id);
            A.innerHTML=`<div class="cap">${TSN[k]} · most likely cause</div><div class="verdict">${f.c[0][0]}</div><p class="say">${f.n}${f.d?` (${f.d.toLowerCase()})`:""}: work through these ${f.c.length} causes in order, starting with the most likely.</p>`;
            F.innerHTML=`<div class="ts-safety"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><span>${TSAFE[k]}</span></div>
             <div class="card" style="margin-top:14px"><ol class="steps">${f.c.map(c=>`<li><b>${c[0]}</b><span>${c[1]}</span>${c[2]?`<br><span class="ts-tool">SiteCalc: ${c[2]}</span>`:""}</li>`).join("")}</ol></div>`;};
           el.querySelectorAll("#tr-sec button").forEach(b=>b.onclick=()=>{st.sec=b.dataset.v;el.querySelectorAll("#tr-sec button").forEach(x=>x.setAttribute("aria-pressed",x===b));save();fill();});
           el.querySelector("#tr-q").addEventListener("input",e=>{st.q=e.target.value;save();fill();});
           el.querySelector("#tr-sel").addEventListener("change",e=>{st.sel=e.target.value;save();show2(1);});
           fill();
          }

