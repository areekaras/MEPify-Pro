# SiteCalc Pro v1.12 - by Mohamed Shafaf Karumannil
# This one file contains the whole app and builds the APK.
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Create Android project
        run: |
          set -e
          mkdir -p out && cd out
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "SiteCalcPro"
          include ':app'
          EOF_FILE
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_FILE
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p "$(dirname app/build.gradle)"
          cat > app/build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.shafaf.sitecalc'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.shafaf.sitecalc'
                  minSdk 26
                  targetSdk 34
                  versionCode 13
                  versionName '1.12'
              }
              // Fixed signing key (from GitHub secrets) so every new APK installs over the old one.
              def ks = file('sitecalc-release.jks')
              signingConfigs {
                  fixed {
                      storeFile ks
                      storePassword System.getenv('KS_PASS') ?: ''
                      keyAlias 'sitecalc'
                      keyPassword System.getenv('KS_PASS') ?: ''
                  }
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { if (ks.exists()) signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/com/shafaf/sitecalc/MainActivity.java)"
          cat > app/src/main/java/com/shafaf/sitecalc/MainActivity.java <<'EOF_FILE'
          package com.shafaf.sitecalc;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import android.content.ContentValues;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.widget.Toast;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          /** SiteCalc Pro by Mohamed Shafaf Karumannil. Runs the calculator fully offline from app assets. */
          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "SiteCalcNative");
                  setContentView(web);
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              /** Lets the page save the equipment schedule to Downloads and print it (Save as PDF). */
              public class Bridge {
                  @JavascriptInterface
                  public void print(final String job) {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                          if (pm != null) pm.print(job, web.createPrintDocumentAdapter(job), new PrintAttributes.Builder().build());
                      });
                  }

                  @JavascriptInterface
                  public String save(String name, String mime, String content) {
                      if (Build.VERSION.SDK_INT >= 29) {
                          try {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                              v.put(MediaStore.Downloads.MIME_TYPE, mime);
                              v.put(MediaStore.Downloads.IS_PENDING, 1);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (uri == null) throw new Exception("no file");
                              try (OutputStream o = getContentResolver().openOutputStream(uri)) {
                                  o.write(content.getBytes(StandardCharsets.UTF_8));
                              }
                              v.clear();
                              v.put(MediaStore.Downloads.IS_PENDING, 0);
                              getContentResolver().update(uri, v, null, null);
                              return "Saved to Downloads: " + name;
                          } catch (Exception e) {
                              // fall through to sharing
                          }
                      }
                      final Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType("text/plain");
                      send.putExtra(Intent.EXTRA_SUBJECT, name);
                      send.putExtra(Intent.EXTRA_TEXT, content);
                      runOnUiThread(() -> startActivity(Intent.createChooser(send, "Share " + name)));
                      return "Choose where to send the schedule";
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  web.evaluateJavascript("(window.scBack && window.scBack()) ? '1' : '0'", v -> {
                      if (v == null || !v.contains("1")) finish();
                  });
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/strings.xml)"
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SiteCalc Pro</string>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/colors.xml)"
          cat > app/src/main/res/values/colors.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="logo_bg">#1B2229</color>
              <color name="bg_light">#ECEFF1</color>
              <color name="bg_dark">#0F1316</color>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/styles.xml)"
          cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@color/bg_light</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@color/bg_light</item>
                  <item name="android:windowBackground">@color/bg_light</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values-night/styles.xml)"
          cat > app/src/main/res/values-night/styles.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">@color/bg_dark</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">@color/bg_dark</item>
                  <item name="android:windowBackground">@color/bg_dark</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/drawable/ic_launcher_foreground.xml)"
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:scaleX="1.5" android:scaleY="1.5" android:translateX="24" android:translateY="24">
                  <path android:pathData="M8,5h8a3,3 0,0 1,3,3v8a3,3 0,0 1,-3,3h-8a3,3 0,0 1,-3,-3v-8a3,3 0,0 1,3,-3z" android:fillColor="#2D8FB5" />
                  <path android:pathData="M24,5h8a3,3 0,0 1,3,3v8a3,3 0,0 1,-3,3h-8a3,3 0,0 1,-3,-3v-8a3,3 0,0 1,3,-3z" android:fillColor="#1F6E8C" />
                  <path android:pathData="M8,21h8a3,3 0,0 1,3,3v8a3,3 0,0 1,-3,3h-8a3,3 0,0 1,-3,-3v-8a3,3 0,0 1,3,-3z" android:fillColor="#2A6F62" />
                  <path android:pathData="M24,21h8a3,3 0,0 1,3,3v8a3,3 0,0 1,-3,3h-8a3,3 0,0 1,-3,-3v-8a3,3 0,0 1,3,-3z" android:fillColor="#C9672E" />
                  <path android:pathData="M12,7.5v9M8.2,9.8l7.6,4.4M8.2,14.2l7.6,-4.4" android:strokeColor="#FFFFFF" android:strokeWidth="1.4" android:strokeLineCap="round" />
                  <path android:pathData="M28,7.8s3.4,3.8 3.4,6a3.4,3.4 0,0 1,-6.8 0c0,-2.2 3.4,-6 3.4,-6z" android:fillColor="#FFFFFF" />
                  <path android:pathData="M7.4,29a4.6,4.6 0,1 0,9.2 0a4.6,4.6 0,1 0,-9.2 0z" android:strokeColor="#FFFFFF" android:strokeWidth="1.4" />
                  <path android:pathData="M12,29l2.6,-2.6" android:strokeColor="#F29A55" android:strokeWidth="1.6" android:strokeLineCap="round" />
                  <path android:pathData="M29.2,23.5l-4,6h3l-1.4,4.5 4.4,-6.2h-3z" android:fillColor="#FFFFFF" />
              </group>
          </vector>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml)"
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/logo_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/assets/index.html)"
          cat > app/src/main/assets/index.html <<'EOF_FILE'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
          <title>SiteCalc Pro</title>
          <meta name="claude:viewport-fit-sides" content="cover">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
          <style>
          /* Layout: home grid of big tool buttons -> one tool per screen: question, inputs, then a big plain-English answer */
          :root{
            --bg:#ECEFF1; --surface:#FFFFFF; --ink:#14191E; --muted:#56616C; --line:#D3D9DE;
            --accent:#B0521C; --accent-ink:#FFFFFF; --accent-soft:#F6E6DB;
            --cool:#1F6E8C; --cool-soft:#DCEBF1; --pl:#2A6F62; --pl-soft:#DDEFEA;
            --logo-bg:#17607C; --logo-fg:#FFFFFF; --logo-hot:#F29A55;
            --ok:#1E7F48; --ok-soft:#DDF0E4; --bad:#B4322A; --bad-soft:#F7DEDB;
            --plate:#1B2229; --plate-ink:#EEF2F4; --plate-muted:#9AA6B1;
            --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
            --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
            --f-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
          }
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
            --bg:#0F1316; --surface:#181D22; --ink:#E7ECEF; --muted:#94A0AB; --line:#2A323A;
            --accent:#E3884F; --accent-ink:#1A0F08; --accent-soft:#3A2416;
            --cool:#5DB4D6; --cool-soft:#14303B; --pl:#62C3AE; --pl-soft:#15302A;
            --ok:#54C483; --ok-soft:#163223; --bad:#F2766A; --bad-soft:#3A1A17;
            --plate:#232B33; --plate-ink:#EEF2F4; --plate-muted:#9FABB6; color-scheme:dark }}
          :root[data-theme="dark"]{
            --bg:#0F1316; --surface:#181D22; --ink:#E7ECEF; --muted:#94A0AB; --line:#2A323A;
            --accent:#E3884F; --accent-ink:#1A0F08; --accent-soft:#3A2416;
            --cool:#5DB4D6; --cool-soft:#14303B; --pl:#62C3AE; --pl-soft:#15302A;
            --ok:#54C483; --ok-soft:#163223; --bad:#F2766A; --bad-soft:#3A1A17;
            --plate:#232B33; --plate-ink:#EEF2F4; --plate-muted:#9FABB6; color-scheme:dark }

          *{box-sizing:border-box}
          body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
            padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
            padding-block:0 calc(32px + env(safe-area-inset-bottom,0px))}
          body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
          .wrap{max-width:600px;margin:0 auto}
          button{font:inherit;color:inherit}
          :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

          /* home */
          .top{display:flex;align-items:center;gap:12px;padding-block:20px 8px}
          .mark{width:44px;height:44px;flex:none}
          .top h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;line-height:1}
          .top p{margin:3px 0 0;color:var(--muted);font-size:14px}
          .top p.by{color:var(--accent);font-weight:600;font-size:14.5px;letter-spacing:.01em}
          .credit{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
          .group{display:flex;flex-direction:column;gap:10px;margin-top:22px}
          .group h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--muted)}
          .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-height:118px}
          .tile:hover{border-color:var(--muted)}
          .tile .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
          .tile.hvac .ic,.tile.psy .ic,.tile.ref .ic{background:var(--cool-soft);color:var(--cool)}
          .tile.elec .ic{background:var(--accent-soft);color:var(--accent)}
          .tile.tab .ic,.thead.tab .ic{background:var(--cool-soft);color:var(--cool)}
          .tile.plumb .ic,.thead.plumb .ic{background:var(--pl-soft);color:var(--pl)}
          .tile.feat{flex-direction:row;align-items:center;gap:14px;width:100%;min-height:0;margin-top:18px;background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
          .tile.feat .ic{background:var(--accent);color:var(--accent-ink);width:46px;height:46px;flex:none}
          .tile.feat .ft{display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--plate-ink)}.tile.feat b{font-size:18px}.tile.feat .ft span{color:var(--plate-muted)}
          .tile.feat .chev{width:22px;height:22px;margin-left:auto;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
          .thead.top .ic{background:var(--accent-soft);color:var(--accent)}
          .tile.basic .ic,.thead.basic .ic{background:var(--plate);color:var(--plate-ink)}
          .calc-disp{background:var(--plate);color:var(--plate-ink);border-radius:14px;padding:14px 18px 16px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-height:124px;min-width:0}
          .calc-disp .md{align-self:flex-start;font:600 11px var(--f-body);letter-spacing:.12em;color:var(--plate-muted);min-height:14px}
          .calc-disp .ex{font:500 19px var(--f-data);color:var(--plate-muted);overflow-x:auto;white-space:nowrap;max-width:100%}
          .calc-disp .rs{font:500 44px/1.1 var(--f-data);font-variant-numeric:tabular-nums;overflow-x:auto;white-space:nowrap;max-width:100%}
          .keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
          .keys.sci{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
          .keys button{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:500 24px var(--f-data);cursor:pointer;touch-action:manipulation;padding:0}
          .keys.sci button{min-height:44px;font:500 15px var(--f-data);background:var(--bg)}
          .keys button.op{background:var(--accent-soft);color:var(--accent);font-weight:600}
          .keys button.fn{background:var(--bg);font-size:20px}
          .keys.sci button.fn{font-size:15px}
          .keys button.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
          @media (prefers-reduced-motion:no-preference){.keys button:active{transform:scale(.96)}}
          .hist{display:flex;flex-direction:column;gap:4px}
          .hist button{display:flex;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;cursor:pointer;font:15px var(--f-data);text-align:left;min-width:0}
          .hist button span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .inp input[type=date]{font-size:18px}
          .ts-search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 14px}
          .ts-search:focus-within{border-color:var(--accent)}
          .ts-search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
          .ts-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px var(--f-body);padding:11px 0;outline:none}
          .ts-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
          .ts-sym{flex:none;width:190px;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;scroll-snap-align:start}
          .ts-sym[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
          .ts-sym .dot{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font:600 12px var(--f-data);background:var(--cool-soft);color:var(--cool)}
          .ts-strip.elec .ts-sym .dot{background:var(--accent-soft);color:var(--accent)}
          .ts-sym b{display:block;font-size:14.5px;line-height:1.3}.ts-sym small{display:block;color:var(--muted);font-size:12px;line-height:1.3}.ts-sym small.pg{color:var(--ok);font-weight:600}
          .ts-bar{height:6px;border-radius:3px;background:rgb(255 255 255/.12);overflow:hidden}.ts-bar i{display:block;height:100%;background:var(--ok)}
          .ts-meta{display:flex;justify-content:space-between;gap:10px;font:500 13px var(--f-data);color:var(--plate-muted)}
          .ts-safety{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
          .ts-safety svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
          ol.ts-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
          ol.ts-steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
          ol.ts-steps li:last-child{border-bottom:0}
          .ts-steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-data);background:var(--bg);color:var(--muted)}
          .ts-steps li.first .n{background:var(--accent);color:var(--accent-ink)}
          .ts-steps b{display:block;font-size:16px;line-height:1.35}.ts-steps li.done b{color:var(--muted)}
          .ts-steps p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
          .ts-steps li.found{background:var(--bad-soft);margin-inline:-16px;padding-inline:16px}
          .ts-tool{display:inline-block;margin-top:6px;font:600 12px var(--f-body);color:var(--cool);background:var(--cool-soft);padding:2px 8px;border-radius:999px}
          .ts-st{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
          .ts-st button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
          .ts-st button[aria-pressed="true"].ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
          .ts-st button[aria-pressed="true"].bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
          .ts-note{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px var(--f-body);padding:10px;resize:vertical}
