            return{cap:"Airflow needed",value:f(q,0),unit:"m³/h",
             say:`This ${f(vol,1)} m³ room needs ${B(f(q,0),"m³/h")} of air (${B(f(q/1.699,0),"CFM")}) to change the air ${f(n)} times an hour.`,
             rows:[["Airflow",f(q/1.699,0),"CFM"],["Airflow",f(q/3.6,1),"L/s"],["Room volume",f(vol,1),"m³"]]};
           }},

          {id:"duct",g:"hvac",icon:"duct",name:"Duct size",short:"Round and rectangular duct from airflow",
           intro:"Enter the airflow and pick where the duct is. You get the duct size to use.",
           fields:[
            {id:"q",label:"Airflow",type:"num",def:"1500",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"v",label:"Where is the duct?",help:"Sets the air speed. Lower speed is quieter but needs a bigger duct.",type:"num",def:"5",unit:"m/s",presets:[["3","Quiet room 3"],["4","Branch 4"],["5","Main duct 5"],["7","Plant room 7"]]},
            {id:"h",label:"Maximum duct height",help:"For the rectangular size, from the ceiling space you have.",type:"num",def:"250",unit:"mm",adv:true}
           ],
           calc(v){
            const qv=num(v.q),vel=num(v.v),h=num(v.h)||250;
            if(!(qv>0))return{hint:"Enter the airflow."};if(!(vel>0))return{hint:"Pick or enter an air speed."};
            const Q=qv*(AIRF[v.q_u]||AIRF["m³/h"]),A=Q/vel,D=Math.sqrt(4*A/Math.PI)*1000;
            const Dr=ROUND.find(d=>d>=D)||Math.ceil(D/50)*50;
            const vr=Q/(Math.PI/4*(Dr/1000)**2);
            let hh=Math.max(100,Math.round(h/50)*50),w=100;
            while(DE(w,hh)<D&&w<6000)w+=50;
            if(w<hh){let s2=100;while(DE(s2,s2)<D)s2+=50;w=hh=s2;}
            const vrect=Q/(w/1000*hh/1000);
            return{cap:"Round duct",value:"Ø "+Dr,unit:"mm",
             say:`Use a ${B("Ø "+Dr,"mm")} round duct or a ${B(w+" × "+hh,"mm")} rectangular duct. Air speed will be about ${f(vr,1)} m/s.`,
             rows:[["Rectangular",w+" × "+hh,"mm"],["Speed in rectangular",f(vrect,1),"m/s"],["Exact round size",f(D,0),"mm"],["Airflow",f(Q*1000,0),"L/s"]]};
           },
           note:"Round size is set by air speed. The rectangular size has the same pressure loss as the exact round size, so it can carry the same air. For long runs, check pressure drop too (aim for about 1 Pa per metre)."},

          {id:"chw",g:"hvac",icon:"chw",name:"Chilled water flow",short:"Water flow and pipe size",
           intro:"Enter the cooling load. You get the water flow and the pipe size to use.",
           fields:[
            {id:"load",label:"Cooling load",type:"num",def:"100",units:["kW","TR"],udef:"kW"},
            {id:"dt",label:"Water temperature difference",help:"Return minus supply, for example 12.5 − 7 = 5.5 °C.",type:"num",def:"5.5",unit:"°C",presets:[["5","5"],["5.5","5.5"],["6","6"],["8","8"]]},
            {id:"vmax",label:"Maximum water speed in pipe",type:"num",def:"1.5",unit:"m/s",adv:true}
           ],
           calc(v){
            let kw=num(v.load);const dt=num(v.dt),vmax=num(v.vmax)||1.5;
            if(!(kw>0))return{hint:"Enter the cooling load."};if(!(dt>0))return{hint:"Enter the water temperature difference."};
            if(v.load_u==="TR")kw*=3.51685;
            const ls=kw/(4.186*dt),q=ls/1000;
            const p=PIPE.find(p=>q/(Math.PI/4*(p[1]/1000)**2)<=vmax);
            const vp=p?q/(Math.PI/4*(p[1]/1000)**2):NaN;
            return{cap:"Water flow",value:f(ls,2),unit:"L/s",
             say:p?`Flow needed is ${B(f(ls,2),"L/s")} (${f(ls*3.6,1)} m³/h). Use ${B(p[0])} pipe. Water speed will be ${f(vp,2)} m/s.`:`Flow needed is ${B(f(ls,2),"L/s")} (${f(ls*3.6,1)} m³/h). That is bigger than DN400, so split it over two pipes.`,
             rows:[["Flow",f(ls*3.6,2),"m³/h"],["Flow",f(ls*15.8503,1),"US GPM"],["Cooling load",f(kw/3.51685,1),"TR"]]};
           },
           note:"Plain water, steel pipe sizes (schedule 40). For glycol mixes, add 10 to 15 % to the flow."},

          {id:"air",g:"hvac",icon:"air",name:"Coil capacity check",short:"Cooling from airflow and temperatures",
           intro:"Use during testing and balancing. Measure the airflow and the air temperature before and after the coil.",
           fields:[
            {id:"q",label:"Measured airflow",type:"num",def:"3000",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"t1",label:"Air temperature entering coil",type:"num",def:"26",unit:"°C",half:true},
            {id:"t2",label:"Air temperature leaving coil",type:"num",def:"14",unit:"°C",half:true}
           ],
           calc(v){
            const qv=num(v.q),t1=num(v.t1),t2=num(v.t2);
            if(!(qv>0))return{hint:"Enter the measured airflow."};if(!isFinite(t1)||!isFinite(t2))return{hint:"Enter both air temperatures."};
            const ls=qv*(AIRF[v.q_u]||AIRF["m³/h"])*1000,dt=Math.abs(t1-t2),kw=1.2*ls*dt/1000;
            if(dt===0)return{hint:"Both temperatures are the same, so the coil is not cooling or heating the air."};
            if(t2>t1)return{cap:"Sensible heating",value:f(kw,1),unit:"kW",
             say:`The leaving air is warmer, so this coil is heating. It is adding about ${B(f(kw,1),"kW")} of heat to the air, with a ${f(dt,1)} °C temperature rise.`,
             rows:[["Airflow",f(ls,0),"L/s"],["Temperature rise",f(dt,1),"°C"]]};
            return{cap:"Sensible cooling",value:f(kw,1),unit:"kW",
             say:`The coil is removing about ${B(f(kw,1),"kW")} (${f(kw/3.51685,2)} TR) of heat from the air, with a ${f(dt,1)} °C temperature drop.`,
             rows:[["Sensible cooling",f(kw/3.51685,2),"TR"],["Airflow",f(ls,0),"L/s"],["Temperature drop",f(dt,1),"°C"]]};
           },
           note:"This is <b>sensible</b> cooling only. Total cooling, including moisture removed, is usually 20 to 35 % higher in humid weather."},

          {id:"conv",g:"basic",icon:"conv",name:"Unit converter",short:"Length, area, weight, temperature and more",
           intro:"Pick what you are converting, type the value, and see it in every unit.",
           fields:[
            {id:"cat",label:"What are you converting?",type:"chips",def:"length",options:Object.keys(CONV).map(k=>[k,CONV[k].label]),onSet:(v)=>{v.unit=CONV[v.cat].u[0][0];}},
            {id:"val",label:"Value",type:"num",def:"1",unitsFrom:v=>CONV[v.cat].u.map(u=>u[0]),ukey:"unit",udef:"m"}
           ],
           calc(v){
            const c=CONV[v.cat]||CONV.length;if(!c.u.some(u=>u[0]===v.unit))v.unit=c.u[0][0];const x=num(v.val);if(!isFinite(x))return{hint:"Type a value to convert."};
            let list;
            if(v.cat==="temp"){const C=toC[v.unit](x);list=c.u.map(u=>[u[0],fromC[u[0]](C)]);}
            else{const fac=(c.u.find(u=>u[0]===v.unit)||c.u[0])[1],base=x*fac;list=c.u.map(u=>[u[0],base/u[1]]);}
            return{extra:`<div class="cap">${f(x)} ${v.unit} equals</div><div class="conv">${list.map(r=>`<div class="${r[0]===v.unit?"me":""}"><span>${r[0]}</span><strong>${f(r[1])}</strong></div>`).join("")}</div>`};
           },
           note:"1 cent = 40.47 m² (435.6 ft²), as used for land in Kerala. TR is the refrigeration ton (12,000 BTU/h = 3.517 kW). HP is mechanical horsepower. Data uses 1 KB = 1024 B."},

          {id:"motor",g:"elec",icon:"motor",name:"Motor current",short:"Amps from kW, or kW from amps",
           intro:"Find the full-load current of a motor or load, or work out power from a clamp meter reading.",
           fields:[
            {id:"mode",label:"What do you know?",type:"chips",def:"kw",options:[["kw","The power (kW / HP)"],["amp","The measured amps"]]},
            {id:"P",label:"Motor power",type:"num",def:"15",units:["kW","HP"],udef:"kW",show:v=>v.mode==="kw"},
            {id:"I",label:"Measured current",type:"num",def:"26",unit:"A",show:v=>v.mode==="amp"},
            {id:"ph",label:"Supply",type:"chips",def:"3",options:[["3","3-phase"],["1","1-phase"]],onSet:v=>{v.V=v.ph==="3"?"415":"230";}},
            {id:"V",label:"Voltage",type:"num",def:"415",unit:"V",presets:[["400","400"],["415","415"],["230","230"],["240","240"]]},
            {id:"pf",label:"Power factor",help:"Use 1 for heaters.",type:"num",def:"0.85",unit:"cos φ",adv:true},
            {id:"eff",label:"Motor efficiency",help:"Use 100 for heaters.",type:"num",def:"90",unit:"%",adv:true}
           ],
           calc(v){
            const k=v.ph==="3"?SQ3:1,V=num(v.V),pf=num(v.pf),eff=num(v.eff)/100,phs=v.ph==="3"?"3-phase":"1-phase";
            if(!(V>0))return{hint:"Enter the supply voltage."};
            if(!(pf>0&&pf<=1&&eff>0&&eff<=1))return{hint:"Check More options: power factor must be 0 to 1 and efficiency 1 to 100 %."};
            if(v.mode==="kw"){
             let P=num(v.P);if(!(P>0))return{hint:"Enter the motor power."};if(v.P_u==="HP")P*=0.7457;
             const Pin=P/eff,I=Pin*1000/(k*V*pf);
             return{cap:"Full-load current",value:f(I,1),unit:"A",
              say:`A ${f(P,1)} kW motor on ${f(V)} V ${phs} draws about ${B(f(I,1),"A")} at full load. Starting direct-on-line, expect ${f(I*6,0)} to ${f(I*8,0)} A for a few seconds.`,
              rows:[["Power taken from supply",f(Pin,2),"kW"],["Apparent power",f(Pin/pf,2),"kVA"],["Star-delta start, approx",f(I*2,0)+"–"+f(I*2.7,0),"A"]]};
            }
            const I=num(v.I);if(!(I>0))return{hint:"Enter the measured current."};
            const kva=k*V*I/1000,Pin=kva*pf;
            return{cap:"Power drawn",value:f(Pin,2),unit:"kW",
             say:`At ${f(I,1)} A on ${f(V)} V ${phs}, the load is using about ${B(f(Pin,2),"kW")}. A motor at this current is giving about ${f(Pin*eff,2)} kW at the shaft.`,
             rows:[["Apparent power",f(kva,2),"kVA"],["Shaft output",f(Pin*eff,2),"kW"],["Shaft output",f(Pin*eff/0.7457,1),"HP"]]};
           },
           note:"Always check against the motor nameplate FLA."},

          {id:"cable",g:"elec",icon:"cable",name:"Cable size",short:"Voltage drop and the right cable",
           intro:"Enter the current and cable length. You get the smallest cable that is safe and keeps voltage drop in limits.",
           fields:[
            {id:"I",label:"Load current",type:"num",def:"30",unit:"A",half:true},
            {id:"L",label:"Cable length",help:"One way, from panel to load.",type:"num",def:"80",unit:"m",half:true},
            {id:"ph",label:"Supply",type:"chips",def:"3",options:[["3","3-phase"],["1","1-phase"]],onSet:v=>{v.V=v.ph==="3"?"415":"230";}},
            {id:"mat",label:"Conductor",type:"chips",def:"cu",options:[["cu","Copper"],["al","Aluminium"]]},
            {id:"amb",label:"Air temperature around the cable",help:"The hottest it will see in service. The base table is for 30 °C.",type:"num",def:"40",unit:"°C",presets:[["30","30"],["40","40"],["45","45"],["50","50"]]},
            {id:"grp",label:"Circuits running together",help:"Count this circuit plus any others touching it in the same tray, trunking or bunch.",type:"num",def:"1",unit:"circuits",presets:[["1","Alone"],["2","2"],["3","3"],["4","4"],["6","6"],["9","9"]]},
            {id:"arr",label:"How are they laid?",type:"chips",def:"bunch",options:[["bunch","Bunched or in trunking / conduit"],["layer","Single layer on tray or wall"]],show:v=>num(v.grp)>1},
            {id:"V",label:"Voltage",type:"num",def:"415",unit:"V",adv:true},
            {id:"pf",label:"Power factor",type:"num",def:"0.85",unit:"cos φ",adv:true},
            {id:"lim",label:"Maximum voltage drop allowed",type:"num",def:"4",unit:"%",adv:true,presets:[["3","3 % lighting"],["4","4 %"],["5","5 % power"]]},
            {id:"size",label:"Check a specific size",type:"select",def:"auto",options:[["auto","Use the recommended size"]].concat(SIZES.map(s=>[String(s),s+" mm²"])),adv:true}
           ],
           calc(v){
            const k=v.ph==="3"?SQ3:2,rho=v.mat==="al"?0.036:0.0225,I=num(v.I),L=num(v.L),V=num(v.V),pf=num(v.pf),lim=num(v.lim),af=v.mat==="al"?0.78:1;
            if(!(I>0))return{hint:"Enter the load current."};if(!(L>0))return{hint:"Enter the cable length."};
            if(!(V>0&&pf>0&&pf<=1&&lim>0))return{hint:"Check More options: voltage, power factor and drop limit."};
            const amb=num(v.amb),grp=Math.round(num(v.grp));
            if(!isFinite(amb))return{hint:"Enter the air temperature around the cable."};
            if(amb>=60)return{hint:"PVC cable cannot be used at 60 °C or above. Use XLPE or heat-resistant cable and the manufacturer's ratings."};
            if(!(grp>=1))return{hint:"Enter how many circuits run together (1 if it runs alone)."};
            const Ct=derT(amb),Cg=derG(grp,v.arr),Cd=Ct*Cg;
            const sn=Math.sqrt(1-pf*pf),X=0.00008;
            const rows=SIZES.map((a,i)=>{const d=k*L*I*(rho/a*pf+X*sn);return{a,d,pct:d/V*100,amp:AMP_CU[i]*af*Cd};}).map(r=>Object.assign(r,{okA:r.amp>=I,okV:r.pct<=lim}));
            const rec=rows.find(r=>r.okA&&r.okV);
            const cur=(v.size!=="auto"&&rows.find(r=>String(r.a)===v.size))||rec||rows[rows.length-1];
            const pass=cur.okA&&cur.okV;
            const maxP=lim*2;
            const tbl=`<div class="card" style="padding:10px"><div class="tbl"><div class="tr head"><span>Size mm²</span><span class="r">Rating</span><span>Voltage drop</span><span class="r">%</span></div>${rows.map(r=>`<div class="tr${r===cur?" sel":""}" data-a="${r.a}" role="button" tabindex="0"><span class="${r===rec?"rec":""}">${r.a}${r===rec?" ✓":""}</span><span class="r ${r.okA?"":"x"}">${f(r.amp,0)} A</span><span class="b"><i class="${r.okV?"":"over"}" style="width:${Math.min(100,r.pct/maxP*100)}%"></i></span><span class="r ${r.okV?"":"x"}">${f(r.pct,1)}</span></div>`).join("")}</div><p class="note" style="padding:6px 8px 2px">Tap any size to check it. Red means too small.</p></div>`;
            const mat=v.mat==="al"?"aluminium":"copper";
            return{cap:v.size==="auto"?"Recommended cable":"Checking cable",value:cur.a,unit:"mm²",
             status:{ok:pass,text:pass?"Safe and within voltage drop":!cur.okA?"Too small for this current":"Voltage drop too high"},
             say:(rec?`For ${f(I)} A over ${f(L)} m, use at least ${B(rec.a,"mm²")} ${mat} cable. Voltage drop at ${cur.a} mm² is ${f(cur.pct,1)} % (${f(cur.d,1)} V).`:`No size up to 300 mm² works for ${f(I)} A over ${f(L)} m. Use parallel cables or a higher voltage.`)
              +(Cd<0.995?` Ratings are reduced to ${B(f(Cd*100,0),"%")} for ${f(amb,0)} °C${grp>1?` and ${grp} grouped circuits`:""}.`:""),
             rows:[["Voltage drop",f(cur.d,1),"V"],["Voltage at load",f(V-cur.d,0),"V"],["Derated cable rating",f(cur.amp,0),"A"],["Temperature factor",f(Ct,2),"Ca"],["Grouping factor",f(Cg,2),"Cg"]],after:tbl};
           },
           bind(el,st){el.querySelectorAll(".tr[data-a]").forEach(r=>{const go=()=>{st.size=r.dataset.a;show();};r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});},
           note:"Base ratings: multicore PVC (70 °C) cable in air, IEC 60364-5-52 method C, derated for air temperature (Table B.52.14) and grouping (Table B.52.17). Not covered: buried cables, thermal insulation, direct sun, XLPE cables (these carry more: use the manufacturer's table). Voltage drop includes typical reactance (0.08 Ω/km)."},

          {id:"ohm",g:"elec",icon:"ohm",name:"Ohm's law",short:"Volts, amps, ohms, watts",
           intro:"Type any two values. The other two are worked out. Clear a box to swap which ones you use.",
           fields:[
            {id:"V",label:"Voltage",type:"num",def:"230",unit:"V",half:true},
            {id:"I",label:"Current",type:"num",def:"10",unit:"A",half:true},
            {id:"R",label:"Resistance",type:"num",def:"",unit:"Ω",half:true},
            {id:"P",label:"Power",type:"num",def:"",unit:"W",half:true}
           ],
           calc(v){
            const ks=["V","I","R","P"].filter(k=>num(v[k])>0);
            if(ks.length<2)return{hint:"Type any two of voltage, current, resistance and power."};
            if(ks.length>2)return{hint:"You have filled in more than two boxes. Clear one so only two are left."};
            let V,I,R,P;const g={};ks.forEach(k=>g[k]=num(v[k]));({V,I,R,P}=g);const h=x=>x!==undefined;
            if(h(V)&&h(I)){R=V/I;P=V*I}else if(h(V)&&h(R)){I=V/R;P=V*V/R}else if(h(V)&&h(P)){I=P/V;R=V*V/P}
            else if(h(I)&&h(R)){V=I*R;P=I*I*R}else if(h(I)&&h(P)){V=P/I;R=P/(I*I)}else{V=Math.sqrt(P*R);I=Math.sqrt(P/R)}
            const all={V:["Voltage",V,"V"],I:["Current",I,"A"],R:["Resistance",R,"Ω"],P:["Power",P,"W"]};
            const un=["V","I","R","P"].filter(k=>!ks.includes(k));
            return{cap:all[un[0]][0],value:f(all[un[0]][1]),unit:all[un[0]][2],
             say:`${all[un[0]][0]} is ${B(f(all[un[0]][1]),all[un[0]][2])} and ${all[un[1]][0].toLowerCase()} is ${B(f(all[un[1]][1]),all[un[1]][2])}.`,
             rows:ks.map(k=>[all[k][0]+" (you entered)",f(all[k][1]),all[k][2]])};
           }},

          {id:"pf",g:"elec",icon:"pf",name:"Power factor fix",short:"Capacitor kVAr to improve PF",
           intro:"Enter the load and its power factor now. You get the capacitor size to reach your target.",
           fields:[
            {id:"kw",label:"Load power",type:"num",def:"100",unit:"kW"},
            {id:"p1",label:"Power factor now",type:"num",def:"0.78",unit:"cos φ",half:true},
            {id:"p2",label:"Target power factor",type:"num",def:"0.95",unit:"cos φ",half:true,presets:[["0.9","0.90"],["0.95","0.95"],["0.98","0.98"]]},
            {id:"V",label:"Voltage (3-phase)",type:"num",def:"415",unit:"V",adv:true}
           ],
           calc(v){
            const P=num(v.kw),p1=num(v.p1),p2=num(v.p2),V=num(v.V);
            if(!(P>0))return{hint:"Enter the load power."};
            if(!(p1>0&&p1<1&&p2>0&&p2<=1))return{hint:"Power factors must be between 0 and 1, for example 0.8."};
            if(p2<=p1)return{hint:"The target power factor must be higher than the one you have now."};
            const Q=P*(Math.tan(Math.acos(p1))-Math.tan(Math.acos(p2))),s1=P/p1,s2=P/p2,I1=s1*1000/(SQ3*V),I2=s2*1000/(SQ3*V);
            return{cap:"Capacitor needed",value:f(Q,1),unit:"kVAr",
             say:`Add about ${B(f(Q,1),"kVAr")} of capacitors. Line current drops from ${f(I1,0)} A to ${f(I2,0)} A, which is ${f((1-I2/I1)*100,0)} % less.`,
             rows:[["kVA before",f(s1,1),"kVA"],["kVA after",f(s2,1),"kVA"]]};
           },

           note:"Round up to the next standard capacitor bank size."},

          {id:"ir",g:"elec",icon:"ir",name:"Insulation resistance",short:"Megger test: IR, temperature correction, PI",
           intro:"Enter the equipment and your megger readings. You get the test voltage to use, the IR corrected for temperature, the polarisation index and a pass or fail.",
           fields:[
            {id:"eq",label:"Equipment",type:"chips",def:"lvm",options:[["lvm","LV motor / random-wound"],["hvm","HV motor / form-wound"],["cab","LV cable or switchgear"],["hvc","HV cable"]]},
            {id:"V",label:"Rated voltage",type:"num",def:"415",unit:"V"},
            {id:"r1",label:"IR reading at 1 minute",type:"num",def:"850",unit:"MΩ"},
            {id:"r10",label:"IR reading at 10 minutes",help:"Leave blank if you only took the 1-minute reading.",type:"num",def:"2400",unit:"MΩ"},
            {id:"r30",label:"IR reading at 30 seconds (for DAR)",help:"Optional. DAR = 1 min ÷ 30 s, a quick check when a 10-minute test is not practical.",type:"num",def:"",unit:"MΩ",adv:true},
            {id:"T",label:"Winding or cable temperature",type:"num",def:"35",unit:"°C"},
            {id:"tb",label:"Correct to",type:"chips",def:"40",options:[["40","40 °C (IEEE 43)"],["20","20 °C"]],adv:true},
            {id:"min",label:"Project minimum (optional)",help:"Overrides the default minimum below.",type:"num",def:"",unit:"MΩ",adv:true}
           ],
           calc(v){
            const V=num(v.V),r1=num(v.r1),r10=num(v.r10),T=num(v.T),tb=num(v.tb);
            if(!(V>0))return{hint:"Enter the rated voltage."};if(!(r1>0))return{hint:"Enter the 1-minute IR reading."};if(!isFinite(T))return{hint:"Enter the temperature at the time of the test."};
            const kV=V/1000,tv=V<1000?"500 V DC (1000 V DC for 690–1000 V)":V<=2500?"500–1000 V DC":V<=5000?"1000–2500 V DC":V<=12000?"2500–5000 V DC":"5000–10000 V DC";
            const kt=Math.pow(0.5,(tb-T)/10),rc=r1*kt;
            const defMin={lvm:5,hvm:100,cab:Math.max(1,kV+1),hvc:Math.max(100,(kV+1)*10)}[v.eq],mn=num(v.min)>0?num(v.min):defMin;
            const pi=r10>0?r10/r1:NaN,r30=num(v.r30),dar=r30>0?r1/r30:NaN,darTxt=!isFinite(dar)?"":` DAR is ${B(f(dar,2))}: ${dar<1?"poor, likely wet":dar<1.25?"questionable":dar<1.6?"good":"excellent"}.`;
            const piTxt=!isFinite(pi)?"":r1>5000?" PI is not needed because the 1-minute reading is above 5000 MΩ.":pi<1?` PI is ${B(f(pi,2))}, which is poor: the insulation is likely wet or contaminated.`:pi<2?` PI is ${B(f(pi,2))}, which is questionable. Most specs need 2.0 or more for class B, F and H insulation.`:pi<4?` PI is ${B(f(pi,2))}, which is good.`:` PI is ${B(f(pi,2))}, which is very good.`;
            const piBad=isFinite(pi)&&r1<=5000&&pi<2&&(v.eq==="lvm"||v.eq==="hvm");
            const ok=rc>=mn&&!piBad;
            return{cap:`IR corrected to ${tb} °C`,value:f(rc,rc<10?2:0),unit:"MΩ",status:{ok,text:ok?"Pass":rc<mn?"Below minimum":"PI too low"},
             say:`Test at ${B(tv)}. Your ${f(r1)} MΩ reading at ${f(T,1)} °C is ${B(f(rc,rc<10?2:0),"MΩ")} at ${tb} °C, against a minimum of ${f(mn,1)} MΩ.`+piTxt+darTxt,
             rows:[["Temperature factor",f(kt,3),"×"],["Minimum used",f(mn,1),"MΩ"],["Polarisation index",isFinite(pi)?f(pi,2):"—",""],["DAR (60 s ÷ 30 s)",isFinite(dar)?f(dar,2):"—",""]]};
           },
           note:"IR halves for every 10 °C rise, so readings are corrected to a base temperature. Minimums follow IEEE 43 for machines (5 MΩ random-wound, 100 MΩ form-wound) and a common (kV + 1) MΩ rule for cables. Your project spec governs."},

          {id:"ct",g:"elec",icon:"ct",name:"CT ratio",short:"Primary current, CT selection, burden, ratio test",
           intro:"Work out the real current from a CT secondary reading, choose a CT for a load, check the burden, or check a ratio test result.",
           fields:[
            {id:"mode",label:"What do you need?",type:"chips",def:"read",options:[["read","Secondary to primary"],["sel","Choose a CT"],["burd","Burden check"],["test","Ratio test"]]},
            {id:"pri",label:"CT primary rating",type:"num",def:"400",unit:"A",half:true,show:v=>v.mode!=="sel"},
            {id:"sec",label:"CT secondary rating",type:"chips",def:"5",options:[["5","5 A"],["1","1 A"]]},
            {id:"Is",label:"Secondary current measured",type:"num",def:"3.6",unit:"A",show:v=>v.mode==="read"},
            {id:"vt",label:"VT ratio (optional)",help:"For energy meters, for example 11000/110 = 100. Leave 1 for LV.",type:"num",def:"1",unit:"",adv:true,show:v=>v.mode==="read"},
            {id:"fla",label:"Full-load current of the feeder",type:"num",def:"280",unit:"A",show:v=>v.mode==="sel"},
            {id:"use",label:"Used for",type:"chips",def:"m",options:[["m","Metering"],["p","Protection"]],show:v=>v.mode==="sel"||v.mode==="test"},
            {id:"va",label:"CT rated burden",type:"num",def:"15",unit:"VA",half:true,show:v=>v.mode==="burd"},
            {id:"dev",label:"Meters and relays burden",help:"Add the VA of every device on the CT circuit.",type:"num",def:"2.5",unit:"VA",half:true,show:v=>v.mode==="burd"},
            {id:"L",label:"Cable length, one way",type:"num",def:"40",unit:"m",half:true,show:v=>v.mode==="burd"},
            {id:"mm",label:"Cable size",type:"chips",def:"2.5",options:[["1.5","1.5 mm²"],["2.5","2.5 mm²"],["4","4 mm²"],["6","6 mm²"]],show:v=>v.mode==="burd"},
            {id:"Ip",label:"Primary current injected",type:"num",def:"200",unit:"A",half:true,show:v=>v.mode==="test"},
            {id:"Im",label:"Secondary current measured",type:"num",def:"2.49",unit:"A",half:true,show:v=>v.mode==="test"},
            {id:"cls",label:"Accuracy class",type:"chips",def:"0.5",options:[["0.2","0.2"],["0.5","0.5"],["1","1"],["3","3"],["1p","5P / 10P (±1 %)"]],show:v=>v.mode==="test"}
           ],
           calc(v){
            const sec=num(v.sec)||5,pri=num(v.pri);
            if(v.mode==="sel"){const fla=num(v.fla);if(!(fla>0))return{hint:"Enter the full-load current."};
             const STD=[5,10,15,20,25,30,40,50,60,75,100,150,200,250,300,400,500,600,750,800,1000,1200,1250,1500,1600,2000,2500,3000,4000,5000];
             const need=fla*(v.use==="m"?1.25:1.0),p=STD.find(x=>x>=need)||Math.ceil(need/500)*500,load=fla/p*100;
             return{cap:"CT ratio",value:`${p}/${sec}`,unit:"A",status:{ok:load>=40&&load<=100,text:`Full load at ${f(load,0)} % of CT rating`},
              say:`For ${f(fla)} A full load, use a ${B(p+"/"+sec+" A")} CT. At full load the secondary carries ${B(f(fla/p*sec,2),"A")}.`+(v.use==="m"?" For metering, keep normal load between about 40 and 100 % of the CT rating so the meter stays accurate.":" For protection, also check the accuracy limit factor (for example 5P20) covers the fault current, and that the relay settings fit the ratio."),
              rows:[["CT ratio",f(p/sec,0),": 1"],["Secondary at full load",f(fla/p*sec,2),"A"],["Load on CT",f(load,0),"%"]]};}
            if(!(pri>0))return{hint:"Enter the CT primary rating."};const K=pri/sec;
            if(v.mode==="read"){const Is=num(v.Is),vt=num(v.vt)||1;if(!(Is>=0))return{hint:"Enter the secondary current."};const Ip=Is*K;
             return{cap:"Primary current",value:f(Ip,1),unit:"A",status:{ok:Is<=sec*1.2,text:Is>sec?"Above CT rating":`${f(Is/sec*100,0)} % of CT rating`},
              say:`${f(Is,2)} A on a ${f(pri)}/${sec} A CT means ${B(f(Ip,1),"A")} is flowing in the primary (ratio ${f(K,0)}).`+(vt!==1?` Meter multiplier with the VT is ${B(f(K*vt,0))}: multiply the meter reading by this.`:` Multiply meter readings by ${B(f(K,0))}.`),
              rows:[["CT ratio",f(K,0),": 1"],["Meter multiplier",f(K*vt,0),"×"],["Secondary loading",f(Is/sec*100,0),"%"]]};}
            if(v.mode==="burd"){const va=num(v.va),dev=num(v.dev)||0,L=num(v.L)||0,A=num(v.mm);if(!(va>0))return{hint:"Enter the CT rated burden."};
             const R=2*L*0.0216/A,lead=sec*sec*R,tot=dev+lead,ok=tot<=va;
             return{cap:"Total burden",value:f(tot,2),unit:"VA",status:{ok,text:ok?`Within ${f(va)} VA rating`:"Over the CT rating"},
              say:`The ${f(L)} m cable loop (${f(2*L)} m of ${A} mm²) adds ${B(f(lead,2),"VA")} at ${sec} A. With ${f(dev,1)} VA of devices, the total is ${B(f(tot,2),"VA")} against the CT's ${f(va)} VA.`+(ok?"":` Over-burdened CTs lose accuracy and may saturate. Use bigger cable, a 1 A CT, or a CT with a higher VA.`)+(sec===5&&lead>dev?" Most of the burden is the cable; a 1 A CT would cut it by 25 times.":""),
              rows:[["Cable resistance (loop)",f(R,3),"Ω"],["Cable burden",f(lead,2),"VA"],["Devices",f(dev,2),"VA"],["Spare",f(va-tot,2),"VA"]]};}
            const Ip=num(v.Ip),Im=num(v.Im);if(!(Ip>0&&Im>0))return{hint:"Enter the injected and measured currents."};
            const err=(K*Im-Ip)/Ip*100,lim=v.cls==="1p"?1:num(v.cls),ok=Math.abs(err)<=lim;
            return{cap:"Ratio error",value:(err>=0?"+":"")+f(err,2),unit:"%",status:{ok,text:ok?`Within class ${v.cls==="1p"?"5P/10P":v.cls}`:"Outside class limit"},
             say:`Injecting ${f(Ip)} A should give ${B(f(Ip/K,3),"A")} on the secondary. You measured ${f(Im,3)} A, a ratio error of ${B((err>=0?"+":"")+f(err,2),"%")} against a limit of ±${lim} %.`+(ok?"":" Check the CT tap or ratio setting, the test set, open or shorted turns, and that the secondary is not shorted elsewhere."),
             rows:[["Measured ratio",f(Ip/Im,1),": 1"],["Nameplate ratio",f(K,1),": 1"],["Expected secondary",f(Ip/K,3),"A"]]};
           },
           note:"Never open-circuit a live CT secondary: it produces dangerous high voltage. Short the secondary before disconnecting a meter or relay. Ratio limits shown are at rated current (IEC 61869-2); lower currents allow a wider limit."},
          {id:"wind",g:"elec",icon:"wind",name:"Winding resistance",short:"Phase balance and 20 °C correction",
           intro:"Enter the three winding or phase-to-phase resistances and the winding temperature. You get the balance and the values corrected to 20 °C.",
           fields:[
            {id:"r",label:"Three resistance readings",help:"U-V, V-W, W-U (or U1-U2, V1-V2, W1-W2), separated by spaces.",type:"text",def:"0.412 0.415 0.409"},
            {id:"un",label:"Unit",type:"chips",def:"Ω",options:[["Ω","Ω"],["mΩ","mΩ"]]},
            {id:"T",label:"Winding temperature",help:"Use ambient if the motor has been off for many hours.",type:"num",def:"34",unit:"°C"},
            {id:"mat",label:"Conductor",type:"chips",def:"234.5",options:[["234.5","Copper"],["225","Aluminium"]]},
            {id:"lim",label:"Allowed imbalance",type:"num",def:"2",unit:"%",adv:true},
            {id:"fac",label:"Factory value at 20 °C (optional)",type:"num",def:"",unitFrom:v=>v.un,adv:true}
           ],
           calc(v){
            const r=numsOf(v.r),T=num(v.T),k=num(v.mat),lim=num(v.lim)||2,fac=num(v.fac);if(r.length!==3)return{hint:`Enter three readings. You have ${r.length}.`};if(!isFinite(T))return{hint:"Enter the winding temperature."};
            const av=(r[0]+r[1]+r[2])/3,ub=Math.max(...r.map(x=>Math.abs(x-av)))/av*100,c=(k+20)/(k+T),r20=r.map(x=>x*c),a20=av*c,ok=ub<=lim,u=v.un;
            return{cap:"Imbalance",value:f(ub,2),unit:"%",status:{ok,text:ok?"Balanced":"Imbalance too high"},
             say:`The readings are within ${B(f(ub,2),"%")} of their average (limit ${f(lim,1)} %). Corrected to 20 °C the average is ${B(f(a20,4),u)}.`+(fac>0?` That is ${f((a20-fac)/fac*100,1)} % from the factory value.`:"")+(ok?"":" Look for a loose or high-resistance connection, a wrong tap, or shorted turns before energising."),
             rows:[["Average",f(av,4),u],["Average at 20 °C",f(a20,4),u],["Correction factor",f(c,4),""]],
             after:tbl(["Phase","Measured","At 20 °C"],r.map((x,i)=>[["1","2","3"][i],f(x,4),f(r20[i],4)]))};
           },
           note:"R20 = R × (k + 20) ÷ (k + T), k = 234.5 for copper and 225 for aluminium. Use a 4-wire micro-ohmmeter or low-resistance bridge. 2 % imbalance is a common limit for motors; transformers use the maker's figures."},

          {id:"zs",g:"elec",icon:"zs",name:"Earth loop impedance",short:"Maximum Zs for a breaker, pass or fail",
           intro:"Pick the breaker and enter the measured earth fault loop impedance. You find out if the breaker will trip fast enough on an earth fault.",
           fields:[
            {id:"ty",label:"Breaker curve",type:"chips",def:"C",options:[["B","Type B"],["C","Type C"],["D","Type D"]]},
            {id:"In",label:"Breaker rating",type:"chips",def:"32",options:[6,10,16,20,25,32,40,50,63,80,100,125].map(x=>[String(x),x+" A"])},
            {id:"U0",label:"Voltage to earth",type:"num",def:"240",unit:"V"},
            {id:"Zs",label:"Measured Zs",type:"num",def:"0.62",unit:"Ω"},
            {id:"hot",label:"Allow for conductor heating",help:"Readings are taken cold. Comparing with 80 % of the limit allows for cables at full temperature.",type:"chips",def:"1",options:[["1","Yes (80 % rule)"],["0","No"]],adv:true}
           ],
           calc(v){
            const In=num(v.In),U0=num(v.U0),Zs=num(v.Zs),m={B:5,C:10,D:20}[v.ty],Ia=m*In;if(!(U0>0))return{hint:"Enter the voltage to earth."};
            const Zmax=0.95*U0/Ia,Zchk=v.hot==="1"?0.8*Zmax:Zmax,ok=Zs>=0&&Zs<=Zchk,If=Zs>0?U0/Zs:NaN;
            return{cap:"Maximum Zs",value:f(Zchk,3),unit:"Ω",status:Zs>=0?{ok,text:ok?"Pass":"Fail"}:null,
             say:`A ${In} A type ${v.ty} breaker needs at least ${f(Ia,0)} A to trip instantly, so Zs must not exceed ${B(f(Zmax,3),"Ω")}${v.hot==="1"?`, or ${B(f(Zchk,3),"Ω")} for a cold reading`:""}.`+(Zs>0?` Your ${f(Zs,3)} Ω gives a fault current of about ${f(If,0)} A, so it ${ok?"passes":"fails: use a larger protective conductor, shorten the run, change to a type B or lower-rated breaker, or add an RCD"}.`:""),
             rows:[["Instant trip current",f(Ia,0),"A"],["Limit (hot)",f(Zmax,3),"Ω"],["Limit for cold reading",f(Zchk,3),"Ω"],["Prospective fault current",isFinite(If)?f(If,0):"—","A"]]};
           },
           note:"Zs ≤ Cmin × U0 ÷ Ia with Cmin 0.95 (IEC 60364-4-41 / BS 7671), Ia = 5, 10 or 20 × In for type B, C, D (0.4 s and 5 s disconnection). For fuses and adjustable breakers, use the maker's time-current curve."},

          {id:"vdip",g:"elec",icon:"vdip",name:"Voltage dip at motor start",short:"Will a big motor start dip the supply too much?",
           intro:"Enter the supply (transformer or generator) and the motor. You get the voltage dip when the motor starts.",
           fields:[
            {id:"src",label:"Supply",type:"chips",def:"tx",options:[["tx","Transformer"],["gen","Generator"]]},
            {id:"kva",label:"Supply rating",type:"num",def:"1000",unit:"kVA",half:true},
            {id:"z",label:"Impedance %Z (or generator X″d)",help:"Transformers 4–6 %, generators often 12–20 %.",type:"num",def:"5",unit:"%",half:true},
            {id:"kw",label:"Motor rating",type:"num",def:"75",unit:"kW",half:true},
            {id:"st",label:"Starting method",type:"chips",def:"6.5",options:[["6.5","DOL"],["2.2","Star-delta"],["3","Soft starter"],["1.2","VFD"]]},
            {id:"base",label:"Load already on the supply",type:"num",def:"400",unit:"kVA",adv:true},
            {id:"lim",label:"Allowed dip",type:"num",def:"15",unit:"%",adv:true}
           ],
           calc(v){
            const kva=num(v.kva),z=num(v.z)/100,kw=num(v.kw),m=num(v.st),base=num(v.base)||0,lim=num(v.lim)||15;if(!(kva>0&&z>0))return{hint:"Enter the supply rating and impedance."};if(!(kw>0))return{hint:"Enter the motor rating."};
            const Ssc=kva/z,Sm=kw/(0.9*0.86),Ss=Sm*m,dip=Ss/(Ssc+Ss)*100,ok=dip<=lim;
            return{cap:"Voltage dip",value:f(dip,1),unit:"%",status:{ok,text:ok?`Within ${lim} %`:`Over ${lim} %`},
             say:`Starting the ${f(kw)} kW motor ${({"6.5":"direct-on-line","2.2":"star-delta","3":"on a soft starter","1.2":"on a VFD"})[v.st]} draws about ${B(f(Ss,0),"kVA")}. On a supply with ${f(Ssc/1000,1)} MVA fault level this dips the voltage by about ${B(f(dip,1),"%")}.`+(ok?"":" Contactors may drop out and lights flicker. Use a soft starter or VFD, or a larger supply.")+(v.src==="gen"&&base>0?` With ${f(base,0)} kVA already running, also check the generator's motor-starting curve.`:""),
             rows:[["Supply fault level",f(Ssc,0),"kVA"],["Motor running",f(Sm,0),"kVA"],["Motor starting",f(Ss,0),"kVA"],["Starting current",f(Ss*1000/(SQ3*415),0),"A at 415 V"]]};
           },
           note:"Dip ≈ S_start ÷ (S_sc + S_start), where S_sc = kVA ÷ %Z. Ignores cable impedance and upstream source, so the real dip is a little larger. Limits: 15 % at the motor and 10 % at sensitive loads are common."},
          {id:"unbal",g:"elec",icon:"unbal",name:"Voltage & current unbalance",short:"% unbalance and motor derating",
           intro:"Enter the three line-to-line voltages or the three phase currents.",
           fields:[
            {id:"mode",label:"What did you measure?",type:"chips",def:"v",options:[["v","Voltages"],["i","Currents"]]},
            {id:"a",label:"L1–L2 / L1",type:"num",def:"412",unitFrom:v=>v.mode==="v"?"V":"A",half:true},
            {id:"b",label:"L2–L3 / L2",type:"num",def:"418",unitFrom:v=>v.mode==="v"?"V":"A",half:true},
            {id:"c",label:"L3–L1 / L3",type:"num",def:"405",unitFrom:v=>v.mode==="v"?"V":"A"}
           ],
           calc(v){
            const x=[num(v.a),num(v.b),num(v.c)];if(!x.every(n=>n>0))return{hint:"Enter all three readings."};
            const avg=(x[0]+x[1]+x[2])/3,dev=Math.max(...x.map(n=>Math.abs(n-avg))),u=dev/avg*100,un=v.mode==="v"?"V":"A";
            if(v.mode==="i"){const ok=u<=10;
             return{cap:"Current unbalance",value:f(u,1),unit:"%",status:{ok,text:ok?"Within 10 %":"Too high"},
              say:`Average current is ${f(avg,1)} A and the largest deviation is ${f(dev,1)} A, so unbalance is ${B(f(u,1),"%")}. `+(ok?"That is acceptable for most motors.":"Check the supply voltage balance first, then loose connections, the starter contacts and the winding resistance."),
              rows:[["Average",f(avg,2),"A"],["Max deviation",f(dev,2),"A"]]};}
            const tab=[[0,1],[1,1],[2,0.95],[3,0.88],[4,0.82],[5,0.75]];let dr=NaN;
            if(u<=5){for(let i=0;i<tab.length-1;i++)if(u>=tab[i][0]&&u<=tab[i+1][0]){dr=tab[i][1]+(tab[i+1][1]-tab[i][1])*(u-tab[i][0]);break;}}
            const st=u<=1?{ok:true,text:"Good"}:u<=2?{ok:true,text:"Acceptable"}:{ok:false,text:u<=5?"Derate motors":"Do not run motors"};
            return{cap:"Voltage unbalance",value:f(u,2),unit:"%",status:st,
             say:`Average voltage is ${f(avg,1)} V and the largest deviation is ${f(dev,1)} V, so unbalance is ${B(f(u,2),"%")}. `+(u<=1?"Motors can run at full rating.":u<=5?`Motors should be derated to about ${B(f(dr*100,0),"%")} of their rating. Expect current unbalance of roughly ${f(u*6,0)} to ${f(u*10,0)} %.`:"Above 5 %, NEMA advises not to run motors. Find the cause in the supply."),
             rows:[["Average",f(avg,1),un],["Max deviation",f(dev,1),un],["Motor derating factor",isFinite(dr)?f(dr,2):"—","×"]]};
           },
           note:"NEMA MG 1 method: % unbalance = maximum deviation from average ÷ average × 100. Derating follows the NEMA MG 1 curve. Most commissioning specs allow 1 % voltage and 10 % current unbalance."},

          {id:"ma",g:"elec",icon:"ma",name:"4–20 mA scaling",short:"Loop current ↔ process value",
           intro:"Set the transmitter range, then convert a loop current to a reading or a reading to the current you should see.",
           fields:[
            {id:"mode",label:"What do you have?",type:"chips",def:"ma",options:[["ma","A current (mA)"],["pv","A process value"]]},
            {id:"lo",label:"Range low (at 4 mA)",type:"num",def:"0",unit:"",half:true},
            {id:"hi",label:"Range high (at 20 mA)",type:"num",def:"500",unit:"",half:true},
            {id:"I",label:"Loop current",type:"num",def:"12",unit:"mA",show:v=>v.mode==="ma",presets:[["4","4"],["8","8"],["12","12"],["16","16"],["20","20"]]},
            {id:"pv",label:"Process value",type:"num",def:"250",unit:"",show:v=>v.mode==="pv"},
            {id:"sq",label:"Output type",type:"chips",def:"lin",options:[["lin","Linear"],["sqrt","Square root (DP flow)"]],adv:true}
           ],
           calc(v){
            const lo=num(v.lo),hi=num(v.hi),sq=v.sq==="sqrt";if(!isFinite(lo)||!isFinite(hi)||hi===lo)return{hint:"Enter a range with different low and high values."};
            const span=hi-lo,tbl=[0,25,50,75,100].map(p=>[`${p} %`,f(4+p*0.16,2)+" mA",f(lo+span*(sq?Math.sqrt(p/100):p/100),3)]);
            const after=`<div class="card" style="padding:10px"><div class="ptab"><table class="fit"><thead><tr><th>% signal</th><th>Current</th><th>Value</th></tr></thead><tbody>${tbl.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div><p class="note" style="padding:6px 8px 2px">Five-point check for loop calibration.</p></div>`;
            if(v.mode==="ma"){const I=num(v.I);if(!isFinite(I))return{hint:"Enter the loop current."};
             const p=(I-4)/16,pv=lo+span*(sq?Math.sqrt(Math.max(p,0)):p);
             const fault=I<3.8?{ok:false,text:"Below range: fault or open loop"}:I>20.5?{ok:false,text:"Above range: fault"}:{ok:true,text:"Signal in range"};
             return{cap:"Process value",value:f(pv,3),unit:"",status:fault,
              say:`${f(I,2)} mA is ${B(f(p*100,1),"%")} of the signal, which reads ${B(f(pv,3))} on a ${f(lo)} to ${f(hi)} range.`+(I<3.8||I>20.5?" NAMUR NE 43 treats currents below 3.8 mA or above 20.5 mA as a fault.":""),
              rows:[["Signal",f(p*100,2),"%"],["Span",f(span),""]],after};}
            const pv=num(v.pv);if(!isFinite(pv))return{hint:"Enter the process value."};
            const r=(pv-lo)/span,p=sq?r*r:r,I=4+16*p;
            return{cap:"Expected current",value:f(I,3),unit:"mA",
             say:`A reading of ${f(pv)} should give ${B(f(I,3),"mA")} (${f(p*100,1)} % of the signal).`,rows:[["Signal",f(p*100,2),"%"],["Span",f(span),""]],after};
           },
           note:"Linear: value = low + (mA − 4) ÷ 16 × span. Square root output is used on DP flow transmitters, where flow ∝ √(signal)."},

          {id:"rtd",g:"elec",icon:"rtd",name:"RTD (PT100)",short:"Resistance ↔ temperature",
           intro:"Convert an RTD resistance to temperature, or find the resistance to simulate a temperature.",
           fields:[
            {id:"type",label:"Sensor",type:"chips",def:"100",options:[["100","PT100"],["1000","PT1000"]]},
            {id:"mode",label:"What do you have?",type:"chips",def:"r",options:[["r","A resistance"],["t","A temperature"]]},
            {id:"R",label:"Measured resistance",type:"num",def:"113.61",unit:"Ω",show:v=>v.mode==="r"},
            {id:"T",label:"Temperature",type:"num",def:"35",unit:"°C",show:v=>v.mode==="t"}
           ],
           calc(v){
            const R0=num(v.type)||100,A=3.9083e-3,Bc=-5.775e-7,C=-4.183e-12;
            const RofT=t=>R0*(1+A*t+Bc*t*t+(t<0?C*(t-100)*t*t*t:0));
            if(v.mode==="t"){const t=num(v.T);if(!(t>=-200&&t<=850))return{hint:"Enter a temperature between −200 and 850 °C."};const r=RofT(t);
             return{cap:"Resistance",value:f(r,3),unit:"Ω",say:`A PT${R0} at ${f(t,1)} °C reads ${B(f(r,3),"Ω")}. Set this on a decade box to simulate the temperature.`,rows:[["Change per °C here",f((RofT(t+0.5)-RofT(t-0.5)),4),"Ω/°C"],["Temperature",f(t*9/5+32,1),"°F"]]};}
            const r=num(v.R);if(!(r>0))return{hint:"Enter the measured resistance."};
            let t=r>=R0?(-A+Math.sqrt(A*A-4*Bc*(1-r/R0)))/(2*Bc):(r/R0-1)/A;
            for(let i=0;i<30;i++){const d=(RofT(t+0.001)-RofT(t-0.001))/0.002;t-=(RofT(t)-r)/d;}
            if(!(t>=-200&&t<=850))return{hint:"That resistance is outside the PT"+R0+" range. Check the sensor type and the wiring."};
            return{cap:"Temperature",value:f(t,2),unit:"°C",say:`${f(r,3)} Ω on a PT${R0} is ${B(f(t,2),"°C")} (${f(t*9/5+32,1)} °F).`+(r<R0*0.18||r>R0*3.9?"":""),
             rows:[["Temperature",f(t*9/5+32,2),"°F"],["Resistance at 0 °C",f(R0,0),"Ω"]]};
           },
           note:"IEC 60751 (α = 0.00385) Callendar–Van Dusen equation. On 2-wire RTDs, subtract the lead resistance before converting. An open circuit reads very high, a short reads near 0 Ω."},

          {id:"brk",g:"elec",icon:"brk",name:"Breaker size",short:"MCB / MCCB rating and curve",
           intro:"Enter the design current and the cable rating. You get the breaker size and trip curve to use.",
           fields:[
            {id:"Ib",label:"Design (load) current",type:"num",def:"28",unit:"A"},
            {id:"load",label:"Type of load",type:"chips",def:"gen",options:[["res","Heaters / lighting"],["gen","General / sockets"],["mot","Motors / transformers"]]},
            {id:"Iz",label:"Cable current rating",help:"After derating. Leave blank to skip the cable check.",type:"num",def:"41",unit:"A"},
            {id:"cont",label:"Continuous load (NEC 125 % rule)",type:"chips",def:"0",options:[["0","No (IEC)"],["1","Yes"]],adv:true}
           ],
           calc(v){
            const Ib=num(v.Ib),Iz=num(v.Iz),fac=v.cont==="1"?1.25:1;if(!(Ib>0))return{hint:"Enter the design current."};
            const STD=[6,10,13,16,20,25,32,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3200];
            const need=Ib*fac,In=STD.find(s=>s>=need);if(!In)return{hint:"That current is above 3200 A. Use an ACB sized from the manufacturer's data."};
            const curve={res:"B",gen:"C",mot:"D"}[v.load],type=In<=63?"MCB":In<=1600?"MCCB":"ACB";
            const cOK=!(Iz>0)||In<=Iz;
            return{cap:"Breaker rating",value:In,unit:"A",status:Iz>0?{ok:cOK,text:cOK?"Cable is protected":"Cable too small for this breaker"}:null,
             say:`Use a ${B(In+" A")} ${type}${In<=125?` with a ${B("type "+curve)} curve`:""}.`+(Iz>0?(cOK?` It protects the ${f(Iz)} A cable (I<sub>b</sub> ≤ I<sub>n</sub> ≤ I<sub>z</sub>).`:` The cable is rated only ${f(Iz)} A, so increase the cable size or reduce the load.`):"")+(v.load==="mot"?" For motors, an MPCB or MCCB with a motor trip unit set to FLA is usually better.":""),
             rows:[["Design current",f(need,1),"A"],["Trip curve",In<=125?curve:"Adjustable",""],["Instantaneous trip, approx",In<=125?f(In*{B:4,C:8,D:15}[curve],0):"—","A"]]};
           },
           note:"IEC 60364: design current ≤ breaker rating ≤ cable rating. Curve B trips at 3–5 × I<sub>n</sub>, C at 5–10 ×, D at 10–20 ×. Check breaking capacity against the fault level."},

          {id:"tx",g:"elec",icon:"tx",name:"Transformer",short:"Full-load and short-circuit current",
           intro:"Enter the transformer rating, voltages and impedance.",
           fields:[
            {id:"kva",label:"Rating",type:"num",def:"1000",unit:"kVA"},
            {id:"Vs",label:"Secondary voltage",type:"num",def:"415",unit:"V",half:true},
            {id:"Vp",label:"Primary voltage",type:"num",def:"11000",unit:"V",half:true},
            {id:"z",label:"Impedance",type:"num",def:"5",unit:"%",presets:[["4","4 %"],["5","5 %"],["6","6 %"],["8","8 %"]]},
            {id:"ph",label:"Phases",type:"chips",def:"3",options:[["3","3-phase"],["1","1-phase"]],adv:true}
           ],
           calc(v){
            const S=num(v.kva)*1000,Vs=num(v.Vs),Vp=num(v.Vp),z=num(v.z),k=v.ph==="1"?1:SQ3;
            if(!(S>0&&Vs>0))return{hint:"Enter the rating and secondary voltage."};if(!(z>0))return{hint:"Enter the impedance in %."};
            const Is=S/(k*Vs),Ip=Vp>0?S/(k*Vp):NaN,Isc=Is*100/z;
            return{cap:"Secondary full-load current",value:f(Is,0),unit:"A",
             say:`A ${f(S/1000)} kVA transformer at ${f(Vs)} V gives ${B(f(Is,0),"A")} at full load. With ${f(z,1)} % impedance, a bolted fault at the terminals is about ${B(f(Isc/1000,1),"kA")}, so the main breaker needs at least that breaking capacity.`,
             rows:[["Primary current",f(Ip,1),"A"],["Short-circuit current",f(Isc/1000,2),"kA"],["Fault level",f(S/(z/100)/1e6,1),"MVA"]]};
           },
           note:"I<sub>sc</sub> = I<sub>FL</sub> × 100 ÷ %Z, assuming an infinite upstream source. The real fault current is a little lower once source and cable impedance are included."},

          {id:"gen",g:"elec",icon:"gen",name:"Generator size",short:"Running load plus motor starting",
           intro:"Enter the total running load and the largest motor that starts on the generator.",
           fields:[
            {id:"kw",label:"Total running load",type:"num",def:"120",unit:"kW"},
            {id:"pf",label:"Load power factor",type:"num",def:"0.8",unit:"cos φ"},
            {id:"mk",label:"Largest motor",type:"num",def:"30",unit:"kW"},
            {id:"st",label:"How it starts",type:"chips",def:"6",options:[["6","Direct-on-line"],["2.5","Star-delta"],["3","Soft starter"],["1.5","VFD"]]},
            {id:"mg",label:"Spare margin",type:"num",def:"20",unit:"%",adv:true}
           ],
           calc(v){
            const kw=num(v.kw),pf=num(v.pf),mk=num(v.mk)||0,m=num(v.st),mg=(num(v.mg)||0)/100;
            if(!(kw>0))return{hint:"Enter the running load."};if(!(pf>0&&pf<=1))return{hint:"Power factor must be between 0 and 1."};
            const run=kw/pf,need=run*(1+mg),mRun=mk/(0.9*0.85),start=mRun*m,step=(kw-mk)/pf+start;
            const SZ=[20,30,45,60,80,100,125,150,200,250,300,350,400,500,630,750,800,1000,1250,1500,1750,2000,2500];
            const g=SZ.find(s=>s>=need)||Math.ceil(need/100)*100;
            return{cap:"Generator rating",value:g,unit:"kVA",status:{ok:start<=g*1.5,text:start<=g*1.5?"Motor start looks manageable":"Check the motor-starting capacity"},
             say:`The running load is ${f(run,0)} kVA, or ${f(need,0)} kVA with margin, so choose a ${B(g+" kVA")} set. Starting the ${f(mk)} kW motor ${ {"6":"direct-on-line","2.5":"star-delta","3":"on a soft starter","1.5":"on a VFD"}[v.st]} draws about ${B(f(start,0),"kVA")}. Confirm on the generator's motor-starting (SkVA) curve that it can supply this with no more than 15–20 % voltage dip.`,
             rows:[["Running load",f(run,0),"kVA"],["Motor starting demand",f(start,0),"kVA"],["Load at motor start",f(step,0),"kVA"]]};
           },
           note:"Starting multipliers are typical: DOL 6 ×, star-delta 2.5 ×, soft starter 3 ×, VFD 1.5 × running kVA. Final selection needs the manufacturer's sizing software."},

          {id:"ups",g:"elec",icon:"ups",name:"UPS / battery backup",short:"Backup time or battery Ah needed",
           intro:"Enter the load and the battery bank. You get the backup time, and the Ah needed for your target time.",
           fields:[
            {id:"W",label:"Load",type:"num",def:"2000",unit:"W"},
            {id:"V",label:"Battery bank voltage",type:"num",def:"48",unit:"V DC",half:true},
            {id:"Ah",label:"Battery capacity",type:"num",def:"100",unit:"Ah",half:true},
            {id:"n",label:"Parallel strings",type:"num",def:"1",unit:"strings"},
            {id:"chem",label:"Battery type",type:"chips",def:"0.5",options:[["0.5","Lead-acid (50 % depth)"],["0.8","Lead-acid deep cycle (80 %)"],["0.9","Lithium (90 %)"]]},
            {id:"eff",label:"Inverter efficiency",type:"num",def:"90",unit:"%",adv:true},
            {id:"tt",label:"Target backup time",type:"num",def:"2",unit:"h",adv:true}
           ],
           calc(v){
            const W=num(v.W),V=num(v.V),Ah=num(v.Ah),n=num(v.n)||1,d=num(v.chem),e=num(v.eff)/100,tt=num(v.tt);
            if(!(W>0))return{hint:"Enter the load."};if(!(V>0&&Ah>0))return{hint:"Enter the battery voltage and capacity."};if(!(e>0&&e<=1))return{hint:"Efficiency must be between 1 and 100 %."};
            const Wh=V*Ah*n*d*e,h=Wh/W,need=tt>0?W*tt/(V*d*e):NaN;
            return{cap:"Backup time",value:h>=1?f(h,1):f(h*60,0),unit:h>=1?"hours":"minutes",
             say:`The bank stores ${f(V*Ah*n/1000,2)} kWh, of which about ${f(Wh/1000,2)} kWh is usable. At ${f(W)} W that lasts ${B(h>=1?f(h,1)+" h":f(h*60,0)+" min")}.`+(tt>0?` For ${f(tt)} h you need about ${B(f(need,0),"Ah")} at ${f(V)} V.`:""),
             rows:[["Usable energy",f(Wh/1000,2),"kWh"],["Battery current",f(W/e/V,1),"A"],["Ah for target time",f(need,0),"Ah"]]};
           },
           note:"Time = V × Ah × depth of discharge × efficiency ÷ load. Lead-acid gives less than this at high discharge rates (Peukert effect), so add 20–25 % for loads drawn over less than an hour."},

          {id:"lux",g:"elec",icon:"lux",name:"Lighting (lumen method)",short:"Number of light fittings for a room",
           intro:"Enter the room size, the light level you need and the fitting output.",
           fields:[
            {id:"L",label:"Length",type:"num",def:"10",unit:"m",half:true},
            {id:"W",label:"Width",type:"num",def:"6",unit:"m",half:true},
            {id:"E",label:"Light level needed",type:"num",def:"500",unit:"lux",presets:[["100","Corridor 100"],["200","Plant room 200"],["300","Workshop 300"],["500","Office / control room 500"]]},
            {id:"lm",label:"Lumens per fitting",type:"num",def:"3600",unit:"lm",half:true},
            {id:"w",label:"Watts per fitting",type:"num",def:"36",unit:"W",half:true},
            {id:"uf",label:"Utilisation factor",type:"num",def:"0.6",unit:"",adv:true},
            {id:"mf",label:"Maintenance factor",type:"num",def:"0.8",unit:"",adv:true}
           ],
           calc(v){
            const L=num(v.L),W=num(v.W),E=num(v.E),lm=num(v.lm),w=num(v.w)||0,uf=num(v.uf),mf=num(v.mf);
            if(!(L>0&&W>0))return{hint:"Enter the room length and width."};if(!(E>0&&lm>0))return{hint:"Enter the lux level and lumens per fitting."};if(!(uf>0&&mf>0))return{hint:"Check the utilisation and maintenance factors under More options."};
            const A=L*W,n=E*A/(lm*uf*mf),N=Math.ceil(n),Ea=N*lm*uf*mf/A;
            const cols=Math.max(1,Math.round(Math.sqrt(N*L/W))),rows=Math.ceil(N/cols);
            return{cap:"Fittings needed",value:N,unit:"fittings",
             say:`A ${f(L)} × ${f(W)} m room at ${f(E)} lux needs ${B(N+" fittings")} of ${f(lm)} lm. A grid of about ${cols} × ${rows} works, giving ${f(Ea,0)} lux.`,
             rows:[["Exact number",f(n,2),""],["Lux achieved",f(Ea,0),"lux"],["Lighting power",f(N*w,0),"W"],["Power density",f(N*w/A,1),"W/m²"]]};
           },
           note:"N = E × A ÷ (lumens × UF × MF). A UF of 0.5–0.7 suits most rooms with light ceilings. Use a lighting design program for final layouts."},

          {id:"fill",g:"elec",icon:"fill",name:"Conduit & tray fill",short:"Cable fill % against the limit",
           intro:"Enter the cables and the conduit or tray size.",
           fields:[
            {id:"mode",label:"Containment",type:"chips",def:"c",options:[["c","Conduit"],["t","Cable tray / trunking"]]},
            {id:"d",label:"Cable outside diameter",type:"num",def:"12",unit:"mm",half:true},
            {id:"n",label:"Number of cables",type:"num",def:"5",unit:"cables",half:true},
            {id:"id",label:"Conduit inside diameter",type:"num",def:"50",unit:"mm",show:v=>v.mode==="c"},
            {id:"tw",label:"Tray width",type:"num",def:"300",unit:"mm",half:true,show:v=>v.mode==="t"},
            {id:"td",label:"Usable depth",type:"num",def:"50",unit:"mm",half:true,show:v=>v.mode==="t"},
            {id:"lim",label:"Fill limit for tray",type:"num",def:"40",unit:"%",adv:true,show:v=>v.mode==="t"}
           ],
           calc(v){
            const d=num(v.d),n=Math.round(num(v.n));if(!(d>0&&n>0))return{hint:"Enter the cable diameter and number of cables."};
            const ca=n*Math.PI*d*d/4;let area,lim;
            if(v.mode==="c"){const id=num(v.id);if(!(id>0))return{hint:"Enter the conduit inside diameter."};area=Math.PI*id*id/4;lim=n===1?53:n===2?31:40;}
            else{const tw=num(v.tw),td=num(v.td);if(!(tw>0&&td>0))return{hint:"Enter the tray width and depth."};area=tw*td;lim=num(v.lim)||40;}
            const fill=ca/area*100,ok=fill<=lim;
            const maxN=Math.floor(area*lim/100/(Math.PI*d*d/4));
            return{cap:"Fill",value:f(fill,1),unit:"%",status:{ok,text:ok?`Within ${lim} % limit`:`Over ${lim} % limit`},
             say:`${n} cables of ${f(d)} mm fill ${B(f(fill,1),"%")} of the ${v.mode==="c"?"conduit":"tray"}. The limit is ${lim} %, so it can take up to ${B(maxN+" cables")} of this size.`,
             rows:[["Cable area",f(ca,0),"mm²"],["Space area",f(area,0),"mm²"],["Spare area",f(area*lim/100-ca,0),"mm²"]]};
           },
           note:"Conduit limits follow NEC Chapter 9: 53 % for 1 cable, 31 % for 2 and 40 % for 3 or more. Tray limits vary by project spec, so set yours under More options."},

          {id:"tray",g:"elec",icon:"tray",name:"Cable tray sizing",short:"Trefoil, flat or multicore power cables",
           intro:"Enter the cable size, how the cables are laid and how many circuits. You get the tray width, side height, bend radius and load to choose the tray.",
           fields:[
            {id:"arr",label:"Arrangement",type:"chips",def:"tre",options:[["tre","Single-core trefoil"],["flat","Single-core flat"],["mc","Multicore"]]},
            {id:"D",label:"Cable outside diameter",help:"From the cable datasheet. For example 1C 240 mm² XLPE/SWA about 32 mm.",type:"num",def:"32",unit:"mm",half:true},
            {id:"n",label:"Number of circuits",type:"num",def:"4",unitFrom:v=>v.arr==="mc"?"cables":"circuits",half:true},
            {id:"sp",label:"Gap between groups",help:"2 × D apart keeps grouping derating small (IEC 60364-5-52, method F/G). Touching needs a bigger cable.",type:"chips",def:"2",options:[["0","Touching"],["1","1 × D"],["2","2 × D"]]},
            {id:"spare",label:"Spare space for future cables",type:"num",def:"25",unit:"%"},
            {id:"ne",label:"Earth / other cables on the same tray",type:"num",def:"1",unit:"cables",half:true,adv:true},
            {id:"De",label:"Their outside diameter",type:"num",def:"20",unit:"mm",half:true,adv:true},
            {id:"edge",label:"Clearance to each side rail",type:"num",def:"25",unit:"mm",adv:true},
            {id:"kg",label:"Weight per cable",help:"From the cable datasheet.",type:"num",def:"3.1",unit:"kg/m",half:true,adv:true},
            {id:"rate",label:"Tray safe working load",help:"At your support span, from the tray catalogue.",type:"num",def:"",unit:"kg/m",half:true,adv:true}
           ],
           calc(v){
            const D=num(v.D),n=Math.round(num(v.n)),k=num(v.sp),spare=(num(v.spare)||0)/100,ne=Math.max(0,Math.round(num(v.ne)||0)),De=num(v.De)||0,edge=num(v.edge)||0,kg=num(v.kg)||0,rate=num(v.rate);
            if(!(D>0))return{hint:"Enter the cable outside diameter."};if(!(n>0))return{hint:"Enter the number of circuits."};
            const tre=v.arr==="tre",mc=v.arr==="mc",wg=tre?2*D:v.arr==="flat"?3*D:D,s=k*D,hg=tre?(1+Math.sqrt(3)/2)*D:D;
            const used=n*wg+(n-1)*s+(ne>0?ne*De+ne*Math.max(s,De*0.5):0),need=used*(1+spare)+2*edge;
            const STD=[100,150,200,300,400,450,500,600,750,900,1000,1200];
            const W=STD.find(x=>x>=need),fit=x=>Math.max(0,Math.floor((x-2*edge+s)/(wg+s)));
            const side=[50,75,100,125,150].find(x=>x>=hg+10)||150,bend=(mc?12:15)*D,cores=tre||v.arr==="flat"?3:1,load=(n*cores+ne)*kg;
            const der=k>=2?"small (about 0.94–1.0)":k>=1?"moderate":"large",tiers=W?1:Math.ceil(need/1200);
            const ew=ne>0?ne*De+ne*Math.max(s,De*0.5):0,fitS=x=>Math.max(0,Math.floor(((x-2*edge)/(1+spare)-ew+s)/(wg+s)));
            const rows=STD.filter(x=>x>=150&&x<=1200).map(x=>({cls:x===W?"sel":"",c:[x+" mm",Math.max(0,Math.floor((x-2*edge-ew+s)/(wg+s))),fitS(x)]}));
            return{cap:"Tray width",value:W?W:"> 1200",unit:"mm",status:isFinite(rate)&&rate>0?{ok:load<=rate,text:load<=rate?`Load ${f(load,0)} of ${f(rate,0)} kg/m`:"Tray overloaded"}:{ok:!!W,text:W?`${n} ${mc?"cables":"circuits"} fit`:"Use two trays or two tiers"},
             say:`${n} ${tre?"trefoil groups":v.arr==="flat"?"flat groups":"cables"} of ${f(D,0)} mm cable, ${k?f(k,0)+" × D apart":"touching"}, take ${B(f(used,0),"mm")} of width. With ${f(spare*100,0)} % spare and side clearance you need ${f(need,0)} mm, so use a ${B(W?W+" mm":"wider")} tray`+(W?` with side rails at least ${B(side+" mm")} high.`:`: split over ${tiers} tiers or trays.`)+` Grouping derating at this spacing is ${der}; check the cable rating with the Cable size tool.`+(tre?" Cleat each trefoil group to resist short-circuit forces (spacing per the cleat maker, often 1–1.5 m).":""),
             rows:[["Width used",f(used,0),"mm"],["Width needed with spare",f(need,0),"mm"],["Group width",f(wg,0),"mm"],["Layer height",f(hg,0),"mm"],["Minimum bend radius",f(bend,0),"mm"],["Cable load",f(load,1),"kg/m"]],
             after:tbl(["Tray width",mc?"Cables that fit":"Circuits that fit",`With ${f(spare*100,0)} % spare`],rows)};
           },
           note:"Trefoil group width 2D, height 1.87D; flat group 3D. Single layer only: do not stack power cables. Bend radius 15 × D for single-core and 12 × D for multicore XLPE (check the cable maker). Single-core cables need non-magnetic cleats and tray where the spec requires it."},
          {id:"pconv",g:"elec",icon:"pconv",name:"Power converter",short:"kW ↔ kVA ↔ amps",
           intro:"Enter one value and the supply. You get the others.",
           fields:[
            {id:"k",label:"What do you know?",type:"chips",def:"kw",options:[["kw","kW"],["kva","kVA"],["a","Amps"]]},
            {id:"x",label:"Value",type:"num",def:"15",unitFrom:v=>({kw:"kW",kva:"kVA",a:"A"})[v.k]},
            {id:"ph",label:"Supply",type:"chips",def:"3",options:[["3","3-phase AC"],["1","1-phase AC"],["dc","DC"]],onSet:v=>{v.V=v.ph==="3"?"415":v.ph==="1"?"230":"24";}},
            {id:"V",label:"Voltage",type:"num",def:"415",unit:"V"},
            {id:"pf",label:"Power factor",type:"num",def:"0.85",unit:"cos φ",show:v=>v.ph!=="dc"}
           ],
           calc(v){
            const x=num(v.x),V=num(v.V),pf=v.ph==="dc"?1:num(v.pf),k=v.ph==="3"?SQ3:1;
            if(!(x>0))return{hint:"Enter the value."};if(!(V>0))return{hint:"Enter the voltage."};if(!(pf>0&&pf<=1))return{hint:"Power factor must be between 0 and 1."};
            let kva=v.k==="kw"?x/pf:v.k==="kva"?x:k*V*x/1000;const kw=kva*pf,I=kva*1000/(k*V),kvar=Math.sqrt(Math.max(kva*kva-kw*kw,0));
            return{cap:v.k==="a"?"Real power":"Current",value:v.k==="a"?f(kw,2):f(I,1),unit:v.k==="a"?"kW":"A",
             say:`On ${f(V)} V ${v.ph==="dc"?"DC":v.ph+"-phase"}${v.ph==="dc"?"":` at ${f(pf,2)} power factor`}: ${B(f(kw,2),"kW")}, ${B(f(kva,2),"kVA")} and ${B(f(I,1),"A")}.`,
             rows:[["Real power",f(kw,2),"kW"],["Apparent power",f(kva,2),"kVA"],["Reactive power",f(kvar,2),"kVAr"],["Current",f(I,1),"A"],["Real power",f(kw/0.7457,2),"HP"]]};
           },
           note:"3-phase: kVA = √3 × V × I ÷ 1000. 1-phase: kVA = V × I ÷ 1000. kW = kVA × power factor."},

          {id:"cost",g:"elec",icon:"cost",name:"Energy cost",short:"kWh and running cost",
           intro:"Enter the power, running hours and your tariff.",
           fields:[
            {id:"kw",label:"Power",type:"num",def:"5",unit:"kW"},
            {id:"h",label:"Hours per day",type:"num",def:"10",unit:"h",half:true},
            {id:"d",label:"Days per month",type:"num",def:"30",unit:"days",half:true},
            {id:"cur",label:"Currency",type:"chips",def:"QAR",options:[["QAR","QAR"],["AED","AED"],["SAR","SAR"],["INR","INR"],["USD","USD"]]},
            {id:"t",label:"Tariff",help:"From your electricity bill.",type:"num",def:"0.3",unitFrom:v=>v.cur+"/kWh"},
            {id:"lf",label:"Average loading",help:"Below 100 % if it cycles or runs part-loaded.",type:"num",def:"100",unit:"%",adv:true}
           ],
           calc(v){
            const kw=num(v.kw),h=num(v.h),d=num(v.d),t=num(v.t),lf=(num(v.lf)||100)/100,c=v.cur;
            if(!(kw>0&&h>0&&d>0))return{hint:"Enter the power, hours and days."};if(!(t>=0))return{hint:"Enter your tariff."};
            const day=kw*h*lf,mon=day*d,yr=mon*12;
            return{cap:"Cost per month",value:f(mon*t,0),unit:c,
             say:`It uses ${B(f(mon,0),"kWh")} a month, which costs ${B(f(mon*t,0),c)} a month and ${B(f(yr*t,0),c)} a year.`,
             rows:[["Per day",f(day,1),"kWh"],["Per year",f(yr,0),"kWh"],["Cost per day",f(day*t,2),c],["Cost per year",f(yr*t,0),c]]};
           },
           note:"Energy = kW × hours × loading. Demand charges and slab tariffs are not included."}
          ,

          {id:"psy",g:"psy",icon:"psy",name:"Air properties",short:"RH, wet bulb, dew point, enthalpy",
           intro:"Enter the dry bulb temperature and one more reading. You get every property of the air, with its point on the chart.",
           fields:[
            {id:"t",label:"Dry bulb temperature",type:"num",def:"20",unit:"°C"},
            {id:"mode",label:"What else did you measure?",type:"chips",def:"rh",options:[["rh","Relative humidity"],["wb","Wet bulb"],["dp","Dew point"],["w","Moisture"]]},
            {id:"rh",label:"Relative humidity",type:"num",def:"50",unit:"%",show:v=>v.mode==="rh"},
            {id:"wb",label:"Wet bulb temperature",type:"num",def:"14",unit:"°C",show:v=>v.mode==="wb"},
            {id:"dp",label:"Dew point temperature",type:"num",def:"9",unit:"°C",show:v=>v.mode==="dp"},
            {id:"w",label:"Moisture content",type:"num",def:"7.3",unit:"g/kg",show:v=>v.mode==="w"},
            {id:"alt",label:"Site altitude",help:"Leave 0 for sites near sea level, like Ras Laffan or Kochi.",type:"num",def:"0",unit:"m",adv:true}
           ],
           calc(v){
            const t=num(v.t),p=PSY.p(num(v.alt)||0);
            if(!isFinite(t)||t<-40||t>90)return{hint:"Enter a dry bulb temperature between −40 and 90 °C."};
            let W;
            if(v.mode==="rh"){const rh=num(v.rh);if(!(rh>0&&rh<=100))return{hint:"Relative humidity must be between 0 and 100 %."};W=PSY.Wpw(PSY.pws(t)*rh/100,p);}
            else if(v.mode==="wb"){const tw=num(v.wb);if(!isFinite(tw))return{hint:"Enter the wet bulb temperature."};if(tw>t)return{hint:"Wet bulb can't be higher than dry bulb. Check the readings."};W=PSY.Wwb(t,tw,p);}
            else if(v.mode==="dp"){const td=num(v.dp);if(!isFinite(td))return{hint:"Enter the dew point temperature."};if(td>t)return{hint:"Dew point can't be higher than dry bulb. Check the readings."};W=PSY.Wpw(PSY.pws(td),p);}
            else{const g=num(v.w);if(!(g>=0))return{hint:"Enter the moisture content in grams per kg of dry air."};W=g/1000;}
            if(!(W>=0))return{hint:"This air is too dry for these readings. Check the numbers."};
            if(W>PSY.Wpw(PSY.pws(t),p)*1.0005)return{hint:"That is more moisture than air can hold at this temperature (over 100 % RH). Check the readings."};
            const S=PSY.state(t,W,p);
            return{cap:"Enthalpy",value:f(S.h,2),unit:"kJ/kg",
             say:`At ${f(t,1)} °C and ${f(S.rh,0)} % RH, each kg of air holds ${B(g1(W),"g")} of water. Any surface colder than ${B(f(S.td,1),"°C")} will sweat.`,
             rows:psyRows(S),after:psyChart([{S,label:"Air"}],[],p)};
           },
           note:"Calculated with ASHRAE psychrometric equations. Site altitude changes air pressure and is under More options."},

          {id:"mix",g:"psy",icon:"mix",name:"Air mixing",short:"Fresh air + return air mix",
           intro:"Enter the two air streams that mix, for example return air and fresh air going into an AHU.",
           fields:[
            {id:"q1",label:"Return air flow",type:"num",def:"8000",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"t1",label:"Return air temperature",type:"num",def:"24",unit:"°C",half:true},
            {id:"r1",label:"Return air RH",type:"num",def:"50",unit:"%",half:true},
            {id:"q2",label:"Fresh air flow",type:"num",def:"2000",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"t2",label:"Fresh air temperature",type:"num",def:"46",unit:"°C",half:true},
            {id:"r2",label:"Fresh air RH",type:"num",def:"30",unit:"%",half:true},
            {id:"alt",label:"Site altitude",type:"num",def:"0",unit:"m",adv:true}
           ],
           calc(v){
            const p=PSY.p(num(v.alt)||0),Q1=num(v.q1)*(AIRF[v.q1_u]||AIRF["m³/h"]),Q2=num(v.q2)*(AIRF[v.q2_u]||AIRF["m³/h"]);
            const t1=num(v.t1),r1=num(v.r1),t2=num(v.t2),r2=num(v.r2);
            if(!(Q1>=0&&Q2>=0&&Q1+Q2>0))return{hint:"Enter the two airflows."};
            if(!isFinite(t1)||!isFinite(t2))return{hint:"Enter both air temperatures."};
            if(!(r1>0&&r1<=100&&r2>0&&r2<=100))return{hint:"Both RH values must be between 0 and 100 %."};
            const A=PSY.fromRH(t1,r1,p),C=PSY.fromRH(t2,r2,p),m1=Q1/A.v,m2=Q2/C.v,m=m1+m2;
            const W=(m1*A.W+m2*C.W)/m,h=(m1*A.h+m2*C.h)/m,M=PSY.state(PSY.tHW(h,W),W,p);
            const fresh=Q2/(Q1+Q2)*100;
            return{cap:"Mixed air temperature",value:f(M.t,1),unit:"°C",
             say:`The mixed air going to the coil is ${B(f(M.t,1),"°C")} at ${B(f(M.rh,0),"% RH")}. Fresh air is ${f(fresh,0)} % of the total airflow.`,
             rows:[["Mixed RH",f(M.rh,1),"%"],["Mixed wet bulb",f(M.tw,1),"°C"],["Mixed dew point",f(M.td,1),"°C"],["Mixed enthalpy",f(M.h,2),"kJ/kg"],["Moisture",g1(M.W),"g/kg"],["Total airflow",f(m*M.v*3600,0),"m³/h"]],
             after:psyChart([{S:A,label:"Return",pos:"l"},{S:C,label:"Fresh",pos:"l"},{S:M,label:"Mix",pos:"b"}],[[0,1]],p)};
           },
           note:"Mixed by mass of dry air, so the result is exact, not a simple average."},

          {id:"proc",g:"psy",icon:"proc",name:"Coil load",short:"Total, sensible and latent kW",
           intro:"Enter the airflow and the air before and after a coil. You get the full cooling or heating load and the water condensed.",
           fields:[
            {id:"q",label:"Airflow through coil",type:"num",def:"3000",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"t1",label:"Air in: temperature",type:"num",def:"26",unit:"°C",half:true},
            {id:"r1",label:"Air in: RH",type:"num",def:"55",unit:"%",half:true},
            {id:"t2",label:"Air out: temperature",type:"num",def:"13",unit:"°C",half:true},
            {id:"r2",label:"Air out: RH",type:"num",def:"95",unit:"%",half:true},
            {id:"alt",label:"Site altitude",type:"num",def:"0",unit:"m",adv:true}
           ],
           calc(v){
            const p=PSY.p(num(v.alt)||0),Q=num(v.q)*(AIRF[v.q_u]||AIRF["m³/h"]);
            const t1=num(v.t1),r1=num(v.r1),t2=num(v.t2),r2=num(v.r2);
            if(!(Q>0))return{hint:"Enter the airflow through the coil."};
            if(!isFinite(t1)||!isFinite(t2))return{hint:"Enter the air temperature in and out."};
            if(!(r1>0&&r1<=100&&r2>0&&r2<=100))return{hint:"Both RH values must be between 0 and 100 %."};
            const A=PSY.fromRH(t1,r1,p),C=PSY.fromRH(t2,r2,p),m=Q/A.v;
            const tot=m*(A.h-C.h),sen=m*(1.006+1.86*A.W)*(t1-t2),lat=tot-sen,water=m*(A.W-C.W)*3600;
            const chart=psyChart([{S:A,label:"In",pos:"l"},{S:C,label:"Out"}],[[0,1]],p);
            if(Math.abs(tot)<0.01)return{hint:"Air in and air out are the same, so there is no load."};
            if(tot>0){
             const wet=water>0.05;
             return{cap:"Total cooling load",value:f(tot,1),unit:"kW",
              say:`This coil removes ${B(f(tot,1),"kW")} (${f(tot/3.51685,2)} TR): ${f(sen,1)} kW sensible and ${f(lat,1)} kW latent.${wet?` It condenses about ${B(f(water,1),"litres")} of water per hour, so the drain pan must work.`:` No water is condensed.`}`,
              rows:[["Sensible",f(sen,1),"kW"],["Latent",f(lat,1),"kW"],["Sensible heat ratio",f(sen/tot,2),""],["Condensate",f(Math.max(water,0),1),"L/h"],["Air out dew point",f(C.td,1),"°C"],["Air in enthalpy",f(A.h,1),"kJ/kg"],["Air out enthalpy",f(C.h,1),"kJ/kg"]],after:chart};
            }
            const drier=water>0.05,wetter=water<-0.05;
            return{cap:"Total heating load",value:f(-tot,1),unit:"kW",
             status:drier?{ok:false,text:"Check the RH readings"}:null,
             say:`This coil adds ${B(f(-tot,1),"kW")} of heat to the air.`+(wetter?` Moisture is also added: about ${f(-water,1)} litres of water per hour.`:"")+(drier?` But the air out is drier than the air in. A heating coil alone can't remove moisture, so one of the RH readings is probably wrong. With no moisture change, the heat would be ${B(f(m*(1.006+1.86*A.W)*(t2-t1),1),"kW")}.`:""),
             rows:[["Air in enthalpy",f(A.h,1),"kJ/kg"],["Air out enthalpy",f(C.h,1),"kJ/kg"],["Moisture in",g1(A.W),"g/kg"],["Moisture out",g1(C.W),"g/kg"]],after:chart};
           },
           note:"Use the airflow measured at the coil inlet. Water condensed is in litres per hour (1 kg = 1 litre)."},

          {id:"dew",g:"psy",icon:"dew",name:"Sweating check",short:"Will a pipe or duct condense?",
           intro:"Enter the room air and the surface temperature. Find out if a pipe, duct or wall will sweat.",
           fields:[
            {id:"t",label:"Air temperature",type:"num",def:"30",unit:"°C",half:true},
            {id:"rh",label:"Air RH",type:"num",def:"70",unit:"%",half:true},
            {id:"s",label:"Surface temperature",type:"num",def:"13",unit:"°C",presets:[["7","Chilled water pipe 7"],["13","Supply duct 13"],["18","Diffuser 18"],["24","Cooled wall 24"]]},
            {id:"alt",label:"Site altitude",type:"num",def:"0",unit:"m",adv:true}
           ],
           calc(v){
            const t=num(v.t),rh=num(v.rh),ts=num(v.s),p=PSY.p(num(v.alt)||0);
            if(!isFinite(t))return{hint:"Enter the air temperature."};
            if(!(rh>0&&rh<=100))return{hint:"RH must be between 0 and 100 %."};
            if(!isFinite(ts))return{hint:"Enter the surface temperature."};
            const S=PSY.fromRH(t,rh,p),mg=ts-S.td;
            const st=mg<=0?{ok:false,text:"Will sweat"}:mg<2?{ok:false,text:"High risk of sweating"}:{ok:true,text:"Safe, no sweating"};
            return{cap:"Dew point of the air",value:f(S.td,1),unit:"°C",status:st,
             say:mg<=0?`The surface at ${f(ts,1)} °C is ${B(f(-mg,1),"°C")} below the dew point, so water will form on it. Insulate it with a vapour barrier, or dry the air.`
               :mg<2?`The surface is only ${B(f(mg,1),"°C")} above the dew point. A small rise in humidity will make it sweat. Insulation is recommended.`
               :`The surface is ${B(f(mg,1),"°C")} above the dew point, so it will stay dry.`,
             rows:[["Safety margin",f(mg,1),"°C"],["Wet bulb",f(S.tw,1),"°C"],["Moisture",g1(S.W),"g/kg"]]};
           },

           note:"Keep at least 2 °C between surface and dew point. Humid sites like Ras Laffan in summer can reach dew points above 28 °C."},

          {id:"pt",g:"ref",icon:"pt",name:"Pressure–temperature",short:"Gauge reading to saturation temp",
           intro:"Pick the refrigerant and enter a gauge pressure or a temperature. A full pressure–temperature chart is shown below.",
           fields:[
            {id:"ref",label:"Refrigerant",type:"chips",def:"R410A",options:REFOPTS},
            {id:"mode",label:"What do you have?",type:"chips",def:"p",options:[["p","A gauge pressure"],["t","A temperature"]]},
            {id:"pu",label:"Pressure unit",type:"chips",def:"bar g",options:Object.keys(GAUGE).map(u=>[u,u])},
            {id:"P",label:"Gauge pressure",type:"num",def:"8.5",unitFrom:v=>v.pu,show:v=>v.mode==="p"},
            {id:"T",label:"Saturation temperature",type:"num",def:"5",unit:"°C",show:v=>v.mode==="t"}
           ],
           calc(v){
            const k=v.ref,r=REF[k],bl=isBlend(k),pu=GAUGE[v.pu]?v.pu:"bar g",tbl=ptTable(k,pu);
            if(v.mode==="p"){
             const pv=num(v.P);if(!isFinite(pv))return{hint:"Enter the gauge pressure.",after:tbl};
             const P=toAbs(pv,pu),tb=refT(k,P,"b"),td=refT(k,P,"d");
             if(!isFinite(tb)||!isFinite(td))return{hint:`That pressure is outside the −40 to 65 °C range for ${r.n}. Check the gauge and the unit.`,after:tbl};
             const lbl=`${f(pv,2)} ${pu}`;
             if(!bl)return{cap:"Saturation temperature",value:f(td,1),unit:"°C",say:`At ${lbl}, ${r.n} boils and condenses at ${B(f(td,1),"°C")}.`,rows:[["Absolute pressure",f(P,2),"bar a"],["In psig",f((P-PATM)/0.0689476,1),"psig"]],after:tbl};
             return{cap:"Dew temperature (vapour)",value:f(td,1),unit:"°C",
              say:`At ${lbl}, ${r.n} starts to boil at ${B(f(tb,1),"°C")} (bubble) and is all vapour at ${B(f(td,1),"°C")} (dew). Use the dew value for superheat and the bubble value for subcooling.`,
              rows:[["Bubble temperature (liquid)",f(tb,1),"°C"],["Temperature glide",f(td-tb,1),"K"],["Absolute pressure",f(P,2),"bar a"]],after:tbl};
            }
            const T=num(v.T);if(!isFinite(T))return{hint:"Enter the temperature.",after:tbl};
            const pb=refP(k,T,"b"),pd=refP(k,T,"d");
            if(!isFinite(pb))return{hint:`Enter a temperature between −40 and 65 °C for ${r.n}.`,after:tbl};
            const fac=GAUGE[pu],g=x=>f((x-PATM)/fac,2);
            if(!bl)return{cap:"Gauge pressure",value:g(pb),unit:pu,say:`To boil or condense at ${f(T,1)} °C, ${r.n} must be at ${B(g(pb),pu)}.`,rows:[["Absolute pressure",f(pb,2),"bar a"],["In psig",f((pb-PATM)/0.0689476,1),"psig"]],after:tbl};
            return{cap:"Dew pressure (vapour)",value:g(pd),unit:pu,
             say:`At ${f(T,1)} °C, ${r.n} reads ${B(g(pd),pu)} on the vapour side (dew) and ${B(g(pb),pu)} on the liquid side (bubble).`,
             rows:[["Bubble pressure (liquid)",g(pb),pu],["Dew pressure",f(pd,2),"bar a"]],after:tbl};
           },
           note:"Data: NIST for pure refrigerants and manufacturer property tables for R-410A, R-407C and R-404A. Gauge readings assume sea-level air pressure."},

          {id:"slide",g:"ref",icon:"slide",name:"P/T slider",short:"Drag temperature, read pressure",
           intro:"Drag the slider to any saturation temperature and the gauge pressure follows. Use − and + for 0.5 °C steps.",
           fields:[
            {id:"ref",label:"Refrigerant",type:"chips",def:"R410A",options:REFOPTS},
            {id:"pu",label:"Pressure unit",type:"chips",def:"bar g",options:Object.keys(GAUGE).map(u=>[u,u])}
           ],
           calc(v){
            const k=v.ref,r=REF[k],bl=isBlend(k),pu=GAUGE[v.pu]?v.pu:"bar g",fac=GAUGE[pu];
            const T=slideT(v),pb=refP(k,T,"b"),pd=bl?refP(k,T,"d"):pb,g=x=>f((x-PATM)/fac,fac<0.05?0:2);
            const vac=pd<PATM?" That is below atmospheric pressure, so the gauge shows vacuum.":"";
            const after=slideHTML(k,pu,T);
            if(!bl)return{cap:`${r.n} at ${f(T,1)} °C`,value:g(pb),unit:pu,
             say:`At ${B(f(T,1),"°C")}, ${r.n} boils and condenses at ${B(g(pb),pu)}.${vac}`,
             rows:[["Absolute",f(pb,2),"bar a"],["psig",f((pb-PATM)/0.0689476,1),"psig"],["kPa g",f((pb-PATM)*100,0),"kPa g"]],after};
            return{cap:`${r.n} at ${f(T,1)} °C`,value:g(pd),unit:pu,
             say:`At ${B(f(T,1),"°C")}, ${r.n} reads ${B(g(pd),pu)} as vapour (dew) and ${B(g(pb),pu)} as liquid (bubble). Use dew for superheat and bubble for subcooling.${vac}`,
             rows:[["Dew (vapour)",g(pd),pu],["Bubble (liquid)",g(pb),pu],["Glide at dew pressure",f(T-refT(k,pd,"b"),1),"K"]],after};
           },
           bind(af,st){
            const R=af.querySelector("#slR"),lab=af.querySelector("#slT");if(!R)return;
            const upd=x=>{const T=Math.min(65,Math.max(-40,Math.round(x*2)/2));st.ts=String(T);save();R.value=T;lab.textContent=f(T,1);
             document.getElementById("ans").innerHTML=ansHTML(byId("slide").calc(st));};
            R.addEventListener("input",()=>upd(+R.value));
            af.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>upd(slideT(st)+ +b.dataset.step));
           },
           note:"Range −40 to 65 °C. Same property data as the Pressure–temperature tool. Gauge readings assume sea-level air pressure."},

          {id:"sh",g:"ref",icon:"sh",name:"Superheat",short:"Suction pressure + line temp",
           intro:"Measure suction pressure at the service port and the suction line temperature near the evaporator outlet or compressor.",
           fields:[
            {id:"ref",label:"Refrigerant",type:"chips",def:"R410A",options:REFOPTS},
            {id:"P",label:"Suction pressure",type:"num",def:"8.5",units:Object.keys(GAUGE),udef:"bar g"},
            {id:"T",label:"Suction line temperature",help:"Clamp the probe on bare pipe and insulate over it.",type:"num",def:"12",unit:"°C"}
           ],
           calc(v){
            const k=v.ref,pv=num(v.P),Tl=num(v.T);
            if(!isFinite(pv))return{hint:"Enter the suction pressure."};if(!isFinite(Tl))return{hint:"Enter the suction line temperature."};
            const P=toAbs(pv,v.P_u),Te=refT(k,P,"d");
            if(!isFinite(Te))return{hint:`That suction pressure is outside the −40 to 65 °C range for ${REF[k].n}. Check the gauge and unit.`};
            const SH=Tl-Te,st=shState(SH);
            if(SH<-1)return{hint:`The line is ${f(-SH,1)} K colder than the boiling temperature (${f(Te,1)} °C), which is not possible. Check the probe position, the pressure reading and the refrigerant type.`};
            const msg=SH<2?"Liquid refrigerant may be reaching the compressor. Check for overcharge, TXV overfeeding or low evaporator airflow."
             :SH<4?"On the low side. Watch for liquid floodback, especially on fixed-orifice systems."
             :SH<=12?"This is a normal range for most systems. TXV systems usually run 5 to 8 K at the evaporator outlet."
             :"The evaporator is starved of refrigerant. Common causes are low charge, a restriction or a TXV that is underfeeding.";
            return{cap:"Superheat",value:f(Math.max(SH,0),1),unit:"K",status:st,
             say:`Refrigerant boils at ${B(f(Te,1),"°C")} and the suction line is ${f(Tl,1)} °C, so superheat is ${B(f(Math.max(SH,0),1),"K")}. ${msg}`,
             rows:[["Evaporating temperature",f(Te,1),"°C"],["Suction pressure",f(P,2),"bar a"]]};
           },
           note:"For R-407C and other blends, the dew temperature is used, which is correct for superheat. 1 K = 1 °C difference."},

          {id:"sc",g:"ref",icon:"sc",name:"Subcooling",short:"Liquid pressure + liquid line temp",
           intro:"Measure the liquid line pressure (or discharge pressure) and the liquid line temperature near the condenser outlet.",
           fields:[
            {id:"ref",label:"Refrigerant",type:"chips",def:"R410A",options:REFOPTS},
            {id:"P",label:"Liquid line pressure",type:"num",def:"26",units:Object.keys(GAUGE),udef:"bar g"},
            {id:"T",label:"Liquid line temperature",type:"num",def:"40",unit:"°C"}
           ],
           calc(v){
            const k=v.ref,pv=num(v.P),Tl=num(v.T);
            if(!isFinite(pv))return{hint:"Enter the liquid line pressure."};if(!isFinite(Tl))return{hint:"Enter the liquid line temperature."};
            const P=toAbs(pv,v.P_u),Tc=refT(k,P,"b");
            if(!isFinite(Tc))return{hint:`That pressure is outside the −40 to 65 °C range for ${REF[k].n}. Check the gauge and unit.`};
            const SC=Tc-Tl,st=scState(SC);
            if(SC<-1)return{hint:`The liquid line is ${f(-SC,1)} K hotter than the condensing temperature (${f(Tc,1)} °C), which is not possible. Check the probe, the gauge and the refrigerant type.`};
            const msg=SC<1?"There is no liquid seal, so flash gas may reach the expansion valve. This usually means low charge."
             :SC<3?"On the low side. This may point to a slight undercharge."
             :SC<=10?"This is a normal range for most systems. Many TXV units target 4 to 6 K, but check the unit's label."
             :"Too much liquid is backing up in the condenser. Common causes are overcharge or a restriction after the measuring point.";
            return{cap:"Subcooling",value:f(Math.max(SC,0),1),unit:"K",status:st,
             say:`Refrigerant condenses at ${B(f(Tc,1),"°C")} and the liquid line is ${f(Tl,1)} °C, so subcooling is ${B(f(Math.max(SC,0),1),"K")}. ${msg}`,
             rows:[["Condensing temperature",f(Tc,1),"°C"],["Liquid pressure",f(P,2),"bar a"]]};
           },
           note:"For blends, the bubble temperature is used, which is correct for subcooling."},

          {id:"chg",g:"ref",icon:"chg",name:"Charge check",short:"Diagnose charge from 4 readings",
           intro:"Enter suction and liquid readings and the outdoor temperature. You get superheat, subcooling and the most likely problem.",
           fields:[
            {id:"ref",label:"Refrigerant",type:"chips",def:"R410A",options:REFOPTS},
            {id:"meter",label:"Expansion device",type:"chips",def:"txv",options:[["txv","TXV / EEV"],["fixed","Fixed orifice / capillary"]]},
            {id:"Ps",label:"Suction pressure",type:"num",def:"8.5",units:Object.keys(GAUGE),udef:"bar g"},
            {id:"Ts",label:"Suction line temperature",type:"num",def:"12",unit:"°C"},
            {id:"Pl",label:"Liquid line pressure",type:"num",def:"26",units:Object.keys(GAUGE),udef:"bar g"},
            {id:"Tl",label:"Liquid line temperature",type:"num",def:"40",unit:"°C"},
            {id:"amb",label:"Outdoor air temperature",help:"Air entering the condenser.",type:"num",def:"35",unit:"°C"},
            {id:"tsc",label:"Target subcooling",help:"From the unit's label or charging chart.",type:"num",def:"5",unit:"K",adv:true,show:v=>v.meter==="txv"},
            {id:"tsh",label:"Target superheat",help:"From the unit's charging chart (depends on indoor wet bulb and outdoor temperature).",type:"num",def:"10",unit:"K",adv:true,show:v=>v.meter==="fixed"}
           ],
           calc(v){
            const k=v.ref,ps=num(v.Ps),ts=num(v.Ts),pl=num(v.Pl),tl=num(v.Tl),amb=num(v.amb);
            if(![ps,ts,pl,tl].every(isFinite))return{hint:"Enter all four readings: suction pressure and temperature, liquid pressure and temperature."};
            const Te=refT(k,toAbs(ps,v.Ps_u),"d"),Tc=refT(k,toAbs(pl,v.Pl_u),"b");
            if(!isFinite(Te)||!isFinite(Tc))return{hint:`A pressure is outside the −40 to 65 °C range for ${REF[k].n}. Check the gauges, units and refrigerant type.`};
            const SH=ts-Te,SC=Tc-tl;
            if(SH<-1||SC<-1)return{hint:"A temperature reading is impossible for these pressures. Check probe positions, gauge units and the refrigerant type."};
            if(Tc<=Te)return{hint:"The liquid pressure must be higher than the suction pressure. Check which gauge is which."};
            let dx,ok=false,more=[];
            if(v.meter==="txv"){const t=num(v.tsc)||5;
             if(SC<t-2&&SH>10)dx="Low charge, probably a leak";
             else if(SC>t+4&&SH>10)dx="Liquid line restriction or TXV starving";
             else if(SC>t+4)dx="Overcharged";
             else if(SH<3)dx="TXV overfeeding or low indoor airflow";
             else if(SH>12)dx="TXV underfeeding";
             else{dx="Charge looks correct";ok=true;}
            }else{const t=num(v.tsh)||10;
             if(SH>t+5&&SC<4)dx="Low charge, probably a leak";
             else if(SH>t+5)dx="Underfeeding: low charge or a restriction";
             else if(SH<t-5&&SC>8)dx="Overcharged";
             else if(SH<t-5)dx="Low indoor airflow or overcharge";
             else{dx="Charge looks correct";ok=true;}
            }
            const why={"Low charge, probably a leak":"High superheat with low subcooling means not enough refrigerant. Find and fix the leak before adding any refrigerant.",
             "Liquid line restriction or TXV starving":"Liquid is backing up and the evaporator is starved. Check the filter drier (temperature drop across it), the sight glass and the TXV bulb.",
             "Overcharged":"High subcooling with normal or low superheat means too much refrigerant. Recover some charge and recheck.",
             "TXV overfeeding or low indoor airflow":"Very low superheat risks liquid reaching the compressor. Check the indoor filter, fan and coil first, then the TXV bulb mounting and setting.",
             "TXV underfeeding":"Superheat is high but subcooling is fine, so the charge is OK. Check the TXV bulb, the setting, or a blocked TXV strainer.",
             "Underfeeding: low charge or a restriction":"Superheat is high. If subcooling is normal, look for a restriction at the orifice or strainer.",
             "Low indoor airflow or overcharge":"Superheat is low. Check the indoor filter, fan speed and coil before removing any refrigerant.",
             "Charge looks correct":"Superheat and subcooling are both in range for this type of system."}[dx];
            if(isFinite(amb)){const ap=Tc-amb;
             if(ap>20)more.push(`Condensing temperature is ${f(ap,0)} K above outdoor air, which is high. Check the condenser coil, condenser fan, overcharge or non-condensable gas.`);
             else if(ap<5)more.push(`Condensing temperature is only ${f(ap,0)} K above outdoor air. That usually means low charge or a compressor that is not pumping.`);}
            if(Te<0&&["R410A","R32","R22","R407C"].includes(k))more.push(`Evaporating temperature is ${f(Te,1)} °C. On an air-conditioning coil this will freeze it. Check airflow and charge.`);
            if(more.length)ok=false;
            return{cap:"Most likely",big:dx,status:{ok,text:ok?"No problem found":"Needs attention"},
             say:why+(more.length?`<ul class="more-list">${more.map(m=>`<li>${m}</li>`).join("")}</ul>`:""),
             rows:[["Superheat",f(Math.max(SH,0),1),"K"],["Subcooling",f(Math.max(SC,0),1),"K"],["Evaporating",f(Te,1),"°C"],["Condensing",f(Tc,1),"°C"],...(isFinite(amb)?[["Condenser approach",f(Tc-amb,1),"K"]]:[])]};
           },
           note:"Field guide only. Always confirm with the manufacturer's charging chart, and repair leaks before adding refrigerant."},

          {id:"fix",g:"hidden",icon:"fix",name:"Troubleshooter",short:"Symptom to cause to fix",
           intro:"Pick what you see on the system. You get the likely causes, most common first, with what to check and how to fix each one.",
           fields:[
            {id:"s",label:"What is the symptom?",type:"select",def:"lowsuc",options:Object.keys(FAULTS).map(k=>[k,FAULTS[k].n])}
           ],
           calc(v){
            const F=FAULTS[v.s]||FAULTS.lowsuc;
            const list=`<div class="card"><div class="lbl">Likely causes, most common first</div><ol class="causes">${F.c.map(c=>`<li><b>${c[0]}</b><p><span>Check</span>${c[1]}</p><p><span>Fix</span>${c[2]}</p></li>`).join("")}</ol>${F.go?`<button type="button" class="golink" data-goto="${F.go[0]}">${F.go[1]} →</button>`:""}</div>`;
            return{cap:"Symptom",big:F.n,say:F.d,rows:[["Causes to check",String(F.c.length),""],["Start with",F.c[0][0],""]],after:list};
           },
           bind(af){af.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{view=b.dataset.goto;render();window.scrollTo(0,0);});},
           note:"Field guide only. Isolate power before electrical checks, recover refrigerant before opening the circuit, and follow the manufacturer's service data."},
          /* ===== TAB & commissioning ===== */
          {id:"trav",g:"tab",icon:"trav",name:"Pitot traverse",short:"Duct airflow from velocity pressure",
           intro:"Enter the duct size to get the test points, then type your readings in order. Airflow is worked out by the log-Tchebycheff method.",
           fields:[
            {id:"shape",label:"Duct shape",type:"chips",def:"rect",options:[["rect","Rectangular"],["round","Round"]]},
            {id:"W",label:"Width",type:"num",def:"600",unit:"mm",half:true,show:v=>v.shape==="rect"},
            {id:"H",label:"Height",type:"num",def:"400",unit:"mm",half:true,show:v=>v.shape==="rect"},
            {id:"D",label:"Diameter",type:"num",def:"400",unit:"mm",show:v=>v.shape==="round"},
            {id:"mode",label:"Readings are",type:"chips",def:"pv",options:[["pv","Velocity pressure (Pa)"],["v","Velocity (m/s)"]]},
            {id:"r",label:"Readings",help:"Type every point in order, separated by spaces or commas.",type:"text",def:"18 21 22 20 17 20 23 24 22 19 21 24 25 23 20 19 22 23 21 18 16 19 20 18 15"},
            {id:"T",label:"Air temperature in duct",type:"num",def:"14",unit:"°C",half:true},
            {id:"Qd",label:"Design airflow",type:"num",def:"5000",units:["m³/h","CFM","L/s"],udef:"m³/h"}
           ],
           calc(v){
            let A,rows,cols,depths,pos;
            if(v.shape==="round"){const D=num(v.D);if(!(D>0))return{hint:"Enter the duct diameter."};const n=nRoundP(D);A=Math.PI*D*D/4e6;rows=2;cols=n;depths=LRD[n].map(x=>x*D);}
            else{const W=num(v.W),H=num(v.H);if(!(W>0&&H>0))return{hint:"Enter the duct width and height."};cols=nRectP(W);rows=nRectP(H);A=W*H/1e6;pos=LTR[cols].map(x=>x*W);depths=LTR[rows].map(x=>x*H);}
            const N=rows*cols,T=num(v.T),rho=isFinite(T)?1.2041*293.15/(273.15+T):1.2,r=numsOf(v.r);
            const geo=v.shape==="round"?tbl(["Point","Depth from wall (mm)"],depths.map((d,i)=>[i+1,f(d,0)])):
             tbl(["","Position (mm)"],[...pos.map((p,i)=>["Hole "+(i+1)+" across width",f(p,0)]),...depths.map((d,i)=>["Depth "+(i+1)+" into duct",f(d,0)])]);
            const need=`${N} points: ${v.shape==="round"?`2 holes 90° apart × ${cols} depths`:`${cols} holes × ${rows} depths`}`;
            if(!r.length)return{hint:`Enter your readings. You need ${need}.`,after:geo};
            const vs=r.map(x=>v.mode==="pv"?(x>0?Math.sqrt(2*x/rho):0):Math.max(0,x)),neg=r.filter(x=>x<=0).length;
            const va=vs.reduce((a,b)=>a+b,0)/vs.length,Q=va*A,Qd=airQ(v,"Qd"),pct=Q/Qd*100;
            return{cap:"Measured airflow",value:f(Q*3600,0),unit:"m³/h",status:r.length===N?{ok:Math.abs(pct-100)<=10||!isFinite(pct),text:isFinite(pct)?`${f(pct,0)} % of design`:"Complete"}:{ok:false,text:`${r.length} of ${N} points entered`},
             say:`Average velocity ${B(f(va,2),"m/s")} over ${f(A,3)} m² gives ${B(f(Q*1000,0),"L/s")} (${f(Q*2118.88,0)} CFM).`+(isFinite(pct)?` That is ${B(f(pct,0),"%")} of design.`:"")+(neg?` ${neg} point(s) read zero or negative: swirl or reverse flow there, note it in the report.`:"")+(r.length!==N?` You need ${need}.`:""),
             rows:[["Airflow",f(Q*1000,0),"L/s"],["Airflow",f(Q*2118.88,0),"CFM"],["Average velocity",f(va,2),"m/s"],["Air density used",f(rho,3),"kg/m³"],["Points",`${r.length} / ${N}`,""]],after:geo};
           },
           note:"Average √Pv, not Pv. Choose a straight run about 7.5 diameters after and 3 before any fitting. Velocity = √(2 Pv ÷ ρ)."},

          {id:"bal",g:"tab",icon:"bal",name:"Terminal balancing",short:"Proportional method: % and targets",
           intro:"Enter design and measured airflow for each terminal in the same order. You get each terminal's % of design, the index terminal and the reading to set the others to.",
           fields:[
            {id:"d",label:"Design airflow for each terminal",help:"Same unit for both lists, separated by spaces or commas.",type:"text",def:"300 300 250 250 200 200"},
            {id:"m",label:"Measured airflow for each terminal",type:"text",def:"340 320 230 260 170 210"},
            {id:"tol",label:"Terminal tolerance",type:"num",def:"10",unit:"± %",adv:true}
           ],
           calc(v){
            const d=numsOf(v.d),m=numsOf(v.m),tol=num(v.tol)||10;
            if(!d.length)return{hint:"Enter the design airflow for each terminal."};if(m.length!==d.length)return{hint:`Enter ${d.length} measured readings, one for each design value. You have ${m.length}.`};
            const p=m.map((x,i)=>x/d[i]*100),ix=p.indexOf(Math.min(...p)),pi=p[ix],tD=d.reduce((a,b)=>a+b,0),tM=m.reduce((a,b)=>a+b,0),out=p.filter(x=>Math.abs(x-100)>tol).length;
            const rows=d.map((x,i)=>({cls:i===ix?"sel":"",c:[i+1,f(x,0),f(m[i],0),f(p[i],0)+" %",i===ix?"Index: leave open":f(x*pi/100,0),Math.abs(p[i]-100)<=tol?"OK":"Adjust"]}));
            return{cap:"Index terminal",value:"#"+(ix+1),unit:`${f(pi,0)} % of design`,status:{ok:out===0,text:out?`${out} terminal(s) outside ±${tol} %`:"All within tolerance"},
             say:`Total is ${B(f(tM/tD*100,0),"%")} of design. Terminal ${ix+1} is the index (lowest %), so leave its damper open and set each other terminal to the target in the table, so all read about ${f(pi,0)} %. Then raise the fan until they all reach 100 %.`+(tM/tD<1?" The fan total is below design, so fix the fan first.":""),
             rows:[["Total design",f(tD,0),""],["Total measured",f(tM,0),""],["Total % of design",f(tM/tD*100,1),"%"]],
             after:tbl(["#","Design","Measured","% design","Set to","Status"],rows)};
           },
           note:"Proportional balancing (NEBB / AABC): set every terminal to the same % as the index, then adjust the fan. Typical tolerance ±10 % per terminal, 0 to +10 % for the total."},

          {id:"fanlaw",g:"tab",icon:"fanlaw",name:"Fan laws",short:"New flow, pressure and power with speed",
           intro:"Enter what the fan does now and the new speed, or the airflow you need. You get the new speed, pressure, power and pulley size.",
           fields:[
            {id:"mode",label:"What do you know?",type:"chips",def:"q",options:[["q","Airflow I need"],["n","The new speed"]]},
            {id:"Q1",label:"Airflow now",type:"num",def:"4200",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"P1",label:"Static pressure now",type:"num",def:"350",unit:"Pa",half:true},
            {id:"W1",label:"Motor power now",type:"num",def:"3.2",unit:"kW",half:true},
            {id:"N1",label:"Fan speed now",type:"num",def:"950",unit:"rpm"},
            {id:"Q2",label:"Airflow needed",type:"num",def:"5000",units:["m³/h","CFM","L/s"],udef:"m³/h",show:v=>v.mode==="q"},
            {id:"N2",label:"New fan speed",type:"num",def:"1050",unit:"rpm",show:v=>v.mode==="n"},
            {id:"dm",label:"Motor pulley diameter",type:"num",def:"160",unit:"mm",adv:true,half:true},
            {id:"Wm",label:"Motor rated power",type:"num",def:"5.5",unit:"kW",adv:true,half:true}
           ],
           calc(v){
            const Q1=airQ(v,"Q1"),P1=num(v.P1),W1=num(v.W1),N1=num(v.N1);if(!(Q1>0&&N1>0))return{hint:"Enter the airflow and fan speed now."};
            let r;if(v.mode==="q"){const Q2=airQ(v,"Q2");if(!(Q2>0))return{hint:"Enter the airflow you need."};r=Q2/Q1;}else{const N2=num(v.N2);if(!(N2>0))return{hint:"Enter the new speed."};r=N2/N1;}
            const N2=N1*r,Q2=Q1*r,P2=P1*r*r,W2=W1*r**3,dm=num(v.dm),Wm=num(v.Wm),over=Wm>0&&W2>Wm;
            return{cap:"New fan speed",value:f(N2,0),unit:"rpm",status:Wm>0?{ok:!over,text:over?"Motor too small":"Motor OK"}:null,
             say:`At ${B(f(N2,0),"rpm")} the fan gives ${B(f(Q2*3600,0),"m³/h")} at ${f(P2,0)} Pa and needs about ${B(f(W2,2),"kW")}.`+(dm>0?` With the motor fixed, change the motor pulley from ${f(dm,0)} to ${B(f(dm*r,0),"mm")}.`:"")+(over?` That is more than the ${f(Wm,1)} kW motor, so a bigger motor is needed.`:""),
             rows:[["Speed change",f((r-1)*100,1),"%"],["New airflow",f(Q2*1000,0),"L/s"],["New static pressure",f(P2,0),"Pa"],["New power",f(W2,2),"kW"],["New motor pulley",dm>0?f(dm*r,0):"—","mm"]]};
           },
           note:"Q ∝ N, P ∝ N², power ∝ N³. Valid for the same fan and system. Check the motor current and belt after any speed change."},

          {id:"leak",g:"tab",icon:"leak",name:"Duct leakage test",short:"Allowable leakage and pass / fail",
           intro:"Enter the duct surface area, test pressure, leakage class and the leakage you measured.",
           fields:[
            {id:"std",label:"Standard",type:"chips",def:"en",options:[["en","EN 1507 / DW 144"],["sm","SMACNA"]]},
            {id:"cls",label:"Air tightness class",type:"chips",def:"0.009",options:[["0.027","A"],["0.009","B"],["0.003","C"],["0.001","D"]],show:v=>v.std==="en"},
            {id:"cl",label:"SMACNA leakage class",type:"chips",def:"6",options:[["3","CL 3"],["6","CL 6"],["12","CL 12"],["24","CL 24"],["48","CL 48"]],show:v=>v.std==="sm"},
            {id:"A",label:"Duct surface area tested",type:"num",def:"120",units:["m²","ft²"],udef:"m²"},
            {id:"P",label:"Test pressure",type:"num",def:"400",unit:"Pa"},
            {id:"L",label:"Measured leakage",help:"Leave blank to see only the allowance.",type:"num",def:"55",units:["L/s","m³/h","CFM"],udef:"L/s"}
           ],
           calc(v){
            let A=num(v.A);const P=num(v.P);if(!(A>0))return{hint:"Enter the duct surface area."};if(!(P>0))return{hint:"Enter the test pressure."};if(v.A_u==="ft²")A*=0.092903;
            let allow;if(v.std==="sm"){const cl=num(v.cl);allow=cl*Math.pow(P/249.089,0.65)*(A/0.092903/100)*0.471947;}else allow=num(v.cls)*Math.pow(P,0.65)*A*1;
            const Lm=num(v.L)*({"L/s":1,"m³/h":1/3.6,"CFM":0.471947}[v.L_u]||1),has=isFinite(Lm),ok=Lm<=allow;
            return{cap:"Allowable leakage",value:f(allow,1),unit:"L/s",status:has?{ok,text:ok?"Pass":"Fail"}:null,
             say:`At ${f(P)} Pa, ${f(A,1)} m² of duct may leak up to ${B(f(allow,1),"L/s")} (${f(allow/A,3)} L/s per m²).`+(has?` You measured ${B(f(Lm,1),"L/s")}, which is ${f(Lm/allow*100,0)} % of the allowance.`:""),
             rows:[["Allowance",f(allow*3.6,1),"m³/h"],["Allowance",f(allow*2.11888,1),"CFM"],["Per m²",f(allow/A,4),"L/s·m²"],["Measured",has?f(Lm,1):"—","L/s"]]};
           },
           note:"EN 1507: f = c × p^0.65 L/s per m² (A 0.027, B 0.009, C 0.003, D 0.001). SMACNA: F = CL × P^0.65 CFM per 100 ft² with P in inWG. Test at the pressure in your spec."},

          {id:"press",g:"tab",icon:"press",name:"Room pressurisation",short:"Air needed to hold +25 or +50 Pa",
           intro:"Work out the extra air needed to hold a room at a set pressure, from its leakage paths or from a pressure you measured.",
           fields:[
            {id:"mode",label:"Method",type:"chips",def:"leak",options:[["leak","From leakage paths"],["meas","Scale from a reading"]]},
            {id:"P",label:"Target pressure",type:"num",def:"50",unit:"Pa",presets:[["12.5","12.5"],["25","25"],["50","50 (LER / substation)"]]},
            {id:"sd",label:"Single doors",type:"num",def:"2",unit:"doors",half:true,show:v=>v.mode==="leak"},
            {id:"dd",label:"Double doors",type:"num",def:"1",unit:"doors",half:true,show:v=>v.mode==="leak"},
            {id:"ox",label:"Other leakage area",help:"Cable transits, ceiling, wall cracks. Typical 0.005–0.02 m² per room.",type:"num",def:"0.01",unit:"m²",show:v=>v.mode==="leak"},
            {id:"sf",label:"Safety margin",type:"num",def:"25",unit:"%",adv:true,show:v=>v.mode==="leak"},
            {id:"P1",label:"Pressure you measured",type:"num",def:"28",unit:"Pa",half:true,show:v=>v.mode==="meas"},
            {id:"Q1",label:"Net air at that time",help:"Supply minus return and exhaust.",type:"num",def:"180",units:["L/s","m³/h","CFM"],udef:"L/s",half:true,show:v=>v.mode==="meas"}
           ],
           calc(v){
            const P=num(v.P);if(!(P>0))return{hint:"Enter the target pressure."};
            if(v.mode==="meas"){const P1=num(v.P1),Q1=num(v.Q1)*({"L/s":1,"m³/h":1/3.6,"CFM":0.471947}[v.Q1_u]||1);if(!(P1>0&&Q1>0))return{hint:"Enter the pressure and net air you measured."};
             const Q2=Q1*Math.sqrt(P/P1);return{cap:"Net air needed",value:f(Q2,0),unit:"L/s",
              say:`Leakage flow rises with √pressure. To go from ${f(P1)} to ${f(P)} Pa, raise the net air from ${f(Q1,0)} to ${B(f(Q2,0),"L/s")}, an extra ${B(f(Q2-Q1,0),"L/s")}. Seal transits and check door seals first; that is cheaper than more air.`,
              rows:[["Net air needed",f(Q2*3.6,0),"m³/h"],["Extra air",f((Q2-Q1)*3.6,0),"m³/h"],["Equivalent leakage area",f(Q1/1000/(0.827*Math.sqrt(P1)),4),"m²"]]};}
            const A=(num(v.sd)||0)*0.01+(num(v.dd)||0)*0.03+(num(v.ox)||0),sf=1+(num(v.sf)||0)/100;if(!(A>0))return{hint:"Enter at least one door or leakage area."};
            const Q=0.827*A*Math.sqrt(P)*sf*1000;
            return{cap:"Net pressurisation air",value:f(Q,0),unit:"L/s",
             say:`A total leakage area of ${f(A,3)} m² needs about ${B(f(Q,0),"L/s")} (${f(Q*3.6,0)} m³/h) more supply than return and exhaust to hold ${f(P)} Pa, including ${f((sf-1)*100,0)} % margin.`,
             rows:[["Net air",f(Q*3.6,0),"m³/h"],["Net air",f(Q*2.11888,0),"CFM"],["Leakage area",f(A,3),"m²"]]};
           },
           note:"Q = 0.827 × A × √ΔP (m³/s, A in m²). Typical leakage per closed door: single 0.01 m², double 0.03 m² (EN 12101-6 / CIBSE). Measure and seal before adding air."},

          {id:"esp",g:"tab",icon:"esp",name:"Static pressure (ESP)",short:"External static from duct losses or readings",
           intro:"Estimate the external static pressure a fan must give, or work it out from suction and discharge readings.",
           fields:[
            {id:"mode",label:"Method",type:"chips",def:"est",options:[["est","Estimate from ductwork"],["meas","From readings"]]},
            {id:"L",label:"Longest duct run",type:"num",def:"60",unit:"m",half:true,show:v=>v.mode==="est"},
            {id:"R",label:"Friction rate",type:"num",def:"1",unit:"Pa/m",half:true,show:v=>v.mode==="est"},
            {id:"fit",label:"Fittings allowance",help:"Bends, tees and transitions as % of straight duct.",type:"num",def:"50",unit:"%",show:v=>v.mode==="est"},
            {id:"term",label:"Diffuser / grille",type:"num",def:"25",unit:"Pa",half:true,show:v=>v.mode==="est"},
            {id:"dmp",label:"Dampers and fire dampers",type:"num",def:"20",unit:"Pa",half:true,show:v=>v.mode==="est"},
            {id:"oth",label:"Other external items",help:"Louvres, silencers, heaters outside the unit.",type:"num",def:"40",unit:"Pa",show:v=>v.mode==="est"},
            {id:"sf",label:"Safety margin",type:"num",def:"10",unit:"%",adv:true,show:v=>v.mode==="est"},
            {id:"ps",label:"Suction static (outside unit)",help:"Usually negative.",type:"num",def:"-120",unit:"Pa",half:true,show:v=>v.mode==="meas"},
            {id:"pd",label:"Discharge static (outside unit)",type:"num",def:"260",unit:"Pa",half:true,show:v=>v.mode==="meas"},
            {id:"des",label:"Design ESP",type:"num",def:"350",unit:"Pa",show:v=>v.mode==="meas"}
           ],
           calc(v){
            if(v.mode==="meas"){const ps=num(v.ps),pd=num(v.pd),d=num(v.des);if(!isFinite(ps)||!isFinite(pd))return{hint:"Enter suction and discharge static."};const e=pd-ps;
             return{cap:"External static pressure",value:f(e,0),unit:"Pa",status:d>0?{ok:Math.abs(e-d)/d<=0.1,text:`${f(e/d*100,0)} % of design`}:null,
              say:`ESP = ${f(pd,0)} − (${f(ps,0)}) = ${B(f(e,0),"Pa")}.`+(d>0?(e>d*1.1?" Higher than design: the ductwork has more resistance than designed, so airflow will be low. Check dampers, filters and fire dampers.":e<d*0.9?" Lower than design: check for open access doors, missing filters or duct leaks.":" Close to design."):""),
              rows:[["ESP",f(e/249.089,2),"inWG"],["ESP",f(e/9.80665,1),"mm WG"]]};}
            const L=num(v.L),R=num(v.R);if(!(L>0&&R>0))return{hint:"Enter the duct run length and friction rate."};
            const duct=L*R*(1+(num(v.fit)||0)/100),items=(num(v.term)||0)+(num(v.dmp)||0)+(num(v.oth)||0),esp=(duct+items)*(1+(num(v.sf)||0)/100);
            return{cap:"Estimated ESP",value:f(esp,0),unit:"Pa",say:`Duct and fittings ${f(duct,0)} Pa plus external items ${f(items,0)} Pa, with margin, gives about ${B(f(esp,0),"Pa")} (${f(esp/249.089,2)} inWG).`,
             rows:[["Ductwork",f(duct,0),"Pa"],["External items",f(items,0),"Pa"],["ESP",f(esp/249.089,2),"inWG"]]};
           },
           note:"ESP = discharge static − suction static, both measured outside the unit. Estimates use the index (longest) run; use a full duct calculation for design."},

          {id:"vbelt",g:"tab",icon:"vbelt",name:"V-belt tension",short:"SKF force–deflection check",
           intro:"Pick the belt section, enter the pulleys and speed. You get the deflection and the force range. Add your tester readings to check each belt.",
           fields:[
            {id:"sec",label:"Belt section",type:"select",def:"SPB, XPB",options:Object.keys(VB).map(k=>[k,k])},
            {id:"cog",label:"Construction",type:"chips",def:"0",options:[["0","Un-cogged"],["1","Cogged (X in code)"]]},
            {id:"nw",label:"Belt condition",type:"chips",def:"1",options:[["1","New"],["0","Used"]]},
            {id:"d",label:"Small pulley diameter",type:"num",def:"180",unit:"mm",half:true},
            {id:"rpm",label:"Small pulley speed",type:"num",def:"1460",unit:"rpm",half:true},
            {id:"D",label:"Large pulley diameter",type:"num",def:"315",unit:"mm",half:true},
            {id:"C",label:"Centre distance",type:"num",def:"620",unit:"mm",half:true},
            {id:"r",label:"Tester readings, one per belt",help:"In kgf, separated by spaces. Leave blank to see the target only.",type:"text",def:"8.9 9.3 8.6"}
           ],
           calc(v){
            const S=VB[v.sec],d0=num(v.d),D0=num(v.D),C=num(v.C),rpm=num(v.rpm);if(!S)return{hint:"Pick a belt section."};
            if(!(d0>0&&D0>0&&C>0&&rpm>0))return{hint:"Enter both pulley diameters, the centre distance and the speed."};
            const d=Math.min(d0,D0),D=Math.max(d0,D0);if(C<=(d+D)/2)return{hint:"The centre distance is too short; the pulleys would overlap."};
            const span=Math.sqrt(C*C-((D-d)/2)**2),defl=span/64,wrap=180-2*Math.asin((D-d)/(2*C))*180/Math.PI;
            let bi=S.b.findIndex(b=>d<=b[1]);if(bi<0)bi=S.b.length-1;const rows=S.b[bi][3];let ri=rows.findIndex(r=>rpm>=r[0]&&rpm<=r[1]);if(ri<0)ri=rpm<rows[0][0]?0:rows.length-1;
            const vals=rows[ri][2],cog=v.cog==="1",u=cog?vals[2]:vals[0],n=cog?vals[3]:vals[1];
            if(u==null)return{hint:`SKF lists no ${cog?"cogged":"un-cogged"} value for ${v.sec} at this pulley size. Switch construction or check the pulley.`};
            const bs=Math.PI*d*rpm/60000,rd=numsOf(v.r),res=rd.map(x=>x<u?"Slack":x>n?"Too tight":"OK"),allOK=rd.length&&res.every(x=>x==="OK"),tgt=v.nw==="1"?n:u;
            const warn=[];if(d<S.b[0][0])warn.push(`Small pulley is below the smallest listed for ${v.sec} (${S.b[0][0]} mm).`);if(wrap<120)warn.push(`Arc of contact is only ${f(wrap,0)}°; slip is likely.`);if(bs>(S.cls==="wedge"?40:30))warn.push(`Belt speed ${f(bs,1)} m/s is above the usual limit.`);
            return{cap:"Set force to",value:f(tgt,1),unit:"kgf",status:rd.length?{ok:allOK,text:allOK?"All belts pass":`${res.filter(x=>x!=="OK").length} belt(s) fail`}:null,
             say:`Push at mid-span until it deflects ${B(f(defl,1),"mm")} (span ${f(span,0)} mm ÷ 64). The force must be between ${B(f(u,1)+" and "+f(n,1),"kgf")} (${f(u*9.80665,0)}–${f(n*9.80665,0)} N). ${v.nw==="1"?"New belts: set near the maximum.":"Used belts: keep at or above the minimum."}`+(warn.length?" "+warn.join(" "):""),
             rows:[["Span",f(span,0),"mm"],["Deflection",f(defl,1),"mm"],["Minimum (used)",f(u,1),"kgf"],["Maximum (new)",f(n,1),"kgf"],["Arc of contact",f(wrap,0),"°"],["Belt speed",f(bs,1),"m/s"]],
             after:rd.length?tbl(["Belt","Reading kgf","Result"],rd.map((x,i)=>({cls:res[i]==="OK"?"":"sel",c:[i+1,f(x,1),res[i]]}))):""};
           },
           note:"SKF Industrial V-Belt Tension Tester table (kgf). Isolate and lock out before checking. Re-check new belts after 24–48 hours of running."},

          {id:"dheat",g:"tab",icon:"dheat",name:"Duct heater test",short:"Current, ΔT, resistance and site check",
           intro:"Enter the heater nameplate and duct size. Add site readings to check output, current balance and temperature rise.",
           fields:[
            {id:"kw",label:"Heater capacity",type:"num",def:"18",unit:"kW",half:true},
            {id:"V",label:"Voltage",type:"num",def:"415",unit:"V",half:true},
            {id:"ph",label:"Supply",type:"chips",def:"3",options:[["3","3-phase"],["1","1-phase"]]},
            {id:"Q",label:"Airflow",type:"num",def:"3600",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"w",label:"Duct width",type:"num",def:"600",unit:"mm",half:true},
            {id:"h",label:"Duct height",type:"num",def:"400",unit:"mm",half:true},
            {id:"vmin",label:"Minimum face velocity",type:"num",def:"1.5",unit:"m/s",adv:true},
            {id:"mV",label:"Measured voltage",type:"num",def:"",unit:"V",half:true},
            {id:"I",label:"Measured currents",help:"One per phase, separated by spaces.",type:"text",def:""},
            {id:"ti",label:"Inlet air",type:"num",def:"",unit:"°C",half:true},
            {id:"to",label:"Outlet air",type:"num",def:"",unit:"°C",half:true}
           ],
           calc(v){
            const kw=num(v.kw),V=num(v.V),three=v.ph==="3",Q=airQ(v,"Q"),A=num(v.w)*num(v.h)/1e6,vmin=num(v.vmin)||1.5;
            if(!(kw>0&&V>0))return{hint:"Enter the heater kW and voltage."};if(!(Q>0))return{hint:"Enter the airflow."};
            const P=kw*1000,I=three?P/(SQ3*V):P/V,dT=kw/(1.207*Q),vel=A>0?Q/A:NaN,R=three?2*V*V/P:V*V/P;
            const mV=num(v.mV),Is=numsOf(v.I),ti=num(v.ti),to=num(v.to),rows=[["Full-load current",f(I,1),"A"],["Air temperature rise",f(dT,1),"°C"],["Face velocity",f(vel,2),"m/s"],[three?"Resistance line-to-line":"Element resistance",f(R,2),"Ω"],["Feeder rating (1.25 × I)",f(1.25*I,1),"A"]];
            let msg=[],ok=!(vel<vmin);if(vel<vmin)msg.push(`Face velocity ${f(vel,2)} m/s is below the ${f(vmin,1)} m/s minimum: risk of overheating and high-limit trips.`);
            if(mV>0&&Is.length===(three?3:1)){const Ia=Is.reduce((a,b)=>a+b,0)/Is.length,Pm=three?SQ3*mV*Ia:mV*Ia,Pe=P*(mV/V)**2,pc=Pm/Pe*100;
             rows.push(["Measured output",f(Pm/1000,2),"kW"],["Expected at this voltage",f(Pe/1000,2),"kW"]);
             if(Math.abs(pc-100)>10){ok=false;msg.push(`Output is ${f(pc,0)} % of expected: a stage or element may be off.`);}else msg.push(`Output is ${f(pc,0)} % of expected.`);
             if(three){const ub=Math.max(...Is.map(x=>Math.abs(x-Ia)))/Ia*100;rows.push(["Current unbalance",f(ub,1),"%"]);if(ub>10){ok=false;msg.push(`Current unbalance ${f(ub,1)} % suggests an open element.`);}}
             if(isFinite(ti)&&isFinite(to)){const dTm=to-ti,dTe=Pm/1000/(1.207*Q);rows.push(["Measured ΔT",f(dTm,1),"°C"],["Expected ΔT",f(dTe,1),"°C"]);if(dTm>0)rows.push(["Airflow from ΔT",f(Pm/1000/(1.207*dTm)*3600,0),"m³/h"]);}}
            return{cap:"Full-load current",value:f(I,1),unit:"A",status:{ok,text:ok?"OK":"Check"},
             say:`At full output the heater draws ${B(f(I,1),"A")} and raises the air ${B(f(dT,1),"°C")}. `+msg.join(" "),rows};
           },
           note:"I = P ÷ (√3 V) or P ÷ V. ΔT = kW ÷ (1.207 × m³/s). Output varies with V². Interlocks to test: no heat with fan off, trip on airflow loss, auto and manual-reset high limits, fan overrun."},

          /* ===== HVAC additions ===== */
          /* ===== Commissioning additions ===== */
          {id:"hydro",g:"tab",icon:"hydro",name:"Hydrostatic test",short:"Test pressure and temperature correction",
           intro:"Work out the test pressure, then check whether a pressure change during the hold is a leak or just the water temperature changing.",
           fields:[
            {id:"Pd",label:"Design pressure",type:"num",def:"10",unit:"bar g",half:true},
            {id:"k",label:"Test factor",type:"chips",def:"1.5",options:[["1.5","1.5 × (ASME B31.3 / most specs)"],["1.43","1.43 × (EN 13480)"],["1.3","1.3 ×"],["1.25","1.25 ×"]]},
            {id:"OD",label:"Pipe outside diameter",type:"num",def:"168.3",unit:"mm",half:true},
            {id:"t",label:"Wall thickness",type:"num",def:"7.11",unit:"mm",half:true},
            {id:"mat",label:"Pipe material",type:"chips",def:"st",options:[["st","Carbon / stainless steel"],["cu","Copper"],["pp","Plastic (PPR / HDPE)"]]},
            {id:"P1",label:"Pressure at start of hold",type:"num",def:"15.2",unit:"bar g",half:true},
            {id:"T1",label:"Water temperature at start",type:"num",def:"31",unit:"°C",half:true},
            {id:"P2",label:"Pressure at end of hold",type:"num",def:"14.3",unit:"bar g",half:true},
            {id:"T2",label:"Water temperature at end",type:"num",def:"30.8",unit:"°C",half:true},
            {id:"tol",label:"Allowed unexplained drop",type:"num",def:"0.1",unit:"bar",adv:true}
           ],
           calc(v){
            const Pd=num(v.Pd),k=num(v.k),Pt=Pd*k;if(!(Pd>0))return{hint:"Enter the design pressure."};
            const OD=num(v.OD),t=num(v.t),P1=num(v.P1),P2=num(v.P2),T1=num(v.T1),T2=num(v.T2),tol=num(v.tol)||0.1;
            const base={cap:"Test pressure",value:f(Pt,2),unit:"bar g",say:`Test at ${B(f(Pt,2),"bar g")} (${f(k,2)} × ${f(Pd,1)} bar). Hold for the time in your spec, often 30 minutes to 2 hours after the pressure settles.`,rows:[["Test pressure",f(Pt*100,0),"kPa g"],["Test pressure",f(Pt*14.5038,0),"psig"]]};
            if(![P1,P2,T1,T2].every(isFinite)||!(OD>0&&t>0))return base;
            const BT=[[0,-0.68],[4,0],[5,0.16],[10,0.88],[15,1.51],[20,2.07],[25,2.57],[30,3.03],[40,3.85],[50,4.57],[60,5.22]],Tm=(T1+T2)/2;
            let beta=BT[BT.length-1][1];for(let i=1;i<BT.length;i++)if(Tm<=BT[i][0]){const[a,fa]=BT[i-1],[b,fb]=BT[i];beta=fa+(fb-fa)*(Tm-a)/(b-a);break;}
            const M={st:[1.2e-5,200000],cu:[1.7e-5,110000],pp:[1.5e-4,900]}[v.mat],dPdT=(beta*1e-4-3*M[0])/(4.6e-4+OD/(t*M[1]))*10;
            const exp=dPdT*(T2-T1),act=P2-P1,un=act-exp,ok=un>=-tol;
            return{cap:"Unexplained pressure change",value:(un>=0?"+":"")+f(un,2),unit:"bar",status:{ok,text:ok?"No leak indicated":"Leak likely"},
             say:`Test at ${B(f(Pt,2),"bar g")}. Trapped water in this pipe changes about ${B(f(Math.abs(dPdT),2),"bar per °C")}, so the ${f(T2-T1,1)} °C change explains ${f(exp,2)} bar. You saw ${f(act,2)} bar, leaving ${B(f(un,2),"bar")} unexplained.`+(ok?" The pressure change is from temperature, not a leak.":" Walk the line for leaks; check flanges, vents, drains and valve glands.")+" Do the hold out of direct sun and log temperature with the pressure.",
             rows:[["Test pressure",f(Pt,2),"bar g"],["Pressure change per °C",f(dPdT,2),"bar/°C"],["Expected from temperature",f(exp,2),"bar"],["Measured change",f(act,2),"bar"]]};
           },
           note:"ΔP/ΔT = (β − 3α) ÷ (κ + D/(t·E)) for trapped, air-free water (β water expansion, α pipe expansion, κ water compressibility). Air pockets make this much smaller, so vent fully. Follow the test pack and your code's test factor."},

          {id:"flush",g:"tab",icon:"flush",name:"Flushing velocity",short:"Flow needed to flush each pipe size",
           intro:"Pick the pipe size and target flushing velocity. You get the flow needed, and the velocity your flushing pump actually gives.",
           fields:[
            {id:"dn",label:"Pipe size (steel Sch 40)",type:"select",def:"5",options:PIPE.map((p,i)=>[String(i),p[0]+" · ID "+p[1]+" mm"])},
            {id:"vt",label:"Target flushing velocity",help:"Usually at least the design velocity, often 1.0–1.5 m/s minimum (BSRIA BG 29). Use your flushing spec.",type:"num",def:"1.5",unit:"m/s",presets:[["1","1.0"],["1.5","1.5"],["2","2.0"]]},
            {id:"Qp",label:"Flushing pump flow available",type:"num",def:"5",units:uu("flow"),udef:"L/s"},
            {id:"Vs",label:"System volume (for turnover time)",type:"num",def:"2000",unit:"L",adv:true}
           ],
           calc(v){
            const p=PIPE[+v.dn],vt=num(v.vt),Qp=si(v,"Qp","flow");if(!p)return{hint:"Pick a pipe size."};if(!(vt>0))return{hint:"Enter the target velocity."};
            const A=Math.PI*(p[1]/1000)**2/4,Qn=A*vt,va=Qp>0?Qp/A:NaN,Vs=num(v.Vs),ok=va>=vt;
            const rows=PIPE.map(q=>{const a=Math.PI*(q[1]/1000)**2/4;return{cls:q===p?"sel":"",c:[q[0],f(a*vt*1000,2),Qp>0?f(Qp/a,2):"—"]};});
            return{cap:"Flow needed",value:f(Qn*1000,2),unit:"L/s",status:Qp>0?{ok,text:ok?"Pump reaches target":"Pump too small for this size"}:null,
             say:`To flush ${p[0]} at ${f(vt,1)} m/s you need ${B(f(Qn*1000,2),"L/s")} (${f(Qn*3600,1)} m³/h).`+(Qp>0?` Your pump gives ${B(f(va,2),"m/s")} in this size.`+(ok?"":" Flush the larger mains in sections, or use a bigger temporary pump."):"")+(Vs>0&&Qp>0?` One full system turnover takes about ${f(Vs/1000/Qp/60,1)} minutes.`:""),
             rows:[["Flow needed",f(Qn*3600,2),"m³/h"],["Flow needed",f(Qn*15850.3,1),"US GPM"],["Velocity achieved",f(va,2),"m/s"]],
             after:tbl(["Size","L/s needed","m/s with your pump"],rows)};
           },
           note:"Flush each branch separately with terminals bypassed and strainers fitted with fine flushing mesh. Flush until the water runs clear and samples meet the water-treatment spec."},

          {id:"align",g:"tab",icon:"align",name:"Shaft alignment",short:"Tolerance check and shim / move at the feet",
           intro:"Enter the speed and your offset and angularity readings at the coupling. You get pass or fail and how much to move each motor foot.",
           fields:[
            {id:"rpm",label:"Speed",type:"num",def:"1480",unit:"rpm",half:true},
            {id:"pl",label:"Plane",type:"chips",def:"v",options:[["v","Vertical (shims)"],["h","Horizontal (side move)"]]},
            {id:"off",label:"Offset at coupling centre",help:"Motor shaft relative to pump shaft. + means motor high (or to the right).",type:"num",def:"0.18",unit:"mm",half:true},
            {id:"gap",label:"Angularity",help:"Gap difference across the coupling face. + means gap open at top (or right).",type:"num",def:"0.06",unit:"mm",half:true},
            {id:"D",label:"Coupling diameter (or reading span)",type:"num",def:"100",unit:"mm"},
            {id:"A",label:"Coupling centre to front foot",type:"num",def:"200",unit:"mm",half:true},
            {id:"Bf",label:"Front foot to rear foot",type:"num",def:"300",unit:"mm",half:true}
           ],
           calc(v){
            const rpm=num(v.rpm),off=num(v.off),gap=num(v.gap),D=num(v.D),A=num(v.A),Bf=num(v.Bf);if(!(rpm>0))return{hint:"Enter the speed."};if(!isFinite(off)||!isFinite(gap)||!(D>0))return{hint:"Enter the offset, angularity and diameter."};
            const T=rpm<=1000?[0.13,0.10]:rpm<=2000?[0.09,0.07]:rpm<=3000?[0.06,0.05]:[0.04,0.04],ang=gap/D*100,ok=Math.abs(off)<=T[0]&&Math.abs(ang)<=T[1];
            const slope=gap/D,fF=off+slope*A,fR=off+slope*(A+Bf),vert=v.pl==="v",act=x=>vert?(x>0?`remove ${f(x,2)} mm of shims`:x<0?`add ${f(-x,2)} mm of shims`:"no change"):(x>0?`move ${f(x,2)} mm left`:x<0?`move ${f(-x,2)} mm right`:"no change");
            return{cap:"Alignment",big:ok?"Within tolerance":"Correct it",status:{ok,text:`Limits ${T[0]} mm offset, ${T[1]} mm/100 mm angle`},
             say:`At ${f(rpm,0)} rpm the offset is ${f(Math.abs(off),2)} mm (limit ${T[0]}) and the angle is ${f(Math.abs(ang),3)} mm per 100 mm (limit ${T[1]}).`+(A>0&&Bf>0?` To correct the ${vert?"vertical":"horizontal"} plane: front feet ${B(act(fF))}, rear feet ${B(act(fR))}.`:"")+" Correct vertical first, then horizontal, then re-measure.",
             rows:[["Offset",f(off,3),"mm"],["Angularity",f(ang,3),"mm/100 mm"],["Front foot move",f(-fF,3),"mm"],["Rear foot move",f(-fR,3),"mm"]]};
           },
           note:"Typical acceptable tolerances for short flexible couplings (laser alignment practice). Your pump or coupling maker's values govern. Check soft foot (under 0.05 mm) before aligning, and re-check hot alignment where specified."},

          {id:"torque",g:"tab",icon:"torque",name:"Flange bolt torque",short:"Torque for bolt size, grade and lubrication",
           intro:"Pick the bolt size, grade and lubrication. You get the tightening torque and the passes to use.",
           fields:[
            {id:"sz",label:"Bolt size",type:"select",def:"M20",options:[["M10","M10"],["M12","M12"],["M16","M16"],["M20","M20"],["M24","M24"],["M27","M27"],["M30","M30"],["M33","M33"],["M36","M36"]]},
            {id:"gr",label:"Bolt grade",type:"chips",def:"725",options:[["725","ASTM A193 B7"],["640","ISO 8.8"],["940","ISO 10.9"],["450","Stainless A2/A4-70"]]},
            {id:"K",label:"Lubrication",type:"chips",def:"0.16",options:[["0.12","Moly / anti-seize"],["0.16","Light oil"],["0.20","Dry / plated"]]},
            {id:"pc",label:"Target bolt stress",help:"% of yield. 50 % is common for spiral-wound gaskets.",type:"num",def:"50",unit:"% of yield"}
           ],
           calc(v){
            const AS={M10:[10,58],M12:[12,84.3],M16:[16,157],M20:[20,245],M24:[24,353],M27:[27,459],M30:[30,561],M33:[33,694],M36:[36,817]}[v.sz],Y=num(v.gr),K=num(v.K),pc=num(v.pc)/100;
            if(!AS||!(pc>0&&pc<=0.9))return{hint:"Enter a target between 10 and 90 % of yield."};
            const F=pc*Y*AS[1],T=K*F*AS[0]/1000;
            return{cap:"Tightening torque",value:f(T,0),unit:"N·m",
             say:`Tighten ${v.sz} bolts to ${B(f(T,0),"N·m")} (${f(T*0.7376,0)} ft·lb), giving about ${f(F/1000,1)} kN clamp per bolt. Use a star (cross) pattern: pass 1 at ${f(T*0.3,0)}, pass 2 at ${f(T*0.6,0)}, pass 3 at ${f(T,0)} N·m, then a final round pass at ${f(T,0)} N·m until no bolt turns.`,
             rows:[["Torque",f(T*0.7376,0),"ft·lb"],["Bolt load",f(F/1000,1),"kN"],["Pass 1 (30 %)",f(T*0.3,0),"N·m"],["Pass 2 (60 %)",f(T*0.6,0),"N·m"]]};
           },
           note:"T = K × F × d with F = target stress × yield × tensile stress area. The gasket maker's or the project's bolt torque table governs; this is a check. Use calibrated torque wrenches and new gaskets."},

          {id:"vib",g:"tab",icon:"vib",name:"Vibration acceptance",short:"ISO 10816 zones A to D",
           intro:"Pick the machine size and mounting, then enter the highest vibration velocity you read on the bearings.",
           fields:[
            {id:"sz",label:"Machine size",type:"chips",def:"m",options:[["s","Under 15 kW"],["m","15–300 kW"],["l","Over 300 kW"]]},
            {id:"fd",label:"Foundation",type:"chips",def:"r",options:[["r","Rigid"],["f","Flexible (springs, steel frame)"]],show:v=>v.sz!=="s"},
            {id:"vr",label:"Highest reading",type:"num",def:"2.4",unit:"mm/s RMS"}
           ],
           calc(v){
            const vr=num(v.vr);if(!(vr>=0))return{hint:"Enter the vibration reading."};
            const Z=v.sz==="s"?[0.71,1.8,4.5]:v.sz==="m"?(v.fd==="f"?[2.3,4.5,7.1]:[1.4,2.8,4.5]):(v.fd==="f"?[3.5,7.1,11]:[2.3,4.5,7.1]);
            const zn=vr<=Z[0]?"A":vr<=Z[1]?"B":vr<=Z[2]?"C":"D",ok=zn==="A"||zn==="B";
            const txt={A:"Zone A: newly commissioned machines normally fall here.",B:"Zone B: acceptable for unrestricted long-term running.",C:"Zone C: not acceptable for long-term running. Find the cause (balance, alignment, looseness, bearings) before handover.",D:"Zone D: severe enough to cause damage. Stop and investigate."}[zn];
            return{cap:"ISO 10816 zone",value:zn,unit:"",status:{ok,text:ok?"Acceptable":"Not acceptable"},
             say:`${f(vr,2)} mm/s RMS is in ${B("zone "+zn)}. ${txt}`,
             rows:[["A / B boundary",Z[0],"mm/s"],["B / C boundary",Z[1],"mm/s"],["C / D boundary",Z[2],"mm/s"]]};
           },
           note:"ISO 10816-1 (small machines) and 10816-3 (15 kW to 50 MW), RMS velocity 10–1000 Hz. Measure horizontal, vertical and axial on each bearing. For fans, ISO 14694 categories may apply; the project spec governs."},

          {id:"pumpt",g:"tab",icon:"pumpt",name:"Pump performance test",short:"Head, power and efficiency from site readings",
           intro:"Enter flow, suction and discharge gauge readings and the motor power. You get the real pump head and efficiency to compare with the curve.",
           fields:[
            {id:"Q",label:"Measured flow",type:"num",def:"25",units:uu("flow"),udef:"L/s"},
            {id:"ps",label:"Suction gauge",type:"num",def:"120",unit:"kPa g",half:true},
            {id:"pd",label:"Discharge gauge",type:"num",def:"420",unit:"kPa g",half:true},
            {id:"dz",label:"Discharge gauge height above suction gauge",type:"num",def:"0.4",unit:"m",adv:true},
            {id:"ds",label:"Suction pipe ID",type:"num",def:"154",unit:"mm",half:true,adv:true},
            {id:"dd",label:"Discharge pipe ID",type:"num",def:"128",unit:"mm",half:true,adv:true},
            {id:"kw",label:"Motor input power",help:"From a power meter, or √3 × V × I × PF.",type:"num",def:"11.5",unit:"kW",half:true},
            {id:"me",label:"Motor efficiency",type:"num",def:"92",unit:"%",half:true},
            {id:"Qd",label:"Design flow",type:"num",def:"25",units:uu("flow"),udef:"L/s",adv:true},
            {id:"Hd",label:"Design head",type:"num",def:"30",unit:"m",adv:true}
           ],
           calc(v){
            const Q=si(v,"Q","flow"),ps=num(v.ps),pd=num(v.pd);if(!(Q>0))return{hint:"Enter the measured flow."};if(!isFinite(ps)||!isFinite(pd))return{hint:"Enter both gauge readings."};
            const dz=num(v.dz)||0,ds=num(v.ds)/1000,dd=num(v.dd)/1000,vs=ds>0?Q/(Math.PI*ds*ds/4):0,vd=dd>0?Q/(Math.PI*dd*dd/4):0;
            const H=(pd-ps)*1000/(998*9.81)+dz+(vd*vd-vs*vs)/(2*9.81),Ph=998*9.81*Q*H/1000,kw=num(v.kw),me=num(v.me)/100,eff=kw>0&&me>0?Ph/(kw*me):NaN;
            const Qd=si(v,"Qd","flow"),Hd=num(v.Hd);
            return{cap:"Pump head",value:f(H,1),unit:"m",status:isFinite(eff)?{ok:eff>=0.5,text:`Pump efficiency ${f(eff*100,0)} %`}:null,
             say:`The pump is giving ${B(f(H,1),"m")} head at ${f(Q*1000,1)} L/s, which is ${f(Ph,2)} kW of hydraulic power.`+(isFinite(eff)?` With ${f(kw,1)} kW into a ${f(me*100,0)} % efficient motor, pump efficiency is ${B(f(eff*100,0),"%")}.`:"")+(Qd>0&&Hd>0?` Against design: flow ${f(Q/Qd*100,0)} %, head ${f(H/Hd*100,0)} %. Plot this point on the pump curve; a point well below the curve points to wrong rotation, a worn impeller, air, or a blocked strainer.`:""),
             rows:[["Head",f(H*9.81*0.998,0),"kPa"],["Velocity head correction",f((vd*vd-vs*vs)/(2*9.81),2),"m"],["Hydraulic power",f(Ph,2),"kW"],["Pump efficiency",isFinite(eff)?f(eff*100,1):"—","%"],["Wire-to-water efficiency",kw>0?f(Ph/kw*100,1):"—","%"]]};
           },
           note:"H = (Pd − Ps) ÷ ρg + gauge height difference + (vd² − vs²) ÷ 2g. Use calibrated gauges on the pump nozzles, not after valves or strainers."},

          {id:"fanperf",g:"tab",icon:"fanperf",name:"Fan performance",short:"Air power, fan efficiency and SFP",
           intro:"Enter the measured airflow, fan pressure and motor input power. You get fan efficiency and specific fan power (SFP).",
           fields:[
            {id:"Q",label:"Measured airflow",type:"num",def:"12000",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"P",label:"Fan total pressure",help:"Across the fan, or ESP plus internal losses.",type:"num",def:"650",unit:"Pa"},
            {id:"kw",label:"Motor input power",type:"num",def:"3.9",unit:"kW",half:true},
            {id:"me",label:"Motor efficiency",type:"num",def:"90",unit:"%",half:true},
            {id:"dr",label:"Drive",type:"chips",def:"0.95",options:[["1","Direct / plug fan"],["0.95","Belt drive"]]}
           ],
           calc(v){
            const Q=airQ(v,"Q"),P=num(v.P),kw=num(v.kw),me=num(v.me)/100,dr=num(v.dr)||1;if(!(Q>0&&P>0))return{hint:"Enter the airflow and fan pressure."};
            const Pa=Q*P/1000,eff=kw>0&&me>0?Pa/(kw*me*dr):NaN,sfp=kw>0?kw/Q:NaN;
            const cat=!isFinite(sfp)?"—":sfp<=0.5?"SFP 1":sfp<=0.75?"SFP 2":sfp<=1.25?"SFP 3":sfp<=2?"SFP 4":sfp<=3?"SFP 5":sfp<=4.5?"SFP 6":"SFP 7";
            return{cap:"Fan efficiency",value:isFinite(eff)?f(eff*100,0):"—",unit:"%",status:isFinite(sfp)?{ok:sfp<=2,text:`${f(sfp,2)} kW per m³/s (${cat})`}:null,
             say:`The fan moves ${f(Q*1000,0)} L/s at ${f(P,0)} Pa, which is ${B(f(Pa,2),"kW")} of air power.`+(isFinite(eff)?` Fan efficiency is ${B(f(eff*100,0),"%")} and specific fan power is ${B(f(sfp,2),"kW/(m³/s)")}, category ${cat}.`:"")+(eff<0.5?" Low efficiency points to the fan running far from its best point, wrong rotation, or inlet or outlet losses.":""),
             rows:[["Air power",f(Pa,2),"kW"],["SFP",isFinite(sfp)?f(sfp,2):"—","kW/(m³/s)"],["SFP category (EN 16798-3)",cat,""],["Shaft power",kw>0?f(kw*me,2):"—","kW"]]};
           },
           note:"Air power = Q × p. Fan efficiency = air power ÷ (input × motor × drive efficiency). SFP = electrical input ÷ airflow; lower is better."},

          {id:"hrec",g:"tab",icon:"hrec",name:"Heat recovery effectiveness",short:"Thermal wheel or plate exchanger",
           intro:"Enter the outdoor air, supply air after recovery and extract air temperatures. You get the temperature effectiveness and the heat recovered.",
           fields:[
            {id:"t21",label:"Outdoor air entering",type:"num",def:"44",unit:"°C",half:true},
            {id:"t22",label:"Supply air after recovery",type:"num",def:"31.5",unit:"°C",half:true},
            {id:"t11",label:"Extract air entering",type:"num",def:"24",unit:"°C",half:true},
            {id:"Qs",label:"Supply airflow",type:"num",def:"5000",units:["m³/h","CFM","L/s"],udef:"m³/h",half:true},
            {id:"spec",label:"Datasheet effectiveness",type:"num",def:"65",unit:"%",adv:true}
           ],
           calc(v){
            const a=num(v.t21),b=num(v.t22),c=num(v.t11),Q=airQ(v,"Qs"),sp=num(v.spec);if(![a,b,c].every(isFinite))return{hint:"Enter all three temperatures."};
            if(Math.abs(a-c)<5)return{hint:"Outdoor and extract air need at least 5 K difference for a reliable result. Test on a hotter (or colder) day."};
            const e=(b-a)/(c-a),kw=Q>0?1.2*Q*1.006*Math.abs(b-a):NaN;
            return{cap:"Temperature effectiveness",value:f(e*100,0),unit:"%",status:sp>0?{ok:e*100>=sp*0.9,text:`${f(e*100/sp*100,0)} % of datasheet`}:null,
             say:`The recovery unit brings the outdoor air ${f(Math.abs(b-a),1)} K of the way toward extract air out of ${f(Math.abs(c-a),1)} K possible, an effectiveness of ${B(f(e*100,0),"%")}.`+(Q>0?` It recovers about ${B(f(kw,1),"kW")} (${f(kw/3.517,2)} TR).`:"")+(sp>0&&e*100<sp*0.9?" Below datasheet: check wheel speed and belt, bypass dampers, seals and that supply and extract flows are balanced.":""),
             rows:[["Recovered",f(kw,1),"kW"],["Temperature change",f(b-a,1),"K"],["Available difference",f(c-a,1),"K"]]};
           },
           note:"EN 308 supply-side temperature efficiency η = (t22 − t21) ÷ (t11 − t21), valid with balanced supply and extract airflow. Sensible only; enthalpy wheels also recover moisture."},

          {id:"filt",g:"tab",icon:"filt",name:"Filter pressure drop",short:"How loaded is the filter?",
           intro:"Enter the clean, final and current pressure drop. You find how loaded the filter is and when to change it.",
           fields:[
            {id:"c",label:"Clean (initial) pressure drop",help:"From the filter label or datasheet at design airflow.",type:"num",def:"90",unit:"Pa",half:true},
            {id:"fn",label:"Final (change) pressure drop",type:"num",def:"250",unit:"Pa",half:true},
            {id:"m",label:"Reading now",type:"num",def:"185",unit:"Pa"},
            {id:"qp",label:"Airflow at time of reading",type:"num",def:"100",unit:"% of design",adv:true}
           ],
           calc(v){
            const c=num(v.c),fn=num(v.fn),qp=(num(v.qp)||100)/100;let m=num(v.m);if(!(c>0&&fn>c))return{hint:"Enter clean and final pressure drops (final higher than clean)."};if(!(m>=0))return{hint:"Enter the reading."};
            const mc=m/Math.pow(qp,1.3),load=(mc-c)/(fn-c)*100;
            return{cap:"Filter loading",value:f(Math.max(load,0),0),unit:"%",status:{ok:load<80,text:load>=100?"Change now":load>=80?"Change soon":"OK"},
             say:`At design airflow the filter reads about ${B(f(mc,0),"Pa")}, which is ${B(f(Math.max(load,0),0),"%")} of the way from clean to final.`+(load>=100?" It is at or past final pressure drop: change it.":load>=80?" Order replacements.":"")+(mc<c*0.8?" Lower than clean: the filter may be missing, bypassing or damaged, or the gauge tubes are swapped.":""),
             rows:[["Corrected reading",f(mc,0),"Pa"],["Clean",f(c,0),"Pa"],["Final",f(fn,0),"Pa"],["Margin left",f(fn-mc,0),"Pa"]]};
           },
           note:"Readings at reduced airflow are corrected with ΔP ∝ Q^1.3. During TAB, test with clean filters and design for the mid-life or final ΔP, as the spec requires."},

          {id:"faceu",g:"tab",icon:"faceu",name:"Face velocity uniformity",short:"Spread across a coil or filter face",
           intro:"Enter the velocity grid readings across the coil or filter face. You get the average, the spread and pass or fail.",
           fields:[
            {id:"r",label:"Velocity readings",help:"Separated by spaces or commas.",type:"text",def:"2.1 2.3 2.2 2.0 2.4 2.5 2.3 2.1 1.9 2.2 2.4 2.3"},
            {id:"tol",label:"Allowed deviation from average",type:"num",def:"20",unit:"± %"},
            {id:"vmax",label:"Maximum face velocity",help:"Cooling coils about 2.5 m/s to avoid water carry-over.",type:"num",def:"2.5",unit:"m/s",adv:true},
            {id:"A",label:"Face area (optional)",type:"num",def:"",unit:"m²",adv:true}
           ],
           calc(v){
            const r=numsOf(v.r),tol=num(v.tol)||20,vm=num(v.vmax),A=num(v.A);if(r.length<3)return{hint:"Enter at least three readings."};
            const av=r.reduce((a,b)=>a+b,0)/r.length,dv=r.map(x=>(x-av)/av*100),mx=Math.max(...dv.map(Math.abs)),out=dv.filter(x=>Math.abs(x)>tol).length,hi=Math.max(...r);
            const ok=out===0&&!(vm>0&&hi>vm);
            return{cap:"Average face velocity",value:f(av,2),unit:"m/s",status:{ok,text:ok?"Uniform":"Not uniform"},
             say:`Average is ${B(f(av,2),"m/s")} and the worst point is ${B(f(mx,0),"%")} from it.`+(out?` ${out} point(s) are outside ±${tol} %: check for blocked fins, gaps, bypass, or a poor inlet.`:` All points are within ±${tol} %.`)+(vm>0&&hi>vm?` The highest reading ${f(hi,2)} m/s is above ${f(vm,1)} m/s.`:"")+(A>0?` Airflow is about ${f(av*A*3600,0)} m³/h.`:""),
             rows:[["Points",r.length,""],["Highest",f(hi,2),"m/s"],["Lowest",f(Math.min(...r),2),"m/s"],["Max deviation",f(mx,1),"%"],["Airflow",A>0?f(av*A*1000,0):"—","L/s"]],
             after:tbl(["Point","m/s","From average"],r.map((x,i)=>({cls:Math.abs(dv[i])>tol?"sel":"",c:[i+1,f(x,2),(dv[i]>=0?"+":"")+f(dv[i],0)+" %"]})))};
           },
           note:"Take an even grid (about one point per 0.1–0.2 m²) about 150 mm from the face. ±20 % of average is a common acceptance; HEPA and cleanroom specs may be tighter."},

          {id:"sound",g:"tab",icon:"sound",name:"Sound level",short:"Add dB, background correction, NC rating",
           intro:"Add sound levels together, take off background noise, or rate a room from octave-band readings.",
           fields:[
            {id:"mode",label:"What do you need?",type:"chips",def:"nc",options:[["nc","NC rating"],["bg","Background correction"],["add","Add sources"]]},
            {id:"oct",label:"Octave-band levels 63 to 8000 Hz",help:"8 readings in dB, separated by spaces.",type:"text",def:"58 52 46 41 37 33 30 27",show:v=>v.mode==="nc"},
            {id:"tgt",label:"Room target",type:"num",def:"40",unit:"NC",show:v=>v.mode==="nc",presets:[["30","Office 30–35"],["40","Control room 40"],["45","Workshop 45"]]},
            {id:"Lt",label:"Level with the equipment running",type:"num",def:"48",unit:"dB",half:true,show:v=>v.mode==="bg"},
            {id:"Lb",label:"Background with it off",type:"num",def:"43",unit:"dB",half:true,show:v=>v.mode==="bg"},
            {id:"L",label:"Levels to add",help:"Separated by spaces.",type:"text",def:"45 45 42",show:v=>v.mode==="add"}
           ],
           calc(v){
            const lg=x=>10*Math.log10(x);
            if(v.mode==="add"){const L=numsOf(v.L);if(!L.length)return{hint:"Enter the levels to add."};const T=lg(L.reduce((a,b)=>a+Math.pow(10,b/10),0));
             return{cap:"Combined level",value:f(T,1),unit:"dB",say:`Together the ${L.length} sources give ${B(f(T,1),"dB")}. Two equal sources add 3 dB; a source 10 dB quieter adds almost nothing.`,rows:[["Loudest single source",f(Math.max(...L),1),"dB"]]};}
            if(v.mode==="bg"){const Lt=num(v.Lt),Lb=num(v.Lb);if(!isFinite(Lt)||!isFinite(Lb))return{hint:"Enter both readings."};const d=Lt-Lb;
             if(d<3)return{cap:"Equipment level",big:"Cannot separate",status:{ok:false,text:`Only ${f(d,1)} dB above background`},say:"The equipment is less than 3 dB above background, so its level can't be measured reliably. Measure when the background is quieter (night shift, other plant off)."};
             const Ls=lg(Math.pow(10,Lt/10)-Math.pow(10,Lb/10));
             return{cap:"Equipment alone",value:f(Ls,1),unit:"dB",say:`With ${f(d,1)} dB between running and background, the equipment alone is ${B(f(Ls,1),"dB")}.`+(d>=10?" Over 10 dB difference, background makes almost no difference.":""),rows:[["Correction",f(Lt-Ls,1),"dB"]]};}
            const o=numsOf(v.oct);if(o.length!==8)return{hint:`Enter 8 octave-band readings (63 to 8000 Hz). You have ${o.length}.`};
            const NC={15:[47,36,29,22,17,14,12,11],20:[51,40,33,26,22,19,17,16],25:[54,44,37,31,27,24,22,21],30:[57,48,41,35,31,29,28,27],35:[60,52,45,40,36,34,33,32],40:[64,56,50,45,41,39,38,37],45:[67,60,54,49,46,44,43,42],50:[71,64,58,54,51,49,48,47],55:[74,67,62,58,56,54,53,52],60:[77,71,67,63,61,59,58,57],65:[80,75,71,68,66,64,63,62]};
            const ks=Object.keys(NC).map(Number),band=[63,125,250,500,1000,2000,4000,8000];
            const per=o.map((L,i)=>{if(L<=NC[15][i])return 15;for(let j=1;j<ks.length;j++){const a=NC[ks[j-1]][i],b=NC[ks[j]][i];if(L<=b)return ks[j-1]+5*(L-a)/(b-a);}return 65+5*(L-NC[65][i])/(NC[65][i]-NC[60][i]);});
            const nc=Math.max(...per),bi=per.indexOf(nc),tg=num(v.tgt),ok=!(tg>0)||nc<=tg;
            return{cap:"Room rating",value:"NC "+f(Math.ceil(nc),0),unit:"",status:tg>0?{ok,text:ok?`Meets NC ${tg}`:`Above NC ${tg}`}:null,
             say:`The room rates ${B("NC "+f(Math.ceil(nc),0))}, set by the ${band[bi]} Hz band.`+(band[bi]<=250&&!ok?" Low-frequency noise usually comes from fans and duct rumble: check fan speed, flexible connections and duct velocity.":(!ok?" Mid and high-frequency noise usually comes from diffusers, dampers or high air velocity.":"")),
             after:tbl(["Band Hz","dB","NC in band"],band.map((b,i)=>({cls:i===bi?"sel":"",c:[b,f(o[i],0),f(Math.ceil(per[i]),0)]})))};
           },
           note:"Decibels add logarithmically: L = 10 log Σ10^(L/10). NC uses the tangency method on 63–8000 Hz octave bands. Measure at 1.2 m height, away from walls, per the project acoustic spec."},

          {id:"door",g:"tab",icon:"door",name:"Door opening force",short:"Pressurised stair and lobby doors",
           intro:"Enter the door size, the pressure difference and the door closer force. You get the force needed at the handle and the maximum pressure the door can take.",
           fields:[
            {id:"W",label:"Door width",type:"num",def:"0.9",unit:"m",half:true},
            {id:"H",label:"Door height",type:"num",def:"2.1",unit:"m",half:true},
            {id:"dp",label:"Pressure difference across the door",type:"num",def:"50",unit:"Pa"},
            {id:"Fc",label:"Door closer force",help:"Measure with a force gauge with no pressure, or use the closer data.",type:"num",def:"40",unit:"N",half:true},
            {id:"d",label:"Handle to latch edge",type:"num",def:"0.075",unit:"m",half:true},
            {id:"lim",label:"Maximum force allowed",type:"chips",def:"100",options:[["100","100 N (EN 12101-6)"],["133","133 N (NFPA 101 / 92)"]]}
           ],
           calc(v){
            const W=num(v.W),H=num(v.H),dp=num(v.dp),Fc=num(v.Fc)||0,d=num(v.d)||0.075,lim=num(v.lim);if(!(W>d&&H>0))return{hint:"Enter the door width and height."};if(!(dp>=0))return{hint:"Enter the pressure difference."};
            const A=W*H,k=W*A/(2*(W-d)),F=Fc+k*dp,dpmax=(lim-Fc)/k,ok=F<=lim;
            return{cap:"Force at the handle",value:f(F,0),unit:"N",status:{ok,text:ok?`Within ${lim} N`:`Over ${lim} N`},
             say:`At ${f(dp,0)} Pa, opening this ${f(W,2)} × ${f(H,2)} m door takes about ${B(f(F,0),"N")} (${f(F/9.81,1)} kgf). The most pressure difference this door can take and stay within ${lim} N is ${B(f(dpmax,0),"Pa")}.`+(ok?"":" Reduce the pressure with a relief damper or VFD control, or use a lighter door closer."),
             rows:[["Force from pressure",f(k*dp,0),"N"],["Closer force",f(Fc,0),"N"],["Door area",f(A,2),"m²"],["Maximum pressure difference",f(dpmax,0),"Pa"]]};
           },
           note:"F = Fdc + W·A·ΔP ÷ (2(W − d)) (NFPA 92 / EN 12101-6). Test with all other doors in the stair closed and the system running in fire mode, then with the fire floor door open."},

          {id:"gtd",g:"tab",icon:"gtd",name:"Damper leakage test",short:"Gas-tight or fire damper leakage per m²",
           intro:"Enter the leakage you measured, the damper size and test pressure. You get leakage per m² and pass or fail against the class.",
           fields:[
            {id:"Q",label:"Measured leakage",type:"num",def:"3.2",units:["L/s","m³/h","CFM"],udef:"L/s"},
            {id:"W",label:"Damper width",type:"num",def:"600",unit:"mm",half:true},
            {id:"H",label:"Damper height",type:"num",def:"400",unit:"mm",half:true},
            {id:"P",label:"Pressure during test",type:"num",def:"1000",unit:"Pa",half:true},
            {id:"cls",label:"Acceptance",type:"select",def:"spec",options:[["spec","Project spec (enter below)"],["15.2|250","AMCA 511 Class 1A (15.2 L/s·m² at 250 Pa)"],["20.3|250","AMCA 511 Class 1 (20.3 L/s·m² at 250 Pa)"],["50.8|250","AMCA 511 Class 2 (50.8 L/s·m² at 250 Pa)"]]},
            {id:"lim",label:"Spec limit",type:"num",def:"5",unit:"L/s per m²",half:true,show:v=>v.cls==="spec"},
            {id:"Pl",label:"at pressure",type:"num",def:"1000",unit:"Pa",half:true,show:v=>v.cls==="spec"}
           ],
           calc(v){
            const Q=num(v.Q)*({"L/s":1,"m³/h":1/3.6,"CFM":0.471947}[v.Q_u]||1),A=num(v.W)*num(v.H)/1e6,P=num(v.P);if(!(Q>=0&&A>0&&P>0))return{hint:"Enter the leakage, damper size and test pressure."};
            let lim,Pl;if(v.cls==="spec"){lim=num(v.lim);Pl=num(v.Pl);}else[lim,Pl]=String(v.cls).split("|").map(Number);if(!(lim>0&&Pl>0))return{hint:"Enter the spec limit and its pressure."};
            const q=Q/A,qc=q*Math.pow(Pl/P,0.65),ok=qc<=lim;
            return{cap:"Leakage per m²",value:f(q,2),unit:"L/s·m²",status:{ok,text:ok?"Pass":"Fail"},
             say:`${f(Q,2)} L/s through ${f(A,3)} m² is ${B(f(q,2),"L/s per m²")} at ${f(P,0)} Pa.`+(Pl!==P?` Corrected to ${f(Pl,0)} Pa that is ${f(qc,2)} L/s per m².`:"")+` The limit is ${f(lim,2)}, so it ${ok?"passes":"fails: check blade and jamb seals, linkage adjustment and actuator end position"}.`,
             rows:[["Leakage at limit pressure",f(qc,2),"L/s·m²"],["Limit",f(lim,2),"L/s·m²"],["Damper area",f(A,3),"m²"],["Allowed total",f(lim*A,2),"L/s"]]};
           },
           note:"Leakage scales with pressure^0.65 when correcting to a different test pressure. Gas-tight dampers on LER, substation and CCR intakes usually have a project-specific limit; use that."},

          {id:"calib",g:"tab",icon:"calib",name:"Instrument calibration check",short:"5-point error against tolerance",
           intro:"Enter the instrument range, the reference values you applied and what the instrument read. You get the error at each point and pass or fail.",
           fields:[
            {id:"lo",label:"Range low",type:"num",def:"0",unit:"",half:true},
            {id:"hi",label:"Range high",type:"num",def:"500",unit:"",half:true},
            {id:"ref",label:"Reference values applied",type:"text",def:"0 125 250 375 500"},
            {id:"rd",label:"Instrument readings",type:"text",def:"0.8 126.1 250.9 376.2 501.4"},
            {id:"tol",label:"Tolerance",type:"num",def:"0.5",unit:"% of span"}
           ],
           calc(v){
            const lo=num(v.lo),hi=num(v.hi),R=numsOf(v.ref),M=numsOf(v.rd),tol=num(v.tol)||0.5,sp=hi-lo;if(!(sp>0))return{hint:"Enter a range with high above low."};
            if(!R.length||R.length!==M.length)return{hint:`Enter the same number of reference values and readings (${R.length} and ${M.length}).`};
            const e=M.map((m,i)=>(m-R[i])/sp*100),mx=Math.max(...e.map(Math.abs)),ok=mx<=tol;
            return{cap:"Largest error",value:f(mx,2),unit:"% of span",status:{ok,text:ok?"As found: pass":"As found: fail"},
             say:`The worst point is ${B(f(mx,2),"%")} of span against a tolerance of ±${f(tol,2)} %.`+(ok?"":" Adjust zero and span, then repeat the check and record as-left values.")+(e.every(x=>x>0)||e.every(x=>x<0)?" All errors are on one side, which points to a zero offset.":""),
             rows:[["Span",f(sp),""],["Tolerance",f(tol*sp/100,3),"units"]],
             after:tbl(["Point","Reference","Reading","Error % span","4–20 mA expected"],R.map((r,i)=>({cls:Math.abs(e[i])>tol?"sel":"",c:[i+1,f(r,3),f(M[i],3),(e[i]>=0?"+":"")+f(e[i],2),f(4+16*(r-lo)/sp,2)]})))};
           },
           note:"Check at 0, 25, 50, 75 and 100 % of range, rising then falling for hysteresis. The reference must be at least 3–4 times more accurate than the instrument. Record as-found and as-left."},
          {id:"grille",g:"hvac",icon:"grille",name:"Grille & diffuser size",short:"Neck size from airflow",
           intro:"Enter the airflow and pick the outlet type. You get the size to use and its velocity.",
           fields:[
            {id:"Q",label:"Airflow per outlet",type:"num",def:"500",units:["m³/h","CFM","L/s"],udef:"m³/h"},
            {id:"t",label:"Outlet type",type:"chips",def:"3",options:[["3","Ceiling diffuser (quiet)"],["3.5","Ceiling diffuser (office)"],["2.5","Supply grille"],["2","Return grille"],["1.5","Transfer / door grille"]]},
            {id:"fa",label:"Free area of the grille",type:"num",def:"75",unit:"%",adv:true}
           ],
           calc(v){
            const Q=airQ(v,"Q"),vm=num(v.t),fa=(num(v.fa)||75)/100;if(!(Q>0))return{hint:"Enter the airflow."};
            const neck=v.t==="3"||v.t==="3.5",Aneed=Q/vm/(neck?1:fa),SZ=[150,200,225,250,300,375,450,525,600,750,900];
            const s=SZ.find(x=>(x/1000)**2>=Aneed)||Math.ceil(Math.sqrt(Aneed)*1000/50)*50,va=Q/((s/1000)**2*(neck?1:fa));
            const rect=[[300,150],[400,150],[400,200],[500,200],[600,200],[500,300],[600,300],[800,300],[1000,300],[800,400],[1000,400],[1200,400]].find(([a,b])=>a*b/1e6*fa>=Q/vm);
            return{cap:neck?"Diffuser neck size":"Grille size",value:`${s} × ${s}`,unit:"mm",
             say:`Use a ${B(s+" × "+s,"mm")} ${neck?"neck":"grille"}. ${neck?"Neck":"Free-area"} velocity will be about ${f(va,2)} m/s, against a limit of ${f(vm,1)} m/s for quiet operation.`+(!neck&&rect?` A rectangular option is ${B(rect[0]+" × "+rect[1],"mm")}.`:""),
             rows:[["Area needed",f(Aneed,3),"m²"],["Velocity",f(va,2),"m/s"],["Airflow",f(Q*1000,0),"L/s"]]};
           },
           note:"Face or neck velocity limits keep noise down (about NC 30–35). Check throw and noise in the maker's catalogue for the final choice."},

          {id:"oa621",g:"hvac",icon:"oa",name:"Fresh air (ASHRAE 62.1)",short:"Outdoor air from people and area",
           intro:"Pick the space type and enter the people and floor area. You get the outdoor air the room needs.",
           fields:[
            {id:"sp",label:"Space type",type:"select",def:"2.5|0.3",options:[["2.5|0.3","Office / control room"],["2.5|0.3|c","Meeting room"],["5|0.6","Classroom (age 9+)"],["3.8|0.6","Retail / sales"],["3.8|0.9","Restaurant dining"],["2.5|0.3|h","Hotel bedroom"],["10|0.3","Gym"],["3.8|0.3","Lobby / reception"],["0|0.3","Corridor"]]},
            {id:"Pz",label:"People",type:"num",def:"12",unit:"people",half:true},
            {id:"Az",label:"Floor area",type:"num",def:"120",unit:"m²",half:true},
            {id:"Ez",label:"Air distribution",type:"chips",def:"1",options:[["1","Ceiling supply, cool air"],["0.8","Ceiling supply, warm air"],["1.2","Floor supply (UFAD)"]],adv:true}
           ],
           calc(v){
            const[rp,ra]=String(v.sp).split("|").map(Number),P=num(v.Pz)||0,A=num(v.Az)||0,Ez=num(v.Ez)||1;if(!(P>0||A>0))return{hint:"Enter the people or the floor area."};
            const Vbz=rp*P+ra*A,Voz=Vbz/Ez;
            return{cap:"Outdoor air needed",value:f(Voz,0),unit:"L/s",
             say:`${f(P)} people × ${rp} L/s plus ${f(A)} m² × ${ra} L/s/m² gives ${B(f(Voz,0),"L/s")} (${f(Voz*3.6,0)} m³/h) of outdoor air.`+(P>0?` That is ${f(Voz/P,1)} L/s per person.`:""),
             rows:[["Outdoor air",f(Voz*3.6,0),"m³/h"],["Outdoor air",f(Voz*2.11888,0),"CFM"],["People part",f(rp*P/Ez,0),"L/s"],["Area part",f(ra*A/Ez,0),"L/s"]]};
           },
           note:"ASHRAE 62.1 ventilation rate procedure: Vbz = Rp·Pz + Ra·Az, Voz = Vbz ÷ Ez. Local codes and the project spec may need more."},

          {id:"batt",g:"hvac",icon:"batt",name:"Battery room ventilation",short:"Hydrogen extract to IEC 62485-2",
           intro:"Enter the battery type, number of cells and capacity. You get the extract airflow needed to keep hydrogen below the safe limit.",
           fields:[
            {id:"bt",label:"Battery type",type:"chips",def:"vrla",options:[["vrla","VRLA (sealed lead-acid)"],["vla","Vented lead-acid"],["nicd","Vented NiCd"]]},
            {id:"ch",label:"Charging condition",type:"chips",def:"f",options:[["f","Float"],["b","Boost"]]},
            {id:"n",label:"Number of cells",help:"Lead-acid cells are 2 V, NiCd 1.2 V. A 110 V lead-acid bank has about 55 cells.",type:"num",def:"55",unit:"cells",half:true},
            {id:"C",label:"Capacity (C10 / C5)",type:"num",def:"300",unit:"Ah",half:true}
           ],
           calc(v){
            const n=num(v.n),C=num(v.C);if(!(n>0&&C>0))return{hint:"Enter the number of cells and the capacity."};
            const Ig={vrla:{f:1,b:8},vla:{f:5,b:20},nicd:{f:5,b:50}}[v.bt][v.ch],Q=0.05*n*Ig*C/1000,ls=Q/3.6;
            return{cap:"Extract airflow needed",value:f(Q,1),unit:"m³/h",
             say:`${f(n)} cells of ${f(C)} Ah on ${v.ch==="f"?"float":"boost"} charge give off hydrogen that needs ${B(f(Q,1),"m³/h")} (${f(ls,2)} L/s) of extract air. For natural ventilation, inlet and outlet openings of at least ${B(f(28*Q,0),"cm²")} each are needed.`,
             rows:[["Airflow",f(ls,2),"L/s"],["Airflow",f(Q*0.588578,1),"CFM"],["Gas current Igas",f(Ig,0),"mA/Ah"],["Natural vent area",f(28*Q,0),"cm²"]]};
           },
           note:"IEC 62485-2: Q = 0.05 × n × Igas × Crt × 10⁻³ m³/h. Natural ventilation area A = 28 × Q cm². Locate the extract at high level; hydrogen rises. Your project spec and C&E for the battery room govern."},

          {id:"btemp",g:"hvac",icon:"btemp",name:"Battery temperature",short:"Life at temperature, charge voltage, room cooling",
           intro:"Batteries last longest at 20–25 °C. Check how heat shortens life, the charge voltage to set for the temperature, and the cooling a battery room needs.",
           fields:[
            {id:"mode",label:"What do you need?",type:"chips",def:"room",options:[["room","Room heat & cooling"],["life","Life at temperature"],["comp","Charge voltage"]]},
            {id:"bt",label:"Battery type",type:"chips",def:"vrla",options:[["vrla","VRLA (sealed lead-acid)"],["vla","Vented lead-acid"],["nicd","Vented NiCd"],["li","Lithium-ion"]],onSet:v=>{v.vf={vrla:"2.27",vla:"2.23",nicd:"1.42",li:"3.40"}[v.bt];}},
            {id:"n",label:"Number of cells",type:"num",def:"55",unit:"cells",half:true,show:v=>v.mode!=="life"},
            {id:"C",label:"Capacity",type:"num",def:"300",unit:"Ah",half:true,show:v=>v.mode==="room"},
            {id:"vf",label:"Float voltage per cell at reference temperature",help:"From the battery datasheet.",type:"num",def:"2.27",unit:"V/cell",show:v=>v.mode==="comp"},
            {id:"Tb",label:"Battery temperature",type:"num",def:"35",unit:"°C",show:v=>v.mode!=="room"},
            {id:"yrs",label:"Design life at 20–25 °C",type:"num",def:"10",unit:"years",show:v=>v.mode==="life"},
            {id:"ch",label:"Charging state",type:"chips",def:"f",options:[["f","Float"],["b","Boost / equalise"]],show:v=>v.mode==="room"},
            {id:"oth",label:"Charger, UPS and other heat in the room",help:"From the charger or UPS datasheet (losses), plus lights.",type:"num",def:"1.2",unit:"kW",show:v=>v.mode==="room"},
            {id:"A",label:"Wall and roof area exposed to outside",type:"num",def:"40",unit:"m²",half:true,show:v=>v.mode==="room"},
            {id:"U",label:"Average U-value",type:"num",def:"0.6",unit:"W/m²K",half:true,show:v=>v.mode==="room"},
            {id:"Q",label:"Extract airflow",help:"Use the Battery room ventilation tool. The same amount of outdoor air comes in.",type:"num",def:"150",unit:"m³/h",show:v=>v.mode==="room"},
            {id:"To",label:"Outdoor design temperature",type:"num",def:"46",unit:"°C",half:true,show:v=>v.mode==="room"},
            {id:"Tr",label:"Room target",type:"num",def:"25",unit:"°C",half:true,show:v=>v.mode==="room"}
           ],
           calc(v){
            const bt=v.bt,NM={vrla:"VRLA",vla:"vented lead-acid",nicd:"NiCd",li:"lithium-ion"}[bt];
            if(v.mode==="life"){
             const T=num(v.Tb),y=num(v.yrs);if(!isFinite(T))return{hint:"Enter the battery temperature."};
             const base=bt==="nicd"?20:25,halfK={vrla:8.3,vla:8.3,nicd:20,li:15}[bt],fac=T<=base?1:Math.pow(0.5,(T-base)/halfK);
             const rws=[20,25,30,35,40,45,50].map(t=>({cls:Math.abs(t-T)<2.5?"sel":"",c:[t+" °C",f((t<=base?1:Math.pow(0.5,(t-base)/halfK))*100,0)+" %",y>0?f(y*(t<=base?1:Math.pow(0.5,(t-base)/halfK)),1)+" yrs":"—"]}));
             return{cap:"Expected life",value:y>0?f(y*fac,1):f(fac*100,0),unit:y>0?"years":"% of rated",status:{ok:fac>=0.7,text:fac>=0.95?"Good temperature":fac>=0.7?"Some life lost":"Large life loss"},
              say:`A ${NM} battery kept at ${f(T,1)} °C lasts about ${B(f(fac*100,0),"%")} of its rated life`+(y>0?`, so ${B(f(y*fac,1),"years")} instead of ${f(y,0)}.`:".")+(T>base?` Every ${f(halfK,0)} K above ${base} °C roughly halves ${bt==="nicd"?"remaining ":""}life. Keep the room at 20–25 °C with air conditioning.`:" That is at or below the reference temperature, so no life is lost to heat."),
              rows:[["Life factor",f(fac,2),"×"],["Reference temperature",base,"°C"],["Halves every",f(halfK,1),"K"]],after:tbl(["Room temperature","Life","Years"],rws)};
            }
            if(v.mode==="comp"){
             const n=num(v.n),T=num(v.Tb),vf=num(v.vf);if(!(n>0&&vf>0))return{hint:"Enter the cells and float voltage."};if(!isFinite(T))return{hint:"Enter the battery temperature."};
             if(bt==="li")return{cap:"Charge voltage",value:f(n*vf,1),unit:"V",say:`Lithium-ion batteries are not temperature-compensated: the battery management system (BMS) controls charging. Keep the float at ${B(f(n*vf,1),"V")} and the room at 15–30 °C. Charging below 0 °C damages the cells.`,rows:[["Per cell",f(vf,3),"V"]]};
             const ref=bt==="nicd"?20:25,k={vrla:-0.003,vla:-0.0025,nicd:-0.0025}[bt],Tc=Math.min(Math.max(T,0),45),vc=vf+k*(Tc-ref);
             return{cap:"Float voltage to set",value:f(n*vc,1),unit:"V",
              say:`At ${f(T,1)} °C, set the charger to ${B(f(vc,3),"V per cell")}, which is ${B(f(n*vc,1),"V")} for ${f(n,0)} cells (${f(n*vf,1)} V at ${ref} °C). Too high in a hot room overcharges and dries out the battery; too low in a cold room undercharges it.`+(T!==Tc?" Compensation is usually limited to 0–45 °C, so that limit is applied.":""),
              rows:[["Per cell",f(vc,3),"V"],["Change",f((vc-vf)*n,2),"V"],["Compensation",f(k*1000,1),"mV/°C/cell"],["Reference",ref,"°C"]]};
            }
            const n=num(v.n),C=num(v.C),oth=(num(v.oth)||0)*1000,A=num(v.A)||0,U=num(v.U)||0,Qa=num(v.Q)||0,To=num(v.To),Tr=num(v.Tr);
            if(!(n>0&&C>0))return{hint:"Enter the cells and capacity."};if(!isFinite(To)||!isFinite(Tr))return{hint:"Enter the outdoor and room temperatures."};
            const vc={vrla:2.27,vla:2.23,nicd:1.42,li:3.4}[bt],mA={vrla:{f:1,b:8},vla:{f:1,b:4},nicd:{f:1,b:10},li:{f:0.05,b:0.05}}[bt][v.ch];
            const Pb=n*vc*mA*C/1000,Pw=U*A*(To-Tr),Pv=1.2*Qa/3600*1006*(To-Tr),tot=Pb+oth+Pw+Pv,tr=tot/3517;
            const Tfree=Qa>0?To+(Pb+oth)/(1.2*Qa/3600*1006):NaN;
            return{cap:"Cooling needed",value:f(tot/1000,2),unit:"kW",status:{ok:true,text:`${f(tr,2)} TR to hold ${f(Tr,0)} °C`},
             say:`The batteries give off about ${B(f(Pb,0),"W")} on ${v.ch==="f"?"float":"boost"} charge. With the charger and UPS (${f(oth/1000,1)} kW), wall gains and the hot outdoor air drawn in by the extract fan, the room needs ${B(f(tot/1000,2),"kW")} (${f(tr,2)} TR) of cooling to stay at ${f(Tr,0)} °C.`+(isFinite(Tfree)?` With ventilation only and no AC, the room would reach about ${B(f(Tfree,0),"°C")}.`:"")+" Use AC sized for this, with the extract fan still running for hydrogen.",
             rows:[["Battery heat",f(Pb,0),"W"],["Charger / UPS / lights",f(oth,0),"W"],["Walls and roof",f(Pw,0),"W"],["Ventilation air",f(Pv,0),"W"],["Total",f(tot,0),"W"],["Total",f(tot*3.412,0),"BTU/h"],["Room with ventilation only",isFinite(Tfree)?f(Tfree,0):"—","°C"]]};
           },
           note:"Life: lead-acid roughly halves for every 8–10 K above 25 °C (IEEE 1188 / Eurobat), NiCd about every 20 K above 20 °C, lithium about every 15 K. Charge compensation: VRLA −3, vented lead-acid and NiCd −2.5 mV/°C per cell. Battery heat uses the float or boost current per IEC 62485-2. Always follow the battery maker's data."},
          {id:"kv",g:"hvac",icon:"kv",name:"Valve Kv / Cv",short:"Size a valve, or flow from ΔP",
           intro:"Size a control or balancing valve, or find the flow through a balancing valve from its ΔP reading.",
           fields:[
            {id:"mode",label:"What do you need?",type:"chips",def:"size",options:[["size","Size a valve"],["flow","Flow from ΔP"]]},
            {id:"Q",label:"Water flow",type:"num",def:"1.2",units:uu("flow"),udef:"L/s",show:v=>v.mode==="size"},
            {id:"dp",label:"Pressure drop across the valve",type:"num",def:"25",unit:"kPa"},
            {id:"kv",label:"Valve Kv at its current setting",type:"num",def:"6.3",unit:"",show:v=>v.mode==="flow"},
            {id:"dc",label:"Pressure drop of coil and branch",help:"For valve authority.",type:"num",def:"30",unit:"kPa",adv:true,show:v=>v.mode==="size"}
           ],
           calc(v){
            const dp=num(v.dp);if(!(dp>0))return{hint:"Enter the pressure drop across the valve."};
            if(v.mode==="flow"){const kv=num(v.kv);if(!(kv>0))return{hint:"Enter the valve Kv."};const q=kv*Math.sqrt(dp/100);
             return{cap:"Flow through valve",value:f(q/3.6,3),unit:"L/s",say:`With Kv ${f(kv)} and ${f(dp)} kPa across the test points, flow is ${B(f(q,2),"m³/h")} (${f(q/3.6,3)} L/s).`,rows:[["Flow",f(q,2),"m³/h"],["Flow",f(q*4.40287,1),"US GPM"]]};}
            const Q=si(v,"Q","flow");if(!(Q>0))return{hint:"Enter the flow."};const qh=Q*3600,kv=qh/Math.sqrt(dp/100);
            const STD=[0.25,0.4,0.63,1,1.6,2.5,4,6.3,10,16,25,40,63,100,160,250,400,630];const kvs=STD.find(x=>x>=kv)||kv,dpn=(qh/kvs)**2*100,dc=num(v.dc),auth=dc>0?dpn/(dpn+dc):NaN;
            return{cap:"Kv needed",value:f(kv,2),unit:"",status:isFinite(auth)?{ok:auth>=0.25,text:`Authority ${f(auth,2)}`}:null,
             say:`For ${f(qh,2)} m³/h at ${f(dp)} kPa you need Kv ${B(f(kv,2))} (Cv ${f(kv*1.156,2)}). The next standard size is ${B("Kvs "+kvs)}, giving ${f(dpn,1)} kPa at full flow.`+(isFinite(auth)?` Valve authority is ${f(auth,2)}${auth<0.25?", which is too low for good control: pick a smaller Kvs.":auth>=0.5?", which is good.":", which is acceptable."}`:""),
             rows:[["Cv",f(kv*1.156,2),""],["Standard Kvs",kvs,""],["ΔP at Kvs",f(dpn,1),"kPa"],["Flow",f(qh,2),"m³/h"]]};
           },
           note:"Kv = Q (m³/h) ÷ √ΔP (bar). Cv = 1.156 × Kv. Aim for control valve authority of 0.5 (valve ΔP equal to the coil and branch)."},

          {id:"expv",g:"hvac",icon:"expv",name:"Expansion vessel",short:"Vessel size for a closed water system",
           intro:"Enter the system volume, temperatures and pressures. You get the expansion volume and the vessel size.",
           fields:[
            {id:"V",label:"System water volume",type:"num",def:"3000",units:["L","m³"],udef:"L"},
            {id:"fl",label:"Fluid",type:"chips",def:"1",options:[["1","Water"],["1.25","Glycol 25–30 %"]]},
            {id:"t1",label:"Fill (lowest) temperature",type:"num",def:"10",unit:"°C",half:true},
            {id:"t2",label:"Highest temperature",help:"For chilled water, the plant-off temperature in summer.",type:"num",def:"46",unit:"°C",half:true},
            {id:"h",label:"Static height above vessel",type:"num",def:"15",unit:"m",half:true},
            {id:"psv",label:"Safety valve setting",type:"num",def:"6",unit:"bar g",half:true}
           ],
           calc(v){
            let V=num(v.V);if(v.V_u==="m³")V*=1000;const t1=num(v.t1),t2=num(v.t2),h=num(v.h),psv=num(v.psv);
            if(!(V>0))return{hint:"Enter the system volume."};if(!(t2>t1))return{hint:"The highest temperature must be above the fill temperature."};if(!(psv>0))return{hint:"Enter the safety valve setting."};
            const e=(rhoW(t1)/rhoW(t2)-1)*(num(v.fl)||1),Ve=V*e,Vr=Math.max(3,0.005*V),pi=(h>0?h/10.2:0)+0.3,pf=psv*0.9;
            if(!(pf>pi))return{hint:"The safety valve setting is too close to the static pressure. Check the inputs."};
            const Vn=(Ve+Vr)*(pf+1)/(pf-pi),SZ=[8,12,18,25,35,50,80,100,150,200,250,300,400,500,600,800,1000,1500,2000,3000,5000],sz=SZ.find(x=>x>=Vn)||Math.ceil(Vn/500)*500;
            return{cap:"Vessel size",value:sz,unit:"L",
             say:`The water expands by ${B(f(Ve,0),"L")} (${f(e*100,2)} %) from ${f(t1)} to ${f(t2)} °C. With ${f(Vr,0)} L water reserve, pre-charge ${f(pi,1)} bar and maximum ${f(pf,1)} bar, the vessel needs ${f(Vn,0)} L, so use a ${B(sz+" L")} vessel.`,
             rows:[["Expansion volume",f(Ve,0),"L"],["Water reserve",f(Vr,0),"L"],["Pre-charge pressure",f(pi,2),"bar g"],["Final pressure",f(pf,2),"bar g"],["Calculated volume",f(Vn,0),"L"]]};
           },
           note:"EN 12828 method: Vn = (Ve + Vr) × (Pf + 1) ÷ (Pf − P0). Pre-charge = static head + 0.3 bar. Glycol factor is approximate; use the glycol maker's data."},

          {id:"chperf",g:"hvac",icon:"chperf",name:"Chiller & tower performance",short:"kW/TR, COP, range and approach",
           intro:"Check a chiller's capacity and efficiency, or a cooling tower's range and approach, from site readings.",
           fields:[
            {id:"mode",label:"Equipment",type:"chips",def:"ch",options:[["ch","Chiller"],["ct","Cooling tower"]]},
            {id:"Q",label:"Water flow",type:"num",def:"25",units:uu("flow"),udef:"L/s"},
            {id:"ti",label:"Water in (return)",type:"num",def:"12.5",unit:"°C",half:true,show:v=>v.mode==="ch"},
            {id:"to",label:"Water out (supply)",type:"num",def:"7",unit:"°C",half:true,show:v=>v.mode==="ch"},
            {id:"kw",label:"Electrical power input",type:"num",def:"150",unit:"kW",show:v=>v.mode==="ch"},
            {id:"hi",label:"Hot water in",type:"num",def:"37",unit:"°C",half:true,show:v=>v.mode==="ct"},
            {id:"co",label:"Cold water out",type:"num",def:"32",unit:"°C",half:true,show:v=>v.mode==="ct"},
            {id:"wb",label:"Outdoor wet bulb",type:"num",def:"29",unit:"°C",show:v=>v.mode==="ct"}
           ],
           calc(v){
            const Q=si(v,"Q","flow")*1000;if(!(Q>0))return{hint:"Enter the water flow."};
            if(v.mode==="ct"){const hi=num(v.hi),co=num(v.co),wb=num(v.wb);if(![hi,co,wb].every(isFinite))return{hint:"Enter the water and wet-bulb temperatures."};
             const rg=hi-co,ap=co-wb,eff=rg/(rg+ap)*100,qk=4.186*Q*rg;
             return{cap:"Approach",value:f(ap,1),unit:"K",status:{ok:ap<=5,text:ap<=5?"Approach normal":"Approach high"},
              say:`Range is ${B(f(rg,1),"K")} and approach to wet bulb is ${B(f(ap,1),"K")}, so the tower is ${f(eff,0)} % effective. It rejects about ${B(f(qk,0),"kW")}.`+(ap>5?" A high approach usually means fouled fill, poor water distribution, a fan problem or recirculation of hot air.":""),
              rows:[["Range",f(rg,1),"K"],["Effectiveness",f(eff,0),"%"],["Heat rejected",f(qk/3.51685,0),"TR"]]};}
            const ti=num(v.ti),to=num(v.to),kw=num(v.kw);if(!isFinite(ti)||!isFinite(to))return{hint:"Enter the water in and out temperatures."};
            const cap=4.186*Q*(ti-to),tr=cap/3.51685,kwtr=kw/tr,cop=cap/kw;
            return{cap:"Cooling capacity",value:f(tr,1),unit:"TR",status:kw>0?{ok:kwtr<=1.3,text:`${f(kwtr,2)} kW/TR`}:null,
             say:`The chiller is producing ${B(f(cap,0),"kW")} (${f(tr,1)} TR) with a ${f(ti-to,1)} K water ΔT.`+(kw>0?` At ${f(kw)} kW input that is ${B(f(kwtr,2),"kW/TR")} (COP ${f(cop,2)}).`:""),
             rows:[["Capacity",f(cap,0),"kW"],["kW per TR",kw>0?f(kwtr,2):"—",""],["COP",kw>0?f(cop,2):"—",""],["EER",kw>0?f(cop*3.412,2):"—","Btu/Wh"]]};
           },
           note:"Capacity = 4.186 × L/s × ΔT. Range = hot in − cold out; approach = cold out − wet bulb. Typical air-cooled chillers run 1.0–1.3 kW/TR at full load in the Gulf, water-cooled 0.55–0.75."},

          {id:"insul",g:"hvac",icon:"insul",name:"Insulation thickness",short:"Thickness to stop sweating",
           intro:"Enter the pipe or duct, the fluid temperature and the room air. You get the insulation thickness that keeps the surface above the dew point.",
           fields:[
            {id:"k",label:"Item",type:"chips",def:"p",options:[["p","Pipe"],["d","Duct (flat)"]]},
            {id:"od",label:"Pipe outside diameter",type:"num",def:"60.3",unit:"mm",show:v=>v.k==="p"},
            {id:"tf",label:"Fluid or air inside",type:"num",def:"7",unit:"°C",half:true},
            {id:"ta",label:"Surrounding air",type:"num",def:"35",unit:"°C",half:true},
            {id:"rh",label:"Surrounding RH",type:"num",def:"75",unit:"%",half:true},
            {id:"lam",label:"Insulation conductivity",help:"Elastomeric about 0.035, glass wool 0.04.",type:"num",def:"0.035",unit:"W/mK",half:true},
            {id:"hs",label:"Surface heat transfer coefficient",type:"num",def:"9",unit:"W/m²K",adv:true}
           ],
           calc(v){
            const tf=num(v.tf),ta=num(v.ta),rh=num(v.rh),lam=num(v.lam),hs=num(v.hs)||9;if(!isFinite(tf)||!isFinite(ta))return{hint:"Enter the inside and surrounding temperatures."};
            if(!(rh>0&&rh<100))return{hint:"RH must be between 0 and 100 %."};if(!(lam>0))return{hint:"Enter the insulation conductivity."};
            const td=PSY.fromRH(ta,rh,101.325).td,tsReq=td+1;if(tf>=tsReq)return{cap:"Insulation thickness",value:"None",unit:"",say:`The surface stays above the dew point of ${f(td,1)} °C without insulation, so it won't sweat. Insulate only to save energy.`,rows:[["Dew point",f(td,1),"°C"]]};
            const ro0=num(v.od)/2000,ts=t=>{if(v.k==="d"){const R=t/1000/lam+1/hs;return ta-(ta-tf)*(1/hs)/R;}const ro=ro0+t/1000,Ri=Math.log(ro/ro0)/(2*Math.PI*lam),Rs=1/(2*Math.PI*ro*hs);return ta-(ta-tf)*Rs/(Ri+Rs);};
            if(v.k==="p"&&!(ro0>0))return{hint:"Enter the pipe outside diameter."};
            let t=0;while(ts(t)<tsReq&&t<300)t+=0.5;const STD=[9,13,19,25,32,40,50,60,75,100],s=STD.find(x=>x>=t)||Math.ceil(t/10)*10;
            const q=v.k==="d"?(ta-tf)/(s/1000/lam+1/hs):(ta-tf)/(Math.log((ro0+s/1000)/ro0)/(2*Math.PI*lam)+1/(2*Math.PI*(ro0+s/1000)*hs));
            return{cap:"Minimum thickness",value:f(t,1),unit:"mm",
             say:`The air dew point is ${B(f(td,1),"°C")}. To keep the surface at least 1 K above it, you need ${f(t,1)} mm, so use ${B(s+" mm")} insulation with a vapour barrier.`,
             rows:[["Standard thickness",s,"mm"],["Surface temperature",f(ts(s),1),"°C"],["Dew point",f(td,1),"°C"],[v.k==="d"?"Heat gain per m²":"Heat gain per metre",f(q,1),v.k==="d"?"W/m²":"W/m"]]};
           },
           note:"Steady-state heat balance with 1 K margin above dew point. In humid Gulf plant rooms and outdoors, use a higher RH and add 25 % to the thickness. Keep the vapour barrier continuous."},

          /* ===== Refrigeration additions ===== */
          {id:"addchg",g:"ref",icon:"addchg",name:"Additional charge",short:"Extra refrigerant for pipe length",
           intro:"Enter the liquid line size and length. You get the extra refrigerant to add for pipe beyond the pre-charged length.",
           fields:[
            {id:"ref",label:"Refrigerant",type:"chips",def:"R410A",options:Object.keys(RLP).map(k=>[k,REF[k]?REF[k].n:k])},
            {id:"sz",label:"Liquid line size",type:"chips",def:"1",options:ACR.slice(0,6).map((a,i)=>[String(i),a[0]])},
            {id:"L",label:"Liquid line length",help:"One way, actual length.",type:"num",def:"25",unit:"m",half:true},
            {id:"L0",label:"Pre-charged length",help:"From the outdoor unit label. 0 for VRF.",type:"num",def:"7.5",unit:"m",half:true},
            {id:"sz2",label:"Second liquid line size (VRF branches)",type:"select",def:"-",options:[["-","None"]].concat(ACR.slice(0,6).map((a,i)=>[String(i),a[0]])),adv:true},
            {id:"L2",label:"Second size length",type:"num",def:"0",unit:"m",adv:true}
           ],
           calc(v){
            const p=RLP[v.ref],a=ACR[+v.sz],L=num(v.L),L0=num(v.L0)||0;if(!(L>0))return{hint:"Enter the liquid line length."};
            const gpm=x=>{const id=(x[1]-2*x[2])/1000;return Math.PI*id*id/4*p.rl*1000;};
            const g1=gpm(a),ex=Math.max(L-L0,0)*g1,b=v.sz2!=="-"?ACR[+v.sz2]:null,L2=num(v.L2)||0,ex2=b?L2*gpm(b):0,tot=ex+ex2;
            return{cap:"Additional charge",value:f(tot/1000,2),unit:"kg",
             say:`${a[0]} liquid line holds about ${f(g1,0)} g/m of ${REF[v.ref].n}. For ${f(Math.max(L-L0,0),1)} m beyond the pre-charged length, add ${B(f(tot/1000,2),"kg")} (${f(tot,0)} g).`+(L>L0?"":" No extra charge: the pipe is within the pre-charged length."),
             rows:[["Main line",f(ex,0),"g"],["Second size",f(ex2,0),"g"],["g per metre",f(g1,0),"g/m"]]};
           },
           note:"Estimate from liquid-line volume × liquid density. The outdoor unit's label or installation manual (g/m per size) always governs. Charge by weight with liquid for blends."},

          {id:"lsize",g:"ref",icon:"lsize",name:"Refrigerant line sizing",short:"Suction, liquid and discharge by velocity",
           intro:"Enter the refrigerant, capacity and line. You get the velocity in each copper size and the one to use.",
           fields:[
            {id:"ref",label:"Refrigerant",type:"chips",def:"R410A",options:Object.keys(RLP).map(k=>[k,REF[k]?REF[k].n:k])},
            {id:"kw",label:"Cooling capacity",type:"num",def:"28",units:["kW","TR"],udef:"kW"},
            {id:"ln",label:"Line",type:"chips",def:"s",options:[["s","Suction"],["l","Liquid"],["d","Discharge"]]},
            {id:"riser",label:"Vertical riser?",type:"chips",def:"0",options:[["0","No"],["1","Yes, suction up"]],show:v=>v.ln==="s"}
           ],
           calc(v){
            let kw=num(v.kw);if(!(kw>0))return{hint:"Enter the capacity."};if(v.kw_u==="TR")kw*=3.51685;const p=RLP[v.ref],m=kw/p.dh,rho={s:p.rs,l:p.rl,d:p.rd}[v.ln];
            const lim={s:v.riser==="1"?[7.5,15]:[4,15],l:[0.5,1.5],d:[10,18]}[v.ln];
            const rows=ACR.map(a=>{const id=(a[1]-2*a[2])/1000,vel=m/rho/(Math.PI*id*id/4);return{a,vel};});
            const pick=rows.find(r=>r.vel>=lim[0]&&r.vel<=lim[1])||rows.find(r=>r.vel<=lim[1]);
            return{cap:"Use copper size",value:pick?pick.a[0]:"—",unit:"OD",
             say:`Mass flow is about ${f(m*3600,0)} kg/h. ${pick?`In ${B(pick.a[0])} the velocity is ${B(f(pick.vel,1),"m/s")}, inside the ${lim[0]}–${lim[1]} m/s range for ${({s:"suction",l:"liquid",d:"discharge"})[v.ln]} lines.`:"No standard size fits the velocity range."}`+(v.ln==="s"&&v.riser==="1"?" Suction risers need enough velocity to carry oil up; use a double riser if the load varies a lot.":""),
             rows:[["Mass flow",f(m*1000,1),"g/s"],["Velocity range",lim.join("–"),"m/s"]],
             after:tbl(["Size","Velocity m/s",""],rows.map(r=>({cls:r===pick?"sel":"",c:[r.a[0],f(r.vel,2),r.vel<lim[0]?"Too slow":r.vel>lim[1]?"Too fast":"OK"]})))};
           },
           note:"Approximate properties at 5 °C evaporating and 45 °C condensing. Also check pressure drop (about 1 K saturation loss on suction). The equipment installation manual governs pipe sizes."},

          {id:"n2",g:"ref",icon:"n2",name:"Nitrogen pressure test",short:"Correct the reading for temperature",
           intro:"Enter the test pressure and temperature at the start and now. You find out if a pressure change is a leak or just temperature.",
           fields:[
            {id:"p1",label:"Pressure at start",type:"num",def:"41.5",unit:"bar g",half:true},
            {id:"t1",label:"Temperature at start",type:"num",def:"28",unit:"°C",half:true},
            {id:"p2",label:"Pressure now",type:"num",def:"40.9",unit:"bar g",half:true},
            {id:"t2",label:"Temperature now",type:"num",def:"23",unit:"°C",half:true},
            {id:"tol",label:"Allowed change",type:"num",def:"0.1",unit:"bar",adv:true}
           ],
           calc(v){
            const p1=num(v.p1),t1=num(v.t1),p2=num(v.p2),t2=num(v.t2),tol=num(v.tol)||0.1;if(![p1,t1,p2,t2].every(isFinite))return{hint:"Enter both pressures and temperatures."};
            const pe=(p1+PATM)*(t2+273.15)/(t1+273.15)-PATM,d=p2-pe,ok=d>=-tol;
            return{cap:"Expected pressure now",value:f(pe,2),unit:"bar g",status:{ok,text:ok?"No leak":"Leak likely"},
             say:`From ${f(t1,1)} to ${f(t2,1)} °C, the pressure should change from ${f(p1,2)} to ${B(f(pe,2),"bar g")} with no leak. You read ${f(p2,2)} bar g, ${B(f(Math.abs(d),2),"bar")} ${d<0?"below":"above"} that.`+(ok?" The change is due to temperature.":" That is more than the allowed change, so look for a leak with soapy water or an electronic detector."),
             rows:[["Corrected difference",f(d,2),"bar"],["Change from temperature",f(pe-p1,2),"bar"]]};
           },
           note:"Gas law: P₂ = P₁ × T₂ ÷ T₁ in absolute pressure and kelvin. Read temperature on the pipe, out of the sun. Test pressure to the equipment maker's value."},

          {id:"vac",g:"ref",icon:"vac",name:"Vacuum decay test",short:"Leak or moisture from micron readings",
           intro:"Pull down, isolate the pump, then record the gauge at the start, halfway and at the end of the hold.",
           fields:[
            {id:"a",label:"Vacuum when isolated",type:"num",def:"400",unit:"microns",half:true},
            {id:"b",label:"Halfway reading",type:"num",def:"700",unit:"microns",half:true},
            {id:"c",label:"End of hold",type:"num",def:"820",unit:"microns",half:true},
            {id:"t",label:"Hold time",type:"num",def:"10",unit:"min",half:true},
            {id:"lim",label:"Maximum allowed at end",type:"num",def:"1000",unit:"microns",adv:true}
           ],
           calc(v){
            const a=num(v.a),b=num(v.b),c=num(v.c),lim=num(v.lim)||1000;if(![a,c].every(isFinite))return{hint:"Enter the start and end readings."};
            const r1=isFinite(b)?b-a:NaN,r2=isFinite(b)?c-b:NaN,ok=a<=500&&c<=lim;
            const why=!isFinite(b)?"":c<=lim?"":r2<r1*0.5?" The rise slowed down, which points to moisture: keep evacuating, warm the pipes, and use a triple evacuation with nitrogen.":" The rise stayed steady, which points to a leak: pressure test with nitrogen and find it before evacuating again.";
            return{cap:"Result",big:ok?"Pass: dry and tight":a>500?"Not deep enough":"Fail",status:{ok,text:ok?"Pass":"Fail"},
             say:`The gauge rose from ${f(a,0)} to ${f(c,0)} microns (${f(c-a,0)} microns) in ${f(num(v.t)||10,0)} minutes.`+(a>500?" Pull down to 500 microns or less before starting the hold.":"")+(c>lim?` It finished above ${f(lim,0)} microns.`:"")+why,
             rows:[["Rise",f(c-a,0),"microns"],["End reading",f(c*0.13332,0),"Pa"],["End reading",f(c*0.0013332,2),"mbar"]]};
           },
           note:"Common practice: evacuate to 500 microns or below, isolate, and hold 10 minutes; it should stay below about 1000 microns. Follow the equipment maker's procedure."},

          {id:"cop",g:"ref",icon:"cop",name:"Compression ratio & COP",short:"System efficiency from gauge pressures",
           intro:"Enter the refrigerant and gauge pressures. You get the compression ratio, saturation temperatures and ideal COP. Add capacity and power for the real COP.",
           fields:[
            {id:"ref",label:"Refrigerant",type:"chips",def:"R410A",options:REFOPTS},
            {id:"ps",label:"Suction pressure",type:"num",def:"8.5",units:Object.keys(GAUGE),udef:"bar g"},
            {id:"pd",label:"Discharge pressure",type:"num",def:"27",units:Object.keys(GAUGE),udef:"bar g"},
            {id:"cap",label:"Measured cooling capacity",type:"num",def:"",unit:"kW",half:true,adv:true},
            {id:"pw",label:"Measured power input",type:"num",def:"",unit:"kW",half:true,adv:true}
           ],
           calc(v){
            const ps=num(v.ps),pd=num(v.pd);if(!isFinite(ps)||!isFinite(pd))return{hint:"Enter suction and discharge pressure."};
            const Ps=toAbs(ps,v.ps_u),Pd=toAbs(pd,v.pd_u),cr=Pd/Ps,Te=refT(v.ref,Ps,"d"),Tc=refT(v.ref,Pd,"b");
            if(!isFinite(Te)||!isFinite(Tc))return{hint:`A pressure is outside the −40 to 65 °C range for ${REF[v.ref].n}. Check the gauges and unit.`};
            const carnot=(Te+273.15)/(Tc-Te),cap=num(v.cap),pw=num(v.pw),real=cap>0&&pw>0?cap/pw:NaN;
            return{cap:"Compression ratio",value:f(cr,2),unit:"",status:{ok:cr<=6,text:cr<=4?"Normal for AC":cr<=6?"High-ish":"Very high"},
             say:`Evaporating at ${B(f(Te,1),"°C")} and condensing at ${B(f(Tc,1),"°C")} gives a compression ratio of ${B(f(cr,2))}. The ideal (Carnot) COP is ${f(carnot,1)}; real systems reach about 40–55 % of that.`+(isFinite(real)?` Your measured COP is ${B(f(real,2))}, which is ${f(real/carnot*100,0)} % of ideal.`:"")+(cr>6?" A high ratio means hot running and lower capacity: check the condenser, charge and airflow.":""),
             rows:[["Evaporating",f(Te,1),"°C"],["Condensing",f(Tc,1),"°C"],["Lift (Tc − Te)",f(Tc-Te,1),"K"],["Carnot COP",f(carnot,2),""],["Measured COP",isFinite(real)?f(real,2):"—",""]]};
           },
           note:"Compression ratio = absolute discharge ÷ absolute suction. Air-conditioning scroll compressors usually run 2.5–4. Every 1 K less lift saves about 2–3 % energy."},

          {id:"gwp",g:"ref",icon:"gwp",name:"Refrigerant GWP / CO₂e",short:"tCO₂e and leak-check frequency",
           intro:"Enter the refrigerant and its charge. You get the CO₂-equivalent and how often leak checks are needed.",
           fields:[
            {id:"r",label:"Refrigerant",type:"select",def:"R410A",options:Object.keys(GWP).map(k=>[k,k.replace("R","R-")])},
            {id:"kg",label:"Charge in the system",type:"num",def:"12",unit:"kg",half:true},
            {id:"lk",label:"Refrigerant added this year",help:"For leak rate. Leave 0 if none.",type:"num",def:"0",unit:"kg",half:true},
            {id:"ld",label:"Automatic leak detection fitted?",type:"chips",def:"0",options:[["0","No"],["1","Yes"]],adv:true}
           ],
           calc(v){
            const g=GWP[v.r],kg=num(v.kg),lk=num(v.lk)||0;if(!(kg>0))return{hint:"Enter the charge."};const t=kg*g/1000,ld=v.ld==="1";
            const freq=t<5?"No periodic leak check required":t<50?(ld?"Every 24 months":"Every 12 months"):t<500?(ld?"Every 12 months":"Every 6 months"):(ld?"Every 6 months":"Every 3 months, and leak detection is mandatory");
            return{cap:"CO₂-equivalent",value:f(t,1),unit:"tCO₂e",
             say:`${f(kg,1)} kg of ${v.r.replace("R","R-")} (GWP ${g}) equals ${B(f(t,1),"tonnes CO₂e")}. Leak checks: ${B(freq.toLowerCase())}.`+(lk>0?` Adding ${f(lk,1)} kg this year is a ${B(f(lk/kg*100,1),"%")} leak rate.`:""),
             rows:[["GWP (AR4)",g,""],["Leak rate",lk>0?f(lk/kg*100,1):"—","%"],["CO₂e of top-up",f(lk*g/1000,2),"t"]]};
           },
           note:"GWP values from IPCC AR4 as used in EU F-gas rules. Check intervals follow the EU F-gas thresholds (5, 50, 500 tCO₂e). Your country's regulations may differ."}
          ,

          {id:"pflow",g:"plumb",icon:"pflow",name:"Pipe flow & velocity",short:"Q = A × V, both ways",
           intro:"Pick the pipe, then enter the velocity to get the flow, or the flow to get the velocity.",
           fields:[
            {id:"mode",label:"What do you know?",type:"chips",def:"q",options:[["q","The flow"],["v","The velocity"]]},
            ...pipeF(),
            {id:"Q",label:"Flow rate",type:"num",def:"0.8",units:uu("flow"),udef:"L/s",show:v=>v.mode==="q"},
            {id:"V",label:"Velocity",type:"num",def:"1.5",units:uu("vel"),udef:"m/s",show:v=>v.mode==="v"},
            {id:"Vt",label:"Target maximum velocity",help:"Used to suggest the smallest pipe that stays under it.",type:"num",def:"1.5",unit:"m/s",adv:true,presets:[["1.2","Hot copper 1.2"],["1.5","1.5"],["2.4","Cold supply 2.4"]]}
           ],
           calc(v){
            const D=pipeD(v);if(!(D>0))return{hint:"Enter the inside diameter of the pipe."};
            const A=Math.PI*D*D/4;
            if(v.mode==="v"){const V=si(v,"V","vel");if(!(V>0))return{hint:"Enter the velocity."};const Q=A*V;
             return{cap:"Flow rate",value:f(Q*1000,2),unit:"L/s",status:vState(V),
              say:`${pipeName(v)} at ${f(V,2)} m/s carries ${B(f(Q*1000,2),"L/s")} (${f(Q*60000,1)} L/min). ${vMsg(V)}`,
              rows:[["Flow",f(Q*60000,1),"L/min"],["Flow",f(Q*3600,2),"m³/h"],["Flow",f(Q/6.30902e-5,1),"US GPM"],["Flow area",f(A*1e6,0),"mm²"]]};}
            const Q=si(v,"Q","flow");if(!(Q>0))return{hint:"Enter the flow rate."};
            const V=Q/A,Vt=num(v.Vt)||1.5,Dm=Math.sqrt(4*Q/(Math.PI*Vt))*1000,r=pipeRef(v);
            const sug=r?PSETS[r.k].p.find(p=>p.id>=Dm):null;
            return{cap:"Velocity",value:f(V,2),unit:"m/s",status:vState(V),
             say:`${f(Q*1000,2)} L/s through ${pipeName(v)} runs at ${B(f(V,2),"m/s")} (${f(V/0.3048,1)} ft/s). ${vMsg(V)}`+(sug?` To stay under ${f(Vt,1)} m/s, the smallest ${PSETS[r.k].n} size is ${B(sug.s)}.`:""),
             rows:[["Velocity",f(V/0.3048,2),"ft/s"],["Minimum bore for target",f(Dm,1),"mm"],["Flow area",f(A*1e6,0),"mm²"]]};
           },
           note:"Q = A × V and V = Q ÷ A, where A = π D² ÷ 4 from the true inside diameter, not the nominal size."},

          {id:"pfric",g:"plumb",icon:"pfric",name:"Friction loss",short:"Pressure drop along a pipe run",
           intro:"Enter the flow, pick the pipe and its length. You get the head and pressure lost to friction.",
           fields:[
            {id:"Q",label:"Flow rate",type:"num",def:"0.8",units:uu("flow"),udef:"L/s"},
            ...pipeF(),
            {id:"L",label:"Pipe length",type:"num",def:"30",units:uu("len"),udef:"m"},
            {id:"mat",label:"Pipe material",type:"chips",def:"cu",options:PMOPTS},
            {id:"T",label:"Water temperature",type:"chips",def:"20",options:[["20","20 °C"],["40","40 °C"],["60","60 °C"],["80","80 °C"]],adv:true}
           ],
           calc(v){
            const Q=si(v,"Q","flow"),D=pipeD(v),L=si(v,"L","len"),m=PMAT[v.mat]||PMAT.cu;
            if(!(Q>0))return{hint:"Enter the flow rate."};if(!(D>0))return{hint:"Enter the inside diameter."};if(!(L>0))return{hint:"Enter the pipe length."};
            const r=darcy(Q,D,L,m[1]/1000,NU[v.T]||NU["20"]),dp=RHO*G*r.hf,hw=hazen(Q,D,L,m[2])*RHO*G;
            return{cap:"Friction loss",value:f(dp/1000,1),unit:"kPa",status:vState(r.V),
             say:`${f(Q*1000,2)} L/s through ${f(L,1)} m of ${pipeName(v)} loses ${B(f(r.hf,2),"m")} of head, which is ${B(f(dp/1000,1),"kPa")} (${f(dp/6894.757,2)} psi). Velocity is ${f(r.V,2)} m/s.`,
             rows:[["Head loss",f(r.hf/0.3048,2),"ft"],["Pressure drop",f(dp/6894.757,2),"psi"],["Per 100 m",f(dp/L*100/1000,1),"kPa"],["Per 100 ft",f(dp/L*30.48/6894.757,2),"psi"],["Hazen–Williams check",f(hw/1000,1),"kPa"],["Velocity",f(r.V,2),"m/s"],["Reynolds number",f(r.Re,0),""],["Friction factor (Darcy)",f(r.fr,4),""]]};
           },
           note:"Darcy–Weisbach: h<sub>f</sub> = f (L/D) V² / 2g, with f from Swamee–Jain. The form 4fLV²/2gD uses the Fanning factor (a quarter of Darcy), so both give the same answer. Hazen–Williams suits water near room temperature."},

          {id:"pfit",g:"plumb",icon:"pfit",name:"Pressure drop with fittings",short:"Pipe plus elbows, tees and valves",
           intro:"Enter the flow, the pipe and its straight length, then count the fittings. You get the total pressure drop.",
           fields:[
            {id:"Q",label:"Flow rate",type:"num",def:"0.8",units:uu("flow"),udef:"L/s"},
            ...pipeF(),
            {id:"L",label:"Straight pipe length",type:"num",def:"20",units:uu("len"),udef:"m"},
            ...FITS.map(([k,l,K,d])=>({id:k,label:l,help:`K = ${K}`,type:"num",def:d,unit:"no.",half:true})),
            {id:"mat",label:"Pipe material",type:"chips",def:"cu",options:PMOPTS,adv:true}
           ],
           calc(v){
            const Q=si(v,"Q","flow"),D=pipeD(v),L=si(v,"L","len")||0,m=PMAT[v.mat]||PMAT.cu;
            if(!(Q>0))return{hint:"Enter the flow rate."};if(!(D>0))return{hint:"Enter the inside diameter."};
            const r=darcy(Q,D,Math.max(L,1e-9),m[1]/1000,NU["20"]),K=FITS.reduce((a,x)=>a+x[2]*(num(v[x[0]])||0),0);
            const hk=K*r.V*r.V/(2*G),ht=r.hf+hk,rg=RHO*G,Leq=K*D/r.fr;
            return{cap:"Total pressure drop",value:f(ht*rg/1000,1),unit:"kPa",status:vState(r.V),
             say:`The run loses ${B(f(ht*rg/1000,1),"kPa")} in total (${f(ht*rg/6894.757,2)} psi): ${f(r.hf*rg/1000,1)} kPa in straight pipe and ${f(hk*rg/1000,1)} kPa in fittings. The fittings act like ${B(f(Leq,1),"m")} of extra pipe.`,
             rows:[["Total head loss",f(ht,2),"m"],["Straight pipe",f(r.hf*rg/1000,1),"kPa"],["Fittings and valves",f(hk*rg/1000,1),"kPa"],["Sum of K",f(K,2),""],["Velocity",f(r.V,2),"m/s"]]};
           },
           note:"ΔP = ρg [ f(L/D) + ΣK ] V² / 2g. K values are typical for screwed or soldered fittings; use the maker's figures for valves and strainers."},

          {id:"ppump",g:"plumb",icon:"pump",name:"Total pump head",short:"Head and motor power for a pump",
           intro:"Add up the lift, the losses and the pressure you need at the outlet. You get the pump duty point.",
           fields:[
            {id:"Hs",label:"Static lift",help:"From the water level in the tank or sump up to the highest outlet.",type:"num",def:"18",units:uu("head"),udef:"m"},
            {id:"Hf",label:"Pipe friction head",type:"num",def:"4",units:uu("head"),udef:"m",half:true},
            {id:"Hk",label:"Fittings head",type:"num",def:"1.5",units:uu("head"),udef:"m",half:true},
            {id:"Pr",label:"Pressure needed at the outlet",type:"num",def:"100",units:uu("pres"),udef:"kPa",presets:[["50","Tap 50 kPa"],["100","Shower 100 kPa"],["200","Flush valve 200 kPa"]]},
            {id:"Q",label:"Design flow",type:"num",def:"2",units:uu("flow"),udef:"L/s"},
            {id:"eff",label:"Pump efficiency",type:"num",def:"65",unit:"%",adv:true}
           ],
           calc(v){
            const Hs=si(v,"Hs","head"),Hf=si(v,"Hf","head")||0,Hk=si(v,"Hk","head")||0,Pr=si(v,"Pr","pres")||0,Q=si(v,"Q","flow"),eff=num(v.eff)/100;
            if(!isFinite(Hs))return{hint:"Enter the static lift."};if(!(Q>0))return{hint:"Enter the design flow."};if(!(eff>0&&eff<=1))return{hint:"Pump efficiency must be between 1 and 100 %."};
            const rg=RHO*G,Hr=Pr/rg,H=Hs+Hf+Hk+Hr,Ph=rg*Q*H/1000,Ps=Ph/eff;
            return{cap:"Total pump head",value:f(H,1),unit:"m",
             say:`The pump must deliver ${f(Q*1000,2)} L/s at ${B(f(H,1),"m")} (${f(H/0.3048,0)} ft) of head. Shaft power is about ${B(f(Ps,2),"kW")} at ${f(eff*100,0)} % efficiency. Add 10 to 15 % margin and choose from the pump curve.`,
             rows:[["Total head",f(H/0.3048,1),"ft"],["Outlet pressure as head",f(Hr,1),"m"],["Discharge pressure",f(H*rg/1e5,2),"bar"],["Hydraulic power",f(Ph,2),"kW"],["Shaft power",f(Ps/0.7457,2),"HP"]]};
           },
           note:"H<sub>pump</sub> = H<sub>static</sub> + H<sub>friction</sub> + H<sub>fittings</sub> + P<sub>outlet</sub> ÷ ρg. Get the friction and fittings head from the two tools above."},

          {id:"pvol",g:"plumb",icon:"pvol",name:"Pipe volume",short:"Water in a pipe run",
           intro:"Pick the pipe and enter its length. You get the water it holds, for flushing, filling or dosing.",
           fields:[
            ...pipeF(),
            {id:"L",label:"Pipe length",type:"num",def:"30",units:uu("len"),udef:"m"},
            {id:"dose",label:"Disinfection dose",help:"For example 50 mg/L of chlorine.",type:"num",def:"50",unit:"mg/L",adv:true}
           ],
           calc(v){
            const D=pipeD(v),L=si(v,"L","len");if(!(D>0))return{hint:"Enter the inside diameter."};if(!(L>0))return{hint:"Enter the pipe length."};
            const A=Math.PI*D*D/4,Vm=A*L,lit=Vm*1000,dose=num(v.dose)||0;
            return{cap:"Water volume",value:f(lit,1),unit:"L",
             say:`${f(L,1)} m of ${pipeName(v)} holds ${B(f(lit,1),"litres")} (${f(lit/3.78541,1)} US gal) of water, weighing ${f(Vm*RHO,1)} kg.${dose>0?` At ${f(dose)} mg/L you need ${B(f(lit*dose/1000,1),"g")} of active chlorine.`:""}`,
             rows:[["Volume",f(lit/3.78541,2),"US gal"],["Per metre",f(A*1000,3),"L/m"],["Per foot",f(A*1000*0.3048/3.78541,4),"gal/ft"],["Weight of water",f(Vm*RHO*2.20462,1),"lb"]]};
           },
           note:"Gallons = π r² L ÷ 231 with r and L in inches. Litres = π D² ÷ 4 × L × 1000 with D and L in metres."},

          {id:"pelev",g:"plumb",icon:"pelev",name:"Pressure from height",short:"Water column ↔ pressure",
           intro:"Turn a height of water into pressure, or a gauge reading into head.",
           fields:[
            {id:"mode",label:"What do you have?",type:"chips",def:"h",options:[["h","A height"],["p","A gauge pressure"]]},
            {id:"H",label:"Height of water",type:"num",def:"10",units:uu("head"),udef:"m",show:v=>v.mode==="h"},
            {id:"P",label:"Gauge pressure",type:"num",def:"300",units:uu("pres"),udef:"kPa",show:v=>v.mode==="p"}
           ],
           calc(v){
            const rg=RHO*G;
            if(v.mode==="h"){const H=si(v,"H","head");if(!isFinite(H))return{hint:"Enter the height."};const P=H*rg;
             return{cap:"Static pressure",value:f(P/1000,1),unit:"kPa",say:`A ${f(H,2)} m column of water gives ${B(f(P/1000,1),"kPa")} (${B(f(P/6894.757,2),"psi")}) at the bottom with no flow.`,
              rows:[["Pressure",f(P/1e5,3),"bar"],["Pressure",f(P/6894.757,2),"psi"],["Height",f(H/0.3048,2),"ft"]]};}
            const P=si(v,"P","pres");if(!isFinite(P))return{hint:"Enter the gauge pressure."};const H=P/rg;
            return{cap:"Head",value:f(H,2),unit:"m",say:`${f(P/1000,1)} kPa can lift water ${B(f(H,2),"m")} (${f(H/0.3048,1)} ft) with no flow.`,
             rows:[["Head",f(H/0.3048,2),"ft"],["Pressure",f(P/1e5,3),"bar"],["Pressure",f(P/6894.757,2),"psi"]]};
           },
           note:"psi = head in ft × 0.433. kPa = head in m × 9.79."},

          {id:"pdrain",g:"plumb",icon:"drain",name:"Drain slope",short:"Fall needed over a drain run",
           intro:"Enter the run length, the drain size and the slope. You get the total fall and a code check.",
           fields:[
            {id:"L",label:"Horizontal run",type:"num",def:"12",units:uu("len"),udef:"m"},
            {id:"sz",label:"Drain size",type:"chips",def:"s",options:[["s",'Up to 2-1/2" (65 mm)'],["m",'3" to 6" (75–150 mm)'],["l",'8" and up (200 mm+)']]},
            {id:"sl",label:"Slope",type:"chips",def:"0.0208333",options:[["0.0052083",'1/16" per ft'],["0.0104167",'1/8" per ft'],["0.0208333",'1/4" per ft'],["0.0416667",'1/2" per ft'],["0.01","1 %"],["0.02","2 %"],["0.025","2.5 %"]]}
           ],
           calc(v){
            const L=si(v,"L","len"),sl=num(v.sl);if(!(L>0))return{hint:"Enter the horizontal run."};
            const min={s:0.0208333,m:0.0104167,l:0.0052083}[v.sz],minT={s:'1/4" per ft (2 %)',m:'1/8" per ft (1 %)',l:'1/16" per ft (0.5 %)'}[v.sz];
            const fall=L*sl,low=sl+1e-9<min;
            return{cap:"Total fall",value:f(fall*1000,0),unit:"mm",
             status:low?{ok:false,text:"Below minimum slope"}:{ok:true,text:"Meets minimum slope"},
             say:`Over ${f(L,2)} m the pipe must drop ${B(f(fall*1000,0),"mm")} (${B(f(fall/0.0254,2),"in")}).`+(low?` That is flatter than the usual minimum of ${minT} for this size, so solids may settle. Check your local code.`:` The usual minimum for this size is ${minT}.`),
             rows:[["Total fall",f(fall/0.0254,2),"in"],["Slope",f(sl*100,2),"%"],["Gradient","1 in "+f(1/sl,0),""],["Angle",f(Math.atan(sl)*180/Math.PI,2),"°"]]};
           },
           note:"Fall = run × slope. Minimums follow common IPC and UPC practice. Always verify the code that applies to your job."},

          {id:"pheat",g:"plumb",icon:"heater",name:"Water heater size",short:"Tank or tankless heater rating",
           intro:"Size a storage tank heater from its volume and recovery time, or a tankless heater from the hot water flow.",
           fields:[
            {id:"mode",label:"Heater type",type:"chips",def:"tank",options:[["tank","Storage tank"],["inst","Tankless / instant"]]},
            {id:"V",label:"Tank volume",type:"num",def:"200",units:uu("vol"),udef:"L",show:v=>v.mode==="tank"},
            {id:"Q",label:"Hot water flow",type:"num",def:"8",units:uu("flow"),udef:"L/min",show:v=>v.mode==="inst"},
            {id:"dT",label:"Temperature rise",help:"Hot water temperature minus incoming cold water temperature.",type:"num",def:"35",units:uu("dT"),udef:"°C"},
            {id:"t",label:"Recovery time",type:"num",def:"1",unit:"h",show:v=>v.mode==="tank"},
            {id:"eff",label:"Heater efficiency",help:"Electric 95–99 %, gas 70–95 %.",type:"num",def:"95",unit:"%",adv:true}
           ],
           calc(v){
            const dT=si(v,"dT","dT"),eff=num(v.eff)/100;
            if(!(dT>0))return{hint:"Enter the temperature rise."};if(!(eff>0&&eff<=1))return{hint:"Efficiency must be between 1 and 100 %."};
            if(v.mode==="tank"){const Vm=si(v,"V","vol"),t=num(v.t);if(!(Vm>0))return{hint:"Enter the tank volume."};if(!(t>0))return{hint:"Enter the recovery time."};
             const E=Vm*RHO*4186*dT,P=E/(t*3600)/eff;
             return{cap:"Heater rating",value:f(P/1000,2),unit:"kW",
              say:`Heating ${f(Vm*1000,0)} L by ${f(dT,1)} °C takes ${B(f(E/3.6e6,2),"kWh")}. To do it in ${f(t,1)} h you need a heater rated at ${B(f(P/1000,2),"kW")} (${f(P/0.29307107,0)} BTU/h).`,
              rows:[["Rating",f(P/0.29307107,0),"BTU/h"],["Heat to water",f(E/1055.056,0),"BTU"],["Heat to water",f(E/3.6e6,2),"kWh"],["Mass of water",f(Vm*RHO,0),"kg"]]};}
            const Q=si(v,"Q","flow");if(!(Q>0))return{hint:"Enter the hot water flow."};
            const P=Q*RHO*4186*dT/eff;
            return{cap:"Heater rating",value:f(P/1000,1),unit:"kW",
             say:`Raising ${f(Q*60000,1)} L/min by ${f(dT,1)} °C needs a tankless heater rated at ${B(f(P/1000,1),"kW")} (${f(P/0.29307107,0)} BTU/h). Size for the coldest incoming water you expect.`,
             rows:[["Rating",f(P/0.29307107,0),"BTU/h"],["Flow",f(Q/6.30902e-5,2),"US GPM"]]};
           },
           note:"Tank: BTU = gallons × 8.33 × ΔT (°F). Tankless: BTU/h = GPM × 500 × ΔT (°F). Metric: kW = L/min × 0.0698 × ΔT (°C)."},

          {id:"poff",g:"plumb",icon:"offset",name:"Rolling offset",short:"Travel, run and true offset",
           intro:"Enter the rise and roll between the two pipe centrelines and pick the fitting angle. Set roll to 0 for a simple offset.",
           fields:[
            {id:"r",label:"Rise (vertical offset)",type:"num",def:"300",units:uu("sm"),udef:"mm",half:true},
            {id:"o",label:"Roll (side offset)",type:"num",def:"200",units:uu("sm"),udef:"mm",half:true},
            {id:"a",label:"Fitting angle",type:"chips",def:"45",options:[["60","60°"],["45","45°"],["30","30°"],["22.5","22-1/2°"],["11.25","11-1/4°"]]}
           ],
           calc(v){
            const R=si(v,"r","sm"),O=si(v,"o","sm")||0,a=num(v.a)*Math.PI/180;
            if(!(R>=0)||!(R+O>0))return{hint:"Enter the rise and roll."};
            const T=Math.hypot(R,O),tr=T/Math.sin(a),run=T/Math.tan(a);
            return{cap:"Travel (centre to centre)",value:f(tr*1000,0),unit:"mm",
             say:`With ${v.a}° fittings, the travel is ${B(f(tr*1000,0),"mm")} (${B(ftin(tr/0.0254*16))}) and the run along the pipe is ${f(run*1000,0)} mm. Subtract the fitting take-offs to get the cut length.`,
             rows:[["True offset",f(T*1000,0),"mm"],["Travel",f(tr/0.0254,3),"in"],["Run (setback)",f(run*1000,0),"mm"],["Run (setback)",ftin(run/0.0254*16),""],["Travel multiplier",f(1/Math.sin(a),3),"×"],["Run multiplier",f(1/Math.tan(a),3),"×"]]};
           },
           note:"True offset = √(rise² + roll²). Travel = true offset × multiplier (60° 1.155, 45° 1.414, 22-1/2° 2.613)."},

          {id:"ptape",g:"plumb",icon:"tape",name:"Feet-inch math",short:"Add, subtract or split tape lengths",
           intro:"Work in feet, inches and sixteenths like a tape measure. You also get the metric value.",
           fields:[
            {id:"af",label:"Length A: feet",type:"num",def:"5",unit:"ft",half:true},
            {id:"ai",label:"Length A: inches",type:"num",def:"7",unit:"in",half:true},
            {id:"as",label:"Length A: fraction",type:"select",def:"6",options:SIXT},
            {id:"op",label:"What to do",type:"chips",def:"add",options:[["add","A + B"],["sub","A − B"],["div","Split A equally"]]},
            {id:"bf",label:"Length B: feet",type:"num",def:"2",unit:"ft",half:true,show:v=>v.op!=="div"},
            {id:"bi",label:"Length B: inches",type:"num",def:"3",unit:"in",half:true,show:v=>v.op!=="div"},
            {id:"bs",label:"Length B: fraction",type:"select",def:"8",options:SIXT,show:v=>v.op!=="div"},
            {id:"n",label:"Number of equal parts",type:"num",def:"4",unit:"parts",show:v=>v.op==="div"}
           ],
           calc(v){
            const L=(a,b,c)=>(num(v[a])||0)*192+(num(v[b])||0)*16+(num(v[c])||0);
            const A=L("af","ai","as"),Bv=L("bf","bi","bs");let R,cap,marks="";
            if(v.op==="add"){R=A+Bv;cap="A + B";}else if(v.op==="sub"){R=A-Bv;cap="A − B";}
            else{const n=Math.max(1,Math.round(num(v.n)||1));R=Math.round(A/n);cap=`Each of ${n} parts`;
             const m=[];for(let i=1;i<n&&i<=20;i++)m.push(ftin(A*i/n));if(m.length)marks=` Marks from the start: ${m.join(", ")}.`;}
            const inch=R/16;
            return{cap,value:ftin(R),unit:"",
             say:`The result is ${B(ftin(R))}, which is ${B(f(inch*25.4,1),"mm")}.${marks}`,
             rows:[["Decimal feet",f(inch/12,4),"ft"],["Total inches",f(inch,4),"in"],["Metres",f(inch*0.0254,4),"m"]]};
           },
           note:"Results round to the nearest 1/16″. 1 ft = 12 in = 304.8 mm."},

          {id:"ppipe",g:"plumb",icon:"pipe",name:"Pipe data",short:"OD, wall, bore and water content",
           intro:"Pick a pipe type, then tap a size in the table to see its full data.",
           fields:[
            {id:"set",label:"Pipe type",type:"chips",def:"cuL",options:Object.keys(PSETS).map(k=>[k,PSETS[k].n])}
           ],
           calc(v){
            const S=PSETS[v.set]||PSETS.cuL,i=Math.min(Math.max(0,Math.round(num(v.sz)||2)),S.p.length-1),p=S.p[i],A=Math.PI*(p.id/1000)**2/4;
            const tbl=`<div class="card" style="padding:10px"><div class="ptab"><table><thead><tr><th>Size</th><th>OD mm</th><th>Wall mm</th><th>ID mm</th><th>ID in</th><th>Water L/m</th><th>L/s at 1.5 m/s</th></tr></thead><tbody>${S.p.map((q,j)=>{const a=Math.PI*(q.id/1000)**2/4;return `<tr class="${j===i?"sel":""}" data-i="${j}" role="button" tabindex="0"><td>${q.s}</td><td>${f(q.od,1)}</td><td>${f(q.w,2)}</td><td>${f(q.id,1)}</td><td>${f(q.id/25.4,3)}</td><td>${f(a*1000,3)}</td><td>${f(a*1500,2)}</td></tr>`;}).join("")}</tbody></table></div><p class="note" style="padding:6px 8px 2px">Tap a size to see its details above.</p></div>`;
            return{cap:`${S.n} ${p.s}`,value:f(p.id,2),unit:"mm bore",
             say:`Outside diameter ${B(f(p.od,2),"mm")}, wall ${B(f(p.w,2),"mm")}, inside diameter ${B(f(p.id,2),"mm")} (${f(p.id/25.4,3)} in). It holds ${f(A*1000,3)} litres of water per metre.`,
             rows:[["Outside diameter",f(p.od/25.4,3),"in"],["Wall",f(p.w/25.4,3),"in"],["Flow area",f(A*1e6,0),"mm²"],["Water per foot",f(A*1000*0.3048/3.78541,4),"US gal"],["Water weight",f(A*RHO,3),"kg/m"],["Flow at 1.5 m/s",f(A*1500,2),"L/s"]],after:tbl};
           },
           bind(el,st){el.querySelectorAll("tr[data-i]").forEach(r=>{const go=()=>{st.sz=r.dataset.i;save();show();};r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});},
           note:"Copper to ASTM B88, steel and PVC to ASME B36.10 / ASTM D1785, PPR to DIN 8077 PN20."},

          {id:"pjob",g:"plumb",icon:"job",name:"Job estimate",short:"Labour, materials and quote total",
           intro:"Enter the hours, crew and materials. You get a quote total with markup and tax.",
           fields:[
            {id:"cur",label:"Currency",type:"chips",def:"QAR",options:[["QAR","QAR"],["AED","AED"],["SAR","SAR"],["INR","INR"],["USD","USD"]]},
            {id:"hrs",label:"Hours on site",type:"num",def:"16",unit:"h",half:true},
            {id:"crew",label:"Crew size",type:"num",def:"2",unit:"people",half:true},
            {id:"rate",label:"Rate per worker-hour",type:"num",def:"45",unitFrom:v=>v.cur+"/h"},
            {id:"mat",label:"Materials cost",type:"num",def:"2400",unitFrom:v=>v.cur},
            {id:"mk",label:"Markup on materials",type:"num",def:"15",unit:"%",adv:true},
            {id:"oh",label:"Overhead and profit on labour",type:"num",def:"20",unit:"%",adv:true},
            {id:"tax",label:"Tax / VAT",type:"num",def:"0",unit:"%",adv:true}
           ],
           calc(v){
            const h=num(v.hrs)||0,c=num(v.crew)||0,r=num(v.rate)||0,m=num(v.mat)||0,cu=v.cur;
            if(!(h*c*r+m>0))return{hint:"Enter the hours, crew and rate, or a materials cost."};
            const lab=h*c*r*(1+(num(v.oh)||0)/100),mt=m*(1+(num(v.mk)||0)/100),sub=lab+mt,tx=sub*(num(v.tax)||0)/100;
            return{cap:"Quote total",value:f(sub+tx,0),unit:cu,
             say:`Labour comes to ${B(f(lab,0),cu)} for ${f(h*c,0)} worker-hours and materials to ${B(f(mt,0),cu)} with markup. The quote total is ${B(f(sub+tx,0),cu)}.`,
             rows:[["Labour",f(lab,0),cu],["Materials",f(mt,0),cu],["Subtotal",f(sub,0),cu],["Tax",f(tx,0),cu]]};
           },
           note:"Set tax to 0 where none applies. Overhead and profit are added to labour only."}

          ];

          /* ---------- STATE ---------- */
          const ST={};let open={},view="home";
          function defs(t){const o={};t.fields.forEach(fl=>{o[fl.id]=fl.def;if(fl.units)o[fl.id+"_u"]=fl.udef;if(fl.ukey)o[fl.ukey]=fl.udef;});return o;}
          TOOLS.forEach(t=>ST[t.id]=defs(t));
          try{const raw=localStorage.getItem("fieldvolt.v2");if(raw){const o=JSON.parse(raw);TOOLS.forEach(t=>Object.assign(ST[t.id],o[t.id]||{}));}}catch(e){}
          const save=()=>{try{localStorage.setItem("fieldvolt.v2",JSON.stringify(ST))}catch(e){}};
          const byId=id=>TOOLS.find(t=>t.id===id);
          const h0=(location.hash||"").slice(1);if(byId(h0))view=h0;

          /* ---------- HEAT LOAD SCREENS ---------- */
          const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
          const HLS={projects:[],cur:null,room:null,screen:"list",armed:null,resume:null};
          try{const o=JSON.parse(localStorage.getItem("sitecalc.load.v1")||"null");if(o&&Array.isArray(o.projects))HLS.projects=o.projects;if(o&&o.resume)HLS.resume=o.resume;}catch(e){}
          if(!HLS.projects.length){const p=HL.defProject();p.name="Example office";HLS.projects.push(p);}
          HLS.projects.forEach(HL.norm);
          const hlSave=(touch=true)=>{const P=HLS.cur&&HLS.projects.find(p=>p.id===HLS.cur);if(P&&touch)P.edited=Date.now();
            if(HLS.resume&&!HLS.projects.some(p=>p.id===HLS.resume.cur))HLS.resume=null;
            try{localStorage.setItem("sitecalc.load.v1",JSON.stringify({projects:HLS.projects,resume:HLS.resume}))}catch(e){}};
          const hlWhen=ms=>ms?new Date(ms).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
          function hlResumeCard(){const R=HLS.resume,p=R&&HLS.projects.find(x=>x.id===R.cur);if(!p)return "";const r=R.room&&p.rooms.find(x=>x.id===R.room);
            const where={proj:"Project overview",set:"Design conditions",room:r?"Room: "+r.name:"Rooms",air:"Air side",water:"Water side",preview:"Preview"}[R.screen]||"Project";
            return `<button class="hlcont" data-resume><span class="ic">${svg("load")}</span><span><b>Continue heat load</b><small>${esc(p.name)} · ${esc(where)} · saved ${hlWhen(R.t)}</small></span><span class="hlgo">›</span></button>`;}
          function hlResume(){const R=HLS.resume,p=R&&HLS.projects.find(x=>x.id===R.cur);if(!p)return;HLS.cur=p.id;
            HLS.room=R.room&&p.rooms.some(x=>x.id===R.room)?R.room:null;HLS.screen=R.screen==="room"&&!HLS.room?"proj":R.screen||"proj";view="load";render();window.scrollTo(0,0);}
          const hlP=()=>HLS.projects.find(p=>p.id===HLS.cur);
          const hlR=()=>{const p=hlP();return p&&p.rooms.find(r=>r.id===HLS.room);};
          const kW=w=>f(w/1000,2),TR=w=>f(w/3517,2),hh=h=>String(h).padStart(2,"0")+":00";
          function hlGet(path){const[o,...ks]=path.split(".");let x=o==="s"?hlP():hlR();for(const k of ks){if(x==null)return"";x=x[k];}return x==null?"":x;}
          function hlSet(path,val){const[o,...ks]=path.split(".");let x=o==="s"?hlP():hlR();ks.slice(0,-1).forEach(k=>{if(x[k]==null)x[k]={};x=x[k];});
            const n=parseFloat(val);x[ks[ks.length-1]]=o==="s"&&ks[ks.length-1]!=="name"&&isFinite(n)?n:val;}
          function hlNum(path,label,unit,help,half){return `<label class="field" data-half="${half?1:0}"><span class="lbl">${label}</span>${help?`<span class="help">${help}</span>`:""}<span class="inp"><input data-p="${path}" type="number" inputmode="decimal" step="any" value="${esc(hlGet(path))}" placeholder="0">${unit?`<em>${unit}</em>`:""}</span></label>`;}
          function hlChips(path,label,opts){const v=String(hlGet(path));return `<div class="field"><span class="lbl">${label}</span><div class="chips">${opts.map(o=>`<button type="button" data-c="${path}" data-v="${o[0]}" aria-pressed="${v===String(o[0])}">${o[1]}</button>`).join("")}</div></div>`;}
          const row2=(a,b)=>`<div class="row2">${a}${b}</div>`;
          function hlChart(arr,pk){const mx=Math.max(1,...arr),W=240,H=64;
            return `<svg viewBox="0 0 ${W} ${H+12}" class="hlchart" role="img" aria-label="Hourly load, peak at ${hh(pk)}">${arr.map((v,i)=>{const bh=Math.max(0,v)/mx*H;return `<rect x="${i*10+1}" y="${H-bh}" width="8" height="${bh}" rx="1.5" fill="${i===pk?"var(--accent)":"var(--cool)"}" opacity="${i===pk?1:0.55}"/>`;}).join("")}${[0,6,12,18].map(h=>`<text x="${h*10+5}" y="${H+10}" text-anchor="middle">${h}</text>`).join("")}</svg>`;}

          function hlRender(){
            const P=hlP(),R=hlR();
            if(HLS.screen!=="list"&&!P)HLS.screen="list";
            if(HLS.screen==="room"&&!R)HLS.screen="proj";
            const backTo=HLS.screen==="list"?"All tools":HLS.screen==="proj"?"Projects":esc(P&&P.name);
            let body="";
            body={list:hlList,proj:hlProj,set:hlSettings,room:hlRoom,air:hlAir,water:hlWater,sched:hlPreview,preview:hlPreview}[HLS.screen]();
            if(["proj","set","room","air","water"].includes(HLS.screen))body+=`<div class="hlact"><span class="hlstat" id="hlstat">${P.savedAt?"Saved "+hlWhen(P.savedAt):"Changes are kept as you type"}${P.status==="draft"?" · draft":""}</span>
              <div class="hlactb"><button class="golink" data-act="preview">Preview</button><button class="golink" data-act="save">Save</button><button class="golink pri" data-act="later">Save &amp; continue later</button></div></div>`;
            app.innerHTML=`<div class="bar"><button class="back" data-hlback><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>${backTo}</button></div><div class="tool">${body}</div>`;
            app.querySelector("[data-hlback]").onclick=()=>{hlBack()||(view="home",render());window.scrollTo(0,0);};
            app.querySelectorAll("input[data-p]").forEach(el=>el.addEventListener("input",()=>{hlSet(el.dataset.p,el.value);if(/^s\.(lat|lon|tz)$/.test(el.dataset.p))hlP().city="";hlSave();hlLive();}));
            const cs=app.querySelector("[data-city]");if(cs)cs.onchange=()=>{const c=HL.CITIES.flatMap(g=>g[1]).find(x=>x[0]===cs.value);if(c){const P=hlP();P.city=c[0];P.lat=c[1];P.lon=c[2];P.tz=c[3];hlSave();hlRedraw();}};
            app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const v=b.dataset.v;hlSet(b.dataset.c,v==="true"?true:v==="false"?false:v);hlSave();hlRedraw();});
            app.querySelectorAll("[data-go-p]").forEach(b=>b.onclick=()=>{HLS.cur=b.dataset.goP;HLS.screen="proj";hlRedraw(true);});
            app.querySelectorAll("[data-go-r]").forEach(b=>b.onclick=()=>{HLS.room=b.dataset.goR;HLS.screen="room";hlRedraw(true);});
            app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>hlAction(b.dataset.act,b));
            app.querySelectorAll("[data-resume]").forEach(b=>b.onclick=hlResume);
            app.querySelectorAll("[data-mem]").forEach(b=>b.onclick=()=>{const[aid,rid]=b.dataset.mem.split(":"),r=hlP().rooms.find(x=>x.id===rid);r.sys=r.sys===aid?"fcu":aid;hlSave();hlRedraw();});
            hlLive();
          }
          function hlRedraw(top){const y=window.scrollY;HLS.armed=null;hlRender();window.scrollTo(0,top?0:y);}
          function hlBack(){if(["room","set","air","water","sched","preview"].includes(HLS.screen)){HLS.screen="proj";hlRedraw(true);return true;}if(HLS.screen==="proj"){HLS.screen="list";hlRedraw(true);return true;}return false;}
          function hlAction(a,btn){
            const P=hlP();
            if(a==="air"||a==="water"||a==="sched"||a==="preview"){HLS.screen=a==="sched"?"preview":a;hlRedraw(true);return;}
            if(a==="save"){P.savedAt=Date.now();P.status="saved";if(HLS.resume&&HLS.resume.cur===P.id)HLS.resume=null;hlSave(false);
              const s=document.getElementById("hlstat");if(s)s.textContent="Saved "+hlWhen(P.savedAt);hlToast("Saved "+P.name);return;}
            if(a==="later"){P.savedAt=Date.now();P.status="draft";HLS.resume={cur:P.id,room:HLS.room,screen:HLS.screen,t:P.savedAt};hlSave(false);
              view="home";render();window.scrollTo(0,0);hlToast("Saved as a draft. Tap Continue to pick up here.");return;}
            if(a==="exp-csv"){hlExportCSV();return;}
            if(a==="exp-pdf"){hlExportPDF();return;}
            if(a==="addahu"){HL.norm(P);P.ahus.push({id:"a"+Date.now().toString(36),name:"AHU-"+(P.ahus.length+1),type:"vav"});hlSave();hlRedraw();return;}
            if(a.startsWith("delahu:")){const id=a.slice(7);if(HLS.armed!==a){HLS.armed=a;btn.textContent="Tap again to delete";btn.classList.add("armed");return;}
              P.ahus=P.ahus.filter(x=>x.id!==id);P.rooms.forEach(r=>{if(r.sys===id)r.sys="fcu";});hlSave();hlRedraw();return;}
            if(a==="newp"){const p=HL.norm(HL.defProject());p.name="Project "+(HLS.projects.length+1);HLS.projects.push(p);HLS.cur=p.id;HLS.screen="set";}
            else if(a==="set")HLS.screen="set";
            else if(a==="addr"){const r=HL.defRoom("Room "+(P.rooms.length+1));r.sys="fcu";P.rooms.push(r);HLS.room=r.id;HLS.screen="room";}
            else if(a==="dupr"){const r=JSON.parse(JSON.stringify(hlR()));r.id=HL.defRoom("").id;r.name+=" copy";P.rooms.push(r);HLS.room=r.id;}
            else if(a==="dupp"){const p=JSON.parse(JSON.stringify(P));p.id=HL.defProject().id;p.name+=" copy";p.rooms.forEach(r=>r.id=HL.defRoom("").id);HLS.projects.push(p);HLS.cur=p.id;}
            else if(a==="delr"||a==="delp"){
              if(HLS.armed!==a){HLS.armed=a;btn.textContent="Tap again to delete";btn.classList.add("armed");return;}
              if(a==="delr"){P.rooms=P.rooms.filter(r=>r.id!==HLS.room);HLS.screen="proj";}
              else{if(HLS.resume&&HLS.resume.cur===HLS.cur)HLS.resume=null;HLS.projects=HLS.projects.filter(p=>p.id!==HLS.cur);HLS.cur=null;HLS.screen="list";}
            }
            hlSave();hlRedraw(true);
          }

          function hlList(){
            return `<div class="thead hvac"><span class="ic">${svg("load")}</span><div><h2>Heat load</h2><p>Room-by-room cooling load for a whole project, worked out hour by hour for the design day. Projects are saved on this phone.</p></div></div>
            ${hlResumeCard()}
            ${HLS.projects.map(p=>{const r=HL.project(p);return `<button class="hlrow" data-go-p="${p.id}"><span><b>${esc(p.name)}${p.status==="draft"?' <em class="badge">Draft</em>':""}</b><small>${p.rooms.length} room${p.rooms.length===1?"":"s"} · ${f(r.area,0)} m²${p.edited?" · edited "+hlWhen(p.edited):""}</small></span><span class="hlv">${TR(r.peak)}<i>TR</i></span></button>`;}).join("")}
            <button class="hladd" data-act="newp">+ New project</button>
            <p class="note">Method: sun position and clear-sky solar for your site and month, wall and roof heat delayed by construction mass, and stored radiant heat. Results are peak design loads for sizing. They are not an annual energy model.</p>`;
          }
          function hlProj(){
            const P=hlP();
            return `<label class="field"><span class="lbl">Project name</span><span class="inp"><input data-p="s.name" value="${esc(P.name)}" style="font-family:var(--f-body)"></span></label>
            <div class="ans" id="hlres"></div>
            <button class="hlrow" data-act="set"><span><b>Design conditions and building</b><small>${esc(P.city||`${f(P.lat,2)}°, ${f(P.lon,2)}°`)} · ${HL.MON[P.month-1]} · ${f(P.db,1)} °C DB / ${f(P.wb,1)} °C WB · inside ${f(P.ti,1)} °C, ${f(P.rh,0)} %</small></span><span class="hlgo">›</span></button>
            <button class="hlrow" data-act="air"><span><b>Air side</b><small>AHUs, FCUs, fresh air, ducts, diffusers, VAV/CAV boxes, fans</small></span><span class="hlgo">›</span></button>
            <button class="hlrow" data-act="water"><span><b>Water side</b><small>Chillers, chilled water flow, pipes, pumps</small></span><span class="hlgo">›</span></button>
            <button class="hlrow" data-act="preview"><span><b>Preview report</b><small>Design basis, room loads and equipment schedule · export to Excel or PDF</small></span><span class="hlgo">›</span></button>
            <div class="group" style="margin-top:6px"><h2>Rooms</h2><div id="hlrooms"></div><button class="hladd" data-act="addr">+ Add room</button></div>
            <div class="hlbtns"><button class="golink" data-act="dupp">Duplicate project</button><button class="golink del" data-act="delp">Delete project</button></div>`;
          }
          function hlSettings(){
            const P=hlP();
            return `<div class="thead hvac"><span class="ic">${svg("load")}</span><div><h2>Design conditions</h2><p>These apply to every room in the project. Use the values from your project's basis of design.</p></div></div>
            <div class="card">
             <div class="lbl" style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Outdoor</div>
             ${row2(hlNum("s.db","Dry bulb","°C"),hlNum("s.wb","Coincident wet bulb","°C"))}
             ${row2(hlNum("s.dr","Daily range","K","Max minus min on the design day."),hlNum("s.clr","Sky clearness","×","1 = clear sky. 0.85 for dusty haze."))}
             ${hlChips("s.month","Design month",HL.MON.map((m,i)=>[i+1,m]))}
             <p class="note" style="margin-top:-8px">North of the equator the peak is usually Jun–Sep, but sun-facing (south) glass can peak in Sep–Oct. South of the equator, check Dec–Mar.</p>
            </div>
            <div class="card">
             <div class="lbl" style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Site location</div>
             <label class="field"><span class="lbl">Pick a city</span><span class="help">Fills latitude, longitude and time zone. For anywhere else, type them in below.</span><span class="inp"><select data-city style="font-family:var(--f-body);font-size:17px"><option value="">${P.city?"":"Custom location"}</option>${HL.CITIES.map(([g,cs])=>`<optgroup label="${g}">${cs.map(c=>`<option value="${c[0]}"${P.city===c[0]?" selected":""}>${c[0]}</option>`).join("")}</optgroup>`).join("")}</select></span></label>
             ${row2(hlNum("s.lat","Latitude","°","Minus for south."),hlNum("s.lon","Longitude","°","Minus for west."))}
             ${row2(hlNum("s.tz","Time zone","h from UTC","Standard time, e.g. India 5.5, London 0, Houston −6."),hlNum("s.alt","Altitude","m"))}
             <p class="note" style="margin-top:-6px">Times shown are standard time. Daylight saving is not applied.</p>
            </div>
            <div class="card">
             <div class="lbl" style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Indoor and system</div>
             ${row2(hlNum("s.ti","Room temperature","°C"),hlNum("s.rh","Room RH","%"))}
             ${row2(hlNum("s.occS","Occupied from","h"),hlNum("s.occE","Occupied until","h"))}
             ${row2(hlNum("s.dts","Supply air ΔT","K","Room minus supply air."),hlNum("s.sf","Safety factor","%"))}
             ${row2(hlNum("s.rp","Fresh air per person","L/s"),hlNum("s.ra","Fresh air per m²","L/s"))}
            </div>
            <div class="card">
             <div class="lbl" style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Building fabric</div>
             ${row2(hlNum("s.uw","Wall U-value","W/m²K"),hlNum("s.ur","Roof U-value","W/m²K"))}
             ${row2(hlNum("s.ug","Glass U-value","W/m²K"),hlNum("s.shgc","Glass SHGC","—"))}
             ${hlNum("s.shade","Shading factor","×","1 = no shading. 0.7 for blinds or a deep overhang.")}
             ${hlChips("s.col","Outside wall and roof colour",Object.keys(HL.COL).map(k=>[k,HL.COL[k][1]]))}
             ${hlChips("s.mass","Construction weight",Object.keys(HL.MASS).map(k=>[k,HL.MASS[k].t]))}
            </div>
            <p class="note">Defaults are typical for Qatar but are not a basis of design. Fresh air defaults follow the ASHRAE 62.1 office rate.</p>`;
          }
          function hlRoom(){
            const R=hlR();
            return `<label class="field"><span class="lbl">Room name</span><span class="inp"><input data-p="r.name" value="${esc(R.name)}" style="font-family:var(--f-body)"></span></label>
            <div class="ans" id="hlres"></div>
            <div class="card">
             ${row2(hlNum("r.area","Floor area","m²"),hlNum("r.ht","Ceiling height","m"))}
             ${hlChips("r.h24","When is it used?",[[false,"Occupied hours only"],[true,"24 hours (control room, server)"]])}
            </div>
            <div class="card">
             <div class="lbl">Outside walls and glass</div><span class="help" style="margin-top:-10px">Wall area without the windows. Leave 0 where there is no outside wall.</span>
             <div class="hlgrid"><span></span><span>Wall m²</span><span>Glass m²</span>
             ${HL.ORI.map(([o])=>`<b>${o}</b><span class="inp"><input data-p="r.walls.${o}" type="number" inputmode="decimal" step="any" value="${esc(hlGet("r.walls."+o))}" placeholder="0" aria-label="${o} wall area"></span><span class="inp"><input data-p="r.wins.${o}" type="number" inputmode="decimal" step="any" value="${esc(hlGet("r.wins."+o))}" placeholder="0" aria-label="${o} glass area"></span>`).join("")}</div>
             ${hlChips("r.roof","Roof above is exposed to sun?",[[false,"No, floor above"],[true,"Yes, roof"]])}
             ${R.roof?hlNum("r.roofA","Roof area","m²","Leave empty to use the floor area."):""}
             ${row2(hlNum("r.part","Wall to unconditioned space","m²","Store, stair, plant room."),hlNum("r.pdt","Temperature difference","K"))}
            </div>
            <div class="card">
             ${row2(hlNum("r.people","People","persons"),hlNum("r.ach","Air leakage","ACH","0.3 typical sealed building."))}
             ${hlChips("r.act","Activity",Object.keys(HL.ACT).map(k=>[k,HL.ACT[k][2]]))}
             ${row2(hlNum("r.lights","Lighting","W/m²"),hlNum("r.equip","Equipment","W/m²","PCs ≈ 15, control panels 50 or more."))}
            </div>
            <div class="card">${hlChips("r.sys","Served by",[["fcu","Its own FCU"]].concat((hlP().ahus||[]).map(a=>[a.id,esc(a.name)])))}<div id="hlairroom"></div></div>
            <div class="card" id="hlbreak"></div>
            <div class="hlbtns"><button class="golink" data-act="dupr">Duplicate room</button><button class="golink del" data-act="delr">Delete room</button></div>`;
          }
          function hlLive(){
            const P=hlP(),el=document.getElementById("hlres");if(!el||!P)return;
            const M=HL.MON[P.month-1];
            if(HLS.screen==="proj"){
              const J=HL.project(P),list=document.getElementById("hlrooms");
              if(list)list.innerHTML=J.rs.map(({r,c})=>`<button class="hlrow" data-go-r="${r.id}"><span><b>${esc(r.name)}</b><small>${f(num(r.area)||0,0)} m² · peak ${hh(c.pk)} · ${f(c.supply*3.6,0)} m³/h</small></span><span class="hlv">${!HL.check(P)&&!HL.checkRoom(r)&&isFinite(c.coil[c.pk])?TR(c.coil[c.pk]):"—"}<i>TR</i></span></button>`).join("")||`<p class="note">No rooms yet.</p>`;
              if(list)list.querySelectorAll("[data-go-r]").forEach(b=>b.onclick=()=>{HLS.room=b.dataset.goR;HLS.screen="room";hlRedraw(true);});
              if(!P.rooms.length){el.innerHTML=`<div class="cap">Block load</div><p class="hint">Add a room to start.</p>`;return;}
              const bad=HL.check(P)||(()=>{const r=P.rooms.find(x=>HL.checkRoom(x));return r?`${esc(r.name)}: ${HL.checkRoom(r)}`:"";})();
              if(bad||!isFinite(J.peak)){el.innerHTML=`<div class="cap">Block load</div><p class="hint">${bad||"Check the design conditions."}</p>`;return;}
              el.innerHTML=`<div class="cap">Block load · ${M} ${hh(J.bpk)}</div><div class="hero"><b>${TR(J.peak)}</b><i>TR</i></div>
               <p class="say">The whole project peaks at ${B(kW(J.peak),"kW")} at ${hh(J.bpk)}. Size the chiller or main plant on this. Size each room's unit on its own peak below.</p>
               ${hlChart(J.block,J.bpk)}
               <div class="kv"><div><span>Sum of room peaks</span><strong>${TR(J.sumPk)} <small>TR</small></strong></div><div><span>Diversity</span><strong>${f(J.sumPk>0?J.peak/J.sumPk*100:0,0)} <small>%</small></strong></div>
               <div><span>Load density</span><strong>${f(J.area>0?J.peak/J.area:0,0)} <small>W/m²</small></strong></div><div><span>Area per TR</span><strong>${f(J.peak>0?J.area/(J.peak/3517):0,1)} <small>m²/TR</small></strong></div>
               <div><span>Supply air (sum)</span><strong>${f(J.supply*3.6,0)} <small>m³/h</small></strong></div><div><span>Fresh air</span><strong>${f(J.oaL,0)} <small>L/s</small></strong></div></div>`;
              return;
            }
            if(HLS.screen==="air"||HLS.screen==="water"){hlSysLive();return;}
            if(HLS.screen!=="room")return;
            const R=hlR(),c=HL.room(P,R),k=c.pk,tot=c.coil[k];
            {const S=HL.systems(P),box=document.getElementById("hlairroom");if(box)box.innerHTML=S.bad?"":hlTermHTML(S.terminals.find(x=>x.r.id===R.id),P);}
            const bad=HL.check(P)||HL.checkRoom(R);
            if(bad||!isFinite(tot)){el.innerHTML=`<div class="cap">Room load</div><p class="hint">${bad||"Check the inputs."}</p>`;document.getElementById("hlbreak").innerHTML="";return;}
            el.innerHTML=`<div class="cap">Room peak · ${M} ${hh(k)}</div><div class="hero"><b>${TR(tot)}</b><i>TR</i></div>
             <p class="say">${esc(R.name)} needs ${B(kW(tot),"kW")} of cooling at the coil, including ${f(c.oaL,0)} L/s of fresh air. Supply ${B(f(c.supply*3.6,0),"m³/h")} (${f(c.supply,0)} L/s) at ${f(P.dts,0)} K below room temperature.</p>
             ${hlChart(c.coil,k)}
             <div class="kv"><div><span>Room sensible</span><strong>${kW(c.sens[k])} <small>kW</small></strong></div><div><span>Room latent</span><strong>${kW(c.lat[k])} <small>kW</small></strong></div>
             <div><span>Fresh air load</span><strong>${kW(c.oa[k])} <small>kW</small></strong></div><div><span>Sensible heat ratio</span><strong>${f(c.sens[k]/(c.sens[k]+c.lat[k]),2)}</strong></div>
             <div><span>Load density</span><strong>${f(c.area>0?tot/c.area:0,0)} <small>W/m²</small></strong></div><div><span>Area per TR</span><strong>${f(tot>0?c.area/(tot/3517):0,1)} <small>m²/TR</small></strong></div></div>`;
            const parts=[["Walls",c.walls],["Roof",c.roof],["Glass, solar",c.gsol],["Glass, conduction",c.gcond],["Partitions",c.part],["People, sensible",c.people],["People, latent",c.peopleL],["Lighting",c.lights],["Equipment",c.equip],["Air leakage, sensible",c.infS],["Air leakage, latent",c.infLat],["Fresh air, sensible",c.oaS],["Fresh air, latent",c.oaLat]]
              .map(([n,a])=>[n,a[k]*c.sf]).filter(x=>Math.abs(x[1])>0.5);
            const mx=Math.max(1,...parts.map(x=>Math.abs(x[1])));
            document.getElementById("hlbreak").innerHTML=`<div class="lbl">Where the load comes from at ${hh(k)}</div><div class="hlbk">${parts.map(([n,w])=>`<span>${n}</span><span class="b"><i style="width:${Math.abs(w)/mx*100}%"${w<0?' class="neg"':""}></i></span><span class="r">${kW(w)}</span>`).join("")}</div><p class="note">kW, including the ${f(P.sf,0)} % safety factor.</p>`;
          }

          /* ---------- AIR SIDE / WATER SIDE / SCHEDULE SCREENS ---------- */
          const L2=x=>f(x,0),ductTxt=d=>d?(d.round?`Ø${d.round} or ${d.w}×${d.h}`:`${d.w}×${d.h}`):"—",pipeTxt=p=>p?`${p.dn} (${f(p.v,2)} m/s, ${f(p.R,0)} Pa/m)`:"over DN600";
          const kv2=rows=>`<div class="sumg">${rows.map(r=>`<div><span>${r[0]}</span><strong>${r[1]}${r[2]?` <small>${r[2]}</small>`:""}</strong></div>`).join("")}</div>`;
          const capLbl=t=>`<div class="lbl" style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">${t}</div>`;
          function hlTermHTML(t,P){
            if(!t)return "";
            const head=t.kind==="FCU"?[["Unit",`${t.tag} · ${t.units>1?t.units+" × ":""}${t.size} CFM`],["Cooling needed",kW(t.kw),"kW"],["Chilled water",f(t.flow,2),"L/s"],["Pipe",t.pipe?t.pipe.dn:"—"]]
              :[["Box",`${t.tag} on ${esc(t.ahu)}`],["Inlet",t.inlet?`Ø${t.inlet} mm`:"over 400 mm"],["Max airflow",L2(t.q),"L/s"],["Min airflow",L2(t.qmin),"L/s"]];
            const warn=t.kind==="VAV"&&t.qmin>=t.q-0.5?`<p class="note" style="color:var(--bad)">This room needs so much fresh air that the VAV box cannot turn down. Consider a CAV box or more fresh air on the AHU.</p>`:"";
            return `${capLbl("Air side for this room")}${kv2(head.concat([["Supply diffusers",`${t.nd} × ${t.neck} mm neck`,`${L2(t.qd)} L/s each`],["Return grilles",`${t.ng} × ${t.grille}×${t.grille}`],["Branch duct",ductTxt(t.branch)]]))}${warn}`;
          }
          function hlAir(){
            const P=HL.norm(hlP()),A=P.air;
            return `<div class="thead hvac"><span class="ic">${svg("duct")}</span><div><h2>Air side</h2><p>Put rooms on an AHU (CAV or VAV). Every other room gets its own FCU. Sizes update from the room loads.</p></div></div>
            <div class="ans" id="hlres"></div>
            <div class="card">${hlChips("s.fahu","Fresh air for the FCU rooms",[[false,"Each FCU takes its own"],[true,"One fresh air unit (FAHU)"]])}<div id="fahures"></div></div>
            ${P.ahus.map((a,i)=>`<div class="card">
              <label class="field"><span class="lbl">AHU name</span><span class="inp"><input data-p="s.ahus.${i}.name" value="${esc(a.name)}" style="font-family:var(--f-body)"></span></label>
              ${hlChips(`s.ahus.${i}.type`,"Type",[["cav","CAV, constant volume"],["vav","VAV, variable volume"]])}
              <div class="field"><span class="lbl">Rooms it serves</span><span class="help">Tap to add or remove. A room can be on one AHU only.</span><div class="chips sm">${P.rooms.map(r=>`<button type="button" data-mem="${a.id}:${r.id}" aria-pressed="${r.sys===a.id}">${esc(r.name)}</button>`).join("")||`<span class="help">No rooms yet.</span>`}</div></div>
              ${hlNum(`s.ahus.${i}.esp`,"External static pressure","Pa",`Leave empty to use the default (${A.esp} Pa).`)}
              <div id="ahures-${a.id}"></div>
              <div class="hlbtns"><button class="golink del" data-act="delahu:${a.id}">Delete ${esc(a.name)}</button></div></div>`).join("")}
            <button class="hladd" data-act="addahu">+ Add AHU</button>
            <div class="group" style="margin-top:6px"><h2>Room terminals</h2><div id="termlist"></div></div>
            <details class="more card"><summary>Air side settings</summary><div class="in">
             ${row2(hlNum("s.air.esp","Default AHU external static","Pa"),hlNum("s.air.isp","AHU internal static","Pa","Filters, coil, casing."))}
             ${row2(hlNum("s.air.effF","Fan efficiency","%"),hlNum("s.air.effM","Motor efficiency","%"))}
             ${row2(hlNum("s.air.vMain","Main duct velocity","m/s"),hlNum("s.air.vBranch","Branch duct velocity","m/s"))}
             ${row2(hlNum("s.air.dh","Max duct height","mm"),hlNum("s.air.fcuEsp","FCU external static","Pa"))}
             ${row2(hlNum("s.air.nv","Diffuser neck velocity","m/s","About 3 m/s for quiet offices."),hlNum("s.air.darea","Floor area per diffuser","m²"))}
             ${row2(hlNum("s.air.gv","Return grille face velocity","m/s"),hlNum("s.air.boxV","VAV/CAV inlet velocity","m/s"))}
             ${hlNum("s.air.minVav","VAV minimum airflow","% of max")}
            </div></details>
            <p class="note">Generic sizes for checking and tendering. Confirm noise (NC), throw and capacity in the manufacturer's selection software.</p>`;
          }
          function hlWater(){
            return `<div class="thead hvac"><span class="ic">${svg("chw")}</span><div><h2>Water side</h2><p>Chillers, chilled water flow, pipe sizes and pump head, from the hour-by-hour load of every coil.</p></div></div>
            <div class="ans" id="hlres"></div>
            <div class="card">${capLbl("Chillers")}
             ${row2(hlNum("s.chw.sup","Chilled water supply","°C"),hlNum("s.chw.dt","Chilled water ΔT","K","Return minus supply, e.g. 12.5 − 7 = 5.5."))}
             ${row2(hlNum("s.chw.nCh","Duty chillers","no."),hlNum("s.chw.sbCh","Standby chillers","no."))}
             ${hlNum("s.chw.margin","Plant margin","%","Pump heat, pipe heat gain, future load.")}</div>
            <div class="card">${capLbl("Pump head (index circuit)")}
             ${row2(hlNum("s.chw.run","Longest pipe run, flow + return","m"),hlNum("s.chw.fit","Fittings allowance","% of run"))}
             ${row2(hlNum("s.chw.dpCh","Chiller evaporator","kPa"),hlNum("s.chw.dpCoil","Worst coil","kPa"))}
             ${row2(hlNum("s.chw.dpVal","Control valve","kPa"),hlNum("s.chw.dpOth","Strainer, check valve, other","kPa"))}
             ${hlNum("s.chw.effP","Pump efficiency","%")}</div>
            <div class="card">${capLbl("Pipe sizes")}<div id="pipelist"></div><p class="note">Steel pipe, sized for at most 300 Pa/m and 3 m/s.</p></div>
            <p class="note">One pump per duty chiller (constant primary). Friction uses the header size along the whole index run, which is slightly conservative.</p>`;
          }
          function hlSysLive(){
            const P=hlP(),S=HL.systems(P),el=document.getElementById("hlres");
            const fill=(id,h)=>{const x=document.getElementById(id);if(x)x.innerHTML=h;};
            if(S.bad){el.innerHTML=`<div class="cap">Check inputs</div><p class="hint">${esc(S.bad)}</p>`;["fahures","termlist","pipelist"].forEach(i=>fill(i,""));P.ahus.forEach(a=>fill("ahures-"+a.id,""));return;}
            if(HLS.screen==="air"){
