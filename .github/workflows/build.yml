            const coils=[...S.ahus.filter(a=>!a.empty).map(a=>[esc(a.a.name),a.kw,a.flow,a.pipe]),...(S.fahu?[[S.fahu.tag,S.fahu.kw,S.fahu.flow,S.fahu.pipe]]:[]),
